 Madden Place 比公屋区早期建的楼大得多，住户组团也更大，每层多达十六套。这种布置的一个后果是，许多单元只有一个朝向在视野和视线私密性上没有受损，另一个朝向则背对走廊，往往是次卧的窗户。对一些单元来说，这种格局还意味着起居室和阳台朝南，得不到直射阳光。由于住宅数量增加，公共洗衣房和“焚化”或垃圾间设在每一层，而不像小楼那样在花园地面层只设一间。在内部，单元采用常规而紧凑的布局，与早期建筑相差不大，在空间面积和设施配置上达到相近的标准。这些楼的进深仍然相对较浅，尤其是与今天澳大利亚的大多数住宅开发相比，并且都有大窗户保证采光和通风。</p></div><div class=\"para\" data-idx=\"33\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"1d2865a490\"><p class=\"en\">In the 1970s, the ambitions of the Housing Commission for the estate dramatically increased. Larger projects in nearby Redfern such as William McKell Place by Morrow &amp; Gordon Architects in 1961 (8–10 storeys, 186 dwellings) and Poets Corner by Peddle, Thorp &amp; Walker Architects in 1966 (three 17-storey slabs with 192 dwellings each) set the precedent for the final stage of Waterloo. The Endeavour Project in the northern portion of Waterloo, built between 1970 and 1976, comprised four 17-storey slabs (named James Cook, Joseph Banks, Daniel Solander and Marton) each with 214 units, and two 30-storey towers (Matavai and Turanga) each with 232 units and designed specifically for aged pensioners (Figure 11). This project became the most visible culmination of the Housing Commission’s activities in New South Wales and possibly the most prominent in the public imagination. Just under 300 dwellings, amongst other buildings, were demolished and several streets and lanes subsumed to make way for the Endeavour Project. All six buildings were set in expansive open space, surrounded by car parking and park-like lawned spaces, with building entries relatively distant from the street.</p><p class=\"zh\">1970 年代，住房委员会对这个公屋区的雄心急剧膨胀。附近 Redfern 的较大项目，例如 Morrow & Gordon Architects 于 1961 年设计的 William McKell Place（8–10 层，186 套）和 Peddle, Thorp & Walker Architects 于 1966 年设计的 Poets Corner（三栋 17 层板楼，每栋 192 套），为 Waterloo 的最后阶段立下了先例。1970 至 1976 年间在 Waterloo 北部建成的<a class=\"gref\" href=\"#g-endeavour\">Endeavour 项目</a>，包括四栋 17 层板楼（分别命名为 James Cook、Joseph Banks、Daniel Solander 和 Marton），每栋 214 套；以及两栋 30 层塔楼（Matavai 和 Turanga），每栋 232 套，专为领取养老金的老人设计（图 11）。这个项目成为住房委员会在新南威尔士州活动最显眼的集大成之作，也可能是在公众想象中最突出的一个。为了给 Endeavour 项目腾出地方，近 300 套住宅连同其他建筑被拆除，几条街道和巷子被并入。全部六栋楼都坐落在宽阔的开敞空间中，四周是停车场和公园式草坪，楼栋入口离街道相对较远。</p></div><div class=\"para\" data-idx=\"34\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"91b75e9963\"><p class=\"en\">The repetitive nature of tall building floor plates coupled with pre-cast concrete construction technology allowed for rapid building at scale and was able to utilize the provision of lifts to their fullest. The typical floor of the cruciform-plan towers includes a north-facing community room at each lift lobby, south-facing laundry, drying and garbage rooms, and eight small units arrayed around a dual lift core and ‘scissor’ fire stairs. Seven of the eight units on each floor are bedsit flats comprised of a kitchen, bathroom and single combined space for living and bedroom with windows to a single orientation north, east or west. The eighth is a one-bedroom unit. Southfacing units were given windows in a second direction providing some sunlight access, but no units had balconies and ceilings are relatively low. At the ground floor, a lift lobby, letterbox area, office, sitting room, and community room contribute additional shared facilities. Externally, the provision of a generous fenced landscaped area with seating, shelter, and water features defined a secure communal garden (Figure 12).</p><p class=\"zh\">高层楼层平面的重复性，加上预制混凝土建造技术，使大规模快速建造成为可能，也能充分利用电梯。十字形塔楼的标准层包括：每个电梯厅旁一间朝北的社区活动室，朝南的洗衣、晾晒和垃圾间，以及围绕双电梯核心筒和“剪刀式”消防楼梯排列的八个小单元。每层八个单元中有七个是一室户（bedsit），由厨房、卫生间和一个起居兼卧室的单一空间组成，只朝北、东或西一个方向开窗。第八个是一居室。朝南的单元在第二个方向上开了窗，获得一些日照，但所有单元都没有阳台，层高也相对较低。底层的电梯厅、信箱区、办公室、休息室和社区活动室提供了额外的共享设施。在室外，一片围起来的宽敞绿化区，配有座椅、遮蔽物和水景，构成了一个安全的公共花园（图 12）。</p></div><div class=\"para\" data-idx=\"35\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"dd5ab4ad2c\"><p class=\"en\">The four slab blocks run north to south, with units facing either east or west, which maximizes solar exposure and makes westward-facing units especially subject to intense afternoon solar gain and overheating. The strictness of construction efficiencies does not appear to have allowed for windows to face north or south at end units and none of the units enjoy proper, natural crossventilation. The units are served by long, narrow, highly internalized corridors with turns at the lift lobby preventing a straight line of view from the lift to the unit entry. A laundry and garbage chute are located at each end of the floor plate for convenience. The double-loaded corridor arrangement means that the building section is relatively deep compared to previous buildings but would still be considered very slender by today’s standards which can typically be almost double, up to 24 m. Almost all kitchens and bathrooms were located internally along the back wall of each unit, requiring artificial lighting and mechanical ventilation. Windows to bedrooms were wide, but with relatively high sills and low head heights. This is seemingly intended to create a feeling of safety at height but limits a good outlook. Taller sliding glass living room doors to small squarish balconies provide some additional glazing but visual access to outside is diminished by a solid balustrade detail (Figures 13 and 14).</p><p class=\"zh\">四栋板楼南北走向，单元朝东或朝西，这使日照最大化，也让朝西的单元在午后尤其容易受强烈的太阳得热而过热。严格追求建造效率，似乎没有给端头单元留出朝北或朝南开窗的余地，所有单元都没有真正的自然穿堂风。单元由狭长、高度内向化的走廊服务，走廊在电梯厅处转折，使人从电梯无法一眼看到单元入口。每层两端各设一个洗衣间和垃圾槽以便使用。<a class=\"gref\" href=\"#g-doubleloaded\">双侧走廊</a>（double-loaded corridor）的布置意味着楼体剖面比以前的建筑深，但按今天的标准仍算非常纤细，今天通常几乎是它的两倍，可达 24 米。几乎所有厨房和卫生间都沿各单元的后墙布置在内部，需要人工照明和机械通风。卧室窗户很宽，但窗台较高、窗顶较低。这样做似乎是为了在高处营造安全感，却限制了良好的视野。通往小方形阳台的较高的起居室玻璃推拉门提供了一些额外的采光面，但实心的栏板设计削弱了向外看的视线（图 13 和图 14）。</p></div><div class=\"para\" data-idx=\"36\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"be43414bc2\"><p class=\"en\">In 1972, the Housing Commission announced plans to extend the site to the east and build more than two thousand more dwellings in Waterloo, including up to six more 30-storey towers to a different design. This was opposed by the newly formed South Sydney Action Group. In 1973, the Commonwealth intervened in State and Local housing provisions through its Department of Urban and Regional Development with a change in policy to protect and rehabilitate inner-city suburbs of terrace housing in places such as Glebe and Woolloomooloo. In 1974, the Builders Labourers Federation placed a ‘green ban’ on further demolition of low-income housing in Waterloo. In response, the Housing Commission commenced a detailed consultative process with residents resulting in their activity being redirected towards an extensive programme of rehabilitation of existing housing complimented by architecturally compatible new infill housing (Figure 15).</p><p class=\"zh\">1972 年，住房委员会宣布计划把场地向东扩展，在 Waterloo 再建两千多套住宅，包括最多六栋采用不同设计的 30 层塔楼。这遭到新成立的南悉尼行动小组（South Sydney Action Group）的反对。1973 年，联邦政府通过其城市与区域发展部（Department of Urban and Regional Development）介入州和地方的住房供给，政策转向保护和修复 Glebe、Woolloomooloo 等地的联排住宅内城郊区。1974 年，建筑工人联合会（Builders Labourers Federation）对 Waterloo 进一步拆除低收入住房实施了“<a class=\"gref\" href=\"#g-greenban\">绿色禁令</a>”（green ban）。作为回应，住房委员会与居民展开了详细的协商程序，其工作因此转向一项大规模的现有住房修复计划，并辅以建筑上相协调的新建填充住宅（图 15）。</p></div><div class=\"para\" data-idx=\"42\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"fb33a78b86\"><p class=\"en\">More dwellings were added to the southern end of the estate right up until the early 1980s, including the architecturally striking Drysdale and Dobell developments (also known as ‘Artists Corner’) designed by Tao Gofers and Penny Rosier of the NSW Housing Commission. But in many ways, the green ban and federal engagement in the mid-1970s decisively shifted the trajectory of public housing development in Sydney. The quarter century of expansive growth that created the Waterloo estate was over.</p><p class=\"zh\">直到 1980 年代初，公屋区南端仍在增建住宅，包括由 NSW 住房委员会的 Tao Gofers 和 Penny Rosier 设计、建筑上引人注目的 Drysdale 和 Dobell 开发项目（也称“艺术家之角”，Artists Corner）。但在很多方面，1970 年代中期的绿色禁令和联邦介入决定性地改变了悉尼公共住房开发的轨迹。造就 Waterloo 公屋区的那四分之一个世纪的扩张式增长结束了。</p></div><div class=\"para\" data-idx=\"43\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"30a94c0f4b\"><p class=\"en\">It had been a period of energetic ambition and growing capacity for public housing that left a diverse built legacy, most of it still physically intact and still inhabited. But how should we understand and evaluate that legacy? If we were to listen to residents who live in the buildings we have just described, it is quite likely that the current plans for estate redevelopment would not go ahead. Similarly, if we look to the NSW state government’s own measures for what constitutes good housing, the options for improving the estate’s housing stock appear quite different to what have been presented thus far. The government has not publicly presented a systematic analysis of how the housing on the Waterloo estate measures up against their own standards. Using a series of Wellbeing Criteria that are discussed in the next section, we have attempted to do this and presented the results in Table 1.</p><p class=\"zh\">那是一个公共住房雄心勃勃、能力不断增长的时期，留下了多样的建成遗产，其中大部分至今在物理上仍完好、仍有人居住。但我们应该如何理解和评价这份遗产？如果去听住在我们刚才描述的那些建筑里的居民怎么说，目前的公屋区再开发计划很可能不会推进。同样，如果按照 NSW 州政府自己关于什么是好住房的衡量标准，改善公屋区住房存量的选项，看起来也会和迄今为止提出的方案大不相同。政府从未公开提出过系统分析，说明 Waterloo 公屋区的住房按照他们自己的标准表现如何。我们利用下一节讨论的一系列福祉标准（Wellbeing Criteria）尝试做了这件事，结果列于表 1。</p></div><h2 class=\"sec\" data-secidx=\"45\"><span class=\"en\">Evaluating Waterloo</span><span class=\"zh\">评估 Waterloo</span></h2><div class=\"para\" data-idx=\"46\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"1ecb95c7fb\"><p class=\"en\">There has been a growing effort in recent years to systematize and build an evidence base for good architectural design. This has partly been driven by a desire to influence design guidance used by governments and third sector actors to promote standards of environmental comfort and other factors perceived as supportive of users’ physical and psychological wellbeing. Much of the initial research for evidence-based design was developed for health settings, moving beyond the high modern concept of the hospital as a curative apparatus and provide settings to support the overall wellbeing of patients, and has since extended into a range of other architectural settings and situations. Researchers have demonstrated that views of and access to green space, high standards of air quality, and thermal comfort levels all have a direct impact on health. Well-designed buildings minimize mould and dampness, maintain comfortable air quality, and provide spaces for outdoor recreation and exercise. These qualities have also been shown to contribute to a reduction in the spread of infectious diseases, as the COVID-19 pandemic has recently highlighted, while supporting better cardiovascular and respiratory health.</p><p class=\"zh\">近年来，人们越来越努力地把好的建筑设计系统化，并为之建立证据基础。部分动因是希望影响政府和第三部门所用的设计指南，以推广环境舒适度标准，以及其他被认为有助于使用者身心福祉的因素。循证设计的早期研究大多是为医疗环境开展的，超越了把医院视为治疗装置的高度现代主义观念，转而营造支持病人整体福祉的环境，之后扩展到其他各种建筑环境和情境。研究者已经证明，能看到和接触绿色空间、高标准的空气质量以及热舒适水平，都对健康有直接影响。设计良好的建筑能把霉菌和潮湿降到最低，保持舒适的空气质量，并提供户外休闲和锻炼的空间。这些品质也被证明有助于减少传染病传播（新冠疫情最近就凸显了这一点），同时有利于心血管和呼吸系统健康。</p></div><div class=\"para\" data-idx=\"47\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"9ff817f486\"><p class=\"en\">Many of these indoor environmental and spatial qualities have long been recognized by architects as fundamental biological and psychological factors that support human flourishing. A growing literature focusing on the idea of wellbeing has confirmed that many of these qualities – particularly thermal comfort and access to sunshine and green spaces – have an impact on psychological wellbeing. Other design considerations that become important in the context of psychological comfort include the provision of privacy and opportunities for social connection. General principles arising from decades of academic and industry research provide a basis for policymakers to arrive at a sense of what ‘best practice’ should look like, including for housing.</p><p class=\"zh\">许多这类室内环境和空间品质，长期以来被建筑师视为支持人类繁荣的基本生理与心理因素。越来越多关注“福祉”（wellbeing）概念的文献证实，其中许多品质，尤其是热舒适以及接触阳光和绿色空间，会影响心理福祉。在心理舒适的语境下变得重要的其他设计考量，还包括提供私密性和社会联系的机会。数十年学术和行业研究得出的一般原则，为政策制定者形成“最佳实践”应当是什么样的认识提供了基础，住房也不例外。</p></div><div class=\"para\" data-idx=\"48\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"3c37c57851\"><p class=\"en\">In NSW, a combination of physical and psychological wellbeing principles are effectively captured in the Apartment Design Guide (2015) planning policy which establishes a benchmark of the quality that must be achieved in the construction of any new residential apartment development that is at least three storeys in height and contains at least four dwellings. While this document was created with the private housing market in mind, it is nonetheless applicable to all tenures. In the context of the Waterloo estate, it provides a useful instrument for testing claims that its buildings have reached the end of their usable lifespan or are no longer fit for purpose, as it provides a contemporary measure of what is considered acceptable in terms of overall amenity in new apartments.</p><p class=\"zh\">在 NSW，身心福祉原则被有效地纳入了《<a class=\"gref\" href=\"#g-adg\">公寓设计指南</a>》（Apartment Design Guide，2015）这一规划政策。它为任何至少三层、至少四套住宅的新建住宅公寓开发设定了必须达到的质量基准。尽管这份文件是针对私人住房市场制定的，它仍适用于所有权属形式。就 Waterloo 公屋区而言，它是检验“其建筑已到使用寿命尽头”或“不再适用”这类说法的有用工具，因为它提供了一个当代尺度，说明新建公寓在整体舒适性上怎样才算可以接受。</p></div><div class=\"para\" data-idx=\"49\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"84f44a4fe4\"><p class=\"en\">To establish this benchmark, we thematically analysed the Apartment Design Guideline relative to the environmental factors known to have the greatest impact on resident amenity, and, therefore, their overall wellbeing (Table 1). Relative to the provision of natural light, fresh air and thermal comfort, the guideline sets expectations about how much direct sunlight, daylight, natural ventilation and natural cross ventilation should serve an apartment, stipulating window orientation, openability, size (as a proportion of a room’s floor area) and shading, as well as setting minimum ceiling heights and maximum habitable room depths. Recommendations to support visual and acoustic privacy set expectations regarding the separation between buildings, and the provision and placement of balconies, windows, and landscaping. Under the theme of liveability, we have grouped considerations related to physical accessibility and minimum areas and dimensions for unit, room, and balcony sizes. While considerations of room size are difficult to measure and have thus not been the focus of design-related research relative to wellbeing in residential environments, at least one study of tenants relocated within the renewal process of an Australian housing estate found that the provision of larger rooms was a significant contributor to tenant satisfaction within those relocations; this suggests a link between more generous interior spaces and psychological comfort.</p><p class=\"zh\">为了建立这个基准，我们对照已知对居民舒适性、进而对其整体福祉影响最大的环境因素，对《公寓设计指南》做了主题分析（表 1）。在自然采光、新鲜空气和热舒适方面，指南对一套公寓应获得多少直射阳光、天然采光、自然通风和自然穿堂风设定了要求，规定了窗户的朝向、可开启性、大小（占房间面积的比例）和遮阳，还规定了最低层高和可居住房间的最大进深。支持视线和声学私密性的建议，对建筑间距以及阳台、窗户和绿化的设置与位置提出了要求。在“宜居性”这一主题下，我们归入了与无障碍通行，以及单元、房间和阳台最小面积与尺寸相关的考量。房间大小的影响难以衡量，因此一直不是住宅环境福祉相关设计研究的重点；但至少有一项研究，针对澳大利亚某公屋区更新过程中被搬迁的租户，发现更大的房间是搬迁后租户满意度的重要来源。这表明更宽敞的室内空间与心理舒适之间存在关联。</p></div><div class=\"para\" data-idx=\"50\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"3a0f97d595\"><p class=\"en\">Design considerations aimed at supporting a sense of community include expectations around the size and quality of communal spaces; the design of building entrances to be easily identifiable and maintain a clear relationship to the street; and the maximum number of apartments per floor accessible from a circulation core. While design is not the main determinant in establishing a strong sense of community, spaces we might term uncomfortable can have a negative psychological impact, particularly around perceptions of discomfort and danger. Such spaces, in turn, can impede communication and a person’s resilience to irritation – both influencing a tenant’s likelihood of establishing and maintaining social contact with neighbours.</p><p class=\"zh\">旨在支持社区感的设计考量包括：对公共空间大小和品质的要求；建筑入口要易于识别并与街道保持清晰关系；以及从一个交通核可到达的每层公寓最大数量。设计并不是形成强烈社区感的主要决定因素，但我们或许可称为“不舒服”的空间会产生负面心理影响，尤其是在不适感和危险感方面。这类空间反过来会妨碍交流，削弱一个人对烦扰的承受力，两者都会影响租户与邻居建立和维持社会联系的可能性。</p></div><div class=\"para\" data-idx=\"51\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"f3a126cf89\"><p class=\"en\">In the remainder of this section, we assess the four housing types on the estate against four key types of amenity that broadly capture the objectives of the Apartment Design Guide. An analysis of the four main housing types contained within the Waterloo Estate – 3-storey walk-ups, 6-storey courtyards, 17-storey slabs, and 30-storey towers – confirms that some typologies go further in meeting contemporary standards than others (Table 1). It must also be acknowledged that design is a practice of multiple possibilities where balancing the many and sometimes conflicting requirements of any building can result in necessary compromises in some areas to optimize benefits in others. This is true of new construction that aspires to meet contemporary guidelines as much as it is of established apartments. It should also be acknowledged that not all design considerations discussed have an equal impact on wellbeing.</p><p class=\"zh\">本节余下部分，我们按四类大致涵盖《公寓设计指南》目标的关键舒适性，评估公屋区里的四种住宅类型。对 Waterloo 公屋区四种主要住宅类型——三层无电梯楼、六层庭院楼、17 层板楼和 30 层塔楼——的分析证实，有些类型比另一些更能达到当代标准（表 1）。也必须承认，设计是一种存在多种可能性的实践，在任何建筑的诸多、有时相互冲突的要求之间取得平衡，可能需要在某些方面做出必要的妥协，以便在其他方面取得最佳效果。这一点对力求符合当代指南的新建筑和既有公寓同样成立。还应承认，所讨论的设计考量对福祉的影响并不都一样大。</p></div><div class=\"para\" data-idx=\"52\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"1d42d3441f\"><p class=\"en\">All four accommodation types compare well against the Apartment Design Guide recommendations in relation to access to light and air, and thermal comfort. The minor compromise across all four types is that ceiling heights are only 2.5 m, which met standards at the time of construction but is 200 mm less than the current design criteria. It is also worth noting that this is still greater than the 2.4 m ceiling height that remains standard in other types of residential construction. Due to building placement and orientation on site, the 3-storey walk-ups have less access to sunshine than the other housing types, with less than half of dwellings able to receive a minimum of 2 h of direct sunlight between 9am and 3pm at mid-winter. However, this compromise may be partially mitigated by the ease of access to substantial outdoor greenspace from this housing type. In respect of the 17-storey slabs and 30-storey towers, the inclusion of double-loaded corridors and/or single-aspect units present a much larger compromise relative to enabling the cross-ventilation of these units (noting that natural cross ventilation is deemed-to-comply above the ninth storey due to greater wind speeds at height). None of the four building types appear to provide adequate sun shading to windows, although this could be easily addressed through retrofitting externally.</p><p class=\"zh\">在采光与通风以及热舒适方面，四种住宅类型对照《公寓设计指南》的建议都表现良好。四种类型共同的小妥协是层高只有 2.5 米：在建造时符合标准，但比现行设计标准低 200 毫米。也值得指出，这仍高于其他类型住宅建筑中至今仍属标准的 2.4 米层高。由于建筑在场地上的位置和朝向，三层无电梯楼的日照少于其他住宅类型：冬至日上午 9 点至下午 3 点之间能获得至少 2 小时直射阳光的住宅不到一半。不过，这类住宅很容易到达大片户外绿地，或许能部分弥补这一妥协。至于 17 层板楼和 30 层塔楼，双侧走廊和/或单朝向单元，在实现穿堂风方面是大得多的妥协（需注意，由于高处风速较大，九层以上被视为自然满足穿堂风要求）。四种建筑类型似乎都没有为窗户提供足够的遮阳，不过这可以很容易地通过外部加装来解决。</p></div><div class=\"para\" data-idx=\"53\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"2f9f121a6e\"><p class=\"en\">In respect to visual and acoustic privacy, all four accommodation types compare well against the Apartment Design Guide with only minor issues arising. These include the open balustrades (instead of solid for privacy) in the case of the 3-storey walk-ups; and the occurrence of a second bedroom occasionally facing an external circulation corridor in the case of the 6-story courtyard building type.</p><p class=\"zh\">在视线和声学私密性方面，四种住宅类型对照《公寓设计指南》都表现良好，只出现了一些小问题。包括三层无电梯楼的通透栏杆（而非出于私密考虑的实心栏板），以及六层庭院楼中偶尔出现次卧朝向外廊的情况。</p></div><div class=\"para\" data-idx=\"54\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"8c3e60bb4c\"><p class=\"en\">Access to nature and a sense of community seem like harder amenities to measure. But the design guide contains provisions that are broadly supported by research. The recommendation that a maximum of 8 residences should be accessed from a circulation core is an important consideration, as research shows that encountering a smaller and known group of neighbours enhances feelings of psychological comfort and physical safety. In the 6-storey courtyards and 17-storey slabs, circulation cores are shared by between 13 and 16 residences, in the case of the latter, potentially doubling what is recommended by Apartment Design Guide as a comfortable level of social encounter. This discomfort is further exacerbated in the 17-storey slabs owing to the lack of natural light and ventilation available to those circulation spaces which are long, tight and largely internalized. While there are limited options for improving this situation in the 17-storey slabs, the retrofitting of lift cores to the 6-storey courtyard buildings has been proven elsewhere to be a feasible solution. In the case of the 6-storey courtyard buildings this could allow them to effectively become multiple attached buildings, permitting some units to cross-through the building which could improve natural cross ventilation as well as improve privacy to second bedrooms. The inclusion of lift cores would also assist these walk-up buildings to become accessible. Building entrances are another design consideration related to community and, for all four accommodation types, represent an aspect of design that would welcome some improvement with some design attention given at the street edge.</p><p class=\"zh\">接触自然和社区感似乎是更难衡量的舒适性。但设计指南中有些条款得到了研究的广泛支持。从一个交通核最多到达 8 户的建议是一个重要考量，因为研究表明，遇见较少且相识的邻居会增强心理舒适感和人身安全感。在六层庭院楼和 17 层板楼中，一个交通核由 13 到 16 户共用；在后者的情况下，这可能比《公寓设计指南》建议的舒适社交接触水平高出一倍。17 层板楼的这种不适感还因交通空间缺乏自然光和通风而加剧，那些走廊狭长、局促，而且大多是内走廊。17 层板楼的改善余地有限，但为六层庭院楼加装电梯核已在别处被证明是可行的方案。对六层庭院楼来说，这可以让它们实际上变成多栋相连的建筑，使部分单元贯通楼体，从而改善自然穿堂风，并改善次卧的私密性。加装电梯核也有助于让这些无电梯楼变得无障碍。建筑入口是另一个与社区相关的设计考量；对四种住宅类型而言，这都是一个值得改进的方面，可以在临街一侧多花些设计心思。</p></div><div class=\"para\" data-idx=\"55\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"4f4bedadba\"><p class=\"en\">Across the four housing types, unit sizes are between 10% and 30% smaller that the Apartment Design Guide recommends. This equates to a shortfall of 13–15 m across the 2- and 3-bedroom apartments for all building types, and a shortfall of 17 m to the 1-bedroom units in the 30-storey tower (noting that a significant minority of 1-bedroom units were consolidated to form 2-bedroom apartments around the turn of the century). Across all four housing types, balconies, where provided, are often inadequate in terms of overall dimensions relative to the design criteria; while none of the four accommodation types provide accessibility features to meet Silver Level of the Liveable Housing Design Guidelines such as a step-free environment, door and corridor widths and suitable bathroom configuration. Built-in storage within apartments is also lacking as a consequence of smaller unit sizes.</p><p class=\"zh\">在四种住宅类型中，单元面积比《公寓设计指南》的建议小 10% 到 30%。这相当于所有建筑类型的两居室和三居室缺少 13–15 平方米，30 层塔楼的一居室缺少 17 平方米（需注意，大约在世纪之交，相当一部分一居室被合并成了两居室）。在四种住宅类型中，凡是有阳台的，其总体尺寸相对于设计标准往往不足；四种类型都没有提供达到《宜居住房设计指南》（Liveable Housing Design Guidelines）银级标准的无障碍设施，例如无台阶环境、门和走廊宽度以及合适的卫生间布局。由于单元面积较小，公寓内也缺乏内置储物空间。</p></div><div class=\"para\" data-idx=\"56\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"6ba85f9fa0\"><p class=\"en\">While this analysis highlights some failings, what it in fact identifies is that much of the existing housing at the Waterloo Estate has fundamental design attributes that are supported by evidence and promoted by the NSW Government in its own endorsed contemporary design guidance. All dwellings have large windows to provide excellent daylight and fresh air to all dwellings; rooms are never too deep; and there is generous open space between and around the buildings with abundant deep soil area allowing for the planting of large trees. Despite requiring various additions and upgrades – some more critical than others – the idea that they are definitively inappropriate for contemproarry needs and, therefore, obsolete is simply not supported by the evidence.</p><p class=\"zh\">这项分析虽然指出了一些不足，但它实际揭示的是：Waterloo 公屋区的大部分现有住房，具备有证据支持、并为 NSW 政府自己认可的当代设计指南所提倡的基本设计属性。所有住宅都有大窗户，提供极好的采光和新鲜空气；房间从不过深；楼与楼之间和四周有宽敞的开放空间，有大量深土区域可以种植大树。尽管需要各种增建和升级（有些比另一些更关键），但认为它们注定不适合当代需求、因而已经过时的说法，根本得不到证据支持。</p></div><div class=\"para\" data-idx=\"57\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"437cc65730\"><p class=\"en\">Design considerations are never black and white, particularly given that architects and decisionmakers have access to design-based evidence that remains limited at best. For example, there is no definitive way of assessing the benefits of expansive city views available from apartments in the 30storey towers. Do those benefits outweigh the drawbacks of small apartment plans in the tallest towers on the Waterloo Estate? These apartments were all originally smaller than current NSW policy prescribes, and while some apartments have been consolidated to create larger two-bedroom units, most remain smaller than the guidelines recommend. Equally, it is reasonable to ask whether shared living spaces on each floor of the 30-storey buildings compensates for that deficit. Furthermore, we do not have methods to accurately quantify the impact on wellbeing of living with a ceiling that is 200 mm lower, or a balcony that falls below the minimum of 4 m × 1 m wide (in the case of a studio apartment) – two aspects where these apartments fall short of the Apartment Design Guide. Importantly, these small compromises should be considered in relation to the social disruption and upheaval of forced relocation. The possible adverse health outcomes are a particular concern for older residents of these buildings who are in general the most vulnerable in this respect and least likely to benefit from redevelopment.</p><p class=\"zh\">设计考量从来不是非黑即白的，尤其是建筑师和决策者能获得的设计证据充其量也很有限。例如，没有确定的方法来评估 30 层塔楼公寓所享有的开阔城市景观有什么好处。这些好处能否抵消 Waterloo 公屋区最高塔楼里公寓平面偏小的缺点？这些公寓最初都比 NSW 现行政策规定的小；虽然部分公寓已被合并成较大的两居室，但大多数仍小于指南建议。同样，有理由追问 30 层楼每层的共享起居空间能否弥补这一不足。此外，我们也没有方法准确量化住在层高低 200 毫米的房子里，或阳台小于 4 米 × 1 米的最低标准（对一室户而言）对福祉的影响——这正是这些公寓未达到《公寓设计指南》的两个方面。重要的是，这些小妥协应当与强制搬迁带来的社会扰动和动荡放在一起衡量。可能的不良健康后果对这些楼里的老年居民尤其值得关注，他们总体上在这方面最脆弱，也最不可能从再开发中获益。</p></div><div class=\"para\" data-idx=\"58\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"e312cab2d7\"><p class=\"en\">It is clear then that while the buildings on the Waterloo Estate have some deficiencies, the idea that they are definitively not fit for purpose is simply not true. With the possible exception of the slab blocks, most of the buildings on the estate could have their lives usefully extended and continue to serve their purpose in a way that supports residents with relatively modest renovation, or even with additions. With effort, even the slab blocks could be substantially improved through staged upgrades that would still be much less disruptive than what the NSW Government currently has in mind. Some upgrades of this kind have already happened. Units in the Matavai and Turanga towers, for example, have been combined. We also know that in addition to being less disruptive for residents, such retrofit and transformation strategies help to avoid the use of new materials and the emissions associated with them as well as reducing the amount of waste that goes to landfill as part of clearance-led renewal schemes. Unquestionably housing agencies and architects should be broadly pursuing the different forms of amenity that support resident wellbeing to the greatest extent possible. But equally, the question remains, does the government’s plan properly prioritize resident wellbeing? One would expect that the government has thoroughly assessed the risks to inhabitants as well as the projected benefits if it were primarily motivated by the interests of public housing tenants. An analysis of the discourse around the redevelopment case put publicly by government, however, points to other motivations.</p><p class=\"zh\">由此可见，Waterloo 公屋区的建筑虽有一些不足，但说它们注定“不再适用”根本不是事实。除了板楼可能是例外，公屋区的大多数建筑只需相对适度的翻新、甚至增建，就能有效延长寿命，并以支持居民的方式继续发挥作用。只要用心，即便是板楼也能通过分阶段升级得到大幅改善，而这仍会比 NSW 政府目前设想的方案扰动小得多。这类升级有些已经做过。例如，Matavai 和 Turanga 塔楼里的单元已经被合并。我们也知道，这类改造和转型策略除了对居民扰动较小，还有助于避免使用新材料及其相关排放，并减少以清拆为主导的更新计划送往填埋场的废料。毫无疑问，住房机构和建筑师应当尽最大可能广泛追求支持居民福祉的各种舒适性。但同样，问题依然存在：政府的计划是否恰当地把居民福祉放在优先位置？如果政府主要出于公共住房租户的利益，人们会期待它已经全面评估过对居民的风险和预期收益。然而，对政府公开提出的再开发理由所做的话语分析，指向了别的动机。</p></div><h2 class=\"sec\" data-secidx=\"59\"><span class=\"en\">Rationalizing redevelopment</span><span class=\"zh\">为再开发找理由</span></h2><div class=\"para\" data-idx=\"60\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"87b4707255\"><p class=\"en\">While improving housing quality is an objective for the Waterloo redevelopment, it was just one of several that motivated the project and arguably not the most powerful. Consistent with the redevelopment of public housing estates throughout many parts of the Global North, the redevelopment of Waterloo was also driven by the desire to deconcentrate socio-economic disadvantage and transform a stigmatized district into one seen to be more befitting its location in the highly coveted inner city of Sydney. Equally, it was a response to funding arrangements which severely constrain the capacity of housing authorities to expand their housing stock and compel them to redevelop existing landholdings via partnerships with the private sector, with the sale of new market-rate housing cross-subsidizing the delivery of social housing.</p><p class=\"zh\">改善住房质量是 Waterloo 再开发的目标之一，但它只是推动该项目的几个目标之一，而且可以说不是最有力的那个。与全球北方许多地方的公屋区再开发一样，Waterloo 的再开发也是出于<a class=\"gref\" href=\"#g-deconc\">分散社会经济劣势</a>的愿望，以及把一个被污名化的地区改造成与其所处的、在悉尼极受追捧的内城位置更相称的地方。同样，它也是对资金安排的一种回应：这些安排严重限制了住房机构扩大住房存量的能力，迫使它们通过与私人部门合作来再开发现有土地，用出售新建市场价住房的收入交叉补贴社会住房的供给。</p></div><div class=\"para\" data-idx=\"61\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"f82a98927b\"><p class=\"en\">The Waterloo project was devised as part of the Communities Plus program of estate redevelopment, which included ‘major projects’ targeting large estates with high land values, close proximity to employment and economic growth areas, good transport connections and, importantly, a history of relatively low-density zoning allowing for significantly intensified development. As recent work by Wynne et al. outline, the programme signalled the increasing relevance of land values and development yield to the selection of renewal sites, as well as to wider asset disposal strategies. A key component of the Future Directions for Social Housing strategy of the Liberal-National coalition government of the time, was that the programme responded to the long-term decline in Commonwealth funding and absence of state government funding by replacing and slightly increasing social housing stock at no net cost to the NSW Government. In essence, private property development on redeveloped estates would fund the replacement of, and a slight increase in, social housing. Rather than public housing managed by the state housing authority, this social housing would be managed by community housing organizations, capitalizing on those organizations’ exemption from paying Goods and Services Tax and their tenants’ eligibility for Commonwealth Rent Assistance (and thereby shifting the cost of housing subsidies from state to Commonwealth government).</p><p class=\"zh\">Waterloo 项目是作为 Communities Plus 公屋区再开发计划的一部分设计的。该计划包括针对大型公屋区的“重大项目”，这些公屋区地价高、靠近就业和经济增长区、交通便利，而且重要的是，历来分区密度相对较低，允许大幅提高开发强度。正如 Wynne 等人最近的研究所述，该计划表明，地价和开发收益在更新地点的选择以及更广泛的资产处置策略中越来越重要。作为当时自由党-国家党联盟政府《<a class=\"gref\" href=\"#g-futuredir\">社会住房未来方向</a>》（Future Directions for Social Housing）战略的关键组成部分，该计划回应了联邦拨款的长期下降和州政府拨款的缺位，办法是在 NSW 政府零净成本的前提下替换并略微增加社会住房存量。本质上，就是让再开发公屋区上的私人房地产开发，为社会住房的替换和小幅增加买单。这些社会住房不再是由州住房机构管理的公共住房，而是由<a class=\"gref\" href=\"#g-chp\">社区住房组织</a>管理，利用这些组织免缴商品与服务税（GST）以及其租户有资格领取联邦租金援助（Commonwealth Rent Assistance）的条件（从而把住房补贴的成本从州政府转移给联邦政府）。</p></div><div class=\"para\" data-idx=\"62\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"94c1b9abea\"><p class=\"en\">Waterloo comfortably met the Communities Plus criteria, as an 18-ha estate just a few kilometres from the Sydney CBD as well as University of Sydney, University of Technology Sydney, and Australian Technology Park. It is also only a kilometre or so from Redfern Station – a major interchange on Sydney’s railway network. Despite this, the NSW Government decided to locate a new Metro station at Waterloo, which had the effect of further enhancing land values and ensuring financial feasibility according to the Communities Plus constraints. The redevelopment of the Waterloo estate was announced with a letter to tenants from then-Minister for Social Housing, Brad Hazzard, stating:</p><p class=\"zh\">Waterloo 轻松满足 Communities Plus 的标准：它是一个 18 公顷的公屋区，距悉尼中央商务区以及悉尼大学、悉尼科技大学和澳大利亚科技园都只有几公里。它离 Redfern 站——悉尼铁路网的一个主要换乘站——也只有一公里左右。尽管如此，NSW 政府还是决定在 Waterloo 设一个新的地铁站，其效果是进一步推高地价，确保项目在 Communities Plus 的约束下具备财务可行性。Waterloo 公屋区的再开发是以时任社会住房部长 Brad Hazzard 写给租户的一封信宣布的，信中写道：</p></div><div class=\"para quote\" data-idx=\"63\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"69aaaa8959\"><p class=\"en\">I am excited to write to you and let you know Transport for NSW has announced a new Sydney Metro station at Waterloo, due to be completed by 2024. On my visits to Waterloo I have spoken to a number of tenants who have told me they like living in the area, but are disappointed with the quality of the ageing housing on the Waterloo estate. The new Metro station not only brings fantastic new rapid transport to Waterloo, it means we can rede- velop the estate with brand new and more social housing that meets people’s needs. […] The Metro station and the area’s renewal will transform the Waterloo housing estate for the better, building a dynamic new community with great transport, better homes, better facilities and more jobs.</p><p class=\"zh\">我很高兴写信告诉你们，新州交通部（Transport for NSW）已宣布在 Waterloo 新建一个悉尼地铁站，预计 2024 年完工。我在走访 Waterloo 时与许多租户交谈过，他们告诉我喜欢住在这一带，但对 Waterloo 公屋区老化住房的质量感到失望。新地铁站不仅为 Waterloo 带来了出色的快速交通，也意味着我们可以用全新的、更多的、满足人们需要的社会住房来再开发这个公屋区。[……] 地铁站和该地区的更新将让 Waterloo 公屋区变得更好，建设一个拥有便捷交通、更好住房、更好设施和更多就业的充满活力的新社区。</p><span class=\"attrib\">Brad Hazzard（时任 NSW 社会住房部长）2015 年致 Waterloo 租户的信，经作者转引。注意：作者引用它是为了接下来反驳——下一段指出，《悉尼先驱晨报》报道的因果顺序正好相反：是想再开发公屋区才决定把地铁站放在 Waterloo，而不是地铁站带来了再开发。这不是作者的立场。</span></div><div class=\"para\" data-idx=\"64\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"97986e1d21\"><p class=\"en\">While Hazzard’s letter implied that the decision to locate a Metro station in Waterloo catalysed the redevelopment of the estate, the Sydney Morning Herald reported that it was the government’s desire to redevelop the estate that led to the decision about the Metro station’s location. According to that story, Ministers for Social Housing, Planning, and Police, as well as representatives of the state-owned Urban Growth Development Corporation, were advocating for a Waterloo Metro station as a catalyst for the project. These four voices persuaded then-Premier Mike Baird to cast his deciding vote on the NSW Cabinet Infrastructure Committee for Waterloo, ahead of an alternative station location at the University of Sydney. In addition to the opportunity to redevelop state-owned housing at little or no cost to government, the project was viewed as a vehicle for increasing inner-city housing supply, and a means of addressing perceived social problems in the environs of the estate related to concentrated poverty.</p><p class=\"zh\">Hazzard 的信暗示，是在 Waterloo 设地铁站的决定催生了公屋区的再开发；但《悉尼先驱晨报》报道说，恰恰是政府想再开发公屋区的愿望，导致了地铁站选址的决定。据该报道，社会住房部长、规划部长和警务部长，以及州属城市增长发展公司（Urban Growth Development Corporation）的代表，都在力推把 Waterloo 地铁站作为项目的催化剂。这四方说服了时任州长 Mike Baird 在 NSW 内阁基础设施委员会上投下决定性一票，选择 Waterloo，而不是设在悉尼大学的备选站址。除了能以很少甚至零政府成本再开发州有住房之外，该项目还被视为增加内城住房供给的工具，以及解决公屋区周边与贫困集中相关的、被认为存在的社会问题的手段。</p></div><div class=\"para\" data-idx=\"65\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"8ec85719df\"><p class=\"en\">There is growing pressure and desire in NSW to increase housing density in inner city locations and private housing supply in general. While there are sound social and environmental arguments for densifying inner urban areas, it is also notable that significant government revenue is generated through property transfer duties and land taxes; that the then-government undertook a significant ‘asset recycling’ programme involving revenue generation and reinvestment through privatization of public infrastructure, land, and services; and that the property development and real estate industries have exercised a powerful influence on policy and planning decisions in NSW historically. Furthermore, in a planning system where government mostly is unable to do more than regulate the land use options of private property owners, large plots of public land like the Waterloo estate are rare ‘low hanging fruit’ for realizing these objectives, irrespective of the negative social impacts of redevelopment. The redevelopment of the Waterloo estate would add as many as 6000 new private apartments in an area seen as insufficiently dense for its proximity to the Sydney CBD.</p><p class=\"zh\">NSW 增加内城住房密度和总体私人住房供给的压力与意愿越来越强。加密内城地区有合理的社会和环境论据，但同样值得注意的是：政府从房产转让印花税和土地税中获得大量收入；当时的政府推行了一项大规模的“<a class=\"gref\" href=\"#g-assetrec\">资产回收</a>”（asset recycling）计划，通过把公共基础设施、土地和服务私有化来创收和再投资；而且房地产开发和地产行业历来对 NSW 的政策与规划决策有强大影响力。此外，在一个政府大多只能管制私人业主土地用途选择的规划体系里，像 Waterloo 公屋区这样的大片公有土地，是实现这些目标难得的“低垂的果实”，不管再开发会带来什么负面社会影响。Waterloo 公屋区的再开发将在一个被认为相对于其靠近悉尼中央商务区的位置密度不足的地区，增加多达 6000 套新的私人公寓。</p></div><div class=\"para\" data-idx=\"66\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"0c3dec88ec\"><p class=\"en\">Recent political leaders in NSW and their policy advisers have subscribed to the idea that large areas of concentrated public housing produce negative social outcomes due to their concentration of social disadvantage and so-called ‘neighbourhood effects’ –a concept which contends that a high incidence of disadvantage in a local area is a cause of further disadvantage for the individuals and communities who live there. A detailed discussion of this highly contested concept is outside the scope of this paper. Suffice to say, it is an idea that, as Joseph Heathcott has noted, has been deployed by architects, sociologists, and planners alike and seized upon by political decisionmakers to justify the retrenchment of public housing. For instance, in making the case for the Waterloo redevelopment, Hazzard claimed that:</p><p class=\"zh\">NSW 近年的政治领导人及其政策顾问信奉这样一种观念：大片集中的公共住房会因社会劣势的集中和所谓“<a class=\"gref\" href=\"#g-neigh\">邻里效应</a>”而产生负面社会后果。邻里效应这一概念认为，一个地区劣势的高发生率，会给住在那里的个人和社区带来更多劣势。对这一极具争议的概念的详细讨论超出了本文范围。只需指出，正如 Joseph Heathcott 所说，建筑师、社会学家和规划师都曾使用这一观念，而政治决策者则抓住它来为削减公共住房辩护。例如，在为 Waterloo 再开发陈述理由时，Hazzard 声称：</p></div><div class=\"para quote\" data-idx=\"67\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"ca5162dcaa\"><p class=\"en\">The major plus of all this which is not necessarily given enough focus is that when you get a mixture of housing, private and public, you get an incredible drop in antisocial behaviour […] Also what appeals to me is that little kids growing up don’t just see their parents and grandparents not going to work […] They see people around them dressed for work, leaving home to go about their day, and they think ‘Gee whiz that’s what I can do’.</p><p class=\"zh\">这一切最大的好处，也是人们没有给予足够关注的，是当住房混合起来、私人和公共混在一起时，反社会行为会大幅下降 [……] 另外让我觉得有吸引力的是，小孩子长大时看到的不只是父母和祖父母不去上班 [……] 他们看到身边的人穿着上班的衣服出门开始一天的工作，他们会想：“哇，原来我也可以这样。”</p><span class=\"attrib\">Brad Hazzard 为 Waterloo 再开发辩护时的原话，经作者转引。这是\"社会混合能减少反社会行为、给孩子树立榜样\"的典型说法，正是作者下一段要质疑的\"邻里效应 / 分散劣势\"逻辑：作者指出这种主张证据很薄弱，而且 Waterloo 所在街区本来就已是约 30% 社会住房、70% 私人住房。不是作者的立场。</span></div><div class=\"para\" data-idx=\"68\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"72fc1c47f7\"><p class=\"en\">It is important to note that social housing in Australia is a highly residualized tenure. The small stock and tight eligibility criteria result in an increasing number of allocations to people with complex needs. It is the combination of eligibility criteria, limited supply, and spatial distribution that leads to concentrated disadvantage. Yet government policy has focused only on the latter, with deconcentration via mixed tenure (re)development prevailing as the ‘common-sense solution’ in spite of thin evidence to support claims that it reduces tenants’ disadvantage at all, let alone more than alternative or complementary interventions such as higher levels of income support and social services. Furthermore, in limiting the analysis of ‘mix’ to the boundaries of an estate, the discourse of deconcentration ignores neighbourhood-scale tenure mixes – the more relevant scale according to several housing scholars. In the case of Waterloo, neighbourhood-scale mix is already approximately 30% social and 70% private housing.</p><p class=\"zh\">必须指出，社会住房在澳大利亚是一种高度<a class=\"gref\" href=\"#g-residual\">残余化</a>的权属形式。存量小、准入标准严格，导致越来越多的住房被分配给有复杂需求的人。造成劣势集中的，是准入标准、供给有限和空间分布三者的结合。然而政府政策只关注了最后一项，通过混合权属（再）开发来分散劣势，成了占主导地位的“常识性解决方案”；尽管几乎没有证据支持它能减少租户的劣势，更不用说它比其他替代或补充措施（例如更高水平的收入支持和社会服务）更有效。此外，分散劣势的话语把对“混合”的分析局限在公屋区边界之内，忽视了街区尺度的权属混合，而好几位住房学者认为那才是更相关的尺度。就 Waterloo 而言，街区尺度的权属构成已经是大约 30% 社会住房、70% 私人住房。</p></div><div class=\"para\" data-idx=\"69\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"6240a8d9a5\"><p class=\"en\">Despite its subordination to other objectives, there is a stated desire among politicians and public servants to improve the quality and suitability of housing for social housing tenants in Waterloo. However, there appears to be some discordance between the statements of politicians and news media on the one hand and those of planning practitioners on the other. Recent planning documents claim that the estate’s buildings‘ have high maintenance costs and are at the end of their economic life’. They also note that more than half of the estate’s dwellings are two-bedroom apartments whereas two-thirds of households are single persons – problematized as a ‘mismatch’ in the context of a highly targeted and fiscally-constrained public housing system. They describe the estate as ‘an “island” in nature with roads physically disconnected, an a-typical block structure and built form, and typologies that are distinctly different from the surrounding areas’, ‘[a]bove ground car parking [leaving] streets devoid of social activity’. Yet none of these claims speak to the qualities of tenants’ actual dwellings, which Hazzard described as ‘terrible’.</p><p class=\"zh\">尽管从属于其他目标，政客和公务员仍表示希望为 Waterloo 的社会住房租户改善住房的质量和适用性。然而，一方面是政客和新闻媒体的说法，另一方面是规划从业者的说法，两者之间似乎有些不一致。近期的规划文件称，公屋区的建筑“维护成本高，已到经济寿命的尽头”。文件还指出，公屋区一半以上的住宅是两居室，而三分之二的住户是单人户；在一个高度定向、财政受限的公共住房体系中，这被当作一种“错配”（mismatch）问题。文件把公屋区描述为“本质上是一座‘孤岛’，道路在物理上断开，街区结构和建成形态不典型，住宅类型与周边地区明显不同”，“地面停车场让街道缺乏社会活动”。然而，这些说法没有一条涉及租户实际住宅的品质，而 Hazzard 把它们形容为“糟糕透顶”。</p></div><div class=\"para\" data-idx=\"70\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"160984aac8\"><p class=\"en\">The nearest thing to a publicly available assessment of the condition of Waterloo’s housing stock was conducted by the now-disestablished Redfern Waterloo Authority – the planning agency created by the NSW Government in 2004 to lead renewal throughout the neighbourhood, including the Waterloo and Redfern estates. The Draft Redfern-Waterloo Built Environment Plan Stage 2 created a redevelopment blueprint that was soon abandoned but which set the stage for the next two decades of state government planning for the estate. It claimed that much of the public housing in Waterloo and Redfern is ‘not well suited to residents’ needs and nearing the end of its economic life’. It identified issues with outdated facilities such as shared laundries and ‘layout, orientation, footprints and design [that] are inefficient and do not address the street’, leading to ‘limited surveillance of the public domain’ as well as ‘irregular siting’ that caused sub-optimal access to sunlight and ventilation and a lack of well-defined separation of public and private spaces. However, such criticisms were largely reserved for the estate’s walk-up apartment complexes, particularly as their lower density made their use of space ‘inefficient’; relocation of sitting tenants would also be more manageable and a greater uplift in density achieved. It is these buildings which will be the focus of the first stage of the estate redevelopment, along with the mid-rise Dobell, Drysdale, Madden Place and Camelia Grove buildings. Together they comprise ‘Waterloo South’, the precinct designated in 2020 to progress as a priority, before finalizing plans for the parts of the estate occupied by the higher-density towers and slab buildings.</p><p class=\"zh\">最接近一份公开的 Waterloo 住房存量状况评估的，是现已撤销的 <a class=\"gref\" href=\"#g-rwa\">Redfern Waterloo 管理局</a>所做的评估。这是 NSW 政府于 2004 年设立的规划机构，负责领导整个街区（包括 Waterloo 和 Redfern 公屋区）的更新。《Redfern-Waterloo 建成环境规划第二阶段（草案）》制定了一份再开发蓝图，很快就被放弃，却为此后二十年州政府对该公屋区的规划定下了基调。它声称 Waterloo 和 Redfern 的大部分公共住房“不太适合居民需要，接近经济寿命尽头”。它指出了公共洗衣房等过时设施，以及“布局、朝向、占地和设计效率低下、不面向街道”的问题，导致“对公共领域的监视有限”，还有造成日照和通风欠佳的“不规则布置”，以及公共与私人空间缺乏清晰分隔。然而，这类批评主要针对公屋区的无电梯公寓楼群，尤其因为它们密度较低，用地“效率不高”；搬迁现有租户也更容易处理，而且能实现更大的密度提升。正是这些建筑，连同中层的 Dobell、Drysdale、Madden Place 和 Camelia Grove，将成为公屋区再开发第一阶段的重点。它们共同构成“Waterloo South”，这个片区在 2020 年被指定为优先推进，然后才最终确定公屋区中高密度塔楼和板楼所在部分的规划。</p></div><div class=\"para\" data-idx=\"71\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"fcfe57b0e2\"><p class=\"en\">While the Redfern Waterloo Authority took issue with the ‘unsightly … blank, unfriendly’ car parks surrounding the towers and slabs, it suggested that the ‘economic life of the high-rise buildings (8 or more storeys) are [sic] estimated to be a further 30 years’, and that, as such, ‘[i]nfill development will need to respond to these buildings’. A response from the City of Sydney largely concurred with this assessment, while also making the recommendation that the Dobell and Drysdale buildings ‘be retained and refurbished to save money, conserve resources and to retain a valuable record of examples of better designed public housing from the 1980s to be found anywhere in the world’.</p><p class=\"zh\">Redfern Waterloo 管理局虽然对塔楼和板楼周围“难看……空白、不友好”的停车场有意见，但它认为“高层建筑（8 层及以上）的经济寿命估计还有 30 年”，因此“填充式开发需要回应这些建筑”。悉尼市的回应基本同意这一评估，同时建议保留并翻新 Dobell 和 Drysdale 两栋楼，“以节省资金、保护资源，并保留世界上任何地方都能找到的 1980 年代设计较好的公共住房实例的宝贵记录”。</p></div><div class=\"para\" data-idx=\"72\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"720382ecee\"><p class=\"en\">Ironically, it is the high rises which attract the most negative attention in popular media, their stigmatization helping to legitimize redevelopment. This is despite the fact that redeveloping them would yield quite limited benefits in the terms articulated by the state government’s planning analysis, and have intense social impacts on existing residents. The estate has been described as a series of ‘grey concrete buildings … strikingly incongruous against the relatively flat, terraced terrain of their urban surrounds’, or more floridly as ‘Soviet-style’, ‘bleak, grey housing commission towers’. Like other high-rise public housing complexes, the towers are occasionally labelled ‘Suicide Towers’. The towers and slabs are routinely used as stock images in any story about public housing or housing affordability. Hazzard’s successor as Minister for Social Housing, Pru Goward (who was also his predecessor), described these buildings and those in the neighbouring Redfern estate as ‘honeypots’ for illicit drug dealing and use when announcing a Local Allocation Policy that would prevent any applicant with a drug conviction from moving into high-density public housing in Waterloo, Redfern, and Surry Hills. When the project’s proponents discuss the need for new social housing to be ‘tenure blind’, it is these buildings that they invoke.</p><p class=\"zh\">讽刺的是，在大众媒体中招致最多负面关注的恰恰是高层楼，对它们的污名化有助于为再开发提供正当性。尽管按州政府规划分析所阐述的标准，再开发这些楼带来的好处相当有限，而且会对现有居民造成强烈的社会冲击。这个公屋区被描述为一组“灰色混凝土建筑……与周边城市相对平坦的联排住宅地形格格不入”，或者更夸张地说是“苏联式的”“阴沉、灰色的住房委员会塔楼”。和其他高层公共住房一样，这些塔楼偶尔被称为“自杀塔”（Suicide Towers）。在任何关于公共住房或住房可负担性的报道中，塔楼和板楼都经常被当作配图。Hazzard 在社会住房部长一职上的继任者 Pru Goward（她也是他的前任）在宣布一项地方分配政策时，把这些楼以及邻近 Redfern 公屋区的楼称为非法毒品交易和吸毒的“蜜罐”（honeypots）；该政策禁止任何有毒品定罪记录的申请人搬进 Waterloo、Redfern 和 Surry Hills 的高密度公共住房。当项目推动者谈论新的社会住房需要做到“<a class=\"gref\" href=\"#g-tenureblind\">权属不可辨</a>”（tenure blind）时，他们援引的正是这些楼。</p></div><div class=\"para\" data-idx=\"73\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"e0ec4155ba\"><p class=\"en\">As such, the Waterloo estate is subject to multiple forms of stigmatization. Its stigmatization in housing and social policy discourses centres on concentrated disadvantage and the problems that purportedly arise. Its stigmatization in urban planning and design discourse centres on the outmoded characteristics of the earlier housing stock in the south of the estate, including irregular and inefficient siting and ambiguous boundaries of public and private space. It is stigmatization in the media centres on the newer, more visible buildings – the towers and slabs – which are seen as an affront to popular taste and serve to anchor the social disrepute of public housing tenants. The relationship between these discourses and housing quality is tenuous at best: none speak directly to the qualities of tenants’ homes. Indeed, stigmatization allows proponents of redevelopment to elide the question of existing housing quality. These discourses open up a powerful ‘reputational gap’, devaluing the present condition of the estate in relation to what it might in the future become, and thus help legitimize the proposed redevelopment.</p><p class=\"zh\">因此，Waterloo 公屋区承受着多重形式的污名化。在住房与社会政策话语中，对它的污名化集中于劣势的集中及其据称带来的问题。在城市规划与设计话语中，污名化集中于公屋区南部较早期住房存量的过时特征，包括不规则、低效率的布局，以及公共与私人空间边界模糊。在媒体中，污名化集中于较新、较显眼的建筑——塔楼和板楼——它们被视为冒犯大众品味，并起到坐实公共住房租户社会恶名的作用。这些话语与住房质量之间的关系充其量是牵强的：没有一种话语直接涉及租户住宅的品质。事实上，污名化让再开发的推动者得以回避现有住房质量的问题。这些话语打开了一个强有力的“<a class=\"gref\" href=\"#g-repgap\">声誉差距</a>”（reputational gap），相对于公屋区未来可能成为的样子贬低它现在的状况，从而有助于为拟议的再开发提供正当性。</p></div><h2 class=\"sec\" data-secidx=\"74\"><span class=\"en\">Conclusion</span><span class=\"zh\">结论</span></h2><div class=\"para\" data-idx=\"75\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"a41480617a\"><p class=\"en\">Is the Waterloo estate’s housing stock among the worst quality and most in need of replacement out of all public housing in NSW? While it is impossible to answer definitively, there is no evidence to suggest that it is and it is certainly doubtful that it is the case. There are public housing complexes that are older than Waterloo, and several that exhibit just as many if not more of the design shortcomings with which it has been charged. Yet these are not currently slated for redevelopment; as we have discussed, housing quality is just one reason among several driving the redevelopment of Waterloo, and far from the most significant. The estate is a large plot of high value and publicly owned land, with a significant gap between ground rents realized by the state and ground rents potentially received through partial privatization and redevelopment. It also has a significant reputational gap, created through denigration of its present use and idealization of its future use.</p><p class=\"zh\">Waterloo 公屋区的住房存量，是否属于 NSW 所有公共住房中质量最差、最需要替换的那一批？虽然不可能给出确定答案，但没有证据表明是这样，而且肯定值得怀疑。有些公共住房项目比 Waterloo 更老，也有几个表现出与它被指责的同样多、甚至更多的设计缺陷。然而这些项目目前并未被列入再开发计划；正如我们所讨论的，住房质量只是推动 Waterloo 再开发的几个原因之一，而且远不是最重要的。这个公屋区是一大片高价值的公有土地，州政府实现的地租与通过部分私有化和再开发可能获得的地租之间，存在显著差距（即<a class=\"gref\" href=\"#g-rentgap\">租差</a>）。它也有一个显著的声誉差距，是通过贬低其现有用途、理想化其未来用途制造出来的。</p></div><div class=\"para\" data-idx=\"76\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"5cc55b2017\"><p class=\"en\">Waterloo is therefore selectively represented as outdated and unfit for purpose, in the sense of a disproportionate focus on the Waterloo estate in relation to other public housing estates and in the identification and articulation of only its negative characteristics that help justify its demolition. All buildings are tarred with the same brush, foreclosing rational assessment of the qualities of the estate’s housing stock and consideration of alternatives. As this paper shows, there are many redeeming features of this housing which, alongside the negative impacts of relocation on residents (and negative environmental impacts of demolition and redevelopment), should be weighed against the benefits of replacing it with homes that meet contemporary standards and expectations. A more fulsome evaluation of these benefits and costs suggests that retaining at least some of the estate’s existing buildings, renovating, and refurbishing, perhaps developing infill housing and gradually phasing out the established buildings over a longer time period (as well as building or buying new public housing elsewhere) could produce better outcomes. A new rationale will be needed in order for this kind of evaluation to occur – one that prioritizes the wellbeing of existing tenants and maximization of current public housing stock in the context of immense immediate and future need.</p><p class=\"zh\">因此，Waterloo 被选择性地呈现为过时的、不再适用的：一方面，相对于其他公屋区，人们不成比例地聚焦于 Waterloo；另一方面，只识别和阐述它那些有助于为拆除辩护的负面特征。所有建筑被一棍子打死，排除了对公屋区住房存量品质的理性评估和对替代方案的考虑。正如本文所表明的，这些住房有许多可取之处，应当连同搬迁对居民的负面影响（以及拆除和再开发对环境的负面影响），与用符合当代标准和期望的住宅替换它们的好处放在一起权衡。对这些收益和成本做更全面的评估后会发现：至少保留公屋区部分现有建筑，加以翻新和整修，或许再建一些填充式住房，在更长时间内逐步淘汰既有建筑（同时在其他地方新建或购买公共住房），可能会带来更好的结果。要让这种评估得以进行，需要一种新的理由：在当下和未来需求巨大的背景下，把现有租户的福祉和现有公共住房存量的最大化放在优先位置。</p></div>", "toc": [{"idx": 0, "level": "h2", "en": "Abstract", "zh": "摘要"}, {"idx": 3, "level": "h2", "en": "Introduction", "zh": "引言"}, {"idx": 10, "level": "h2", "en": "The emergence of public housing in NSW", "zh": "NSW 公共住房的出现"}, {"idx": 18, "level": "h2", "en": "(Re)making Waterloo", "zh": "（重新）营造 Waterloo"}, {"idx": 45, "level": "h2", "en": "Evaluating Waterloo", "zh": "评估 Waterloo"}, {"idx": 59, "level": "h2", "en": "Rationalizing redevelopment", "zh": "为再开发找理由"}, {"idx": 74, "level": "h2", "en": "Conclusion", "zh": "结论"}]}, "sisson-2024-public-housing-territorial-stigma": {"meta": {"title_en": "Public housing and territorial stigma: towards a symbolic and political economy", "title_zh": "公共住房与地域污名：走向一种符号与政治经济", "crumb": "Sisson 2024 · Public housing and territorial stigma"}, "html": "<h2 class=\"sec\" data-secidx=\"0\"><span class=\"en\">Abstract</span><span class=\"zh\">摘要</span></h2><div class=\"para\" data-idx=\"1\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"1fab0eda43\"><p class=\"en\">This article illustrates how the stigmatization of public housing in Australia has been co-constituted by material and symbolic forces over several decades. Drawing on discourse analysis in conjunction with historical-institutional analysis of housing policy trajectories and the place of housing within political-economic change, it shows how territorial stigmatization can be understood as the product of media, policy and social scientific discourses which problematize public housing as well as histories of policy reform and political-economic restructuring which shape its social, material and institutional conditions. The discursive problematization of public housing estates in particular works to obscure the role of restructuring and reform and thus present demolition and redevelopment as a ‘common sense’ response, even as a form of destigmatization. The understanding of stigmatisation that this article advances—as a recursively symbolic and political-economic process—is therefore conceptually significant and important for critically evaluating government interventions in the context of stigma, including claims of destigmatization.</p><p class=\"zh\">本文说明，澳大利亚公共住房的污名化是几十年来物质力量与符号力量共同构成的结果。文章结合话语分析与对住房政策轨迹、以及住房在政治经济变迁中位置的历史-制度分析，指出地域污名化可以理解为两方面的产物：一方面是把公共住房问题化的媒体、政策和社会科学话语；另一方面是塑造其社会、物质和制度条件的政策改革史与政治经济重构史。对公屋区的话语问题化，尤其起到遮蔽重构与改革作用的效果，从而把拆除和再开发呈现为一种“常识性”回应，甚至呈现为一种去污名化。本文提出的污名化理解——把它看作一个符号与政治经济递归交织的过程——因此在概念上有重要意义，对于批判性地评估政府在污名背景下的干预（包括声称的去污名化）也很重要。</p></div><h2 class=\"sec\" data-secidx=\"2\"><span class=\"en\">1. Introduction</span><span class=\"zh\">1. 引言</span></h2><div class=\"para\" data-idx=\"3\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"65ca588b0a\"><p class=\"en\">If academic literature gives any indication, some of the most stigmatized places in the Global North are public or social housing estates. They are certainly some of most commonly examined places in a territorial stigma literature which has blossomed since Loïc Wacquant developed the concept for understanding a ‘blemish of place’ (Wacquant, 2007, 2008; Wacquant et al., 2014). The question that I aim to answer in this article is: why do public housing estates have negative reputations? Rather than offering a universal explanation, I illustrate how the territorial stigmatisation of public housing in Australia is the product of specific geographic and historical contexts of policy reform, political-economic restructuring, and policy and popular discourse, and that together these set the stage for ‘estate renewal’ (demolition and redevelopment as mixed-tenure precincts) to become the accepted common-sense solution to a range of public housing problems. Elements of this argument will resonate in other places. More importantly, my approach to explaining the production of territorial stigma—as co-constituted through material and discursive forces within particular geographical and historical contexts—offers lessons for analyses and critique of government interventions in the context of stigma elsewhere.</p><p class=\"zh\">如果学术文献能说明什么的话，全球北方被污名化最严重的地方之中，有一些就是公共或社会住房区。自 Loïc Wacquant 提出这个概念、用来理解“地方的污点”（blemish of place）以来，<a class=\"gref\" href=\"#g-tstigma\">地域污名</a>（territorial stigma）文献蓬勃发展，公屋区无疑是其中最常被研究的地方之一（Wacquant, 2007, 2008; Wacquant et al., 2014）。我在本文要回答的问题是：为什么公屋区声誉不好？我不提供普遍性的解释，而是说明澳大利亚公共住房的地域污名化，是政策改革、政治经济重构以及政策与大众话语在特定地理和历史语境中的产物；它们共同为“<a class=\"gref\" href=\"#g-renewal\">公屋区更新</a>”（拆除并再开发为混合权属片区）成为解决一系列公共住房问题的公认常识性方案铺平了道路。这一论点的某些部分会在其他地方引起共鸣。更重要的是，我解释地域污名如何产生的方法——把它看作在特定地理与历史语境中由物质力量和话语力量共同构成的——为其他地方分析和批判污名背景下的政府干预提供了借鉴。</p></div><div class=\"para\" data-idx=\"4\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"a9343e681d\"><p class=\"en\">Some accounts attribute territorial stigmatization to the concentrated presence of stigmatized groups and deteriorating quality of built environments; others focus on the concepts or discourses which wield ‘symbolic power’, shaping common perception and therefore treatment of public housing estates, and contributing to a common-sense or doxa that they must be demolished and redeveloped in a radically different way (Bourdieu, 1991; Wacquant, 2009). As Larsen and Delica (2019) argue, single-sided accounts risk oversimplifying the production of territorial stigma as something inevitable in the case of the former and as strategically confected in the case of the latter. I argue that understanding the territorial stigmatization of public housing requires an equal engagement with the real conditions of estates and the political and economic processes that have shaped them as well as their (mis)representation symbolically. It requires an engagement with the particular histories of policy and political-economic restructuring that have created the conditions in which territorial stigma has emerged but which territorial stigma works to simultaneously legitimize, obscure and reproduce (Sisson, 2021b).</p><p class=\"zh\">有些论述把地域污名化归因于被污名群体的集中存在和建成环境质量的恶化；另一些则关注掌握“<a class=\"gref\" href=\"#g-symbolic\">符号权力</a>”（symbolic power）的概念或话语，这些概念和话语塑造了人们对公屋区的普遍看法、进而影响对它们的处置，并助长了一种认为它们必须被拆除、并以截然不同的方式再开发的常识或 doxa（Bourdieu, 1991; Wacquant, 2009）。正如 Larsen 和 Delica（2019）所说，只看一面的论述有过度简化地域污名生产的风险：前者把它说成不可避免的，后者把它说成蓄意捏造的。我认为，理解公共住房的地域污名化，既需要同等关注公屋区的真实状况以及塑造了这些状况的政治和经济过程，也需要关注它们在符号层面的（错误）呈现。它需要关注特定的政策史和政治经济重构史：正是这些历史创造了地域污名得以出现的条件，而地域污名又同时为这些历史提供正当性、遮蔽它们、并使之再生产（Sisson, 2021b）。</p></div><div class=\"para\" data-idx=\"5\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"64f5bdb235\"><p class=\"en\">This article contains four main sections. In the first, I give an overview of the literature on territorial stigma and public housing which highlights the tendency of analyses to focus on the social and physical characteristics of public housing estates or the concepts and discourses through which estates are represented as problem places. In the second, I briefly outline the methodology of the subsequent analysis. In the third, I explain the stigmatization of public housing in Australia as a product of the superordination of private homeownership in the 20th century (as a mechanism and marker of ‘successful’ citizenship and participation in Australian capitalism and settler colonialism) and a series of neoliberal reforms and wider political-economic restructuring from the 1970s onwards. In the fourth, I unpack how territorial stigma is produced in media and policy discourse in a way which obscures the structural and systemic causes of various real and imagined problems within public housing and portrays public housing estates themselves as the problem, leading to the accepted common-sense ‘solution’ of estate renewal. I conclude by synthesizing these arguments and arguing that territorial stigma can only be understood by focusing equally and recursively on the structural and institutional conditioning of space and place and its discursive representation—that it is politically, economically and symbolically co-constituted—and that this is vital for any meaningful form of destigmatization.</p><p class=\"zh\">本文包括四个主要部分。第一部分综述关于地域污名与公共住房的文献，指出分析往往偏重公屋区的社会和物理特征，或偏重把公屋区呈现为问题地方的概念与话语。第二部分简要说明后续分析的方法。第三部分把澳大利亚公共住房的污名化解释为两方面的产物：二十世纪私人自有住房的至高地位（它是“成功”公民身份、以及参与澳大利亚资本主义和定居者殖民主义的机制与标志），以及 1970 年代以来一系列新自由主义改革和更广泛的政治经济重构。第四部分剖析地域污名如何在媒体和政策话语中产生：这种话语遮蔽了公共住房内各种真实和想象问题的结构性、系统性原因，把公屋区本身描绘成问题所在，从而导向公屋区更新这一公认的常识性“方案”。最后我综合这些论点，并主张：只有同等地、递归地关注空间与地方的结构性和制度性塑造及其话语呈现，也就是说，把地域污名看作在政治、经济和符号上共同构成的，才能理解它；这对任何有意义的去污名化都至关重要。</p></div><h2 class=\"sec\" data-secidx=\"6\"><span class=\"en\">2. Territorial stigma and public housing estates</span><span class=\"zh\">2. 地域污名与公屋区</span></h2><div class=\"para\" data-idx=\"7\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"ead14317f5\"><p class=\"en\">The territorial stigmatization of public housing is often attributed to the concentration of stigmatized persons and groups within public housing (e.g. Arthurson, 2013; Dean &amp; Hastings, 2000; Pereira &amp; Queirós, 2014). This is especially true of jurisdictions where ‘residualization’ has occurred: where the stock of public and social housing has been drastically reduced and new allocations ever-increasingly targeted towards the poorest, most marginalized and most precarious households. The residualization of public housing has concentrated many of society’s most disadvantaged, marginalized, and oppressed within the remaining housing stock. This includes racialized minorities, recent migrants, people with disabilities, people with physical or mental illness (including addiction), the recently incarcerated and the unemployed. These are, of course, intersecting categories. The intersection of race and poverty, for example, is writ large in the territorial stigmatization of British and European estates inhabited by post-colonial migrants (e.g. Kearns et al., 2013; Kirkness, 2014; Slater &amp; Anderson, 2012; Wacquant, 2008) and estates in settler colonial societies that are home to large Black communities, Indigenous communities, or other communities of colour (e.g. Birdsall-Jones, 2013; Blokland, 2008; Goetz, 2013; Kipfer &amp; Petrunia, 2009).</p><p class=\"zh\">公共住房的地域污名化常被归因于被污名化的个人和群体在公共住房中的集中（例如 Arthurson, 2013; Dean & Hastings, 2000; Pereira & Queirós, 2014）。在发生了“<a class=\"gref\" href=\"#g-residual\">残余化</a>”的地方尤其如此：公共和社会住房存量大幅减少，新的分配越来越只针对最贫困、最边缘、最不稳定的家庭。公共住房的残余化，把社会中许多处境最不利、最边缘、最受压迫的人集中到了剩余的住房存量里。这包括被种族化的少数群体、新移民、残障人士、身体或精神疾病患者（包括成瘾者）、刚出狱的人和失业者。这些当然是相互交叉的类别。例如，种族与贫困的交叉，在住着后殖民移民的英国和欧洲公屋区的地域污名化中表现得非常明显（例如 Kearns et al., 2013; Kirkness, 2014; Slater & Anderson, 2012; Wacquant, 2008），在定居者殖民社会中住着大量黑人社区、原住民社区或其他有色人种社区的公屋区中也是如此（例如 Birdsall-Jones, 2013; Blokland, 2008; Goetz, 2013; Kipfer & Petrunia, 2009）。</p></div><div class=\"para\" data-idx=\"8\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"9de44f3621\"><p class=\"en\">The territorial stigmatization of public housing is also often attributed to physical or aesthetic characteristics. This includes the distinctive design features of estates that resulted from innovative, at times experimental approaches to the challenge of mass provision under lean budgets. Arthurson (2004), for instance, observed how the former public housing estate in Villawood, Sydney, was stigmatized not only for being poor but for being ‘ugly’; it was seen as ‘unusual’, out of place, incongruous, a disruption of the otherwise coherent image of the surrounding area. Elsewhere, as Dean &amp; Hastings (2000), Kirkness (2014), and Wassenberg (2004) have separately noted, the visibility of high-rise estates is read as a visual cue for the social ills purportedly concentrated therein. Deterioration in the quality of public housing’s built environments, due to inadequate repairs and maintenance, has been identified as an additional cause (Slater &amp; Anderson, 2012; Watt, 2020).</p><p class=\"zh\">公共住房的地域污名化也常被归因于物理或审美特征。这包括公屋区的独特设计特征，它们来自在紧张预算下应对大规模供给挑战时的创新、有时是实验性的做法。例如 Arthurson（2004）观察到，悉尼 Villawood 的前公屋区被污名化，不仅因为它穷，还因为它“丑”；它被视为“不寻常”、格格不入、不协调，破坏了周边地区原本连贯的形象。在其他地方，正如 Dean & Hastings（2000）、Kirkness（2014）和 Wassenberg（2004）分别指出的，高层公屋区的显眼性被解读为其中据称集中的社会弊病的视觉线索。由于维修保养不足导致的公共住房建成环境质量下降，也被认为是另一个原因（Slater & Anderson, 2012; Watt, 2020）。</p></div><div class=\"para\" data-idx=\"9\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"c2543a2072\"><p class=\"en\">The social and material characteristics of public housing can be important conditions for its territorial stigmatization; however, they do not naturally or inevitably lead to the production of stigma. Recognising this, many scholars have drawn attention to the discursive processes through which estates and their tenants have been constructed as exceptionally problematic places and people. For instance, Hancock &amp; Mooney (2013) describe how the ‘Broken Society’ discourse in the UK problematized ‘estate cultures’ that allegedly developed due to spatial concentration. Similarly, Slater unpacks the ‘sink estate’ label and its use to ‘describe an area of council housing where the behaviour of tenants is, first, under intense moral condemnation, and second, both cause and symptom of poor housing conditions and neighbourhood malaise’ (2018, p. 882, emphasis added).</p><p class=\"zh\">公共住房的社会和物质特征可以是其地域污名化的重要条件；但它们并不会自然地或不可避免地导致污名的产生。认识到这一点，许多学者关注了话语过程：公屋区及其租户正是通过这些过程，被建构为格外有问题的地方和人。例如，Hancock & Mooney（2013）描述了英国的“破碎社会”（Broken Society）话语如何把据称因空间集中而形成的“公屋区文化”问题化。同样，Slater 拆解了“沉沦公屋区”（sink estate）这个标签，以及它被用来“描述这样一片市政住房区：首先，租户的行为受到强烈的道德谴责；其次，这种行为既是住房条件差和街区萎靡的原因，也是其症状”（2018, p. 882，强调为原文所加）。</p></div><div class=\"para\" data-idx=\"10\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"e10adbb50f\"><p class=\"en\">Arthurson &amp; Jacobs (2009) categorize these representations of housing problems as ‘moral underclass discourses’ and ‘social integrationist discourses’: the former portray individual deficits as the cause of social problems while the latter level blame at tenants’ purported social isolation and economic disconnection. Within both discourses, the spatial concentration of poor people is said to exacerbate poverty and disadvantage, either by encouraging a range of socially pathological behaviours (criminality, immorality, incivility, irresponsibility, and so on) or by conditioning inhabitants’ aspirations and thereby causing them to self-exclude and self-limit. Somewhat paradoxically, these discourses depict public housing as a cause of disadvantage, rather than a part of the solution to it (Jacobs et al., 2011; Slater, 2018). As Martine August (2014) explains, they are informed by a ‘poverty pathogen epistemology’ that is shared by concepts ranging from the ‘underclass’, ‘incivilities’, and ‘neighbourhood effects’. Such concepts have been central to the production of territorial stigmatization, through the knowledge they produce and their influence on policy regimes and interventions. Similarly, as Cupers (2017) argues, social scientific concepts of human territoriality have informed policy discourses on ‘defensible space’ and Crime Prevention Through Environmental Design, which led to the further problematization of public housing on grounds that, as a tenure and a built form, it denied residents a sense of ‘ownership’, discouraged sociability and facilitated criminality and disorderliness.</p><p class=\"zh\">Arthurson & Jacobs（2009）把这些对住房问题的表述分为“道德下层阶级话语”（moral underclass discourses）和“社会融合主义话语”（social integrationist discourses）：前者把个人缺陷描绘为社会问题的原因，后者则把责任归于租户据称的社会孤立和经济脱节。在两种话语中，穷人的空间集中都被说成会加剧贫困和劣势：要么助长一系列社会病态行为（犯罪、不道德、不文明、不负责任等），要么塑造居民的期望，使他们自我排斥、自我设限。有些吊诡的是，这些话语把公共住房描绘为劣势的原因，而不是解决劣势的一部分（Jacobs et al., 2011; Slater, 2018）。正如 Martine August（2014）所解释的，它们出自一种“贫困病原体认识论”（poverty pathogen epistemology），从“下层阶级”“不文明行为”到“<a class=\"gref\" href=\"#g-neigh\">邻里效应</a>”等概念都共享这种认识论。这些概念通过其产生的知识以及对政策体制和干预的影响，一直是地域污名化生产的核心。同样，正如 Cupers（2017）所说，关于人类领域性的社会科学概念影响了“可防卫空间”（defensible space）和“通过环境设计预防犯罪”（CPTED）的政策话语，导致公共住房被进一步问题化，理由是它作为一种权属形式和建成形态，剥夺了居民的“所有感”，抑制了社交性，助长了犯罪和失序。</p></div><div class=\"para\" data-idx=\"11\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"353d1dd0af\"><p class=\"en\">Wacquant remarks that, ‘under cover of describing marginality’, these concepts ‘contribute to moulding it by organizing its collective perception and political treatment’ (2008, p. 8). They represent public housing estates as bounded ‘problem spaces’ wherein social problems are caused and confined and where their ‘solutions’ are likewise to be found (Dikeç, 2002; see also Tissot, 2018). As Bourdieu describes it, their symbolic power is one of ‘confirming or transforming the vision of the world and, thereby, action on the world and thus the world itself ’ (1991, p. 170).</p><p class=\"zh\">Wacquant 指出，“打着描述边缘性的幌子”，这些概念“通过组织对边缘性的集体感知和政治处置，参与塑造了边缘性”（2008, p. 8）。它们把公屋区呈现为有边界的“问题空间”，社会问题在其中产生、也被限制在其中，而“解决方案”同样要在其中寻找（Dikeç, 2002；另见 Tissot, 2018）。用 Bourdieu 的话说，它们的符号权力在于“确认或改变对世界的看法，从而改变对世界的行动，进而改变世界本身”（1991, p. 170）。</p></div><div class=\"para\" data-idx=\"12\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"ad1d4a6076\"><p class=\"en\">This is where the adverb ‘territorial’ becomes relevant to conceptualising the stigmatization of public housing estates. As Sack (1986) puts it, territory has a ‘reifying’ power that draws attention away from the structural and institutional conditions of its production and onto territory itself, giving it the appearance of a neutral object possessing inherent qualities and characteristics (see also Brenner &amp; Elden, 2009). So, the territories of public housing estates encompass both their social and physical characteristics and their representation as spaces of ‘concentrated disadvantage’, ‘sink estates’ and so on, which presents them as inherently impoverished, run-down and rife with social problems rather than the product of factors such as allocations policies, maintenance, and construction. These representations legitimize unjust interventions and neglect (explained further by Sisson, 2021b).</p><p class=\"zh\">这正是“<a class=\"gref\" href=\"#g-territorial\">地域的</a>”（territorial）这个修饰语在概念化公屋区污名化时变得重要的地方。正如 Sack（1986）所说，地域具有一种“物化”（reifying）的力量，它把注意力从其生产的结构性与制度性条件上移开，转到地域本身，让地域看起来像一个拥有固有品质和特征的中立对象（另见 Brenner & Elden, 2009）。因此，公屋区这种地域既包括其社会和物理特征，也包括它们被表述为“劣势集中”的空间、“沉沦公屋区”等等。这种表述把它们呈现为本来就贫困、破败、社会问题丛生的地方，而不是分配政策、维修保养和建造等因素的产物。这些表述为不公正的干预和忽视提供了正当性（Sisson, 2021b 有进一步解释）。</p></div><div class=\"para\" data-idx=\"13\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"e6ba47cdcf\"><p class=\"en\">Territorial stigma’s obfuscating and legitimating functions are apparent in a range of state policies and interventions vis-à-vis public housing but particularly in estate renewal—something which has received much scholarly attention (e.g. Arthurson, 2004; August, 2014; Kallin &amp; Slater, 2014; Kipfer &amp; Petrunia, 2009; Sakizlioglu &amp; Uitermark, 2014). As August puts it, territorial stigmatization ‘builds public support for redevelopment and “primes” [places] for reinvestment’ (2014, p. 1319) by problematising the concentrated disadvantage and distinctive built environments of estates. Furthermore, public housing tenants in gentrifying neighbourhoods are often represented as undeserving exclusive access to coveted land, or any access whatsoever (August, 2014; Morris, 2019). As such, the territorial stigmatization of public housing estates undergirds the housing policy common-sense or doxa of mixed tenure development to replace concentrated public housing (also known as ‘social mix’) and ‘tenure blind’ design that purports to match the appearance of new public or social housing to its surrounding built environment (Arthurson, 2012; Darcy, 2013; Lees et al., 2012).</p><p class=\"zh\">地域污名的遮蔽和正当化功能，体现在国家针对公共住房的一系列政策和干预中，尤其体现在公屋区更新中，这一点已受到大量学术关注（例如 Arthurson, 2004; August, 2014; Kallin & Slater, 2014; Kipfer & Petrunia, 2009; Sakizlioglu & Uitermark, 2014）。正如 August 所说，地域污名化通过把公屋区的劣势集中和独特建成环境问题化，“为再开发争取公众支持，并为再投资‘预备’好（地方）”（2014, p. 1319）。此外，绅士化街区里的公共住房租户常被表述为不配独享令人垂涎的土地，甚至不配拥有任何使用权（August, 2014; Morris, 2019）。因此，公屋区的地域污名化支撑着住房政策的常识或 doxa：用混合权属开发（也称“<a class=\"gref\" href=\"#g-socialmix\">社会混合</a>”）取代集中的公共住房，并采用“<a class=\"gref\" href=\"#g-tenureblind\">权属不可辨</a>”设计，号称让新的公共或社会住房在外观上与周边建成环境一致（Arthurson, 2012; Darcy, 2013; Lees et al., 2012）。</p></div><div class=\"para\" data-idx=\"14\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"d573edf451\"><p class=\"en\">Territorial stigmatization should not, therefore, be reduced to a discursive process of justifying the production of social and spatial inequality; it is more than a set of cynical excuses for generating public support or acceptance for interventions like estate renewal. Rather, territorial stigma is ‘the result of continuous structural reforms and policies’ (Larsen &amp; Delica, 2019, p. 547) as well as the production of discourse and concepts that organize our understanding of material conditions and processes. As such, understanding the emergence of territorial stigma requires careful attention to specific spatio-temporal contexts of political and economic restructuring and policy reform in combination with the analysis of orders of discourse. Such is the purpose of sections four and five.</p><p class=\"zh\">因此，不应把地域污名化简化为为社会和空间不平等的生产找理由的话语过程；它不只是为公屋区更新这类干预争取公众支持或接受的一套犬儒借口。相反，地域污名是“持续的结构性改革和政策的结果”（Larsen & Delica, 2019, p. 547），也是组织我们对物质条件和过程之理解的话语与概念的产物。因此，理解地域污名的出现，需要把对特定时空语境下政治经济重构和政策改革的细致关注，与对话语秩序的分析结合起来。这正是第四、五节的目的。</p></div><h2 class=\"sec\" data-secidx=\"15\"><span class=\"en\">3. Methodology</span><span class=\"zh\">3. 研究方法</span></h2><div class=\"para\" data-idx=\"16\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"738262279e\"><p class=\"en\">The following analysis was part of an extended case study of the Waterloo estate, an estate of 2000-plus apartments in inner-city Sydney which is currently slated for renewal. The questions driving this case study were: why is Waterloo being redeveloped? Why does the estate have a negative reputation? And what role does this stigmatisation play in the redevelopment decision and process? This single extended case study—or what Peck (2017) has termed a ‘conjunctural’ approach—involved iterative theory-building from a ground-level case and testing for relevance to other sites and situations. It is an approach to case study research requiring ‘close and reflexive interpretations of the mutual constitution of situated circumstances and structuring conditions, moving in and out from immediate (or proximate) contexts to the (constitutive) contexts of those contexts’ (p. 7). This required situating Waterloo within the history of public housing and housing generally—including policy trajectories and structuring political and economic circumstances—at both a national and state level (given responsibilities are split between Commonwealth and State governments) and in the context of post-industrial urban restructuring. This analysis, which forms the basis of the next section, involved reading a wide range of academic literature and other secondary sources on housing in Australia in the 20th and 21st centuries, particularly policy histories and critical sociological and geographical accounts.</p><p class=\"zh\">以下分析是对 Waterloo 公屋区的一项扩展个案研究的一部分。Waterloo 是悉尼内城一个有 2000 多套公寓的公屋区，目前被列入更新计划。驱动这项个案研究的问题是：为什么 Waterloo 要被再开发？为什么这个公屋区声誉不好？这种污名化在再开发决策和过程中起了什么作用？这项单一的扩展个案研究——Peck（2017）称之为“情势性”（conjunctural）方法——从一个地面层面的个案出发迭代地构建理论，并检验其对其他地点和情境的适用性。这种个案研究方法要求“对情境性环境与结构性条件的相互构成作贴近而反思性的解读，从直接（或近端）语境进出到这些语境的（构成性）语境”（p. 7）。这就需要把 Waterloo 放进公共住房乃至住房整体的历史中——包括政策轨迹和起结构作用的政治经济环境——既在国家层面也在州层面（因为职责由联邦和州政府分担），也放在后工业城市重构的语境中。这项分析构成下一节的基础，涉及阅读大量关于二十、二十一世纪澳大利亚住房的学术文献和其他二手资料，尤其是政策史以及批判性的社会学和地理学论述。</p></div><div class=\"para\" data-idx=\"17\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"f8dc657820\"><p class=\"en\">An extended case study approach is one to which discourse analysis can contribute. However, rather than Critical Discourse Analysis’s meticulous examination of particular texts, which has been criticised for ignoring the political and economic contexts in which discourse is produced (Jacobs et al., 2003), my purpose was to examine the ‘local centres’ through which discourse develops (Uitermark, 2003), to understand how discourse is articulated at a particular empirical juncture and how it facilitates or informs observed processes and phenomena. This is close to a Foucauldian ‘archaeological’ approach, attending to how discourses have emerged, constituted subjects, and—vitally—affected social practices. But it is also informed by a Bourdieusian disposition towards discourse as a ‘power resource’ shaping social actions, material conditions and ‘social cognition’ (van Dijk, 1993), with access determined by the distribution of various forms of capital. This type of discourse analysis was necessary to answer the questions of why Waterloo is being redeveloped, why it is stigmatized, and how these two things might be related, in that it situated the estate within a contemporary order of discourse about public housing in a wider geographic (city, state and national) context. It forms the basis of the penultimate section.</p><p class=\"zh\">话语分析可以为扩展个案研究方法做出贡献。不过，我没有采用批判话语分析（CDA）对特定文本的细致检视（这种做法被批评忽视了话语产生的政治和经济语境，Jacobs et al., 2003），而是考察话语得以发展的“地方中心”（
