—尽管副市长的言辞十分动听。</p></div><h3 class=\"sec\" data-secidx=\"52\"><span class=\"en\">4.1. Mobilizing the potential</span><span class=\"zh\">4.1 动员“潜力”</span></h3><div class=\"para\" data-idx=\"53\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"934b6f91c0\"><p class=\"en\">In an interview for the city-owned magazine, a special planning officer coordinating the regeneration explained why, in addition to the anti-segregation perspective, investing in the neighborhoods is important:</p><p class=\"zh\">在接受市属杂志采访时,一位负责协调该更新工作的专项规划官员解释了为什么除了反隔离的视角之外,对这些社区进行投资也很重要:</p></div><div class=\"para quote\" data-idx=\"54\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"74674c4da5\"><p class=\"en\">We see potential in these areas. They have a strong local identity, diverse services, good transport connections, and a local nature where people like to spend their time.</p><p class=\"zh\">我们在这些片区看到了潜力。它们拥有强烈的地方认同感、多元化的服务、良好的交通连接,以及人们喜欢在其中消磨时光的本地自然环境。</p><span class=\"attrib\">市属《赫尔辛基杂志》(Helsinki Magazine, 2024)对一位负责更新工作的规划官员的采访原话——作者引用这段城市官员的话语,是把它作为‘声誉缺口’形成过程的经验证据来分析,而非作者本人对这些片区的评价。</span></div><div class=\"para\" data-idx=\"55\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"aba2060cc3\"><p class=\"en\">The fact that the city sees potential in the areas is an important part of the formation of the rent gap. Next, I will present two cases of reputational gap (Kallin, 2017) where the potential of the places has been held against their current defamed versions to increase the chances of urban intervention. The upgrading of Kontula, which has a long history as a national symbol of social problems, urban rootlessness, and failed integration of immigrants (Tuominen, 2020), is concentrated on refurbishment of the shopping mall. The Kontula mall has mainstream chain retailers, many bars, and ethnic retailers and the latter have spontaneously made it into one of the liveliest centers in Helsinki (see Hewidy &amp; Lilius, 2022). The mall, however, has been in a regeneration limbo since 2004, and a managed decline (Watt, 2023) is evident. The infrastructure is decayed, with small business owners reporting a fear of not being able to stay put in the new mall due to higher rents and the property owners’ hesitancy to maintain the premises due to demolition plans (Pietiläinen, 2023).</p><p class=\"zh\">城市‘在这些片区中看到潜力’这一事实本身,正是租隙形成过程中的重要一环。接下来,我将呈现两个声誉缺口(reputational gap)(Kallin, 2017)的案例,在这两个案例中,一个地方想象中的‘潜力’都被拿来与其当下被诋毁的版本相对照,以提高城市干预推进的机会。Kontula 长期以来一直是社会问题、城市无根性和移民融入失败的全国性象征(Tuominen, 2020),对它的‘提档升级’集中体现在对购物中心的翻新上。Kontula 购物中心拥有连锁零售商、众多酒吧以及族裔商户,后者自发地使其成为赫尔辛基最具活力的中心之一(见 Hewidy & Lilius, 2022)。然而,该购物中心自2004年以来一直处于更新的悬置状态,一种‘管理式衰败’(managed decline)(Watt, 2023)清晰可见。基础设施已经破败,小业主们反映,由于担心租金上涨,以及产权方因拆除计划而不愿维护物业,他们担心自己无法在新购物中心中继续立足(Pietiläinen, 2023)。</p></div><div class=\"para\" data-idx=\"56\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1ef672445a\"><p class=\"en\">In addition to the existing public services and retail stores, the Master Plan (City of Helsinki, 2013) enabled housing construction in the mall. An architectural competition, which can give legitimacy to political decisions by appearing neutral and technical (see Hautamäki &amp; Lindgren, 2025), was organized for the mall’s new vision. The winning plan, which involved complete demolition of the shopping mall, offered a stark contrast to its current condition and was with its imagined potential part of the formation of a reputational gap (Kallin, 2017) in Kontula. Uncertainty over the fate of the mall continued as of March 2025, when the Swedish developer NCC Property Development withdrew from the project.</p><p class=\"zh\">除了既有的公共服务和零售商店之外,《总体规划》(City of Helsinki, 2013)也为在购物中心内建设住房开了绿灯。市政府为购物中心的新愿景组织了一场建筑设计竞赛——这类竞赛因其看似中立、技术性的外观,能够为政治决策赋予正当性(见 Hautamäki & Lindgren, 2025)。获胜方案涉及对购物中心的整体拆除,与其当下的状况形成鲜明对比,其所设想的‘潜力’正是 Kontula 声誉缺口(Kallin, 2017)形成过程的一部分。截至2025年3月,购物中心的命运依然悬而未决——瑞典开发商 NCC Property Development 已退出该项目。</p></div><div class=\"para\" data-idx=\"57\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"aefb5a52fe\"><p class=\"en\">The reputational gap (Kallin, 2017) concerns all regeneration areas. However, the neighborhood’s proximity to green areas and beaches, elements which have increased property values in other parts of Helsinki (Lönnqvist, 2015), makes the reputational gap notably wide in Meri-Rastila. Lots of visionary work and branding has been done, including placemaking led by consulting firms and an architectural competition for the community center, the neighborhood’s flagship project. Another flagship project is the redevelopment of the Haruspuisto playground into a multifunctional park with an aquatic theme:</p><p class=\"zh\">声誉缺口(Kallin, 2017)是所有更新片区都存在的问题。然而,Meri-Rastila 因为毗邻绿地和海滩——这类要素在赫尔辛基其他地区已被证明能够提升房产价值(Lönnqvist, 2015)——其声誉缺口显得格外宽。大量的愿景构建与品牌塑造工作已经展开,包括由咨询公司主导的地方营造(placemaking),以及为该社区的旗舰项目——社区中心——举办的建筑设计竞赛。另一个旗舰项目,是将 Haruspuisto 游乐场改造为一座以水景为主题的多功能公园:</p></div><div class=\"para quote\" data-idx=\"58\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"cd1420596d\"><p class=\"en\">The goal of the urban renewal in Meri-Rastila is to diversify the housing stock. At the moment it seems to be the only goal, so to speak. And maybe, if you think about it cynically, the construction of the Haruspuisto and so on, they are kind of just doing it to raise the image of the area.</p><p class=\"zh\">Meri-Rastila 城市更新的目标是让住房存量多元化。可以说,目前这似乎是唯一的目标。而如果往悲观一点想,Haruspuisto 之类的建设,或许说白了就是为了提升这个片区的形象而已。</p><span class=\"attrib\">作者对一位城市规划师(City Planner)所做的半结构化访谈原话——这是一位受访规划从业者本人相当自我批判的坦言,作者引用它作为内部知情人对‘形象工程/声誉缺口’本质的证言,并非作者本人杜撰的评价,但与作者的分析结论方向一致。</span></div><div class=\"para\" data-idx=\"59\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"c1c262184c\"><p class=\"en\">Upgrading the image of the regeneration areas often focused on beautifying public spaces, such as the refurbishment of the playground in Meri-Rastila, or the demolition of old shopping malls. Demolition of residential buildings is not the primary method in the city of Helsinki’s densification efforts. However, it is in the toolbox:</p><p class=\"zh\">提升更新片区形象的努力,往往集中于美化公共空间,比如翻新 Meri-Rastila 的游乐场,或是拆除老旧购物中心。拆除住宅建筑并不是赫尔辛基密集化建设的主要手段,但它确实在这套工具箱之中:</p></div><div class=\"para quote\" data-idx=\"60\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"971afecfa4\"><p class=\"en\">Due to the poor condition of the housing stock in the urban regeneration areas and, as a rule, low construction efficiency, one third of the housing production is carried out as demolitions. For example, in Meri-Rastila, even more than 50 % of the new building rights are implemented by demolishing the existing residential buildings.</p><p class=\"zh\">由于城市更新片区住房存量的状况欠佳,加上通常较低的建设效率,三分之一的住房建设是通过拆除来实现的。例如在 Meri-Rastila,新建筑权中甚至有超过50%是通过拆除现有住宅建筑来落实的。</p><span class=\"attrib\">赫尔辛基2024年版《住房及相关土地利用实施方案》原文(City of Helsinki, 2024a)——城市官方政策文件语言,作者引用它作为拆除规模的数据证据,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"61\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"a082e58e06\"><p class=\"en\">Meri-Rastila has a large share of social housing stock in low-rise buildings that were built with significant state support in the early 1990s during the recession. The neighborhood is facing vast renewal to make more ‘efficient’ use of land by building more mixed-tenure high-rise buildings on existing plots. A local activist group managed to change the city’s previous plan to allocate densification to surrounding forest areas. Now, more than half of new building permits are implemented by demolishing 30-year-old, mostly social housing stock, that is in poor condition due to neglected maintenance. As symbolic denigration of disinvested neighborhoods is often linked to the built environment, the stigma thus ‘primes’ Meri-Rastila for renewal where demolitions appear necessary and even benevolent (see Wacquant, 2010).</p><p class=\"zh\">Meri-Rastila 的社会住房大量集中在20世纪90年代初经济衰退期间依靠大量国家支持建成的低层建筑中。该社区目前正面临大规模更新,通过在既有地块上建设更多混合产权的高层建筑,来实现土地的‘更高效’利用。当地一个活动人士团体成功促使该市改变了此前将密集化建设分配到周边林地的计划。如今,超过一半的新建许可,是通过拆除这些建成30年、以社会住房为主、因维护不善而状况不佳的建筑来落实的。由于对撤资社区的象征性贬低往往与建成环境本身相关联,污名因此为 Meri-Rastila 的更新做好了‘铺垫’(prime),使拆除显得不仅必要,甚至是善意之举(见 Wacquant, 2010)。</p></div><div class=\"para\" data-idx=\"62\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"2a7108a3c1\"><p class=\"en\">The tenure form on the Meri-Rastila demolition sites is secured, and the plan is to increase the total population so that the proportion but not the absolute number of low-income social housing dwellers declines – so called ‘positive gentrification’ (Shaw &amp; Hagemans, 2015). However, a few things can be expected to affect the availability of affordable housing. First, new production is always more expensive, leading to higher rents – even for social housing. Second, due to a change in the municipal housing company’s rent setting system in 2019 towards an emphasis on use value, the social housing rents now reflect the market rents of the area. After the renewal of Myllypuro, the city’s example of successful urban regeneration, the social housing rents increased more than in other neighborhoods, indicating that low-income households may pay the price for reinvestments in the area (see Lilius &amp; Hirvonen, 2021).</p><p class=\"zh\">Meri-Rastila 拆除地块上的产权形式是有保障的,计划是通过增加总人口,使低收入社会住房居民的比例(而非绝对数量)下降——也就是所谓的‘积极的绅士化’(positive gentrification)(Shaw & Hagemans, 2015)。然而,可以预见有几个因素将影响可负担住房的可得性。首先,新建住房的成本总是更高,这会导致租金上涨——即便是社会住房也不例外。其次,由于市属住房公司于2019年将其租金制定体系改为更强调‘使用价值’,社会住房的租金如今已经反映出该地区的市场租金水平。在该市引以为成功更新典范的 <a class=\"gref\" href=\"#g-myllypuro\">Myllypuro</a> 完成更新之后,当地社会住房租金的涨幅超过了其他社区,这表明低收入家庭可能正在为该地区的再投资付出代价(见 Lilius & Hirvonen, 2021)。</p></div><div class=\"para\" data-idx=\"63\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"5c0d3d1960\"><p class=\"en\">Therefore, the demolition of old rental housing, along with the rule of an increased share of owner-occupied housing, can lead to exclusionary displacement (Marcuse, 1985) of low-income people due to the lack of affordable housing following the increased land value. Then the expected advantages of densification, such as improved services, might mostly end up benefiting middle- and high-income people (see Lutz et al., 2024). The tension between the current and the potential has material consequences, and the dialectical nature of estate regeneration and degeneration (Watt, 2023) became clear during my fieldwork in the regeneration areas.</p><p class=\"zh\">因此,拆除老旧租赁住房,加上提高自有产权住房比例这一规则,可能会因土地价值上升后可负担住房的缺乏,而对低收入群体造成排斥性置换(exclusionary displacement)(Marcuse, 1985)。而密集化建设所预期带来的好处(比如服务设施的改善),到头来可能主要惠及中高收入群体(见 Lutz et al., 2024)。‘现状’与‘潜力’之间的张力具有实实在在的物质后果,而住区更新(regeneration)与衰败(degeneration)之间的辩证性质(Watt, 2023),在我于这些更新片区所做的田野调查中变得清晰可见。</p></div><div class=\"para\" data-idx=\"64\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"9d15b25852\"><p class=\"en\">In Vesala, seven social housing buildings built in the 1980s were zoned to be demolished and replaced with wooden buildings because the Mellunkylä district served as a ‘living lab’ for carbon neutral densification - yet another attempt to bridge the reputational gap. New building permits were granted to social rental and right-of-occupancy housing. However, because the city abolished its own regulated owner-occupied housing production (HITAS) and the government abolished the right-to-occupancy model, the plans were abandoned. In the time of writing, a new detailed plan was forthcoming but lacked developers.</p><p class=\"zh\">在 Vesala,七栋建于20世纪80年代的社会住房建筑被规划为拆除,并以木结构建筑取而代之,原因是 Mellunkylä 区被当作碳中和密集化建设的‘生活实验室’(living lab)——这是弥合声誉缺口的又一次尝试。新的建筑许可被批给了社会租赁住房和<a class=\"gref\" href=\"#g-hitas\">居住权住房(right-of-occupancy housing)</a>。然而,由于该市废止了自己受管制的自有产权住房建设项目(HITAS),中央政府又废止了居住权住房模式,这些计划最终被搁置。截至本文写作之时,一份新的详细规划正在酝酿之中,但尚未有开发商接手。</p></div><div class=\"para\" data-idx=\"65\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1a53e063a4\"><p class=\"en\">The following fieldnote is from a Q&amp;A meeting in Mellunmäki with local politicians and the board of the municipal rental housing company (Heka). The event, where the topic of drastic rent increases (8.4 % in 2024 and 5.3 % in 2025) was discussed, was held in the local elementary school cafeteria. The meeting attracted mostly social housing residents from all over Mellunkylä district, but some had even come from the other side of Helsinki.</p><p class=\"zh\">以下这段田野笔记,来自在 Mellunmäki 举行的一场问答会,与会者包括当地政治人物和市属租赁住房公司(<a class=\"gref\" href=\"#g-heka\">Heka</a>)董事会成员。会议在当地一所小学的食堂举行,讨论的主题是租金的大幅上涨(2024年上涨8.4%,2025年上涨5.3%)。前来参会的大多是来自 Mellunkylä 各社区的社会住房居民,其中一些人甚至是从赫尔辛基的另一端赶来的。</p></div><div class=\"para quote\" data-idx=\"66\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"2e030e9114\"><p class=\"en\">Several residents raised maintenance issues. A resident from the Vesala demolition sites expressed frustration over the fact that the rents were increasing although repairs were not being made due to the eventual demolition. The resident feared that the hardware in their home is going to break down at any moment but won’t be fixed. An elderly woman talked about her and her neighbors’ apartments being cold in the winter, and an elderly man expressed concern that due to poor snow plowing, emergency vehicles cannot access the buildings. Families also reported difficulties planning for the future, such as which school to register their children for, due to the uncertainty of relocation.</p><p class=\"zh\">多位居民提出了维护方面的问题。一位来自 Vesala 拆除地块的居民表达了不满,因为尽管房屋因最终将被拆除而不再进行维修,租金却仍在上涨。这位居民担心自家的设备随时可能损坏,却得不到维修。一位年长的女性谈到自己和邻居的公寓在冬天很冷,一位年长的男性则担忧由于除雪不到位,紧急车辆无法驶入楼群。也有家庭反映,由于搬迁的不确定性,他们在为未来做规划时遇到困难,比如不知道该给孩子登记哪所学校。</p><span class=\"attrib\">作者本人的田野笔记(Fieldnote 2/4/2025),记录社会住房居民在问答会上的发言——这是作者呈现的一手民族志证据,用以说明‘管理式衰败’对居民造成的实际伤害,是本文论证的重要经验支撑,而非作者引来反驳的对立观点。</span></div><div class=\"para\" data-idx=\"67\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"6dd3fb4976\"><p class=\"en\">Managed decline (Watt, 2023) during mid-phase regeneration, where existing buildings are neglected in expectation of demolition, had caused distress among the residents. Displacement anxiety (Watt, 2021) can occur when residents hear rumors and information about demolitions or other changes sometimes years before any actual proceedings (see Juhila et al., 2023). The stagnant and uncertain demolition timeline was also causing worry in Meri-Rastila, where social housing residents wished for better communication of plans:</p><p class=\"zh\">更新中期阶段的‘管理式衰败’(managed decline)(Watt, 2023)——即既有建筑因预期将被拆除而遭到忽视——已经给居民造成了困扰。置换焦虑(displacement anxiety)(Watt, 2021)可能在居民听到有关拆除或其他变化的传闻和信息时便已产生,而这往往发生在实际程序启动的数年之前(见 Juhila et al., 2023)。在 Meri-Rastila,停滞而不确定的拆除时间表同样引发了担忧,社会住房居民希望规划方能加强沟通:</p></div><div class=\"para quote\" data-idx=\"68\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"2dc69a07f8\"><p class=\"en\">As an example of poor communication, a resident brought up a nearby social housing estate where the residents found out about the demolition of their buildings from a local newspaper instead of Heka. Another social housing tenant wanted to know what will happen to her apartment. The representative of Heka explained that a return to the demolition sites is not guaranteed, because the new building does not necessarily have similar apartments. A separate decision will be made on the possible right of return, but it had not been made for the Meri-Rastila demolition sites.</p><p class=\"zh\">作为沟通不善的一个例子,一位居民提到附近一个社会住房社区,那里的居民是从地方报纸而不是从 Heka 那里得知自己所住楼栋将被拆除的消息的。另一位社会住房租户想知道自己的公寓将会怎样。Heka 的代表解释说,能否返回拆除地块并无保证,因为新建筑不一定会有类似的户型。是否享有回迁权,将另行作出决定,但就 Meri-Rastila 的拆除地块而言,这一决定尚未作出。</p><span class=\"attrib\">作者本人的田野笔记(Fieldnote 01/23/2025),记录社区会议中居民与 Heka 代表的对话——这是作者呈现的一手民族志证据,用以说明规划沟通不足给居民带来的不确定性,是本文论证的经验支撑,而非作者引来反驳的对立观点。</span></div><div class=\"para\" data-idx=\"69\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"d4db7d9f22\"><p class=\"en\">The municipal rental housing provider Heka is obligated to find temporary housing for tenants whose residential buildings are renovated or demolished. Tenants have the right to return to their renovated apartment or stay in their new apartment. However, according to the Heka representative, returning to the Meri-Rastila demolition sites was not guaranteed, because the new building might not meet tenant needs.</p><p class=\"zh\">市属租赁住房提供方 Heka 有义务为其住宅楼被翻新或拆除的租户安排临时住房。租户有权返回经翻新的公寓,或留在自己的新公寓中。然而,据 Heka 代表所说,返回 Meri-Rastila 拆除地块并无保证,因为新建筑可能无法满足租户的需求。</p></div><h3 class=\"sec\" data-secidx=\"70\"><span class=\"en\">4.2. Socializing risks</span><span class=\"zh\">4.2 将风险社会化</span></h3><div class=\"para\" data-idx=\"71\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1840a63509\"><p class=\"en\">The uncertainty of the regeneration timeline reflected in the displacement anxiety of some of the residents is the sum of many things. In the urban regeneration areas, site plan solutions must support the implementation of unregulated or intermediate housing production (City of Helsinki, 2021a). However, in 2024 the Finnish government decided to stop financing new production of right-to-occupancy housing by the end of 2025, phasing out the current system. This new and challenging ‘operational environment’ caused by the state’s welfare retrenchment was acknowledged in the latest Land Use program (City of Helsinki, 2024a), which emphasizes the increasing importance of the balancing role of new housing production during the current program period.</p><p class=\"zh\">部分居民置换焦虑中所反映出的更新时间表的不确定性,是多重因素叠加的结果。在城市更新片区,场地规划方案必须支持非管制住房或中间产权住房建设的落实(City of Helsinki, 2021a)。然而,芬兰政府在2024年决定,到2025年底停止资助新建居住权住房,逐步淘汰现行体制。国家福利紧缩所造成的这种全新且充满挑战的‘运作环境’,在最新版土地利用方案(City of Helsinki, 2024a)中得到了承认,该方案强调在当前规划周期内,新建住房所扮演的‘平衡’角色将愈发重要。</p></div><div class=\"para\" data-idx=\"72\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"c81e435b1b\"><p class=\"en\">Until Helsinki launches a new model for regulated owner-occupied housing, most of the housing production in the regeneration areas will be unregulated owner-occupied housing in the name of anti-segregation:</p><p class=\"zh\">在赫尔辛基推出新的受管制自有产权住房模式之前,更新片区中的大部分住房建设,都将以反隔离的名义,以非管制自有产权住房的形式进行:</p></div><div class=\"para quote\" data-idx=\"73\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"6aede2211c\"><p class=\"en\">In urban regeneration areas, intermediate housing production cannot be replaced by rental housing from the perspective of preventing segregation, so currently, unregulated owner-occupied housing production is almost the only alternative to right-of-occupancy production in these areas</p><p class=\"zh\">在城市更新片区,从防止隔离的角度出发,中间产权住房的建设不能被租赁住房所替代,因此目前在这些片区,非管制自有产权住房建设几乎是居住权住房建设唯一的替代选项</p><span class=\"attrib\">赫尔辛基2024年版《住房及相关土地利用实施方案》原文(City of Helsinki, 2024a)——城市官方政策文件语言,作者引用它来揭示该市如何用‘防止隔离’的理由,把‘非管制自有产权住房’论证为唯一可行的建设选项,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"74\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"d7441f42dd\"><p class=\"en\">Replacing the city’s own regulated owner-occupation with unregulated housing production is represented as the only alternative in areas dominated by rental apartments. It could be argued, with Lilius and Hirvonen (2021), that one factor that has been able to regulate negative consequences of gentrification in Helsinki (such as large-scale displacement of low-income residents) is the housing allowance. However, the housing allowance is one of the benefits that has been most targeted by the current Finnish government’s welfare cuts. Even though austerity politics at the national level can be expected to increase the need for affordable housing in Helsinki, the city stands firmly on its principle of mixed neighborhoods:</p><p class=\"zh\">以非管制住房建设取代该市自身受管制的自有产权住房建设,被呈现为在以租赁公寓为主的地区唯一可行的选项。可以援引 Lilius 和 Hirvonen(2021)的观点认为,住房补贴(housing allowance)正是能够在赫尔辛基调节绅士化负面后果(比如低收入居民的大规模置换)的因素之一。然而,住房补贴恰恰是当前芬兰政府福利削减最主要针对的福利项目之一。尽管可以预见国家层面的紧缩政治将增加赫尔辛基对可负担住房的需求,该市却依然坚定地固守其‘混合社区’的原则:</p></div><div class=\"para quote\" data-idx=\"75\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"024237786f\"><p class=\"en\">The city is hesitant to raise the total share of ARA [state-subsidized] rental production. Increased ARA production would mean increasing the share also in areas that already have plenty of ARA rental and other rental housing stock, and from the point of view of preventing segregation, increasing rental production in these areas is not recommended.</p><p class=\"zh\">该市不愿提高<a class=\"gref\" href=\"#g-ara\">ARA</a>[国家补贴]租赁住房建设的总体占比。增加ARA住房建设意味着也要在那些已经拥有大量ARA租赁住房及其他租赁住房存量的片区提高其比例,而从防止隔离的角度看,在这些片区增加租赁住房建设是不被推荐的。</p><span class=\"attrib\">赫尔辛基2024年版《住房及相关土地利用实施方案》原文(City of Helsinki, 2024a)——城市官方政策文件语言,作者引用它来展示该市如何用‘防止隔离’的说法为拒绝增加社会租赁住房辩护,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"76\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1dbea9d489\"><p class=\"en\">Furthermore, the City Council confirmed its own version of this same principle:</p><p class=\"zh\">此外,市议会也确认了同一原则的另一种官方表述:</p></div><div class=\"para quote\" data-idx=\"77\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"704a2a9d32\"><p class=\"en\">However, the city will adhere to the Land Use program’s segregation prevention goals in all situations. […] Therefore, for example, in areas already dominated by rental housing, changes from owner-occupied housing to rental housing would not be possible in principle in the future.</p><p class=\"zh\">然而,该市将在任何情况下都坚持土地利用方案所设定的防止隔离目标。［……］因此,举例来说,在已经以租赁住房为主的片区,原则上今后将不再可能出现从自有产权住房向租赁住房的转变。</p><span class=\"attrib\">赫尔辛基市议会决议原文(City Council, 2024)——市议会官方表态,作者引用它来说明‘防止隔离’的说法如何被用来把‘只增自有产权、不增租赁住房’的规则固定为原则,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"78\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"a92be4ebe2\"><p class=\"en\">As a municipality with a planning monopoly, Helsinki has the tools to influence the supply of social housing, if it wishes. The city is unwilling to raise the total share of state-subsidized rental production because doing so would hinder the goal of mixed communities in rental-dominated areas. City council confirmed that the city will adhere to segregation prevention goals in all situations, making changes in the production from owner-occupied to rental housing impossible in the regeneration areas. The quotes above demonstrate the common-sense position of social mix in Helsinki’s urban policy. Prioritizing diversification of the housing stock, even during an affordability crisis, shows how the hegemonic position of the storyline about the problems of social housing is integrated into political practices and institutional arrangements through social mix (see Hajer, 1995).</p><p class=\"zh\">作为一个拥有规划垄断权的市镇,赫尔辛基如果愿意,原本拥有影响社会住房供给的手段。该市之所以不愿提高国家补贴租赁住房建设的总体占比,是因为这样做会妨碍在以租赁住房为主的片区实现‘混合社区’的目标。市议会确认,该市将在任何情况下都坚持防止隔离的目标,这使得更新片区从自有产权住房向租赁住房方向的建设转变在原则上不再可能。以上引述表明,社会混合在赫尔辛基城市政策中所占据的、近乎常识般不容质疑的地位。即便在可负担性危机之中,也依然优先推进住房存量多元化,这恰恰说明了关于‘社会住房问题’的故事线的霸权地位,是如何通过社会混合被整合进政治实践与制度安排之中的(见 Hajer, 1995)。</p></div><div class=\"para\" data-idx=\"79\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1002ed27bd\"><p class=\"en\">However, diversification of the housing stock turned out to be more difficult than expected. Alongside the national changes to the housing policy, increased interest rates and their particularly negative impact on the construction industry were another challenge for Helsinki’s set goals for housing. Before the ongoing economic impacts of the Ukrainian war, real estate investors were interested in densification in urban regeneration areas (City of Helsinki, 2021a). According to city planners, large international investors such as NREP had made plot reservations in Meri-Rastila. Since then, regeneration has been disrupted because many plans have not attracted developers. The national government’s decision to stop funding right-of-occupancy production, which according to the Land Use program (City of Helsinki, 2024a) has encouraged the production of unregulated housing, was predicted to further slow all housing construction in the urban regeneration areas.</p><p class=\"zh\">然而,住房存量的多元化,结果被证明比预期更加困难。除了国家层面住房政策的变化之外,利率上升及其对建筑行业尤为负面的冲击,也给赫尔辛基既定的住房目标带来了另一重挑战。在乌克兰战争持续造成经济冲击之前,房地产投资者对更新片区的密集化建设一直抱有兴趣(City of Helsinki, 2021a)。据城市规划师介绍,像 NREP 这样的大型国际投资者曾在 Meri-Rastila 预留过地块。此后,由于许多规划方案未能吸引到开发商,更新工作因此受阻。据土地利用方案(City of Helsinki, 2024a)所述,中央政府停止资助居住权住房建设的决定,曾经推动了非管制住房的建设,而这一决定预计将进一步拖慢更新片区所有住房建设的步伐。</p></div><div class=\"para\" data-idx=\"80\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"34bcd5a7b5\"><p class=\"en\">When the city cannot de-risk (Gray, 2022) the development of unregulated housing with intermediate housing production, private investors are even less eager to invest. In this new situation the city, together with industry actors, has had to find other ways to stand for the risks and costs of land development so that private capital does not have to. To create better conditions for private investments in these “un-gentrifiable” (Mösgen et al., 2019) neighborhoods, the city has tried to initiate urban regeneration through green gentrification strategies (Wallin, 2021) such as refurbishing public environments, streets and parks, land remediation, and improving transport connections.</p><p class=\"zh\">当该市无法再借助中间产权住房建设来为非管制住房开发‘去风险’(de-risk)(Gray, 2022)时,私人投资者就更加缺乏投资意愿。在这一新的形势下,该市不得不与产业界行动者一道,寻找其他方式来承担土地开发的风险和成本,从而使私人资本不必承担这些风险和成本。为了给这些“不可绅士化”(un-gentrifiable)的社区(Mösgen et al., 2019)创造更好的私人投资条件,该市尝试通过绿色绅士化策略(green gentrification strategies)(Wallin, 2021)——比如翻新公共环境、街道和公园,进行土地整治,改善交通连接——来启动城市更新。</p></div><div class=\"para quote\" data-idx=\"81\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"4b46a48ad8\"><p class=\"en\">Haruspuisto is what they started the renewal of Meri-Rastila with, so that it would attract unregulated housing production there. But yes, there is also a will with that park planning project, that they really want to do good for the existing residents as well.</p><p class=\"zh\">他们是从 Haruspuisto 开始启动 Meri-Rastila 更新的,为的是能吸引非管制住房建设落地那里。不过没错,那个公园规划项目背后也确实有一份心意,他们也是真心希望能为现有居民做点好事的。</p><span class=\"attrib\">作者对城市规划师(City Planner)所做访谈的原话——受访规划从业者本人对公园项目‘引资’和‘为居民好’两种动机并存的坦承,作者引用它来支持其分析(公共投资首先是为‘去风险’服务),并非作者本人杜撰,而是与作者结论方向一致的第一手证言。</span></div><div class=\"para\" data-idx=\"82\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"6aa610651e\"><p class=\"en\">Although refurbished public spaces were thought to benefit existing residents as well, the main motive was for them to speed up housing production by attracting private investments. This has meant a significant increase in the city’s own investments in the areas. In the city budget for 2022, 7.5 million euros were allocated for the refurbishment of public spaces in Mellunkylä for the following three years (City of Helsinki, 2021c). Three years later, the city allocated 19.5 million euros for Mellunkylä and 14 million euros for Meri-Rastila for the next three years (City of Helsinki, 2024b).</p><p class=\"zh\">虽然翻新后的公共空间也被认为能让现有居民受益,但其主要动机是通过吸引私人投资来加快住房建设的速度。这意味着该市在这些片区自身投资的显著增加。在2022年城市预算中,未来三年用于 Mellunkylä 公共空间翻新的拨款为750万欧元(City of Helsinki, 2021c;当时 Meri-Rastila 尚未被纳入更新片区,故不计入此项预算)。三年后,该市为接下来三年在 Mellunkylä 和 Meri-Rastila 分别拨款1950万欧元和1400万欧元(City of Helsinki, 2024b)。</p></div><div class=\"para\" data-idx=\"83\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"546d20b8a7\"><p class=\"en\">In Kontula, where the development of the shopping mall was standing still, the city was frantically looking for solutions to show that something was being done for the area. Kontula was a pilot area for the ‘incentive experiment’ where the city offered to pay a larger share of the corresponding market value of the plot if the building right was sold to the city. Because densification is largely based on the initiative of private landowners and housing condominiums, the city encouraged them with financial incentives. Another policy measure to support the marketability of housing projects was to enable the sale of the plot at a ‘flexible’ price, instead of renting it (City of Helsinki, 2024a). The transfer of land by selling has increased in Helsinki (Hyötyläinen, 2015), in order to increase the city’s attractiveness and business activities, as well as to achieve set sales targets.</p><p class=\"zh\">在购物中心开发陷入停滞的 Kontula,该市正焦急地寻找各种解决方案,以显示自己正在为这个片区‘有所作为’。Kontula 是‘激励实验’(incentive experiment)的试点片区之一——在这一实验中,如果建筑权被出售给该市,市政府将支付相应地块市场价值中更大的一部分份额。由于密集化建设在很大程度上有赖于私人土地所有者和住宅公司的主动配合,该市便以财政激励来鼓励他们。另一项支持住房项目可销售性的政策措施,是允许以‘灵活’的价格出售地块,而不是出租地块(City of Helsinki, 2024a)。在赫尔辛基,以出售方式转让土地的做法已经有所增加(Hyötyläinen, 2015),目的是提升该市的吸引力和商业活动水平,并实现既定的销售目标。</p></div><div class=\"para\" data-idx=\"84\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"62ca34696d\"><p class=\"en\">In the city council’s decision (2024), the new policy of the sale of plots for unregulated owner-occupied housing production and increasing price competition to ensure market pricing of plots was mainly, but not only, limited to urban regeneration areas. An attempt by a representative from Left Alliance to restrict the sale of plots only to regeneration areas (City Council, 2024) implies that the storyline of the causes of urban inequality and the hegemonic position of social mix legitimizes neoliberal land use policy, even for political actors that would otherwise be critical of the marketization of urban land. These efforts by the city to address market failure show how crucial state intervention is to the formation and potential closure of rent gaps (Gray, 2022).</p><p class=\"zh\">在市议会的决议(2024年)中,这项为非管制自有产权住房建设出售地块、并通过加强价格竞争来确保地块市场化定价的新政策,主要(但不仅仅)局限于城市更新片区。左翼联盟(Left Alliance)一位代表曾试图将地块出售仅限制在更新片区范围内(City Council, 2024),这一尝试恰恰表明:关于城市不平等成因的故事线,以及社会混合的霸权地位,即便对那些本应对城市土地市场化持批判态度的政治行动者而言,也已经使新自由主义土地利用政策获得了正当性。该市为应对‘市场失灵’所做的这些努力表明,国家干预对于租隙的形成及其可能的弥合,是何等关键(Gray, 2022)。</p></div><h2 class=\"sec\" data-secidx=\"85\"><span class=\"en\">5. Discussion</span><span class=\"zh\">5. 讨论</span></h2><div class=\"para\" data-idx=\"86\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"74d22b6e6e\"><p class=\"en\">With a case of stalling urban regeneration in Helsinki, this article contributes to the literature on state-led gentrification by showing how the state intervention to capitalist reproduction has been justified with an anti-segregation narrative. The growth of Helsinki, both physically and economically, relies greatly on the densification of existing residential areas in the suburban zone. I argue that statistical representations (see Sisson, 2021a) of segregation offer a useful problem that gives the city a depoliticized, moral justification to intensified market dominance in housing and land use policy. At the same time, reorganizing the disinvested neighborhoods with increased owner-occupation allows Helsinki to maintain its image as the posterchild of segregation prevention and an (at least statistically) egalitarian city.</p><p class=\"zh\">通过一个赫尔辛基城市更新停滞的案例,本文为国家主导型绅士化的相关文献作出了贡献,展示了国家对资本主义再生产的干预,是如何借助反隔离叙事获得正当性的。赫尔辛基无论在物理空间还是经济层面的增长,都在很大程度上依赖于对郊区既有居住区的密集化建设。我认为,关于隔离的统计表征(见 Sisson, 2021a)提供了一个‘有用的问题’,使该市在住房和土地利用政策中不断强化的市场主导地位,获得了一种去政治化的道德正当性。与此同时,以增加自有产权住房的方式对撤资社区进行重组,也让赫尔辛基得以维持其作为隔离防治模范生、以及一座(至少在统计意义上)平等主义城市的形象。</p></div><div class=\"para\" data-idx=\"87\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"5623276c11\"><p class=\"en\">Through social mix discourse, the complexity of urban inequality is reduced to a problem of “one-sided housing stock” that can be solved through diversification policy. Legitimation for social mix now also as a corrective measure is not a difficult task in Helsinki, where social mix policy enjoys widespread popularity due to the city’s rather successful history of building mixed-tenure neighborhoods. The appeal of social mix is normative as well - “it sounds right” (Hajer, 1995, p. 63) to have mixed communities. The power of social mix discourse is in bringing different interests together by manufacturing consent (Bacqué &amp; Charmes, 2024).</p><p class=\"zh\">通过社会混合话语,城市不平等的复杂性被简化为一个“单一化住房存量”的问题,而这个问题可以通过多元化政策来解决。如今,把社会混合作为一种矫正措施加以正当化,在赫尔辛基并非难事,因为该市在建设混合产权社区方面有着相当成功的历史,社会混合政策因此享有广泛的支持度。社会混合的吸引力也具有规范性的一面——拥有混合社区“听起来就是对的”(Hajer, 1995, 第63页)。社会混合话语的力量,就在于它能够通过制造共识(manufacturing consent)把不同的利益方汇聚到一起(Bacqué & Charmes, 2024)。</p></div><div class=\"para\" data-idx=\"88\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"52bbf26126\"><p class=\"en\">While the motive for urban regeneration is ultimately profit, many of the actors and intentions behind its mechanics are well meaning (Krijnen, 2018); the city planners involved in the refurbishment of Haruspark in Meri-Rastila do it for the existing residents, not solely or even primarily to attract private investments in the area. It is important to note that there is moral commitment in the interventions, one which the stigmatizing storyline of \"problematic\" social housing concentrations has helped to construct. The stigma legitimates intervention through notions of fairness, not only as an external justification but likely also as an internal justification at the level of the institution (Kallin, 2017).</p><p class=\"zh\">虽然城市更新的动机归根结底是利润,但推动其运作机制的许多行动者及其意图,本身是出于善意的(Krijnen, 2018)——参与 Meri-Rastila 的 Haruspark(即 Haruspuisto)翻新工作的城市规划师们,是为了现有居民而这样做的,而不完全是、甚至主要不是为了吸引私人投资进入该地区。值得注意的是,这些干预措施中确实包含着一种道德承诺(moral commitment),而这种承诺,恰恰是被那套将‘问题化’的社会住房集聚地污名化的故事线所塑造出来的。污名通过‘公平’的观念使干预获得正当性,这种正当化不仅是一种对外的辩护,很可能也是一种在制度层面的内部自我辩护(Kallin, 2017)。</p></div><div class=\"para quote\" data-idx=\"89\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"bdebaceb2b\"><p class=\"en\">whether social mix policies are harmless or insidious depends in part on the social and political context in which they are situated.</p><p class=\"zh\">社会混合政策究竟是无害的,还是暗藏危害,部分取决于它们所处的社会和政治情境。</p><span class=\"attrib\">Arthurson(2008, 第499页)本人的理论表述——作者引用这句话是采纳、赞同其观点,并以此为跳板提出自己的判断(见下一句“I argue that…”),这是作者借他人之口引出自己论点的方式,并非要反驳的对象。</span></div><div class=\"para\" data-idx=\"90\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"eaa9557e91\"><p class=\"en\">I argue that, situated in the context of intensified welfare retrenchment, the city’s stubborn devotion to the social mix policy risks legitimizing instead of challenging urban inequality. The national government’s cuts to both supply-side housing subsidies (Rasinkangas et al., 2024) and housing allowances, together with rent increases in municipally owned social housing, have already materialized in increased evictions (Kuokkanen, 2024) and a rise in homelessness for the first time in over a decade (ARA, 2024). This can make the question of physical displacement relevant in the Finnish context, where it has until now remained a marginal phenomenon due to housing allowances that have allowed low-income households to stay put.</p><p class=\"zh\">我认为,在福利紧缩不断加剧的这一情境之下,该市对社会混合政策的固执坚持,有可能非但没有挑战城市不平等,反而使其获得正当性。中央政府对供给侧住房补贴(Rasinkangas et al., 2024)和住房补贴金(housing allowances)的双重削减,加上市属社会住房租金的上涨,已经切实转化为驱逐(evictions)案例的增加(Kuokkanen, 2024),以及十多年来首次出现的无家可归人数上升(ARA, 2024)。这可能使物理性置换问题在芬兰语境下重新变得具有现实意义——迄今为止,由于住房补贴金一直使低收入家庭得以留在原地,物理性置换在芬兰始终只是一个边缘现象。</p></div><div class=\"para\" data-idx=\"91\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"d3fa1759dd\"><p class=\"en\">Research has shown that home ownership among both low-income and middle-income households has decreased in Helsinki due to the high cost of housing (Saikkonen et al., 2018). For young people, home ownership has increasingly become out of reach due to financialization of smaller flats and the high cost of larger apartments (Vaattovaara &amp; Vuori, 2023). Still, the city insists on increasing the share of unregulated owner-occupation in the regeneration areas. By affirming the dominance of private market housing provision, the city does not only justify the status quo but, according to recent examples from the Helsinki Metropolitan Area, the city might contribute to increased financialization of housing, without much impact on the socioeconomic profile of the areas (see Lilius &amp; Hirvonen, 2021).</p><p class=\"zh\">研究表明,由于住房成本高昂,赫尔辛基低收入和中等收入家庭的自有住房率都在下降(Saikkonen et al., 2018)。对年轻人来说,由于小户型公寓的金融化以及大户型公寓的高昂成本,自有产权住房已经变得越来越遥不可及(Vaattovaara & Vuori, 2023)。尽管如此,该市仍然坚持在更新片区提高非管制自有产权住房的比例。通过肯定私人市场供房的主导地位,该市不仅使现状获得了正当性,而且根据赫尔辛基都市区近期的一些实例来看,该市的做法甚至可能加剧住房的金融化,却对这些片区的社会经济状况几乎没有什么实质影响(见 Lilius & Hirvonen, 2021)。</p></div><div class=\"para\" data-idx=\"92\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"0b3ae191b1\"><p class=\"en\">Furthermore, the mere focus on segregation metrics can result in false conclusion regarding increased equality by overlooking other dimensions of urban inequality, such as limited affordable housing options (Uitermark et al., 2024). As a Nordic municipality, the tools for securing housing affordability are good. But in adhering to its anti-segregation goal, the city is hesitating to increase the share of state-subsidized rental housing production in the city as a whole because doing so would mean increasing it in the urban regeneration areas as well. However, without genuine efforts to ensure access to affordable housing densification does not contribute to urban equality – it can contribute to gentrification (see Cavicchia, 2021).</p><p class=\"zh\">此外,单纯聚焦于隔离指标,可能会因忽视城市不平等的其他维度(比如可负担住房选择的有限性)(Uitermark et al., 2024),而得出关于‘平等程度提升’的错误结论。作为一个北欧市镇,赫尔辛基原本拥有确保住房可负担性的良好制度工具。但由于坚持其反隔离目标,该市在提高全市国家补贴租赁住房建设占比这件事上一直犹豫不决,因为这样做也就意味着要在城市更新片区提高这一比例。然而,如果缺乏确保可负担住房可得性的真正努力,密集化建设本身并不能促进城市平等——它反而可能助长绅士化(见 Cavicchia, 2021)。</p></div><div class=\"para\" data-idx=\"93\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"3d767d165e\"><p class=\"en\">The case areas, Mellunkylä and Meri-Rastila, have long histories with stigma and decades’ worth of efforts to ‘revitalize’ them. The efforts have formed the basis for the continuation of similar measures, such as the city’s new urban regeneration model scrutinized in this article. This article shows that by engaging in false choice urbanism (Slater, 2014) the city has successfully rationalized social mix as the only solution to what seems to be a ‘consistent problem’ (see Hajer, 1995) of enduring socioeconomic decline in its periphery. In spite of that, untapping the ‘potential’ of the selected regeneration areas required municipal interventions. Through placemaking and visionary work, such as architectural competitions and neighborhood branding through ‘innovation districts’ (seemingly neutral and technical processes), an imagined future was held against the current disinvested state of the neighborhoods. By exploiting the symbolic denigration of the areas to prime them for renewal, the city could justify radical measures like demolition.</p><p class=\"zh\">案例片区 Mellunkylä 和 Meri-Rastila,都有着长期背负污名、并被数十年来的种种努力‘复兴’的历史。这些努力构成了继续推行类似措施——比如本文所审视的这套城市更新新模式——的基础。本文表明,通过采取虚假选择的城市主义(false choice urbanism)(Slater, 2014),该市成功地将社会混合合理化为应对其边缘地区长期社会经济衰退这一看似‘一以贯之的问题’(见 Hajer, 1995)的唯一解决方案。尽管如此,要真正挖掘出所选更新片区的‘潜力’,依然离不开市政当局的干预。通过地方营造(placemaking)和愿景构建工作——比如建筑设计竞赛,以及借助‘创新街区’(innovation districts)之类看似中立、技术性的过程来进行社区品牌塑造——一个想象中的未来被拿来与这些社区当下的撤资状态相对照。通过利用对这些片区的象征性贬低来为更新‘铺垫’,该市得以将拆除之类的激进措施正当化。</p></div><div class=\"para\" data-idx=\"94\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"20cff88ac9\"><p class=\"en\">A reputational gap (Kallin, 2017) was formed, and urban regeneration was offered as a solution to its closure. However, working on the image of the neighborhoods was not enough for the formation of rent gaps; the city also had to materially bridge the subsidy gap (Gray, 2022). To improve conditions for private investment in these “economically risky” neighborhoods, the city initiated regeneration by significantly increasing public funding for the refurbishment of public spaces and other green gentrification strategies, as well as restructuring land ownership. In other words, the city has chosen to use its planning monopoly and land ownership as a tool (Olsson, 2018) to facilitate urban redevelopment by subsidizing investment costs for developers, thus “privatizing profits and socializing losses” (Risager, 2022, p. 209).</p><p class=\"zh\">一道声誉缺口(reputational gap)(Kallin, 2017)由此形成,而城市更新则被呈现为弥合这道缺口的解决方案。然而,仅仅在社区形象上做文章,并不足以形成租隙;该市还必须在物质层面弥合补贴缺口(subsidy gap)(Gray, 2022)。为了改善私人投资在这些“经济上高风险”社区的条件,该市大幅增加了用于公共空间翻新等绿色绅士化策略的公共资金投入,并对土地所有权进行了重组,以此启动更新工作。换言之,该市选择将自己的规划垄断权和土地所有权当作一种工具(Olsson, 2018),通过为开发商的投资成本提供补贴来促成城市重建,从而实现“利润私有化、损失社会化”(privatizing profits and socializing losses)(Risager, 2022, 第209页)。</p></div><div class=\"para\" data-idx=\"95\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"ee916a3252\"><p class=\"en\">The case of Helsinki has demonstrated the necessity of state mediation to the reproduction of capitalist relations, especially in times of economic crisis and in stigmatized, peripheral neighborhoods. Whether the city can revive the interrupted regeneration and close the rent gaps in the regeneration areas or not remains to be seen. Neighborhoods such as Kontula and Meri-Rastila, that are stuck in this regeneration limbo for years or even decades, are necessary casualties of the vulnerability of capitalist reproduction, when potential failure is baked into the profit logic that drives urban regeneration (see Gray &amp; Kallin, 2023).</p><p class=\"zh\">赫尔辛基这一案例,展示了国家中介(state mediation)对于资本主义关系再生产而言的必要性,尤其是在经济危机时期,以及在污名化的边缘社区之中。该市能否重启中断的更新进程、弥合这些更新片区的租隙,目前仍是未知数。像 Kontula 和 Meri-Rastila 这样已在更新悬置状态中滞留多年甚至数十年的社区,正是资本主义再生产脆弱性的必然代价——因为潜在的失败,本就内嵌在驱动城市更新的利润逻辑之中(见 Gray & Kallin, 2023)。</p></div><div class=\"para\" data-idx=\"96\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"5ab1aa01f7\"><p class=\"en\">Living through the precarities of urban regeneration has implications for residents, perhaps even more so in stalling regeneration processes (see Wallace, 2015). Although no definitive conclusions can be drawn from my ethnographic fieldwork, the ontological insecurity of the residents caused by degeneration (Watt, 2023) and uncertain demolition timelines should be taken seriously. Even without immediate displacement of lower income residents, the new urban regeneration model reflects a broader development where the city is produced for more affluent users (see Lilius, 2021). For those who want to see a just city, it is therefore important to acknowledge other forms of displacement (Davidson, 2009; Marcuse, 1985) to avoid falling into the seemingly progressive trap of pro-gentrification policies.</p><p class=\"zh\">亲身经历城市更新的不确定性,会给居民带来切实的影响,而在更新进程陷入停滞的情况下,这种影响或许更甚(见 Wallace, 2015)。虽然我的民族志田野调查无法得出确定性的结论,但由衰败(degeneration)(Watt, 2023)和不确定的拆除时间表所导致的居民本体论层面的不安全感,理应得到认真对待。即便低收入居民没有立即遭到置换,这套城市更新新模式,依然反映出一种更广泛的发展趋势——这座城市正在被生产出来,以服务于更富裕的使用者(见 Lilius, 2021)。因此,对于那些希望看到一座‘公正城市’的人而言,承认其他形式的置换(Davidson, 2009; Marcuse, 1985)十分重要,这样才能避免落入支持绅士化政策那种看似进步的陷阱之中。</p></div><div class=\"para\" data-idx=\"97\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"41614550f8\"><p class=\"en\">The article has shown that Helsinki, like many other Western European cities (Uitermark &amp; Bosker, 2014), is in a difficult and contradictory situation. The Finnish government wants to deepen private market dominance in housing policy, which leads to increased urban inequality. At the same time, both the state and the city want to prevent segregation to avoid going “Sweden’s way.” To manage this dilemma, the city has in its periphery implemented ‘gentrification in disguise’ (Lees, 2008), wrapped in anti-segregation discourse. However, this only affirms the status quo of neoliberal urbanism.</p><p class=\"zh\">本文表明,赫尔辛基与许多其他西欧城市一样(Uitermark & Bosker, 2014),正处于一种艰难而充满矛盾的处境之中。芬兰政府希望在住房政策中进一步深化私人市场的主导地位,而这会导致城市不平等的加剧;与此同时,国家和该市又都希望防止隔离,以避免走上‘瑞典式’道路。为了应对这一两难困境,该市在其边缘地区实施了一种包裹在反隔离话语之中的‘伪装的绅士化’(gentrification in disguise)(Lees, 2008)。然而,这样做只不过是在肯定新自由主义城市主义的现状而已。</p></div><div class=\"para\" data-idx=\"98\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"41c2208199\"><p class=\"en\">A better approach to the reasonable desire to combat segregation could be, for example, a proper housing policy where access to affordable housing is not regarded as a social policy but a normal need (see Hyötyläinen, 2020). Helsinki is ultimately, due to its planning monopoly and high land ownership, well-equipped to influence the supply of social housing. Instead of socializing risks when the development of unregulated housing fails to proceed, the city could prioritize state-subsidized rental housing. For Helsinki to truly be a counterforce to austerity politics on the national level, as some progressive councilors proudly describe it, it needs to reassess its position on social housing and public ownership.</p><p class=\"zh\">要回应对抗隔离这一合理诉求,一种更好的方式,或许是推行一套恰当的住房政策——将获得可负担住房视为一种正常需求,而不是一种社会救济(见 Hyötyläinen, 2020)。归根结底,凭借其规划垄断权和高比例的土地所有权,赫尔辛基原本完全有能力影响社会住房的供给。与其在非管制住房开发无法推进时选择将风险社会化,该市原本可以优先发展国家补贴租赁住房。如果赫尔辛基真的想成为一些进步派市议员所自豪宣称的那种、对抗国家层面紧缩政治的反作用力,它就需要重新审视自己在社会住房和公共产权问题上的立场。</p></div><h3 class=\"sec\" data-secidx=\"99\"><span class=\"en\">CRediT authorship contribution statement</span><span class=\"zh\">CRediT 作者贡献声明</span></h3><div class=\"para\" data-idx=\"100\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"01638eb152\"><p class=\"en\">Hanna Yrjänä: Writing – original draft, Project administration, Methodology, Formal analysis, Data curation, Conceptualization.</p><p class=\"zh\">Hanna Yrjänä:论文初稿撰写、项目管理、研究方法设计、正式分析、数据整理、概念构建。</p></div><h3 class=\"sec\" data-secidx=\"101\"><span class=\"en\">Declaration of competing interest</span><span class=\"zh\">利益冲突声明</span></h3><div class=\"para\" data-idx=\"102\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1bdbb565b5\"><p class=\"en\">The authors declare that they have no known competing financial interests or personal relationships that could have appeared to influence the work reported in this paper.</p><p class=\"zh\">作者声明,本人不存在任何已知的、可能被认为影响本文所述研究工作的经济利益冲突或个人关系。</p></div><h3 class=\"sec\" data-secidx=\"103\"><span class=\"en\">Data availability</span><span class=\"zh\">数据可得性声明</span></h3><div class=\"para\" data-idx=\"104\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"c2d0c6849a\"><p class=\"en\">No data was used for the research described in the article.</p><p class=\"zh\">本文所述研究未使用可公开提供的数据集。</p></div>", "toc": [{"idx": 0, "level": "h2", "en": "1. Introduction", "zh": "1. 引言"}, {"idx": 13, "level": "h2", "en": "2. Theoretical perspective: State-led gentrification", "zh": "2. 理论视角:国家主导型绅士化"}, {"idx": 21, "level": "h2", "en": "3. Case: Helsinki’s new urban regeneration model", "zh": "3. 案例:赫尔辛基的城市更新新模式"}, {"idx": 35, "level": "h2", "en": "4. Helsinki: “a textbook example in how to prevent segregation”", "zh": "4. 赫尔辛基:“防止隔离的教科书式典范”"}, {"idx": 52, "level": "h3", "en": "4.1. Mobilizing the potential", "zh": "4.1 动员“潜力”"}, {"idx": 70, "level": "h3", "en": "4.2. Socializing risks", "zh": "4.2 将风险社会化"}, {"idx": 85, "level": "h2", "en": "5. Discussion", "zh": "5. 讨论"}, {"idx": 99, "level": "h3", "en": "CRediT authorship contribution statement", "zh": "CRediT 作者贡献声明"}, {"idx": 101, "level": "h3", "en": "Declaration of competing interest", "zh": "利益冲突声明"}, {"idx": 103, "level": "h3", "en": "Data availability", "zh": "数据可得性声明"}]}, "zanardo-2024-wilful-ignorance-waterloo": {"meta": {"title_en": "Wilful ignorance at Waterloo: public housing quality and political stigma in Sydney's largest estate renewal", "title_zh": "Waterloo 的故意无视：悉尼最大公屋更新中的公共住房质量与政治污名", "crumb": "Zanardo et al. 2024 · Wilful ignorance at Waterloo"}, "html": "<h2 class=\"sec\" data-secidx=\"0\"><span class=\"en\">Abstract</span><span class=\"zh\">摘要</span></h2><div class=\"para\" data-idx=\"1\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"beeab9d10f\"><p class=\"en\">Sydney’s Waterloo estate is one of Australia’s largest and most concentrated areas of public housing. There has been an almost two-decade-long effort to renew the estate, with successive governments persistently making the case that the demolition and mixed-tenure redevelopment must happen. In the process, the quality of the housing on the estate has been denigrated and misrepresented. This paper combines a detailed examination of the architectural qualities of the Waterloo estate with a critical analysis of historical and contemporary policy settings and political decisions driving the redevelopment project. It identifies the phases of development at Waterloo since the first buildings were constructed in 1948, describing the key characteristics of the dwellings that were part of each phase and situating them within in the wider story of public housing in NSW. It then evaluates the qualities identified in the buildings on the estate against the government’s own guidelines for new apartment development. This evaluation reveals the extent to which the state government has avoided a good-faith assessment of the architectural quality of the estate. The paper concludes by reviewing planning and policy objectives and highlighting that tenant interests and housing quality have been obscured through the stigmatzation of the estate.</p><p class=\"zh\">悉尼的 Waterloo 公屋区是澳大利亚规模最大、最集中的公共住房区之一。近二十年来，政府一直在推动这个公屋区的更新，历届政府始终坚称必须拆除并进行混合权属再开发。在此过程中，公屋区住房的质量被贬低和歪曲。本文把对 Waterloo 公屋区建筑品质的详细考察，与对推动再开发项目的历史和当代政策设定及政治决定的批判性分析结合起来。文章梳理了 Waterloo 自 1948 年第一批建筑落成以来的各个开发阶段，描述每一阶段住宅的关键特征，并把它们放回 NSW 公共住房更广阔的历史中。接着，文章用政府自己为新建公寓制定的指南，评估公屋区建筑的这些品质。这项评估揭示了州政府在多大程度上回避了对公屋区建筑品质做出善意的评估。文章最后回顾了规划与政策目标，指出租户利益和住房质量已被公屋区的污名化所遮蔽。</p></div><div class=\"para\" data-idx=\"2\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"f89ecab45b\"><p class=\"en\">Keywords: Public housing; Estate renewal; Architecture; Design guidelines; Sydney</p><p class=\"zh\">关键词：公共住房；公屋区更新；建筑；设计指南；悉尼</p></div><h2 class=\"sec\" data-secidx=\"3\"><span class=\"en\">Introduction</span><span class=\"zh\">引言</span></h2><div class=\"para\" data-idx=\"4\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"80a15e118a\"><p class=\"en\">The history of public housing in Australia is being rewritten by redevelopment. Estate renewal, which has come to mean demolition of public housing estates and the construction of mixed-tenure residential developments in their place, has gathered pace over the past two decades, mirroring an international trend. State governments, particularly in Victoria and New South Wales (NSW), have driven these transformations on broadacre outer suburban estates as well as in more complex, high-density inner-city settings. In both cases, policy documents and politicians’ pronouncements describe existing dwellings and neighbourhoods as outdated and unfit for twenty-first-century tenants. The estates and their buildings are often cast as failed experiments that are responsible for social dysfunction. Blame is variously attributed to the apparent hubris of mid-century architects and planners, who are accused of embracing and promoting untried and ill-conceived models of development; technical failures and compromises, due to austere financial conditions imposed on their design and construction; and functional obsolescence. While these explanations are often evoked in overlapping ways that lack a coherent accompanying analysis, the calculation that sits behind them is clear. The political leaders and policy advisers who promote this vision of estate renewal intend their audiences to be left with the very clear impression that twentieth-century public housing falls far short of contemporary standards and norms. They rarely shoulder responsibility for any of these failings. But the estates that have been identified as needing renewal are condemned as simply ‘unfit for purpose’.</p><p class=\"zh\">澳大利亚公共住房的历史正在被再开发改写。<a class=\"gref\" href=\"#g-renewal\">公屋区更新</a>（estate renewal）如今意味着拆除公共住房区、在原址建造混合权属（mixed-tenure）的住宅开发项目，过去二十年里这一进程不断加速，与国际趋势同步。各州政府，尤其是维多利亚州和新南威尔士州（NSW），既在外围郊区的大片公屋区推动这类改造，也在更复杂的高密度内城环境中推动。在这两种情形中，政策文件和政客的表态都把现有住宅与街区描述为过时的、不适合二十一世纪租户的。这些公屋区及其建筑常被塑造成失败的实验，要为社会失序负责。责任被归咎于不同方面：战后中期建筑师和规划师的所谓傲慢（他们被指责采纳并推广未经检验、考虑不周的开发模式）；因设计与建造被施加严苛财务条件而导致的技术失败和妥协；以及功能上的过时。这些解释常常以相互重叠、缺乏连贯分析的方式被援引，但其背后的盘算很清楚。推动这种公屋更新愿景的政治领导人和政策顾问，意在让受众留下一个非常清晰的印象：二十世纪的公共住房远远达不到当代标准和规范。他们很少为这些缺陷承担任何责任。而那些被认定需要更新的公屋区，则被简单地判定为“不再适用”（unfit for purpose）。</p></div><div class=\"para\" data-idx=\"5\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"bcea70fb6f\"><p class=\"en\">Such is the case with the redevelopment of the Waterloo estate: the largest estate renewal proposal to date, and one of the largest that could ever be undertaken in Australia. The estate comprises approximately 2000 dwellings across a range of high-, mid-, and low-rise apartment buildings on 18 hectares in Sydney’s inner-south. In December 2015, the NSW Government announced that it would be included as part of the programme formerly known as ‘Communities Plus’; the plan was to demolish the existing buildings and construct seven to eight thousand new apartments in their place, with approximately 30% of these social housing and 70% private housing. The effect of the project would have been to increase slightly the number of social housing units, although the new units would generally have less bedrooms and be able to house less people than those they replaced. The transfer of a portion of the estate into private ownership and sale of the private market units would fund the project as a whole. In August 2023, following a change of government in March 2023, the plan for the project’s first phase – the redevelopment of 749 units in the predominantly low-rise Waterloo South – was revised to 30% social housing, 50% market-rate private housing, and 20% affordable housing (targeted and moderate-income earners, and leased for either a maximum of 30% of gross income or at a 20% discount to market rate).</p><p class=\"zh\">Waterloo 公屋区的再开发正是如此：这是迄今规模最大的公屋更新提案，也是澳大利亚可能进行的最大型更新之一。该公屋区约有 2000 套住宅，分布在悉尼内城南部 18 公顷土地上高、中、低层不等的公寓楼中。2015 年 12 月，NSW 政府宣布将其纳入当时称为“<a class=\"gref\" href=\"#g-cplus\">Communities Plus</a>”的计划；方案是拆除现有建筑，在原址新建七八千套公寓，其中约 30% 为社会住房，70% 为私人住房。这个项目的效果会是让社会住房数量略有增加，但新单元一般卧室更少，能容纳的人也比被替换的单元少。将公屋区的一部分转为私人所有并出售私人市场单元，用来为整个项目提供资金。2023 年 3 月政府更替后，同年 8 月，项目第一期——以低层为主的 Waterloo South 中 749 套单元的再开发——被修改为 30% 社会住房、50% 市场价私人住房和 20% 可负担住房（面向目标群体和中等收入者，租金最高为总收入的 30%，或按市场价打八折出租）。</p></div><div class=\"para\" data-idx=\"6\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"4f6d19261c\"><p class=\"en\">In the face of a strong campaign by residents to stop or slow the redevelopment plans, the state government – first under the Liberal-National Coalition, and then under Labor since March 2023 – has highlighted the failings of the estate. Former Minister for Social Housing Brad Hazzard initially declared that it was ‘terrible’; the Labor government’s Minister for Housing an Homelessness, Rose Jackson, labelled it ‘not fit for purpose’ and local Member of Parliament Ron Hoenig described it as ‘well past the renewal date’, with residents living in ‘squalor’. But are the units and the living environment on this estate really that bad? Is wholesale demolition for complete reconstruction the best option available to government? And does this approach properly consider those most affected, the existing residents? While resident groups have mounted a vigorous campaign against the project, most of the public debate has focused on how many new units might be acceptable on a redeveloped site. Other ways of conceiving of the estate – repairing, expanding, and refurbishing existing buildings over time, ensuring ongoing security for residents on site – appear not to have not been given serious consideration. One might assume then, given the proposals to date, that all the dwellings are entirely beyond redemption, unsalvageable. But the estate, which took more than a quarter of century to develop, is made up of several very different types of housing, at very different scales, with different plans, and employing completely different construction materials and methods. The government’s all-encompassing appraisal, that they are no longer fit for purpose, throws a veil over the diversity and specificity of what is actually there. It asks us to take as read the idea that the whole estate is truly obsolete, that high-rise towers and slab blocks, as well as low-rise walk-ups and everything in between must go (Figure 1).</p><p class=\"zh\">面对居民为阻止或放缓再开发计划而发起的强力运动，州政府——先是自由党-国家党联盟，2023 年 3 月起是工党——一直在强调这个公屋区的缺陷。前社会住房部长 Brad Hazzard 最初宣称它“糟糕透顶”（terrible）；工党政府的住房与无家可归问题部长 Rose Jackson 称它“不再适用”；当地议员 Ron Hoenig 则形容它“早已过了该更新的时候”，居民生活在“污秽”（squalor）之中。但这个公屋区的住宅单元和居住环境真的有那么糟吗？整体拆除、彻底重建是政府能选择的最佳方案吗？这种做法是否恰当地考虑了受影响最大的人，即现有居民？尽管居民团体对项目展开了激烈抗争，大部分公共讨论却集中在再开发后的地块上可以接受建多少新单元。其他看待这个公屋区的方式——随时间逐步修缮、扩建和翻新现有建筑，保证居民能继续安稳住在原地——似乎没有得到认真考虑。那么，按迄今为止的提案，人们可能会以为所有住宅都已彻底无可挽回、无法保留。但这个花了四分之一个多世纪才建成的公屋区，是由几种截然不同的住宅类型组成的：尺度差异很大，平面各不相同，采用的建造材料和方法也完全不同。政府那种“它们已不再适用”的全盘评价，给现场实际存在的多样性和具体性罩上了一层面纱。它要求我们把“整个公屋区确实已经过时”当作理所当然，认定高层塔楼和板楼、低层无电梯楼以及介于其间的一切都必须拆除（图 1）。</p></div><div class=\"para\" data-idx=\"8\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"bf3f51d0fe\"><p class=\"en\">The purpose of this paper is to evaluate whether the demolition-redevelopment approach favoured by recent governments is ineluctable. The paper combines a detailed examination of the architectural qualities of the Waterloo estate with a critical analysis of historical and contemporary policies and political decisions driving the project. It provides a brief background that delineates the early history of the public housing programme in inner Sydney in the postwar decades before describing and analysing the qualities of each of the main phases of development of the Waterloo estate between the late 1940s and early 1980s, carefully unpacking the different qualities and characteristics of the buildings and their units. This provides basic information about the amenity of the dwellings – daylighting, natural ventilation, privacy, and so on. The paper then looks at how the qualities of the Waterloo estate’s housing align or not with wider ideas about healthy environments and the other factors that inform the NSW Government’s own housing quality standards for new apartments. The paper, furthermore, evaluates the extent to which the existing Waterloo units meet those standards.</p><p class=\"zh\">本文的目的，是评估近年历届政府所偏好的“拆除—再开发”路径是否真的不可避免。本文把对 Waterloo 公屋区建筑品质的详细考察，与对推动该项目的历史与当代政策和政治决定的批判性分析结合起来。文章先简要交代战后几十年悉尼内城公共住房计划的早期历史，再描述和分析 Waterloo 公屋区在 1940 年代末到 1980 年代初之间各个主要开发阶段的品质，细致拆解各类建筑及其单元的不同品质和特点。这提供了关于住宅舒适性（amenity）的基本信息：采光、自然通风、私密性等。接着，本文考察 Waterloo 公屋区住房的品质与更广泛的健康环境观念，以及 NSW 政府自己为新建公寓制定的住房质量标准所依据的其他因素，是否相符。本文还进一步评估现有 Waterloo 单元在多大程度上达到了这些标准。</p></div><div class=\"para\" data-idx=\"9\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"d1f2d51c3c\"><p class=\"en\">This paper, however, is not a condition assessment nor an attempt to document exactly what residents want from their dwellings. It is an evaluation of the basic architectural qualities of the buildings, the resultant amenity delivered and then an assessment of those aspects against the government’s evidence-based design guidelines. Though the buildings and the units are of their time and somewhat mixed in quality, the results of this systematic evaluation raises questions about the underlying rationale for the state government’s estate renewal plan as it evolved across the past decade. In particular, the paper is interested in whether the redevelopment plans – officially referred to as ‘renewal’ – gives due consideration to the needs of the tenants themselves and the possibility of more judicious redevelopment over time. And it asks why the government relies so heavily on stigmatizing the place and its inhabitants and yet seems to have done little in the way of systematic evaluation themselves.</p><p class=\"zh\">不过，本文既不是一份房屋状况评估，也不试图准确记录居民希望从住宅中得到什么。它评估的是建筑的基本建筑学品质、由此提供的舒适性，再把这些方面放到政府基于证据的设计指南下检验。尽管这些建筑和单元带有其时代特征、品质也参差不齐，但这项系统评估的结果，对州政府在过去十年中逐步形成的公屋更新计划背后的根本理由提出了疑问。本文特别关注：再开发计划（官方称为“更新”）是否充分考虑了租户自身的需要，以及随时间进行更审慎的再开发的可能性。本文还追问：为什么政府如此依赖于对这个地方及其居民的<a class=\"gref\" href=\"#g-stigma\">污名化</a>，自己却似乎几乎没做过系统评估？</p></div><h2 class=\"sec\" data-secidx=\"10\"><span class=\"en\">The emergence of public housing in NSW</span><span class=\"zh\">NSW 公共住房的出现</span></h2><div class=\"para\" data-idx=\"11\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"baf9106c7b\"><p class=\"en\">A hundred years ago, Sydney faced a significant housing affordability and supply problem. The economic boom of the 1920s built prosperity for some, but many missed out, and housing for workers was often inadequate or simply unavailable. The state government intervened to provide worker housing through its Housing Board (1910–1924), initially in a limited way in the innerurban areas of Millers Point and The Rocks, and later more ambitiously at suburban Daceyville and other suburban and regional locations. However, prominent economic and political forces in NSW fiercely opposed this state support for housing and consequently its impact was quite limited in scope. Under this scheme, the state government completed a total of 834 dwellings in greater Sydney for a population that passed one million during the 1920s. Sydney Municipal Council also invested resources in workers’ housing in this period (1912–1927), something entirely new to them. Their efforts reflected a clear vision, but were similarly limited in scope, providing just 165 dwellings for a population of more than 50,000 (Figure 2).</p><p class=\"zh\">一百年前，悉尼面临严重的住房可负担性和供给问题。1920 年代的经济繁荣让一部分人富裕起来，但很多人被落下，工人住房往往不足，或者根本没有。州政府通过其住房委员会（Housing Board，1910–1924）介入提供工人住房，起初规模有限，集中在内城的 Millers Point 和 The Rocks，后来在郊区的 Daceyville 及其他郊区和地方城镇更有雄心地推进。然而，NSW 有影响力的经济和政治力量激烈反对这种国家住房支持，因此其影响范围相当有限。在这一计划下，州政府在大悉尼地区总共建成 834 套住宅，而悉尼人口在 1920 年代已突破一百万。悉尼市议会在这一时期（1912–1927）也为工人住房投入了资源，这对他们来说是全新的事。他们的努力体现了清晰的愿景，但同样范围有限，为超过五万的人口只提供了 165 套住宅（图 2）。</p></div><div class=\"para\" data-idx=\"12\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"fecff67514\"><p class=\"en\">In the first quarter of the twentieth century, planners and sanitation experts labelled many inner urban locations with strong concentrations of housing constructed in the period between 1850s and the 1890s as ‘slums’, and they were slated for resumption. But with limited provision of new stateprovided housing, most such areas were redeveloped for profitable commercial or industrial uses, or alternatively just remained as they were with the condition of dwellings worsening. Private construction activity all but ceased during the Great Depression of the 1930s and Sydney faced a drastic housing shortage for its growing population. In 1934, the State set up the Homes for the Unemployed Trust to build small cottages for subsidized sale and to supply cheap materials to enable people to build their own house in suburban areas. But the impact of the Unemployed Trust was also limited.</p><p class=\"zh\">二十世纪头二十五年，规划师和卫生专家把许多集中了 1850 至 1890 年代所建住房的内城地段贴上“贫民窟”（slums）的标签，并计划将其收回。但由于国家新建住房供给有限，这类地区大多被改建为有利可图的商业或工业用途，或者干脆维持原状，住宅状况持续恶化。1930 年代大萧条期间私人建房活动几近停止，悉尼不断增长的人口面临严重住房短缺。1934 年，州政府设立失业者住房信托（Homes for the Unemployed Trust），建造小型独立屋以补贴价格出售，并供应廉价材料，让人们能在郊区自建住房。但这个信托的影响同样有限。</p></div><div class=\"para\" data-idx=\"13\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"3137a4672e\"><p class=\"en\">This series of schemes was modest in terms of serving need but did create momentum for a more substantial public provision of housing. By the middle of the decade, a renewed slum-reform movement pushed for ‘abolishing eye-sores’ and providing better quality homes intended to create employment and improve the health of workers. The removal of terrace housing was a key feature of the initiative as this form of accommodation was widely viewed as ‘ugly and monotonous’, lacking in adequate services and subject to overcrowding. It was the stigmatized housing of its day, and in response to pressure the State established the Housing Conditions Investigation Committee in 1936 to enquire into the issue and make recommendations. It concluded that urgent action was required, that the private sector could not or would not provide the quality of housing required without compromising its profits, and therefore that the Government needed to take on this responsibility. On the advice of the Committee, the State established the Housing Improvement Board in 1937 to undertake necessary slum clearance and construct housing schemes. The Board investigated several slum areas (including Waterloo), but only one project was initiated. Located in Erskineville and completed in 1938, the estate ultimately contained just 56 dwellings (Figure 3).</p><p class=\"zh\">这一系列计划就满足需求而言规模不大，却为更大规模的公共住房供给积蓄了动力。到 1930 年代中期，重新兴起的贫民窟改革运动推动“清除碍眼之物”，并提供品质更好的住房，以创造就业、改善工人健康。拆除联排住宅（terrace housing）是这项倡议的关键内容，因为这种住房形式普遍被视为“丑陋而单调”、缺乏足够的设施并且过度拥挤。它是那个时代被污名化的住房。迫于压力，州政府在 1936 年设立住房状况调查委员会（Housing Conditions Investigation Committee），调查这一问题并提出建议。委员会的结论是：需要采取紧急行动；私人部门无法或不愿在不损害利润的前提下提供所需品质的住房；因此政府需要承担起这项责任。根据委员会的建议，州政府于 1937 年设立住房改善局（Housing Improvement Board），负责必要的贫民窟清理和住房建设计划。该局调查了几个贫民窟地区（包括 Waterloo），但只启动了一个项目：位于 Erskineville、1938 年建成的住宅区，最终只有 56 套住宅（图 3）。</p></div><div class=\"para\" data-idx=\"15\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"ef36736c51\"><p class=\"en\">The government halted further projects and funding at the outbreak of World War II in 1939. However, a change in government in 1941 brought with it an increased focus on addressing the questions of slum-clearance and housing. The new McKell Labor Government proposed a single new authority be established to ‘co-ordinate and supervise housing throughout the State’, and develop a ‘long term programme to give the people homes in which they can live in dignity’. In November 1941, the state government passed a new Housing Act establishing the Housing Commission of New South Wales. The Housing Commission assumed the powers and responsibilities of the previous Housing Board, Homes for the Unemployed Trust and the Housing Improvement Board and was charged with delivering ‘adequate housing accommodation’ across the State.</p><p class=\"zh\">1939 年第二次世界大战爆发后，政府停止了后续项目和拨款。不过，1941 年政府更替后，清理贫民窟和住房问题重新受到重视。新上台的 McKell 工党政府提议设立一个统一的新机构，“协调并监督全州的住房事务”，并制定一项“长期计划，让人们拥有可以有尊严地生活的家”。1941 年 11 月，州政府通过新的《住房法》，设立<a class=\"gref\" href=\"#g-hc\">新南威尔士住房委员会</a>（Housing Commission of New South Wales）。住房委员会承接了此前的住房委员会、失业者住房信托和住房改善局的权力与职责，负责在全州提供“足够的住房”。</p></div><div class=\"para\" data-idx=\"17\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"b8a3b4eb22\"><p class=\"en\">The very first projects of the NSW Housing Commission were modest as material shortages and restrictions during and after World War II in Australia limited the state’s ability to construct new buildings. Houses were built in country areas for those employed in the war effort, and soon after, temporary dwellings were erected in more urban areas for those in greatest need. However, at the end of the War, the Commonwealth lent money to the states under the first Commonwealth State Housing Agreement (CHSA) in 1945, allowing the Housing Commission to commence their activities in earnest. Their initial projects were either new estates called ‘neighbourhood developments’ comprised of scores of small free-standing dwellings on large lots in greenfield areas, or smaller infill projects on resumed (or already available) sites in urban areas, often including modestly-scaled apartment buildings. Designs for standard two and three-storey apartment blocks were developed by the Housing Commission by in-house architects as early as 1946.</p><p class=\"zh\">NSW 住房委员会最早的项目规模不大，因为二战期间及战后澳大利亚的材料短缺和管制限制了州政府建造新建筑的能力。委员会在乡村地区为参与战时生产的人建造住房，不久又在较城市化的地区为最急需者搭建临时住宅。不过，战争结束时，联邦政府根据 1945 年第一份《联邦—州住房协议》（CSHA）向各州贷款，住房委员会这才得以全面开展工作。它最初的项目，要么是在新开发区建造的、被称为“邻里开发”（neighbourhood developments）的新住宅区，由大量建在大地块上的小型独立住宅组成；要么是在城市地区被收回（或已有）地块上的小型填充式项目，往往包括尺度适中的公寓楼。早在 1946 年，住房委员会的内部建筑师就已设计出标准的两层和三层公寓楼。</p></div><h2 class=\"sec\" data-secidx=\"18\"><span class=\"en\">(Re)making Waterloo</span><span class=\"zh\">（重新）营造 Waterloo</span></h2><div class=\"para\" data-idx=\"19\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"6203274dd9\"><p class=\"en\">The first redevelopment at what is now known as the Waterloo Estate occurred in 1948 with four three-storey apartment buildings occupying a small site at the northern end of the urban block bounded by Raglan, George, Wellington and Cooper Streets, on land previously partially occupied by air-raid trenches. The buildings were arranged perpendicular to the street frontages with a landscaped setback and together formed a shared courtyard at the centre-rear of the site. Each small brick apartment building had a simple rectangular building footprint, a pitched, tile roof, and contained six two-bedroom units, two per floor, mirrored across a communal stair. Units were relatively small by today’s standards but had highly efficient layouts with well-proportioned rooms in a pin-wheeled configuration around a minimal corridor, kitchen with sit-in meal room, and modern bathroom facilities. A very thin building section, high ceilings and windows to three sides of every unit provided excellent daylight to all areas of the plan and easy cross-ventilation. Few shared walls meant that there was little acoustic or impact noise transfer laterally (Figure 4).</p><p class=\"zh\">如今被称为 Waterloo 公屋区的地方，第一次再开发发生在 1948 年：四栋三层公寓楼占据了 Raglan、George、Wellington 和 Cooper 四条街围合的街区北端一小块地，这块地此前部分被防空壕占用。这些楼与临街面垂直布置，前面有绿化退让，并在地块中后部共同围出一个共享庭院。每栋小型砖砌公寓楼的平面是简单的矩形，坡屋顶铺瓦，内有六套两居室，每层两套，以一部公共楼梯为轴对称布置。按今天的标准，单元面积相对较小，但布局非常高效：比例良好的房间围绕一条极短的走廊呈风车状排列，有带用餐区的厨房和现代化的卫浴设施。楼体进深很浅、层高较高，每个单元三面开窗，平面的每个角落都有极好的采光，也很容易形成<a class=\"gref\" href=\"#g-crossvent\">穿堂风</a>。共用墙很少，意味着横向几乎没有空气声或撞击声的传递（图 4）。</p></div><div class=\"para\" data-idx=\"21\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"0a3e0a92e6\"><p class=\"en\">The scale of urban redevelopment projects grew quickly as the state government made a concerted push to increase the volume of housing under construction. External architects worked with the Housing Commission to develop bespoke designs for site-specific circumstances on larger sites that had been acquired or assembled before World War II. In 1954, the Housing Commission completed Greenway in Kirribilli on land left over from the construction of the Sydney Harbour Bridge. Designed by D.T. Morrow &amp; Gordon Architects, it contained 309 dwellings, making it the largest residential development in Australia at the time. John Northcott Place in Surry Hills was completed in 1963, this time on land originally assembled by the City of Sydney for housing. It was designed by Samuel Lipson and Kaad Architects and contained 409 dwellings again claiming the title of largest multi-storey public housing development in Australia (Figure 5).</p><p class=\"zh\">随着州政府全力提高在建住房的数量，城市再开发项目的规模迅速扩大。外部建筑师与住房委员会合作，在二战前已收购或整合的较大地块上，针对具体场地条件做定制设计。1954 年，住房委员会在建造悉尼海港大桥后剩余的土地上建成了 Kirribilli 的 Greenway。它由 D.T. Morrow & Gordon Architects 设计，共有 309 套住宅，是当时澳大利亚最大的住宅开发项目。Surry Hills 的 John Northcott Place 于 1963 年建成，用地最初由悉尼市为建住房而整合。它由 Samuel Lipson and Kaad Architects 设计，共有 409 套住宅，再次夺得澳大利亚最大多层公共住房开发项目的称号（图 5）。</p></div><div class=\"para\" data-idx=\"22\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"8456f9917c\"><p class=\"en\">By the early 1960s, several entire urban street blocks in Waterloo had been acquired and cleared, rear lanes removed, and subdivisions amalgamated and prepared for redevelopment. Apartment building designs were along the lines of the small original project in 1948; however, updated standard building plans were being utilized by this time (Figure 6). Rectangular buildings contained collections of either exclusively one-bedroom units, two-bedroom units or three-bedroom units, and were organized two per floor either side of a stair over three storeys. Newer cruciform plan types contained a combination of unit sizes but were collections of four per floor arranged around a central stairwell. Internally, these unit plans had many of the qualities and characteristics of the earlier ones, however, a couple of small differences from the 1948 building design are apparent, including meal rooms relocated to be part of an open-plan living room, the provision of a small balcony to each unit, and the lowering of ceilings.</p><p class=\"zh\">到 1960 年代初，Waterloo 已有好几个完整的城市街区被收购和清理，后巷被取消，地块被合并，准备再开发。公寓楼的设计沿袭了 1948 年那个小型初始项目的思路，不过这时已开始使用更新版的标准建筑图纸（图 6）。矩形楼栋内要么全是一居室，要么全是两居室或三居室，每层两套，分列楼梯两侧，共三层。较新的十字形平面则混合了不同户型，每层四套，围绕中央楼梯间布置。在内部，这些户型平面保留了早期户型的许多品质和特点，但与 1948 年的设计相比有几处小的差别，包括用餐区被并入开放式起居室、每套增设一个小阳台，以及层高降低。</p></div><div class=\"para\" data-idx=\"24\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"4c28c58359\"><p class=\"en\">While they appeared satisfied with this apartment building type, the Housing Commission introduced a significant change at the urban scale in this phase of development. With the availability of entire street blocks the Commission broke with the traditional pattern of aligning housing to the street frontage. They opted instead for alternative angled layouts which no longer strongly defined the street edges with built form. This arrangement instead provided increased and irregular landscaped setbacks and appear almost as if planned from the birds-eye view (Figures 7 and 8). Internally to the block, behind the building line, the space between the buildings became less physically contained or courtyard-like, and more free-flowing. An advantage of the layout appears to be that windows do not directly face opposing buildings and outlook from units is extended further into landscaped spaces. A secondary consequence is that the building entries are not perpendicular to the footpath and are further from the street diminishing the sense of address and sense of ‘front’ and ‘back’, with buildings being perceived ‘in the round’.</p><p class=\"zh\">住房委员会看来对这种公寓楼类型很满意，但在这一开发阶段，它在城市尺度上做出了一个重大改变。由于拿到了整个街区，委员会打破了建筑沿临街面排列的传统格局，转而采用斜向的布局，不再用建筑形体清楚地界定街道边缘。这种布局提供了更大、更不规则的绿化退让，看上去几乎像是从鸟瞰角度规划出来的（图 7 和图 8）。在街区内部、建筑线后方，楼与楼之间的空间不再那么具有围合感或庭院感，而是更加自由流动。这种布局的一个好处似乎是，窗户不直接对着对面的楼，单元的视野可以更远地延伸到绿化空间里。一个次生后果是，楼栋入口不与人行道垂直、离街道也更远，削弱了“门牌地址”感和“前”与“后”的区分，建筑被当作“四面体”来感知。</p></div><div class=\"para\" data-idx=\"28\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"c9657efa44\"><p class=\"en\">In 1968, a project called Mount Lachlan, which includes 52 dwellings, was designed for the southern edge of the Waterloo Estate in the block bounded by John, Mead, McEvoy and George Streets. Comprised of four larger ‘T-shaped’ three-storey buildings, each with four or five units per floor, the project was a return to the earlier 1948 approach of laying out buildings aligned to the street edge. The architectural language of Mount Lachlan is distinguished by a more modern sensibility with a flat roof, blade wall expression around balconies, and features a change in brick tone for spandrels between windows which helps to break up larger areas of wall plane reducing the apparent scale of the building. Another difference is the introduction of short, externalized corridors, or ambulatories, to reach units not immediately adjacent to the staircase. The dwellings themselves, as with the earlier buildings, are compact in plan, with windows on two or three sides providing ample natural daylight and ventilation, and well-constructed of robust materials that have stood the test of time.</p><p class=\"zh\">1968 年，一个名为 Mount Lachlan、包括 52 套住宅的项目，被规划在 Waterloo 公屋区南缘由 John、Mead、McEvoy 和 George 四条街围合的街区里。它由四栋较大的“T 形”三层楼组成，每层四到五套，回到了 1948 年那种建筑沿街道边缘排列的做法。Mount Lachlan 的建筑语言更具现代感：平屋顶、阳台周围的片墙表达，以及窗间墙使用不同色调的砖，有助于打破较大的墙面、减小建筑的视觉尺度。另一个不同之处是引入了短的外廊（ambulatories），用来到达不紧挨楼梯的单元。和早期建筑一样，这些住宅平面紧凑，两三面开窗，自然采光和通风充足，建造用材坚固，经受住了时间的考验。</p></div><div class=\"para\" data-idx=\"30\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"a677463009\"><p class=\"en\">While most of the estate is quite flat, the southeastern corner rises steeply and creates challenges for building in those sections. This change in levels would have made the laying out of multiple free-standing buildings with small footprints – of the kind produced on the estate up until that time – a complex exercise. The steep gradient created difficulties for construction and resident access. To address these challenges, the Commission looked beyond their regular in-house design team and sought input from architects in private practice. Lipson, Kaad and Fotheringham designed Madden Place in 1966. It was composed of one larger, single building with 56 dwellings that could respond to the demanding particularities of the site. In 1969 the Housing Commission Special Designs Group were the architects for Camelia Grove, with 65 dwellings, and, like Madden Place, it was configured to respond directly to the underlying contours. Both are large C-shaped courtyard buildings in plan that are serviced by long open corridors around their internal perimeter. They are varied in height, reducing from six to four storeys as the land beneath them rises (Figures 9 and 10). The real innovation in their design is in section where the buildings are arranged as two three-storey walk-ups stacked on top of each other, with on-grade access from the lowest level and access to the fourth level via a bridge from the higher street frontage. This arrangement delivered compliant fire egress while avoiding the need for elevators, which the Commission generally tried to avoid in its buildings, being too expensive at the time as well as being difficult to maintain.</p><p class=\"zh\">公屋区大部分地势相当平坦，但东南角陡然升高，给这一部分的建造带来了困难。这种高差会让布置多栋小占地独立楼栋（即当时公屋区一直在建的那种）变得很复杂。陡坡给施工和居民出入都造成了困难。为了解决这些问题，委员会把目光投向常规的内部设计团队之外，向私人执业的建筑师寻求方案。Lipson, Kaad and Fotheringham 于 1966 年设计了 Madden Place：一栋较大的单体建筑，有 56 套住宅，能够回应场地的苛刻特殊条件。1969 年，住房委员会特别设计组（Special Designs Group）担任 Camelia Grove 的建筑师，共 65 套住宅；它与 Madden Place 一样，直接顺应下方的地形等高线布置。两者平面上都是大型 C 形庭院式建筑，由沿内侧周边的长开放走廊服务。它们的高度随下方地势升高而从六层降到四层（图 9 和图 10）。设计真正的创新在剖面上：建筑被处理成两个上下叠放的三层无电梯楼，最低层从地面直接进入，第四层则通过一座连桥从较高的临街面进入。这种布置满足了消防疏散规范，同时避免了安装电梯——委员会一般尽量在建筑中避免电梯，因为当时电梯造价太高，也难以维护。</p></div><div class=\"para\" data-idx=\"32\" data-doc=\"zanardo-2024-wilful-ignorance-waterloo\" data-nid=\"d15704a3e2\"><p class=\"en\">Camelia Grove and Madden Place are much larger than buildings that had been constructed earlier on the estate, making for larger groupings of households with up to sixteen units per floor. A consequence of this arrangement was that many units have only one uncompromised orientation for outlook and visual privacy, with their second orientation facing back to the corridor, often for the window to the second bedroom. For some units, this configuration also means that the living room and balcony faces south and does not receive direct sunlight. Due to the increased number of dwellings, shared laundries and ‘incinerator’ or waste rooms are provided on each floor rather than as a single room at ground floor in the garden areas like the smaller buildings. Internally, units adopt a conventional and compact layout not unlike the earlier buildings and meeting similar standards in terms of space provision and facilities provided. These blocks still have comparably narrow building depths, especially compared with most of today’s residential development in Australia, and include large windows for light and air.</p><p class=\"zh\">Camelia Grove 和
