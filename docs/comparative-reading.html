Uitermark, 2003），以理解话语如何在特定的经验节点上被表达出来，以及它如何促成或影响所观察到的过程和现象。这接近福柯式的“考古学”方法，关注话语如何出现、如何构成主体，以及——至关重要的——如何影响社会实践。但它也受布迪厄式立场的影响，把话语视为塑造社会行动、物质条件和“社会认知”的“权力资源”（van Dijk, 1993），而获取这种资源的机会取决于各种形式资本的分配。这种话语分析对于回答“Waterloo 为什么被再开发”“它为什么被污名化”以及“两者可能如何相关”是必要的，因为它把这个公屋区放进了一个更广地理语境（城市、州和国家）中关于公共住房的当代话语秩序里。它构成倒数第二节的基础。</p></div><h2 class=\"sec\" data-secidx=\"18\"><span class=\"en\">4. Historicizing the stigmatization of public housing in Australia</span><span class=\"zh\">4. 把澳大利亚公共住房的污名化历史化</span></h2><div class=\"para\" data-idx=\"19\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"950b7683d8\"><p class=\"en\">This section elaborates the historical background to the stigmatization of public housing in Australia. It outlines the housing policy reforms and broader shifts in the political economy of housing that have created the conditions for the territorial stigmatization of estates and estate renewal in the twenty-first century. As I explain, many of these reforms and shifts were part of processes of neoliberalization, particularly the retraction and marketization of the welfare state alongside processes of economic deregulation and financial liberalization. However, while many accounts of public housing and territorial stigma locate the origins of stigma within neoliberalism (e.g. Paton, 2018; Scambler, 2018; Wacquant, 2008), public rental housing in Australia has a longer history of inferior treatment and status. At no time since its systematic nationwide introduction in 1945 has it accounted for more than 10% of the national housing stock (Hayward, 1996; Troy, 2012). While the funding, construction, and total stock of public housing has indeed shrunk since the neoliberal reforms of the 1970s and beyond, Keynesian and neoliberal governments alike have preferred assistance for home ownership rather than public rental housing. Over the course of the 20th and 21st centuries, private homeownership has been encouraged through land grants, cash payments for purchases and construction, state or state-backed loans, favourable terms of purchase for sitting public housing tenants and, more recently, non-taxation of capital gains and imputed rents and liberalized lending to support debt-financed purchases (Groenhart &amp; Gurran, 2015; Nicholls, 2014; Troy, 2012; Yates, 2003). Furthermore, home ownership has been and continues to be championed by governments as a pillar of community and citizenship; the ‘Great Australian Dream’ of owning a home is one that successive governments have supported materially and discursively.</p><p class=\"zh\">本节阐述澳大利亚公共住房污名化的历史背景，概述那些为二十一世纪公屋区的地域污名化和公屋区更新创造了条件的住房政策改革，以及住房政治经济的更广泛转变。正如我将解释的，这些改革和转变中有许多是新自由主义化进程的一部分，尤其是福利国家的收缩和市场化，以及经济去管制和金融自由化。然而，尽管许多关于公共住房和地域污名的论述把污名的起源定位在新自由主义（例如 Paton, 2018; Scambler, 2018; Wacquant, 2008），澳大利亚的公共租赁住房受到低人一等的对待和地位，历史要长得多。自 1945 年在全国系统推行以来，它从未占全国住房存量的 10% 以上（Hayward, 1996; Troy, 2012）。公共住房的资金、建设和总存量在 1970 年代及以后的新自由主义改革中确实萎缩了，但凯恩斯主义和新自由主义政府都更偏好资助自有住房，而不是公共租赁住房。在整个二十和二十一世纪，私人自有住房一直受到各种鼓励：土地赠与、购房和建房的现金补助、国家或国家担保的贷款、给现住公屋租户的优惠购买条件，以及近年来对资本利得和估算租金免税、放宽贷款以支持举债购房（Groenhart & Gurran, 2015; Nicholls, 2014; Troy, 2012; Yates, 2003）。此外，历届政府一直把自有住房推崇为社区和公民身份的支柱；拥有自己房子的“<a class=\"gref\" href=\"#g-dream\">澳大利亚大梦想</a>”（Great Australian Dream），是历届政府在物质上和话语上都支持的梦想。</p></div><div class=\"para\" data-idx=\"20\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"f812e56644\"><p class=\"en\">This is the context within which the stigmatization of public housing must be first understood. Due to the superordination of homeownership in material and symbolic terms, public housing has always been numerically marginal and often poorly designed, built and maintained (though there are many notable exceptions). This situation was exacerbated by the aforementioned policy of favourable terms of sale to sitting tenants (in place between 1956 and 1973), which led to both the removal of many better quality and better located homes and the concentration of public housing stock in the form of apartments (which were not made available for tenants to purchase) and newer, relatively underserviced outer-suburban estates (Hayward, 1996; Troy, 2012). As I explain in the next section, these physical or morphological characteristics have had important ramifications for the territorial stigmatization of public housing. Furthermore, while vicious denunciations of tenants’ behaviour and character were initiated by later neoliberal reforms, public housing tenants in the 1950s, 60s and 70s were nonetheless positioned as socially inferior to homeowners: their status as renters made the quality of their citizenship and community participation at least somewhat questionable (Kemeny, 1983; Ronald, 2008).</p><p class=\"zh\">必须首先在这个语境中理解公共住房的污名化。由于自有住房在物质和符号上的至高地位，公共住房在数量上一直处于边缘，而且往往设计、建造和维护不佳（尽管有许多值得注意的例外）。上述以优惠条件向现住租户出售住房的政策（1956 至 1973 年实施）加剧了这种情况：它既导致许多质量较好、位置较好的住房被移出，也使公共住房存量集中为公寓（这些不对租户出售）和较新、配套相对不足的外围郊区公屋区（Hayward, 1996; Troy, 2012）。正如我将在下一节解释的，这些物理或形态特征对公共住房的地域污名化产生了重要影响。此外，虽然对租户行为和品格的恶毒谴责是由后来的新自由主义改革掀起的，但 1950、60、70 年代的公共住房租户仍被置于低于自有住房者的社会地位：他们的租户身份使其公民身份和社区参与的质量至少有些可疑（Kemeny, 1983; Ronald, 2008）。</p></div><div class=\"para\" data-idx=\"21\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"ced49438bc\"><p class=\"en\">The drivers of the dominance of private homeownership in Australia are largely beyond the scope of this article but one thing of particular importance is the role of homeownership in depoliticising Indigenous dispossession and settler possession of land. As Capp et al. (2021, p. 4) write, Australia is ‘a nation of homeowners, bred from a violent settler-colonial structure that uses settler creation of private property to legitimize the perpetual dispossession of Indigenous lands, [in which] private property ownership is held as a pinnacle of social achievement’. Homeownership is a marker of citizenship and participation in the Australian capitalist and settler-colonial project and from at least the mid-20th century onwards, when it became the dominant tenure, has played a key role in investing settlers within contemporary structures of settler colonialism by extending private property ownership to a broader segment of the settler population and activating among them a sense status, belonging and control (Blatman‐Thomas &amp; Porter, 2019; Rogers, 2017). In this way, homeownership aids the continued disavowal of Indigenous sovereignty and perpetuation of the settler colonial myth of terra nullius (Moreton-Robinson, 2015). Through the ideology of homeownership, and the property right through which homeownership is conferred, settlers claim ‘rightful’ or ‘deserving’ possession and inhabitance despite the absence of treaties or contracts with Indigenous peoples.</p><p class=\"zh\">澳大利亚私人自有住房占主导地位的原因大多超出本文范围，但有一点特别重要：自有住房在把原住民被剥夺土地、定居者占有土地这件事去政治化方面所起的作用。正如 Capp 等人（2021, p. 4）所写，澳大利亚是“一个房主之国，孕育于暴力的定居者殖民结构，这一结构利用定居者对私有财产的创造，使对原住民土地的永久剥夺正当化，（在这个国家里）私有财产所有权被视为社会成就的顶峰”。自有住房是公民身份和参与澳大利亚资本主义与定居者殖民事业的标志；至少从二十世纪中叶它成为主导权属形式起，它就通过把私有财产所有权扩展到更广泛的定居者人群、激发他们的地位感、归属感和掌控感，在让定居者投身当代定居者殖民结构方面发挥了关键作用（Blatman‐Thomas & Porter, 2019; Rogers, 2017）。由此，自有住房帮助持续否认原住民主权，延续“无主之地”（terra nullius）的定居者殖民神话（Moreton-Robinson, 2015）。通过自有住房意识形态，以及赋予自有住房的财产权，定居者宣称自己“正当”或“应得”地占有和居住，尽管他们与原住民之间并没有条约或契约。</p></div><div class=\"para\" data-idx=\"22\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"13caf3bf26\"><p class=\"en\">Thus, rental tenures have long been considered and treated as inferior to ownership. From 1973 onwards, after the post-World War II period in which public housing reached a height of around eight to nine per cent of all housing and more than 15% of all residential construction (Hayward, 1996; Troy, 2012), three key neoliberal policy trends led to the intensifying stigmatization of public housing tenants and estates. These were the targeting of assistance to very low-income earners, the introduction of market rents, and the decline in Commonwealth government funding for public housing in favour of an income support supplement for private rental households.</p><p class=\"zh\">因此，租赁权属长期以来被视为、也被当作低于所有权。二战后公共住房一度达到全部住房的约 8–9%、住宅建设的 15% 以上（Hayward, 1996; Troy, 2012）；1973 年以后，三项关键的新自由主义政策趋势导致对公共住房租户和公屋区的污名化不断加剧。它们是：把援助定向给极低收入者；引入市场租金；以及联邦政府对公共住房的拨款减少，转而为私人租房家庭提供收入支持补贴。</p></div><div class=\"para\" data-idx=\"23\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"b75eec7e75\"><p class=\"en\">Increased targeting in the public housing system occurred in response to concerns that it was not assisting society’s poorest (Hayward, 1996; Troy, 2012). These concerns were partly legitimate, insofar as public housing was primarily intended for settler families with at least one breadwinner and required that tenants meet standards of homemaking and tidiness. As Morgan (2006) has outlined, Indigenous people were de facto excluded from public housing due to racist tenant evaluation practices and the labour and housing market discrimination that impeded them from meeting eligibility criteria. Yet concerns that public housing tenants were insufficiently poor also spoke to a (persistent) contradiction between the anti-poverty purpose of public housing and the neoliberal model of a welfare state that assists only the very poorest. (If one of the objectives of public housing is poverty prevention or reduction, a low incidence of poverty might be judged as a success). Since 1973, eligibility has been restricted to ever-lower income brackets to the point that, now, around three-quarters of new tenants are allocated from ‘priority’ waiting lists (for persons experiencing or at risk of homelessness, people with a disability, young and elderly people, and Aboriginal and/or Torres Strait Islander people; see AIHW, 2020) and more than 90% of tenants receive disability, old age, unemployment or other government payments as their primary source of income (AIHW, 2019). As such it is targeting, combined with the decline in public housing construction and past development priorities and trends, that has caused the concentration of poverty and disadvantage within public housing estates.</p><p class=\"zh\">公共住房体系定向化的加强，是对“它没有帮到社会最穷的人”这一担忧的回应（Hayward, 1996; Troy, 2012）。这种担忧部分是合理的，因为公共住房主要面向至少有一名养家者的定居者家庭，并要求租户达到持家和整洁的标准。正如 Morgan（2006）所述，由于种族主义的租户评估做法，以及阻碍原住民满足准入条件的劳动力和住房市场歧视，原住民事实上被排除在公共住房之外。然而，关于公共住房租户“不够穷”的担忧，也反映了公共住房的反贫困目的与只援助最穷者的新自由主义福利国家模式之间一个（持续存在的）矛盾。（如果公共住房的目标之一是预防或减少贫困，那么贫困发生率低或许应被视为成功。）自 1973 年以来，准入资格被限制在越来越低的收入区间，以至于现在约四分之三的新租户来自“优先”轮候名单（面向正经历或面临无家可归风险的人、残障人士、年轻人和老年人，以及原住民和/或托雷斯海峡岛民；见 AIHW, 2020），90% 以上的租户以残障、养老、失业或其他政府补助为主要收入来源（AIHW, 2019）。因此，正是定向化，加上公共住房建设的减少以及过去的开发重点和趋势，造成了贫困和劣势在公屋区内的集中。</p></div><div class=\"para\" data-idx=\"24\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"616064688e\"><p class=\"en\">Targeting has transformed the primary subject of public housing from the male settler breadwinner to a range of marginalized groups: public housing became home to unemployed people, people with disabilities, people experiencing mental ill health (including substance abuse and addiction), Indigenous people, and non-Indigenous people of colour (who were largely unable to gain residence in Australia until the rolling back of racist migration laws in the 1970s). Their concentration in estates worked to compound their stigmatization. Furthermore, targeting increased the social distance between public housing tenants and home ownership: while tenants had previously been subjects of assisted home ownership programs, this became increasingly impossible during the late-20th century. Tenants thus came to be denigrated as ‘irresponsible’ and ‘dependent’ (Jacobs et al., 2010, 2011).</p><p class=\"zh\">定向化把公共住房的主要对象，从男性定居者养家者转变为一系列边缘群体：公共住房成了失业者、残障人士、有精神健康问题者（包括物质滥用和成瘾者）、原住民以及非原住民有色人种（在 1970 年代种族主义移民法被废除之前，他们大多无法在澳大利亚获得居留）的家。他们在公屋区的集中加剧了对他们的污名化。此外，定向化拉大了公共住房租户与自有住房之间的社会距离：租户过去曾是资助购房计划的对象，到二十世纪后期这越来越不可能。租户因此被贬斥为“不负责任”和“依赖”（Jacobs et al., 2010, 2011）。</p></div><div class=\"para\" data-idx=\"25\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"70d45ffac2\"><p class=\"en\">Targeting worked in tandem with the introduction of market rents, which occurred in full in 1978 (Hayward, 1996). Tenants earning sufficiently low incomes qualified for a rebate that fixed their rent at, typically, between 20 and 30% of their income. Ineligible households gradually exited the system—many by taking up favourable government loans to purchase homes—or avoided it altogether (Troy, 2012). By 1991, the proportion of rebated tenants had grown to over 80%; by 2010 it was over 90% (Foard et al., 1994; Productivity Commission, 2013). Eligibility restrictions mean that effectively all public housing tenants are now rebated and market rents are moot insofar as tenants’ housing costs are concerned. However, market rents enable the calculation of a so-called ‘subsidy gap’ between the rent tenants pay and the market rate. This gap has been conceptualized as an ‘in-kind’ subsidy (Commonwealth of Australia, 2009) and ‘implicit assistance’ (Productivity Commission, 2017). As I have argued elsewhere (Sisson, 2021a) and touch on in the next section, this exaggerates the degree of assistance that public housing tenants receive, against which they are evaluated as ‘deserving’ or ‘undeserving’.</p><p class=\"zh\">定向化与市场租金的引入同步推进，市场租金在 1978 年全面实施（Hayward, 1996）。收入足够低的租户有资格获得租金减免，租金通常固定在其收入的 20% 到 30% 之间。不符合资格的家庭逐渐退出这个体系（许多人借助优惠的政府贷款买了房），或者干脆不进入（Troy, 2012）。到 1991 年，享受减免的租户比例增至 80% 以上；到 2010 年超过 90%（Foard et al., 1994; Productivity Commission, 2013）。准入限制意味着现在几乎所有公共住房租户都享受减免，就租户的住房成本而言，市场租金已无实际意义。然而，市场租金使人能够计算租户所付租金与市场价之间所谓的“<a class=\"gref\" href=\"#g-subsidygap\">补贴差距</a>”（subsidy gap）。这一差距被概念化为“实物”补贴（Commonwealth of Australia, 2009）和“隐性援助”（Productivity Commission, 2017）。正如我在别处论述过（Sisson, 2021a）、并将在下一节略作讨论的，这夸大了公共住房租户所获援助的程度，而租户正是以此为标准被评判为“应得”或“不应得”。</p></div><div class=\"para\" data-idx=\"26\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"842b34e896\"><p class=\"en\">As eligibility criteria have become stricter, tenants’ rents have declined relative to market rents. This has enlarged the so-called subsidy gap and fuelled accusations that tenants are undeserving. Equally significant has been rising market rents and house prices in Australian cities due to the deregulation and liberalization of housing finance and investment, reshaping housing into a highly profitable asset class (Adkins et al., 2020). Rising market rents and values have been particularly pertinent in the gentrifying inner-cities of Sydney and Melbourne, where several large, high-density public housing estates were built in the mid-20th century as part of ‘slum clearance’ programs. It is here that the ‘subsidy gap’ (the gap between market rent and tenants’ rental payments) is largest and where tenants are arguably the most stigmatized—as undeserving the real estate they inhabit (Sisson, 2021a). It must be stressed that the funds required to operate public housing in gentrified areas are not inherently greater than anywhere else, but rather it is the ‘opportunity cost’ or ‘user cost of capital’ which is greater, the calculation of which reflects the extent to which neoliberal rationalities have become embedded in public housing policy.</p><p class=\"zh\">随着准入标准越来越严，租户的租金相对于市场租金下降。这扩大了所谓的补贴差距，助长了租户“不应得”的指责。同样重要的是，由于住房金融和投资的去管制与自由化，澳大利亚城市的市场租金和房价不断上涨，住房被重塑为一种高利润的<a class=\"gref\" href=\"#g-asset\">资产类别</a>（Adkins et al., 2020）。市场租金和房价上涨在悉尼和墨尔本正在绅士化的内城尤其突出，那里有几个大型高密度公屋区，是二十世纪中叶“清理贫民窟”计划的一部分。正是在这里，“补贴差距”（市场租金与租户所付租金之差）最大，租户可以说也最受污名化——被认为不配住在他们所住的房地产上（Sisson, 2021a）。必须强调，在绅士化地区运营公共住房所需的资金本身并不比其他地方多；更高的是“机会成本”或“资本使用成本”，而计算这些成本的方式，反映了新自由主义理性在公共住房政策中扎根的程度。</p></div><div class=\"para\" data-idx=\"27\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"3bbaa82ae4\"><p class=\"en\">Targeting and market rents were followed by steadily declining government funding from the mid-1980s and particularly from the mid-1990s, with total annual funding cut by more than one-third by the 2010s. The decline in per capita terms is of course even more precipitous, given the nation’s population grew by two-thirds over this period. Declining funding caused housing authorities immense difficulties in keeping up with repairs, maintenance and debt, let alone the need for new public rental dwellings. This was exacerbated by the exit of higher-income (and thus higher-paying) tenants from the system due to targeting and market rents. The constant under-resourcing of public housing has led to continued deterioration in housing quality which has, in turn, exacerbated territorial stigma by making public housing materially worse than much private housing and therefore more conspicuous, particularly in gentrified areas. Perversely, the declining physical quality of public housing has been more commonly blamed on tenants, who are accused of a lack of investment in their community and ingratitude for the assistance they receive.</p><p class=\"zh\">在定向化和市场租金之后，政府拨款从 1980 年代中期、尤其是 1990 年代中期起持续下降，到 2010 年代年度总拨款被削减了三分之一以上。按人均计算的下降当然更加陡峭，因为这一时期全国人口增长了三分之二。拨款减少使住房机构在维修、保养和偿债上都困难重重，更不用说满足对新公共租赁住宅的需求了。由于定向化和市场租金，收入较高（因而付租较多）的租户退出体系，使情况雪上加霜。公共住房长期资源不足，导致住房质量持续恶化，这又使公共住房在物质上比许多私人住房更差、因而更显眼，尤其是在绅士化地区，从而加剧了地域污名。荒谬的是，公共住房物理质量的下降更常被归咎于租户，他们被指责不愿为社区投入、对所获援助不知感恩。</p></div><div class=\"para\" data-idx=\"28\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"8b0c3f91c1\"><p class=\"en\">It is in this context that state housing authorities have adopted ‘asset management’ logics and practices (Randolph &amp; Judd, 2000; Tiernan &amp; Burke, 2002). That is, in order to fund the maintenance, improvement, and sporadic and marginal growth of their housing stock, they have sold the more valuable public homes and redeveloped estates into mixed tenure precincts, with private property development paying (in theory) to replace public housing. Furthermore, in the last ten to fifteen years they have steadily devolved responsibility for tenancy management to private, non-profit Community Housing Providers (CHPs), transferring management of existing tenancies and contracting CHPs to manage new social housing. CHPs receive higher revenues per tenant because their tenants are eligible to receive Commonwealth Government payments, designed to support low-income private renters, and thus tend to have higher incomes from which a CHP can draw 20 to 30% in rental payments. A 2009 agreement between state and federal governments set a target for 35% of the social housing system to be managed by CHPs, which have also sometimes gained title to public dwellings through this process.</p><p class=\"zh\">正是在这种背景下，州住房机构采纳了“<a class=\"gref\" href=\"#g-assetmgmt\">资产管理</a>”（asset management）的逻辑与做法（Randolph & Judd, 2000; Tiernan & Burke, 2002）。也就是说，为了给住房存量的维护、改善以及零星和边际的增长筹资，它们出售价值较高的公共住房，把公屋区再开发为混合权属片区，（理论上）由私人房地产开发出钱替换公共住房。此外，在过去十到十五年里，它们逐步把租务管理责任下放给私营的非营利<a class=\"gref\" href=\"#g-chp\">社区住房提供者</a>（CHPs），把现有租约的管理移交给它们，并签约让它们管理新的社会住房。CHPs 从每位租户身上获得的收入更高，因为其租户有资格领取为支持低收入私人租户而设的联邦政府补助，因而收入往往更高，CHPs 可以从中收取 20% 到 30% 作为租金。2009 年州与联邦政府之间的一项协议设定目标，由 CHPs 管理 35% 的社会住房体系；在此过程中，CHPs 有时还获得了公共住宅的产权。</p></div><div class=\"para\" data-idx=\"29\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"e6f0d361f4\"><p class=\"en\">Legitimating this course of action and events is a view, apparent among governments and their private sector allies, that public housing itself is the problem. That is, rather than addressing the fundamental structural and systemic causes of public housing’s distinctive and often deteriorating built environments, its high incidence of poverty and disadvantage, and its general neglect and mismanagement by the state, they problematize the people and places of public housing, and public ownership and management itself. The effect of this, as I explain in the next section, is to represent public housing estates as territories to which problems are inherent but confined, and to which reterritorialization by way of redevelopment and devolution is the only viable solution.</p><p class=\"zh\">为这一系列行动和事件提供正当性的，是在政府及其私营部门盟友中显而易见的一种看法：公共住房本身就是问题所在。也就是说，他们不去处理公共住房独特且常常恶化的建成环境、高发的贫困与劣势、以及国家对它的普遍忽视和管理不善背后的根本结构性和系统性原因，而是把公共住房的人和地方、以及公共所有和管理本身问题化。正如我将在下一节解释的，其效果是把公屋区呈现为问题本来就存在于其中、但也被限制在其中的地域，而通过再开发和下放进行的“再地域化”（reterritorialization）是唯一可行的方案。</p></div><h2 class=\"sec\" data-secidx=\"30\"><span class=\"en\">5. Territorial stigma and the ‘common-sense’ of estate renewal</span><span class=\"zh\">5. 地域污名与公屋区更新的“常识”</span></h2><div class=\"para\" data-idx=\"31\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"28bc94419d\"><p class=\"en\">In this penultimate section I outline how territorial stigma has been articulated in a way that legitimises programs of estate renewal by presenting the physical, social and institutional characteristics of public housing estates as causes of public housing problems (real and imagined), thereby obscuring the structural and systemic causes summarized in the previous section. Estate renewal thus proceeds in the form of demolition and redevelopment as mixed tenure housing that is ‘tenure-blind’ designed, in the places where public housing occupies the most valuable real estate (so that the state can achieve ‘value for money’), and with the new or replacement social housing managed by the not-for-profit sector rather than the state. This is the common-sense or doxa of estate renewal that prevails in Australian housing policy.</p><p class=\"zh\">在这倒数第二节中，我概述地域污名是如何被表达的，使之为公屋区更新计划提供正当性：它把公屋区的物理、社会和制度特征呈现为公共住房（真实与想象的）问题的原因，从而遮蔽了上一节概述的结构性和系统性原因。于是，公屋区更新就以这样的形式推进：在公共住房占据最有价值地产的地方（以便国家实现“物有所值”）拆除并再开发为“权属不可辨”设计的混合权属住房，新建或替换的社会住房由非营利部门而非国家管理。这就是在澳大利亚住房政策中占主导的公屋区更新常识或 doxa。</p></div><div class=\"para\" data-idx=\"32\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"8da1f0f8d6\"><p class=\"en\">The arguments here are based on a discourse analysis of news media, government policy and planning documents, and various reports and submissions by think tanks, non-government organizations and other private- or third-sector organizations. The material gathered was published in the decade up to the end of 2018 and includes publications with national relevance as well as those focussed on New South Wales— Australia’s largest state and responsible for over one third of its public housing. While supplemented with a small number of additional publications of note, the bulk of the material was comprised of the following:</p><p class=\"zh\">这里的论点基于对新闻媒体、政府政策与规划文件，以及智库、非政府组织和其他私营或第三部门组织的各类报告和意见书所做的话语分析。所收集的材料发表于截至 2018 年底的十年间，既包括具有全国相关性的出版物，也包括聚焦新南威尔士州的出版物——新南威尔士是澳大利亚最大的州，拥有全国三分之一以上的公共住房。除补充少量其他值得注意的出版物外，材料主体包括：</p></div><div class=\"para\" data-idx=\"33\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"bd4d12c787\"><p class=\"en\">i. News media reports returned by a Factiva ® search for the terms ‘public housing’, ‘social housing’, ‘housing estate’ and ‘housing commission’, from the Sydney Morning Herald, Daily Telegraph, Australian, and Australian Financial Review (n = 2913);</p><p class=\"zh\">i. 在 Factiva® 中检索“public housing”“social housing”“housing estate”和“housing commission”，来自《悉尼先驱晨报》《每日电讯报》《澳大利亚人报》和《澳大利亚金融评论》的新闻报道（n = 2913）；</p></div><div class=\"para\" data-idx=\"34\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"9ba35399f9\"><p class=\"en\">ii. Publicly available Commonwealth Government and NSW Government documents relating to social housing and housing policy and planning generally (n = 66);</p><p class=\"zh\">ii. 公开可得的、关于社会住房以及一般住房政策与规划的联邦政府和 NSW 政府文件（n = 66）；</p></div><div class=\"para\" data-idx=\"35\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"479b618507\"><p class=\"en\">iii. Publicly available documents relating to social housing policy and planning published by think tanks, NGOs, consultants and other private-or third-sector organizations (n = 59)</p><p class=\"zh\">iii. 智库、NGO、咨询公司和其他私营或第三部门组织发布的、公开可得的社会住房政策与规划相关文件（n = 59）</p></div><div class=\"para\" data-idx=\"36\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"d99e3ca9f6\"><p class=\"en\">There is much more to be said about the stigmatization of public housing tenants and estates than I cover here, such as the use of the figures of the ‘taxpayer’ and ‘waiting list’ to portray groups of sitting tenants as undeserving their spare bedroom or ungrateful for their assistance because of alleged antisocial behaviour. There are numerous examples of stigma being used to justify the imposition of harsh, even punitive restrictions on tenants, such as fixed-term leases and ‘one strike’ anti-social behaviour laws. My focus here is on discourse that reproduces the territorial stigmatization of estates specifically and helps legitimate estate renewal as a form of reterritorialization. It identifies four prisms through which public housing estates are viewed and, in turn, acted upon.</p><p class=\"zh\">关于公共住房租户和公屋区的污名化，可说的远比我在这里涉及的多，例如用“纳税人”和“轮候名单”的形象，把一些现住租户群体描绘成不配拥有空余卧室，或因所谓反社会行为而对所获援助不知感恩。也有许多例子说明污名被用来为对租户施加严厉甚至惩罚性的限制辩护，例如定期租约和“一次犯规”（one strike）反社会行为法。我在这里关注的，是专门再生产公屋区地域污名化、并帮助把公屋区更新正当化为一种再地域化的话语。它识别出四个棱镜，人们通过它们看待公屋区，进而对其采取行动。</p></div><h3 class=\"sec\" data-secidx=\"37\"><span class=\"en\">5.1. Built environments</span><span class=\"zh\">5.1 建成环境</span></h3><div class=\"para\" data-idx=\"38\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"997d09139c\"><p class=\"en\">As I have discussed, public housing in Australian cities, particularly Sydney and Melbourne, has become characterized by a dual character of high-density inner city and low-density outer suburban estates. This is not to say that these two forms are the only ones in which public housing exists, or even the majority of public housing; rather, they are its most recognisable forms and those circulated most frequently in representations of public housing, for they are the most ‘identifiably separate’ (Darcy, 2013, p. 369). This is particularly true of modernist high-rises and suburban estates designed according to the Radburn model (a form of ‘garden city’ planning which separates pedestrian and vehicle traffic to create clusters of ‘back to front’ dwellings facing communal outdoor areas and footpaths rather than roads). Both were examples of innovation and experimentation in housing design and construction led by state housing authorities, and of efficient mass production of housing in the context of constrained budgets (Pettigrew, 2005; Troy, 2012). They differ, therefore, from much of the housing that surrounds them. For instance, the towers of Sydney’s Waterloo estate have been described as ‘grey concrete buildings [that] remain strikingly incongruous against the relatively flat, terraced terrain of their urban surrounds—monuments to the era’s utilitarian style of housing projects’ (Sydney Morning Herald, 2017, p. 23). The label ‘Suicide Towers’ is often applied to these and other high rise public housing complexes (e.g. Godfrey, 2015; Reynolds, 2017).</p><p class=\"zh\">如前所述，澳大利亚城市（尤其是悉尼和墨尔本）的公共住房形成了一种双重特征：高密度的内城公屋区和低密度的外围郊区公屋区。这并不是说公共住房只以这两种形式存在，甚至也不是说大多数公共住房是这两种形式；而是说，它们是公共住房最容易辨认的形式，也是在关于公共住房的表述中流传最广的形式，因为它们最“可辨认地分隔开来”（Darcy, 2013, p. 369）。现代主义高层楼和按 Radburn 模式设计的郊区公屋区尤其如此（Radburn 是一种“田园城市”规划，人车分流，形成一组组“前后颠倒”的住宅，面向公共户外区域和步道而不是道路）。两者都是州住房机构主导的住房设计与建造的创新和实验之例，也是在预算受限条件下高效大规模生产住房之例（Pettigrew, 2005; Troy, 2012）。因此，它们与周边的大部分住房不同。例如，悉尼 Waterloo 公屋区的塔楼被描述为“灰色混凝土建筑，与周边城市相对平坦的联排住宅地形格格不入——那个时代住房项目功利主义风格的纪念碑”（Sydney Morning Herald, 2017, p. 23）。“自杀塔”这个标签常被用在这些以及其他高层公共住房上（例如 Godfrey, 2015; Reynolds, 2017）。</p></div><div class=\"para\" data-idx=\"39\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"834bb4d01d\"><p class=\"en\">The distinctive appearance of several estates functions to anchor tenants’ stigmatization to place. This has led to a prevailing wisdom that new public housing should deliver ‘tenure blind design’ (e.g. Judith Stubbs and Associates, n.d.; van den Nouwelant &amp; Randolph, 2016). Indeed, the stigmatization incurred by distinctive built environments has been floated as one justification for estate redevelopment. The Executive Director of the NSW program of estate redevelopment, Peter Anderson, described it as an ‘anti-stigma’ strategy:</p><p class=\"zh\">好几个公屋区的独特外观，起到把租户的污名化锚定在地方上的作用。这导致了一种普遍看法：新的公共住房应当实现“权属不可辨设计”（例如 Judith Stubbs and Associates, n.d.; van den Nouwelant & Randolph, 2016）。事实上，独特建成环境招致的污名化，已被提出作为公屋区再开发的理由之一。NSW 公屋区再开发计划的执行总监 Peter Anderson 把它描述为一种“反污名”策略：</p></div><div class=\"para quote\" data-idx=\"40\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"916afa14b1\"><p class=\"en\">When you look at some of the social housing properties that we have from the past you will notice that they have a certain stereotype […] We want to make sure social homes look exactly the same as private homes. That’s important so you can remove the stigma (Saurine, 2016, p. 18)</p><p class=\"zh\">看看我们过去的一些社会住房物业，你会注意到它们有某种刻板形象 [……] 我们要确保社会住房看起来和私人住房一模一样。这很重要，这样你才能消除污名（Saurine, 2016, p. 18）</p><span class=\"attrib\">Peter Anderson（NSW 公屋区再开发计划执行总监）的原话，经 Sisson 转引自报纸（Saurine, 2016）。这是把再开发说成\"反污名\"的典型例子；Sisson 引用它是为了批判：在结论中他指出，当污名被理解为只是\"丑陋建筑\"时，绅士化就被当成了反污名策略。不是作者立场。</span></div><div class=\"para\" data-idx=\"41\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"e06fe6ab77\"><p class=\"en\">Modernist high-rises and Radburn estates alike are represented as socially isolating and criminogenic environments. The terms ‘ghetto’ and ‘slum’ are used with abandon, buckling under intellectual scrutiny but nevertheless conveying a perception of separated physical environments and social orders. A thinly veiled environmental determinism (informed by principles of Crime Prevention Through Environmental Design) is apparent in claims that Radburn principles ‘unintentionally created de facto gated communities where violence rules’ (Sydney Morning Herald, 2009, p. 10). Radburn estates are described as bounded places lacking informal surveillance and with ambiguous ownership of common spaces leading to criminality, their ‘laneways used as common entries and exits to the houses helped ghettoize communities and encourage crime’ (Welch, 2009, p. 4). The redevelopment of these estates has at times been described as an effort to ‘de-Radburnise’ public housing.</p><p class=\"zh\">现代主义高层楼和 Radburn 公屋区都被表述为造成社会孤立、诱发犯罪的环境。“贫民区”（ghetto）和“贫民窟”（slum）这些词被随意使用，经不起学术推敲，却仍传达出物理环境与社会秩序相互隔离的观感。一种几乎不加掩饰的环境决定论（受“通过环境设计预防犯罪”原则影响），体现在这样的说法中：Radburn 原则“无意中造就了由暴力统治的事实上的门禁社区”（Sydney Morning Herald, 2009, p. 10）。Radburn 公屋区被描述为缺乏非正式监视、公共空间归属模糊、因而导致犯罪的封闭之地，其“作为住宅共同出入口的小巷，助长了社区的贫民区化并诱发犯罪”（Welch, 2009, p. 4）。这些公屋区的再开发有时被说成是给公共住房“去 Radburn 化”的努力。</p></div><div class=\"para\" data-idx=\"42\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"5b9058a0be\"><p class=\"en\">Similarly, high-rise estates have been labelled ‘failed experiments’ in planning and architecture that have led to social isolation, crime, and antisocial behaviour. The physical design of high-rise estates is represented as criminogenic in its apparent affordance of discreet spaces for drug dealing, drug use, and perhaps more serious crimes; these ‘rabbit warren-like public housing blocks the “perfect design” for drug dealing’ (McClennan, 2015, p. 14). Former NSW Minister for Social Housing, Pru Goward, labelled towers in inner-Sydney ‘honeypots’ for drug dealing and drug use when introducing a Local Allocation Strategy that restricts anyone charged or convicted for drug supply or manufacture in the five years prior (or who refuses to consent to a criminal record check) from being allocated housing in them (2GB, 2018).</p><p class=\"zh\">同样，高层公屋区被贴上规划和建筑“失败实验”的标签，被认为导致了社会孤立、犯罪和反社会行为。高层公屋区的物理设计被表述为诱发犯罪，因为它看似为毒品交易、吸毒以及也许更严重的犯罪提供了隐蔽空间；这些“兔子窝般的公共住房楼”是毒品交易的“完美设计”（McClennan, 2015, p. 14）。前 NSW 社会住房部长 Pru Goward 在推出一项地方分配策略时，把悉尼内城的塔楼称为毒品交易和吸毒的“蜜罐”；该策略规定，任何在过去五年内因供应或制造毒品被起诉或定罪的人（或拒绝同意查询犯罪记录的人），都不得被分配到这些塔楼里的住房（2GB, 2018）。</p></div><div class=\"para\" data-idx=\"43\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"70df508ad2\"><p class=\"en\">In both cases, the stigmatization of public housing estates operates through their representation as separate and distinct territories, wherein problems of crime, addiction and antisocial behaviour are caused by architectural and planning practices that have created uniquely isolated and permissive environments. By problematizing the built environments of public housing in this way, territorial stigmatization helps legitimize state interventions like estate redevelopment which, in removing and replacing the problematized built environment, constitute strategies of reterritorialization. And as the above example of inner-Sydney’s Local Allocation Strategy attests, this form of territorial stigmatization also helps justify state interventions into the social composition of the populations who inhabit estates.</p><p class=\"zh\">在两种情况下，公屋区的污名化都是通过把它们表述为分离而独特的地域来运作的：在这些地域里，犯罪、成瘾和反社会行为问题，被归因于建筑和规划实践创造了格外孤立、放任的环境。通过这样把公共住房的建成环境问题化，地域污名化帮助为公屋区再开发这类国家干预提供正当性；这些干预通过移除和替换被问题化的建成环境，构成了再地域化策略。正如上述悉尼内城地方分配策略的例子所证明的，这种形式的地域污名化也帮助为国家干预公屋区居住人口的社会构成提供理由。</p></div><h3 class=\"sec\" data-secidx=\"44\"><span class=\"en\">5.2. Populations</span><span class=\"zh\">5.2 人口</span></h3><div class=\"para\" data-idx=\"45\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"1d8d9ca12b\"><p class=\"en\">The spatial concentration of public housing in the form of estates resulted from efficient mass provision as well as policies allowing sitting tenants in the 1950s, 60s and early 70s to purchase their detached or semi-detached homes. Furthermore, the concentration of disadvantaged and marginalized groups within public housing has resulted from targeting, market rents and funding declines. This spatial concentration has been consistently represented as an arrangement that exacerbates, or even causes, tenants’ disadvantage. Estates are problematized for causing ‘concentrated disadvantage’—a term undergirded by aforementioned concept of neighbourhood effects, which controversially contends that individuals’ aspirations and life chances are negatively affected by living among similarly marginalized and deprived communities, in excess of political and economic causes of marginalization and deprivation.</p><p class=\"zh\">公共住房以公屋区形式出现的空间集中，既来自高效的大规模供给，也来自允许 1950、60 年代和 70 年代初的现住租户购买其独立或半独立住宅的政策。此外，弱势和边缘群体在公共住房中的集中，来自定向化、市场租金和拨款减少。这种空间集中一直被表述为一种加剧、甚至造成租户劣势的安排。公屋区被问题化为造成“劣势集中”——这个说法以前述的邻里效应概念为支撑，该概念颇具争议地主张：住在同样边缘、匮乏的社区中，会对个人的期望和生活机会产生负面影响，而且这种影响超出了造成边缘化和匮乏的政治和经济原因。</p></div><div class=\"para\" data-idx=\"46\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"78d16d3559\"><p class=\"en\">Public housing estates have been territorially stigmatized through the deployment of these concepts in policy and media texts that represent estates as distinct social environments in which disadvantage is communicated like a pathogen, among tenants and intergenerationally (August, 2014). For instance, a Productivity Commission report on Introducing Competition and Informed User Choice into Human Services strayed into such social scientific postulation when it contended that a ‘social environment can develop that compounds the effects of disadvantage, and increases the chance that disadvantage is passed on from one generation to the next’ (Productivity Commission, 2017, p. 205). The NSW Government’s Future Directions strategy for social housing similarly claimed that</p><p class=\"zh\">公屋区通过政策和媒体文本对这些概念的运用而被地域污名化：这些文本把公屋区表述为独特的社会环境，劣势在其中像病原体一样在租户之间、在代际之间传播（August, 2014）。例如，生产力委员会一份关于《在公共服务中引入竞争和知情的用户选择》的报告，就跑到了这类社会科学推测里，声称“可能形成一种社会环境，加剧劣势的影响，并增加劣势代际传递的可能”（Productivity Commission, 2017, p. 205）。NSW 政府的社会住房《未来方向》战略也同样声称：</p></div><div class=\"para quote\" data-idx=\"47\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"fcd4118171\"><p class=\"en\">many estates experience high levels of crime, unemployment, domestic violence, tenancy management problems, poor educational outcomes and associated child protection issues. These experiences can be passed on through multiple generations, reinforcing the cycle of disadvantage (NSW Government, 2016, p. 24).</p><p class=\"zh\">许多公屋区犯罪、失业、家庭暴力、租务管理问题、教育成果差及相关儿童保护问题的发生率都很高。这些经历可能代代相传，强化劣势循环（NSW Government, 2016, p. 24）。</p><span class=\"attrib\">NSW 政府《社会住房未来方向》（2016）原文，经 Sisson 转引。作为\"邻里效应 / 劣势代际传递\"话语的例证被引用，Sisson 认为这类说法把劣势归咎于公屋区本身、遮蔽了定向化与拨款削减等结构原因。不是作者立场。</span></div><div class=\"para\" data-idx=\"48\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"6b362b38db\"><p class=\"en\">These claims are indicative of wider regularities in discourse on public housing which represent estates as causally responsible, at least in part, for the reproduction of disadvantage. This is due, they suggest, to the social relations, practices, experiences and atmospheres that emerge when disadvantaged people are spatially concentrated. Tenants themselves are thus represented sympathetically (albeit condescendingly) as passive agents whose lives are structured by their noxious environment. Mark Latham, former Federal Labor opposition leader turned media commentator turned NSW parliamentarian for the far-right One Nation party, presented a particularly florid example in the Australian Financial Review:</p><p class=\"zh\">这些说法反映了公共住房话语中更广泛的规律：把公屋区表述为（至少部分地）对劣势的再生产负有因果责任。它们暗示，这是因为弱势人群在空间上集中时会出现的社会关系、实践、经历和氛围。租户本身因此被同情地（尽管带着居高临下的态度）表述为被动的行动者，其生活被有害的环境所塑造。前联邦工党反对党领袖、后来成为媒体评论员、再后来成为极右翼“一国党”（One Nation）NSW 州议员的 Mark Latham，在《澳大利亚金融评论》上给出了一个特别夸张的例子：</p></div><div class=\"para quote\" data-idx=\"49\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"b37ca05963\"><p class=\"en\">For many years, research has shown that the problems of disadvantaged neighbourhoods are far greater than the personal characteristics of the people who live there. That is, if one was to examine the education levels, labour market history and other poverty indicators for each Claymore resident, they would point to a level of deprivation below that actually being experienced in the suburb. There is something about the place itself which compounds and magnifies the degree of disadvantage […] The ‘mystery factor’ is hope. When young people grow up in areas where there are role models for work and responsibility, they tend to follow these norms as adults. Take them away and aberrant behaviour becomes a way of life (Latham, 2012, p. 48, emphasis added).</p><p class=\"zh\">多年来的研究表明，弱势街区的问题远大于住在那里的人的个人特征。也就是说，如果去考察 Claymore 每位居民的教育水平、劳动力市场经历和其他贫困指标，它们所指向的匮乏程度会低于该郊区实际经历的程度。地方本身有某种东西加剧并放大了劣势的程度 [……] 这个“神秘因素”就是希望。当年轻人在有工作和责任榜样的地区长大，他们成年后往往遵循这些规范。把榜样拿走，反常行为就会成为一种生活方式（Latham, 2012, p. 48，强调为作者所加）。</p><span class=\"attrib\">Mark Latham（前联邦工党领袖、后为一国党州议员）在《澳大利亚金融评论》的原话，经 Sisson 转引，作者称其为\"特别夸张的例子\"。用来说明\"地方本身造成劣势\"的话语。与作者立场相左。</span></div><div class=\"para\" data-idx=\"50\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"75ccac8421\"><p class=\"en\">Rather than tenants themselves, the object of stigmatization here is the estate as a spatial concentration of disadvantaged people. The problem is not ‘criminal’ or ‘undeserving’ tenants, but nor is it the existence of poverty and marginality; it is the practices of locating disadvantaged populations.</p><p class=\"zh\">这里被污名化的对象不是租户本身，而是作为弱势人群空间集中地的公屋区。问题不在于“犯罪”或“不应得”的租户，但也不在于贫困和边缘性的存在；问题在于安置弱势人群的做法。</p></div><div class=\"para\" data-idx=\"51\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"53df2a59e9\"><p class=\"en\">Territorial stigmatization thus functions to discourage attention on structural and systemic causes of disadvantage and its concentration and deny public housing’s role in alleviating disadvantage while simultaneously legitimising estate redevelopment in the name of ‘deconcentrating’ disadvantage. The mixed tenure or ‘social mix’ model of estate redevelopment has been presented as a way of achieving ‘inclusion’ (Commonwealth of Australia, 2009) or ‘integration’ of tenants within the mainstream of society (Infrastructure Partnerships Australia, 2016; NSW Government, 2016). Social mix in discourse on public housing has been described as a model for breaking cycles of disadvantage by introducing more affluent and privileged neighbours to act as ‘role models’ who will demonstrate ‘mainstream’ behaviours and practices and inspire aspiration among tenants. For instance, in justifying the NSW Government’s mixed-tenure redevelopment of several estates in Sydney, the former Minister for Social Housing, Brad Hazzard, commented that</p><p class=\"zh\">因此，地域污名化的作用在于：转移对劣势及其集中的结构性和系统性原因的注意，否认公共住房在缓解劣势方面的作用，同时以“<a class=\"gref\" href=\"#g-deconc\">分散</a>”劣势之名为公屋区再开发提供正当性。混合权属或“社会混合”的公屋区再开发模式，被呈现为实现“包容”（Commonwealth of Australia, 2009）或让租户“融入”主流社会（Infrastructure Partnerships Australia, 2016; NSW Government, 2016）的途径。在公共住房话语中，社会混合被描述为打破劣势循环的模式：引入更富裕、更有特权的邻居充当“榜样”，示范“主流”行为和做法，激发租户的上进心。例如，前社会住房部长 Brad Hazzard 在为 NSW 政府对悉尼几个公屋区的混合权属再开发辩护时说：</p></div><div class=\"para quote\" data-idx=\"52\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"4ffeaf6c4e\"><p class=\"en\">The major plus of all this which is not necessarily given enough focus is that when you get a mixture of housing, private and public, you get an incredible drop in antisocial behaviour […] Also what appeals to me is that little kids growing up don’t just see their parents and grandparents not going to work […] They see people around them dressed for work, leaving home to go about their day, and they think ‘Gee whiz that’s what I can do’ (Saulwick, 2016a, p. 28).</p><p class=\"zh\">这一切最大的好处，也是人们没有给予足够关注的，是当住房混合起来、私人和公共混在一起时，反社会行为会大幅下降 [……] 另外让我觉得有吸引力的是，小孩子长大时看到的不只是父母和祖父母不去上班 [……] 他们看到身边的人穿着上班的衣服出门开始一天的工作，他们会想：“哇，原来我也可以这样。”（Saulwick, 2016a, p. 28）</p><span class=\"attrib\">Brad Hazzard（时任 NSW 社会住房部长）的原话，经 Sisson 转引（Saulwick, 2016a）。社会混合\"榜样论\"的典型表述。Sisson 引用它来说明分散劣势话语如何为再开发提供正当性。不是作者立场。（Zanardo et al. 2024 也引用了同一段话。）</span></div><div class=\"para\" data-idx=\"53\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"d57d769763\"><p class=\"en\">‘Deconcentration’ is thus represented as a way of disrupting the pathological social relations and practices allegedly encouraged by concentration. In combination with the aforementioned built environment correctives, these changes to the social composition of the population of estates is a way of reterritorializing public housing estates.</p><p class=\"zh\">因此，“分散”被表述为一种打破据称由集中所助长的病态社会关系和实践的方式。结合前述对建成环境的矫正，这些对公屋区人口社会构成的改变，是对公屋区进行再地域化的一种方式。</p></div><h3 class=\"sec\" data-secidx=\"54\"><span class=\"en\">5.3. Tenure</span><span class=\"zh\">5.3 权属</span></h3><div class=\"para\" data-idx=\"55\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"5f29beda94\"><p class=\"en\">Discourses on concentrated disadvantage and built environments have been enrolled into a wider discourse on public housing within which state management is represented as inherently flawed compared to management by the non-government community housing sector. State management is routinely derided for its purported inefficiency, bureaucratic inertia, and detachment from the community, compared to CHPs heralded for their agility, innovation, efficiency, and community-mindedness (Darcy, 1999; Jacobs, 2019). For instance, writing in the Sydney Morning Herald, the late journalist Adele Horin implored readers to:</p><p class=\"zh\">关于劣势集中和建成环境的话语，被纳入了一种更广泛的公共住房话语：在这种话语中，与非政府的社区住房部门相比，国家管理被表述为天生有缺陷。国家管理经常因其所谓的低效、官僚惰性和脱离社区而受到嘲讽，而 CHPs 则因其灵活、创新、高效和社区意识而受到赞扬（Darcy, 1999; Jacobs, 2019）。例如，已故记者 Adele Horin 在《悉尼先驱晨报》上恳请读者：</p></div><div class=\"para quote\" data-idx=\"56\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"b7ca97706d\"><p class=\"en\">Banish from your mind any vision of vast housing commission estates. Either the money to build, or the titles to the new properties, have been or will be given to non-profit community housing organizations that have mainly managed properties for state housing departments. These community organizations have more liberal tenancy rules than state housing departments, which avoid concentrations of disadvantage (Horin, 2011, p. 18).</p><p class=\"zh\">把脑海里那些庞大的住房委员会公屋区的画面统统抛掉吧。要么是建房的钱，要么是新物业的产权，已经或将要交给非营利的社区住房组织，它们过去主要为州住房部门管理物业。这些社区组织的租务规则比州住房部门更宽松，能避免劣势的集中（Horin, 2011, p. 18）。</p><span class=\"attrib\">记者 Adele Horin 在《悉尼先驱晨报》的原话，经 Sisson 转引。用来说明\"社区住房组织优于国家管理\"的话语。不是作者立场。</span></div><div class=\"para\" data-idx=\"57\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"c411ab68ca\"><p class=\"en\">Similarly, Michael Perusco, then-Chief Executive of the St Vincent de Paul Society NSW, wrote in an op-ed in the Daily Telegraph that public housing should be transferred to CHPs as part of the solution to the ‘crisis’ of unaffordable housing:</p><p class=\"zh\">同样，时任 NSW 圣云先会（St Vincent de Paul Society）首席执行官 Michael Perusco 在《每日电讯报》的一篇评论文章中写道，作为解决住房不可负担“危机”方案的一部分，公共住房应移交给 CHPs：</p></div><div class=\"para quote\" data-idx=\"58\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"f011483cff\"><p class=\"en\">We need to see the large-scale transfer of the management of public housing stock to community housing providers. History tells us that governments are not good at managing public housing. Research is now showing that where community housing providers manage these properties it is more efficient and effective. They are also better at creating communities where people can thrive rather than be trapped in a cycle of intergenerational disadvantage (Perusco, 2014, p. 28, emphasis added).</p><p class=\"zh\">我们需要看到公共住房存量的管理大规模移交给社区住房提供者。历史告诉我们，政府不擅长管理公共住房。研究正表明，由社区住房提供者管理这些物业更高效、更有效。它们也更善于营造让人们能够发展、而不是陷入代际劣势循环的社区（Perusco, 2014, p. 28，强调为作者所加）。</p><span class=\"attrib\">Michael Perusco（时任圣云先会 NSW 首席执行官）在《每日电讯报》的原话，经 Sisson 转引，强调为 Sisson 所加。同样是\"政府不擅长管理公共住房\"话语的例证。不是作者立场。</span></div><div class=\"para\" data-idx=\"59\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"8c805de899\"><p class=\"en\">Perhaps unsurprisingly, representatives of the community housing sector have been similarly vocal with unfavourable characterizations of public housing. Andrew McNulty, then CEO of Link Housing, claimed that ‘[a]s good as state governments can be they are generally not good housing managers […]. Community providers are smaller, are more nimble, have lower overheads and are focused on housing’ (Saulwick 2016b, p. 11, emphasis added). He neglected to mention the greater rental revenues that CHPs can draw upon.</p><p class=\"zh\">也许并不意外，社区住房部门的代表同样大声地对公共住房作出负面描述。时任 Link Housing 首席执行官 Andrew McNulty 声称：“州政府再好，一般也不是好的住房管理者 [……]。社区提供者规模更小、更灵活、管理费用更低，而且专注于住房。”（Saulwick 2016b, p. 11，强调为作者所加）他没有提到 CHPs 能获得的更高租金收入。</p></div><div class=\"para\" data-idx=\"60\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"d130271466\"><p class=\"en\">In short, CHPs have been positioned as saviours of social housing. The purported problems of public housing—from crime and antisocial behaviour, to poorly serviced and maintained homes and estates, to concentrated disadvantage—are represented as inevitable and irresolvable outcomes of the direct involvement of the state in managing and owning housing. State management is portrayed as an outmoded relic; this is encapsulated by the continued use of the term ‘housing commission’ to describe public housing despite the restructuring of state housing authorities into departments or agencies more than thirty years ago. With state management so implicated in territorial stigmatization, the possibility that the public housing system could be expanded and improved—through sufficient funding and even the ‘best practices’ of CHPs—is made difficult to comprehend. Solutions which might involve expanding the social provisioning role of the state, or even simply maintaining it, are foreclosed. Rather, the only solutions made possible are those in which state social provision is devolved and the role of market or market-like processes widened. This constitutes the third process of reterritorialization, which occurs both through estate redevelopment and independent from it: that is, the reconfiguration of the institutional arrangements through which public housing is governed such that the state is at an arm’s length or absent.</p><p class=\"zh\">简言之，CHPs 被塑造成社会住房的救星。公共住房的所谓问题——从犯罪和反社会行为，到住房和公屋区服务与维护不佳，再到劣势集中——被表述为国家直接参与住房管理和所有的必然且无法解决的结果。国家管理被描绘成过时的遗物；尽管州住房机构在三十多年前就已重组为部门或机构，人们仍继续用“住房委员会”（housing commission）一词来指称公共住房，这正概括了这一点。由于国家管理与地域污名化如此紧密相连，通过充足的资金、甚至借鉴 CHPs 的“最佳实践”来扩大和改善公共住房体系的可能性，就变得难以想象。那些可能涉及扩大、甚至仅仅维持国家社会供给角色的方案被排除了。相反，唯一可能的方案是下放国家社会供给、扩大市场或类市场过程作用的方案。这构成了第三种再地域化过程，它既通过公屋区再开发发生，也独立于再开发发生：即重新配置治理公共住房的制度安排，使国家保持距离或缺席。</p></div><h3 class=\"sec\" data-secidx=\"61\"><span class=\"en\">5.4. Real estate</span><span class=\"zh\">5.4 房地产</span></h3><div class=\"para\" data-idx=\"62\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"34a2534816\"><p class=\"en\">Finally, the territorial stigmatization of public housing is produced in relation to real estate values. Its status as public land and the relatively low rents paid by its inhabitants have together led to claims that public housing is an inefficient use of public land or real estate; it is not its ‘highest and best use’ nor an ‘efficient’ use of a scarce public resource. This is especially so in places where public housing occupies higher value real estate, where public housing tenants are said to receive a disproportionate or even ‘unfair’ degree of ‘implicit assistance’ (Productivity Commission, 2017) or ‘in-kind subsidy’ (Commonwealth of Australia, 2009)—the gap between the rent they pay and the rate at which their home (or a similar home) would rent on the market. Public housing tenants who occupy high-value real estate are portrayed as undeserving this level ‘assistance’, which is represented as a heavy burden on the ‘taxpayer’ and a barrier to assisting households on the waiting list— particularly those in lower-value areas.</p><p class=\"zh\">最后，公共住房的地域污名化是联系着房地产价值而产生的。公共住房的公有土地身份，加上居民所付的相对低廉的租金，共同引出这样的说法：公共住房是对公共土地或房地产的低效利用；它不是“<a class=\"gref\" href=\"#g-hbu\">最高最佳用途</a>”（highest and best use），也不是对稀缺公共资源的“高效”利用。在公共住房占据较高价值地产的地方尤其如此：那里的公共住房租户被说成获得了不成比例、甚至“不公平”的“隐性援助”（Productivity Commission, 2017）或“实物补贴”（Commonwealth of Australia, 2009），即他们所付租金与其住房（或类似住房）在市场上的租金之差。占据高价值地产的公共住房租户被描绘为不配获得这种程度的“援助”，它被表述为“纳税人”的沉重负担，以及援助轮候名单上家庭（尤其是低价值地区的家庭）的障碍。</p></div><div class=\"para\" data-idx=\"63\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"5ca32ed0d6\"><p class=\"en\">Such a conceptualization of public tenants’ subsidy has been used to justify the privatization of public housing in Sydney’s harbourside neighbourhood of Millers Point, Dawes Point and the Rocks; a lengthy media release by then-Social Housing Minister Pru Goward claimed that homes here ‘can have a market rent of around $4,000 monthly, with the taxpayer subsidising as much as $3,700 of that each month. Some long-term tenancies in Millers Point have received more than $500,000 in subsidies over the term of their tenancy’ (Goward, 2014, p. 4). Goward thus claimed that ‘[f]or every subsidised tenancy in Millers Point, the Government could assist 5 tenants in Warrawong, or 3.5 tenants in Newcastle or Minto’ (p. 1). Goward’s successor in the portfolio, Brad Hazzard, similarly claimed that ‘[t]he Millers Point sales mean more families in Western Sydney and across the state will have a roof over their head and a place to call home’ (Godfrey, 2016, p. 18). More than 300 homes in this neighbourhood were eventually sold (see Darcy &amp; Rogers 2016; Morris 2019).</p><p class=\"zh\">这种对公共租户补贴的概念化，被用来为悉尼海港边 <a class=\"gref\" href=\"#g-millers\">Millers Point</a>、Dawes Point 和 The Rocks 一带公共住房的私有化辩护。时任社会住房部长 Pru Goward 在一份长篇新闻稿中声称，这里的住房“市场租金可达每月约 4000 澳元，纳税人每月补贴其中多达 3700 澳元。Millers Point 一些长期租户在租期内获得的补贴超过 50 万澳元”（Goward, 2014, p. 4）。Goward 由此声称：“Millers Point 每一个受补贴的租约，政府都可以用来帮助 Warrawong 的 5 个租户，或 Newcastle、Minto 的 3.5 个租户”（p. 1）。Goward 在该职位上的继任者 Brad Hazzard 也同样声称：“Millers Point 的出售意味着西悉尼和全州会有更多家庭头上有屋顶、有一个可以称为家的地方”（Godfrey, 2016, p. 18）。这一带最终有 300 多套住房被出售（见 Darcy & Rogers 2016; Morris 2019）。</p></div><div class=\"para\" data-idx=\"64\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"b98bebaebc\"><p class=\"en\">The role of real estate values in the stigmatization of estates undergoing renewal is less explicit than the aforementioned case of Millers Point, Dawes Point and the Rocks, but it is significant nonetheless. Both the NSW Communities Plus renewal program and the Victorian Public Housing Renewal Program are designed to minimize the cost of replacing public housing and deliver ‘value for money’ to state governments by selecting high-value sites where large volumes of private housing can be developed (Capp et al., 2021; Pawson et al., 2022). As such, the aforementioned forms of territorial stigmatization that focus on built environments, populations and tenure are trained upon these sites, and while tenants might not be derided for the ‘subsidy’ they receive in quite the same way as those in Millers Point, the high value of the land their homes occupy mean they are treated as ‘undeserving’ the real estate they inhabit unless they share it with higher income private homeowners or renters.</p><p class=\"zh\">在正在更新的公屋区的污名化中，房地产价值的作用不像上述 Millers Point、Dawes Point 和 The Rocks 的例子那样明显，但同样重要。NSW 的 Communities Plus 更新计划和维多利亚州的公共住房更新计划，都旨在通过选择可以开发大量私人住房的高价值地块，把替换公共住房的成本降到最低，为州政府实现“物有所值”（Capp et al., 2021; Pawson et al., 2022）。因此，前述聚焦建成环境、人口和权属的地域污名化形式，都被瞄准到这些地块上；这些地方的租户也许不会像 Millers Point 的租户那样因所获“补贴”而受到同样的贬斥，但他们住房所占土地的高价值意味着，除非与收入较高的私人房主或租户共享，否则他们会被当作不配住在他们所住的房地产上。</p></div><div class=\"para\" data-idx=\"65\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"a962a6c09d\"><p class=\"en\">Territorial stigmatization is therefore structurally embedded in the neoliberal asset management logics of contemporary public housing policy and governance in Australia. These logics require the constant sorting of properties and tenants into categories of deserving and undeserving in order to make decisions about how to manage scarce resources within housing authorities. Territorial stigma helps legitimize these decisions by problematizing tenants and estates themselves, rather than the policy and political-economic regimes in which they exist. The spatial inequality that deprives western Sydney of good services, amenity and infrastructure is not the fault of public housing tenants in the inner city. Nor are tenants to blame for the shortage of public housing, low quality construction and maintenance, the high and rising costs of private housing and the widening gap between market rents and their own. Yet in fixing blame upon tenants and estates, territorial stigma distracts from the systemic and structural causes of these problems as explicated in section three. Privatization and renewal programs like Communities Plus and the Public Housing Renewal Program thus articulate ‘reputational gaps’—between an estate’s supposedly deficient present and its idealized future (Kallin, 2017)—to facilitate the pursuit of rent gaps in the absence of adequate funding.</p><p class=\"zh\">因此，地域污名化在结构上嵌入了澳大利亚当代公共住房政策与治理的新自由主义资产管理逻辑之中。这些逻辑要求不断把物业和租户分类为应得与不应得，以便住房机构决定如何管理稀缺资源。地域污名通过把租户和公屋区本身、而不是它们所处的政策和政治经济体制问题化，帮助为这些决定提供正当性。让西悉尼缺乏良好服务、设施和基础设施的空间不平等，不是内城公共住房租户的错。公共住房短缺、建造和维护质量低下、私人住房成本高企且不断上涨、市场租金与他们自己的租金差距越来越大，也不能怪租户。然而，地域污名通过把责任钉在租户和公屋区身上，转移了对第三节所阐述的这些问题的系统性和结构性原因的注意。因此，像 Communities Plus 和公共住房更新计划这样的私有化和更新计划，表达出“<a class=\"gref\" href=\"#g-repgap\">声誉差距</a>”——公屋区所谓有缺陷的现在与其被理想化的未来之间的差距（Kallin, 2017）——以便在缺乏充足资金的情况下追逐<a class=\"gref\" href=\"#g-rentgap\">租差</a>（rent gaps）。</p></div><h2 class=\"sec\" data-secidx=\"66\"><span class=\"en\">6. Conclusion</span><span class=\"zh\">6. 结论</span></h2><div class=\"para\" data-idx=\"67\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"6a4074c20b\"><p class=\"en\">Public housing estates in the Global North are highly stigmatized and this is produced in many different ways. My argument in this article is for richly contextualised accounts of the production of territorial stigma rather than universal descriptions, and for examining its production through the conjunction of political-economic and symbolic forces. In Australian cities, public housing has become stigmatised through discourses that draw focus upon incongruous and poorly maintained built environments, populations of concentrated disadvantage, the supposed deficiencies of public management, and the wide and widening gap between tenants’ rental payments and market rents or values, which have together functioned to legitimize estate renewal. At the same time, it has been produced through policies and processes of political-economic restructuring which have persistently and systematically devalued it in relation to private homeownership and, over a period of seventy years or more, created the social and material conditions from which stigmatising discourses have emerged. This is not to say that territorial stigma the inevitable result of disinvestment, residualization and neglect; rather, that it is the result of the production of knowledge and discourse in tandem with processes of physical, social and institutional reconfiguration. Analyses of territorial stigma must approach it as such, placing its symbolic production within the context of political-economic restructuring and policy reform, and its material basis within the discourses which shape perceptions and thus actions with material consequences (see also Larsen &amp; Delica, 2019). This recursive approach is one which I have aimed to demonstrate.</p><p class=\"zh\">全球北方的公屋区被高度污名化，而这种污名以许多不同方式产生。我在本文中主张，对地域污名的生产要给出充分语境化的论述，而不是普遍性的描述，并且要通过政治经济力量与符号力量的结合来考察其生产。在澳大利亚城市，公共住房是通过几类话语而被污名化的，这些话语把焦点放在不协调且维护不佳的建成环境、劣势集中的人口、公共管理的所谓缺陷，以及租户所付租金与市场租金或价值之间巨大且不断扩大的差距上；它们共同起到了为公屋区更新提供正当性的作用。与此同时，污名也是通过政策和政治经济重构过程产生的：在七十年或更长的时间里，这些过程相对于私人自有住房持续而系统地贬低了公共住房，并创造了污名化话语得以出现的社会和物质条件。这并不是说地域污名是撤资、残余化和忽视的必然结果；而是说，它是知识与话语的生产，与物理、社会和制度重构过程相互结合的结果。对地域污名的分析必须如此对待它：把它的符号生产放在政治经济重构和政策改革的语境中，把它的物质基础放在塑造认知、进而塑造具有物质后果之行动的话语中（另见 Larsen & Delica, 2019）。这正是我力图展示的递归式方法。</p></div><div class=\"para\" data-idx=\"68\" data-doc=\"sisson-2024-public-housing-territorial-stigma\" data-nid=\"499f809c39\"><p class=\"en\">Furthermore, such a conceptualization of territorial stigma is necessary in order to challenge the ‘policy schizophrenia’ characteristic of efforts to destigmatize housing estates (Larsen &amp; Delica, 2021). When territorial stigma is conceived as simply ‘ugly’ buildings and concentrated poverty, gentrification comes to be seen as an ‘anti-stigma strategy’ (Kallin, 2017). Alternatively, when territorial stigma is believed to be no more than strategic communication designed to misrepresent places and disguise an unjust intervention as just and fair, real conditions of disinvestment, marginalization and deprivation can be overlooked. Furthermore, it can become all too appealing to pursue projects that aim to challenge these representations with ‘positive narratives’ which, while sometimes important for changing popular opinion and improving community self-perception and morale, are often relatively powerless; at worst they can disempower people subject to stigma and distract from its political and economic causes (Tyler and Slater, 2018). The ‘Sisyphean task’ (Larsen and Delica, 2019) of destigmatizing public housing estates is to connect it to political projects of public investment, decommodification and redistribution, and wider land and housing justice struggles.</p><p class=\"zh\">此外，要挑战去污名化公屋区努力中典型的“政策精神分裂”（Larsen & Delica, 2021），就必须这样概念化地域污名。如果地域污名被简单理解为“丑陋”的建筑和集中的贫困，绅士化就会被看作一种“反污名策略”（Kallin, 2017）。反过来，如果地域污名被认为不过是蓄意歪曲地方、把不公正干预伪装成公正公平的策略性传播，那么撤资、边缘化和匮乏的真实状况就可能被忽视。再者，人们可能会过于热衷于用“正面叙事”去挑战这些表述；这类叙事有时对改变大众看法、改善社区自我认知和士气很重要，但往往相对无力，最坏的情况下还会使受污名者失去力量，并转移对污名政治和经济原因的注意（Tyler and Slater, 2018）。去污名化公屋区这项“西西弗斯式的任务”（Larsen and Delica, 2019），是要把它与公共投资、去商品化和再分配的政治计划，以及更广泛的土地与住房正义斗争联系起来。</p></div>", "toc": [{"idx": 0, "level": "h2", "en": "Abstract", "zh": "摘要"}, {"idx": 2, "level": "h2", "en": "1. Introduction", "zh": "1. 引言"}, {"idx": 6, "level": "h2", "en": "2. Territorial stigma and public housing estates", "zh": "2. 地域污名与公屋区"}, {"idx": 15, "level": "h2", "en": "3. Methodology", "zh": "3. 研究方法"}, {"idx": 18, "level": "h2", "en": "4. Historicizing the stigmatization of public housing in Australia", "zh": "4. 把澳大利亚公共住房的污名化历史化"}, {"idx": 30, "level": "h2", "en": "5. Territorial stigma and the ‘common-sense’ of estate renewal", "zh": "5. 地域污名与公屋区更新的“常识”"}, {"idx": 37, "level": "h3", "en": "5.1. Built environments", "zh": "5.1 建成环境"}, {"idx": 44, "level": "h3", "en": "5.2. Populations", "zh": "5.2 人口"}, {"idx": 54, "level": "h3", "en": "5.3. Tenure", "zh": "5.3 权属"}, {"idx": 61, "level": "h3", "en": "5.4. Real estate", "zh": "5.4 房地产"}, {"idx": 66, "level": "h2", "en": "6. Conclusion", "zh": "6. 结论"}]}, "song-2023-landscape-gentrification-nanjing": {"meta": {"title_en": "Social Space Characteristics, Mechanism and Effect of Urban Landscape Gentrification: A Case Study of Nanjing", "title_zh": "城市景观绅士化社会空间特征、机制与效应——以南京为例", "crumb": "Song et al. 2023 · 南京景观绅士化"}, "html": "<h2 class=\"sec\" data-secidx=\"0\"><span class=\"en\">Abstract</span><span class=\"zh\">摘要</span></h2><div class=\"para\" data-idx=\"1\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"c9ac3e6a33\"><p class=\"en\">Landscape gentrification, a category of gentrification with Chinese characteristics, is driven by green landscape resources, and concerns practical problems including the rational use and fair allocation of natural landscape resources. Based on multi-source heterogeneous data, including urban housing market data and mobile phone user portraits, this study proposes the concept of landscape gentrification and, using a random forest model, classifies Nanjing's residential areas neighbouring important green landscape resources into high-level, moderate-level and low-level landscape gentrified communities. It analyses their characteristics, spatial models and replacement processes, and discusses the driving forces, effects and regulation of landscape gentrification. It finds that residential quarters going through landscape gentrification are usually close to green landscape resources and have high residential grade and high socio-economic status of residents; the public attribute and degree of openness of the landscape resources are closely related to the degree of gentrification of neighbouring communities, and the \"enclosure and exclusive occupation\" and \"corridor separation\" modes more easily induce high-level landscape gentrification; landscape gentrification is driven jointly by supply and demand, and while it shows positive effects it also easily leads to problems such as the inefficient use and \"privatisation\" of landscape resources. An \"open sharing\" spatial development model should be advocated, to avoid excessive landscape gentrification and make the fullest use of the comprehensive benefits of landscape resources.</p><p class=\"zh\">由城市山水资源驱动的<a class=\"gref\" href=\"#g-landscape\">景观绅士化</a>现象是一种具有中国特色的绅士化类型，也是涉及城市自然景观资源合理利用与公平配置的实际问题。在提出景观绅士化概念的基础上，以南京为案例，基于城市住房市场、手机用户画像等多源异构数据，采用<a class=\"gref\" href=\"#g-rf\">随机森林模型</a>，根据绅士化发育程度将城市山水资源周边住宅小区划分为高度、中度和低度景观绅士化社区，分析其特征、空间模式和置换过程，并探讨景观绅士化驱力、效应与调控等问题。研究表明：景观绅士化社区通常紧邻山水资源，住宅档次与居民经济社会地位较高；山水资源的公共属性与开放程度与其周边社区景观绅士化程度密切相关，“封闭独占”和“通道分隔”模式更容易诱发高度景观绅士化现象；景观绅士化由供需两端共同推动，表现出积极效应的同时也容易导致山水资源的低效利用和“私有化”等问题；应倡导“开放共享”的空间开发模式，有效规避过度景观绅士化现象，最大程度发挥山水资源的综合效益。</p></div><div class=\"para\" data-idx=\"2\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"840bf51328\"><p class=\"en\">Keywords: green landscape resources; landscape gentrification; social space; housing price; random forest model; open sharing; spatial planning and regulation</p><p class=\"zh\">关键词：山水资源；景观绅士化；社会空间；房价；随机森林模型；开放共享；空间规划管制</p></div><h2 class=\"sec\" data-secidx=\"3\"><span class=\"en\">Introduction</span><span class=\"zh\">引言</span></h2><div class=\"para\" data-idx=\"4\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"0a65e51bbe\"><p class=\"en\">In the era of \"planetary gentrification\", Lees and colleagues have argued for overturning the stereotype that gentrification is simply alike across the globe and diffuses hierarchically outward from Anglo-American cities, calling instead for attention to the differentiated forms gentrification takes under each country's particular political-economic conditions, and for greater conceptual clarity, so as to better understand this varied and shifting global landscape [1]. In early twenty-first-century European and North American cities undergoing post-industrial transformation, an environmentally driven form of gentrification emerged [2]. After industry moved out and inner cities declined, abandoned factories, railway lines and other vacant land were converted into green space, effectively promoting local economic revival and community regeneration [3]. New capital then drove larger-scale demolition and renewal, sharply raising environmental quality, commercial level and property prices in the surrounding areas. While this brought positive economic, social and ecological benefits, original low-income residents who could not afford the rising cost of living were forced to move out and were replaced by higher-income groups [4], producing an upscale restructuring of social space and the \"green space paradox\"① [5]. Scholars have defined this kind of gentrification, triggered by urban greening or environmental improvement, as ecological gentrification [6], environmental gentrification [7] or green gentrification [8]. It was first documented in cities such as New York, Atlanta, Chicago and Toronto, and then rapidly extended and evolved into a global gentrification phenomenon. Recent Chinese studies of Beijing, Shanghai, Guangzhou and Changchun, for example, have found that large urban parks in Chinese cities produce gentrifying restructuring effects, upgrading the physical landscape and replacing social classes [9-10].</p><p class=\"zh\">“<a class=\"gref\" href=\"#g-planetary\">星球绅士化</a>”（planetary gentrification）时代，Lees 等提出要扭转绅士化现象在全球范围具有简单相似性和由英美城市向外等级式扩散的刻板认知，而要重点关注各国特殊政治经济背景下差异化的绅士化现象，同时增加概念上的清晰度，以更好理解这一纷繁多变的全球化景观［1］。在 21 世纪初欧美后工业化转型的城市中，出现了一种由环境驱动的绅士化现象［2］。工业外迁和内城衰退以后，城市中废弃的工厂、铁路线和其他闲置土地被改造为绿色空间，有效促进了地区经济复兴和社区活力再生［3］，新的资本进入推动更大规模的拆建与更新，使周边地区环境品质、商业层次和房地产价格大幅提升，带来积极经济、社会和生态效益的同时，由于原住低收入群体难以负担不断上涨的生活成本，被迫迁离和被高收入阶层置换［4］，产生社会空间高端化重构和“<a class=\"gref\" href=\"#g-paradox\">绿色空间悖论</a>”①（Green Space Paradox）［5］。此类因城市绿化或生态环境改善催生的绅士化，被学者们定义为生态绅士化（Ecological Gentrification）［6］、“环境绅士化”（Environmental Gentrification）［7］或<a class=\"gref\" href=\"#g-green\">绿色绅士化</a>（Green Gentrification）［8］，并率先在纽约、亚特兰大、芝加哥和多伦多等城市得到验证，随后迅速拓展和演化为一种全球性绅士化现象。例如近年来，国内学者通过对北京、上海、广州和长春等城市的研究发现，我国城市大型公园发挥着促进物质景观升级和社会阶层置换等绅士化重构效应［9-10］。</p></div><div class=\"para\" data-idx=\"5\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"586f4fc2a3\"><p class=\"en\">Footnote ①: Building large green infrastructure on abandoned land is an important part of urban sustainable development plans. The original intention is to benefit residents around the green space, but the result is that rising property prices force original residents, especially vulnerable groups, to move away: this is the \"green space paradox\".</p><p class=\"zh\">脚注①：利用废弃空间建设大型绿色基础设施是城市可持续发展计划的重要组成部分，其初衷是使绿色空间周边居民受益，但结果却是，因房地产价格升高使原住居民特别是弱势群体被迫迁离，即“绿色空间悖论”。</p></div><div class=\"para\" data-idx=\"6\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"d22912378b\"><p class=\"en\">Gentrification oriented toward mountain and water (shanshui) resources within Chinese cities differs in certain respects from the Western gentrification driven by environmental greening. Specifically: (1) Western environmental, green or ecological gentrification usually occurs in economically depressed, environmentally degraded inner-city areas where poverty is concentrated, where brownfields and derelict land are \"green-transformed\" into urban parks and other green infrastructure to attract the middle class back, as with New York's High Line [11]. Chinese cities, by contrast, have not experienced large-scale decline or occupation by low-income groups, and small artificial urban green spaces are not enough to drive class replacement; only the few large park and scenic areas within cities and the natural mountains and waters on their periphery can attract an increasingly affluent middle class that values living environment and landscape quality, thereby driving gentrification. (2) In the West, environmental, green or ecological gentrification has been \"stigmatised\" for causing social inequity and environmental injustice through rising land prices and the displacement of original residents [12]; minority groups have even rejected and protested greening around their communities, fearing that green infrastructure would raise their housing burden and bring in white residents [13]. Chinese cities have no serious ethnic or class conflicts, and social differentiation and residential segregation are far lower than in the West. Apart from the small number of shantytowns occupying prime landscape space within cities that have been demolished and rebuilt through gentrification, gentrification is mostly achieved by building new high-end residential areas on vacant land around peripheral mountains and water bodies. This is a kind of urban spatial development and \"new-build gentrification\", whose negative effects lie mainly in the \"environmental justice\" problems caused by exclusive occupation of the city's prime landscape resources [14].</p><p class=\"zh\">中国城市内部以山水资源为导向的绅士化类型，与西方由环境绿色化改造驱动的绅士化现象存在一定差异。具体体现为：①西方的环境/绿色/生态绅士化通常发生在经济萧条、环境脏乱、贫困集聚的内城区，通过将棕地、废弃地“绿色转型”为城市公园等绿色基础设施（Green Infrastructure）以吸引中产阶层回流，例如纽约的“<a class=\"gref\" href=\"#g-highline\">高线公园</a>”［11］；而中国城市未曾出现大面积衰败和被低收入群体占据的情况，人为修造的小型城市绿地并不足以驱动阶层置换，唯有城中少量的大型公园景区和外围的天然山水资源，才能吸引日益富裕且注重居住环境与景观质量的中产阶层集聚，从而推动绅士化的发生。②西方环境/绿色/生态绅士化过程中因地价上涨和原住居民“<a class=\"gref\" href=\"#g-displacement\">失所</a>”（Displacement），导致社会不公平和环境非正义而被“污名化”［12］，少数族裔群体甚至因惧怕绿色基础设施建设可能带来的住房负担增加和白人群体迁入，而拒绝和抗议社区周边的绿色化改造行为［13］；中国城市内部不存在严重的族裔或阶层间矛盾，社会分化与居住隔离程度亦远不及西方，除城市内部少量占据优质景观空间的棚户区被拆迁与绅士化重建以外，更多是通过在城市外围山体、水体周边空地新建高端住宅区的形式实现绅士化过程，这属于城市空间开发和“<a class=\"gref\" href=\"#g-newbuild\">新建绅士化</a>”的一种，其负面效应主要体现在对城市优质山水景观资源的排他性占有导致的“<a class=\"gref\" href=\"#g-ej\">环境正义</a>”问题［14］。</p></div><div class=\"para\" data-idx=\"7\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"9d51dd1f3c\"><p class=\"en\">On this basis, this paper proposes the concept of landscape gentrification with Chinese characteristics: the phenomenon in which groups of higher socio-economic status, in pursuit of a high-quality natural-landscape living environment, occupy areas beside mountains and water, displacing or excluding groups of lower socio-economic status. To depict this type of gentrification driven by urban shanshui resources, the paper takes Nanjing's main city as the case area, selects and constructs identification indicators of landscape gentrification suited to Chinese conditions, and uses big data on the urban housing market and mobile phone user portraits to quantitatively evaluate the degree of gentrification around Nanjing's large landscape resources. It examines the community attributes, spatial models, replacement processes and supply–demand driving mechanisms of landscape gentrification, aiming to analyse the phenomenon in depth, propose countermeasures to mitigate its negative effects, and provide a reference for the efficient and sustainable use of the city's scarce natural landscape resources.</p><p class=\"zh\">基于此，本文提出具有中国本土特色的景观绅士化（Landscape Gentrification）概念，即城市中具有较高经济社会地位群体，为追求高品质自然景观居住环境而占据依山傍水地区，置换或排斥较低经济社会地位群体的现象。为描刻此种由城市山水资源驱动的绅士化类型，本文以南京主城为案例区，通过遴选、构建符合中国实际的景观绅士化辨识指标，采用城市住房市场和手机用户画像等大数据，量化评测南京大型山水景观资源周边的绅士化发育程度，探究景观绅士化社区属性、空间模式、置换过程与供需驱动机制，以期深度解析景观绅士化现象，提出缓解景观绅士化负面效应的对策建议，为促进城市稀缺自然山水景观资源的高效、永续利用提供一定参考借鉴。</p></div><h2 class=\"sec\" data-secidx=\"8\"><span class=\"en\">1 Data and Methods</span><span class=\"zh\">1 数据与方法</span></h2><h3 class=\"sec\" data-secidx=\"9\"><span class=\"en\">1.1 Study area and data sources</span><span class=\"zh\">1.1 研究区概况与数据来源</span></h3><div class=\"para\" data-idx=\"10\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"2f70646482\"><p class=\"en\">Nanjing lies in the Yangtze River Delta, is economically developed and densely populated, and is known for the integration of \"mountains, water, city and forest\". The city contains Zijin Mountain, Xuanwu Lake and the Qinhuai River; on its periphery lie Laoshan, Qixia, Mufu, Jiangjun, Niushou and Fang mountains; and the Yangtze runs through the city, dividing the main city into the Jiangnan and Jiangbei areas. Between 2000 and 2020 Nanjing's resident population surged from 5.45 million to 9.31 million, and its urbanisation rate rose to 86.8%. With large-scale inner renewal and outward expansion, the areas around urban shanshui resources became hotspots for real-estate development and upgraded housing, making Nanjing an excellent case for examining landscape gentrification. As shown in Fig. 1, the study area is Nanjing's main city (to highlight the research theme, the Ring Expressway is used as the boundary for the Jiangbei and Jiangning areas, and Laoshan, Jiangjun and Niushou mountains are included). Within it, 61 landscape resources each larger than 50,000 m² (5 ha) were selected, including large urban parks and natural mountains and water bodies; for rivers, mainly the Yangtze and the Qinhuai (including the Jiajiang, the inner and outer Qinhuai and the moat).</p><p class=\"zh\">南京地处长三角，经济发达，人口密集，素有“山水城林一体”之称，城中有紫金山、玄武湖、秦淮河，外围有老山、栖霞山、幕府山、将军山、牛首山、方山等自然山体，长江穿城而过，将主城划分为江南、江北两个片区。2020 年，南京市常住人口由 2000 年的 545 万猛增至 931 万，城镇化率提升至 86.8%。伴随大规模的城市内部更新与向外拓展，城市山水资源周边成为房地产开发与改善型居住的热点地带，也使南京成为深入探讨景观绅士化及相关问题的绝佳案例地。如图 1 所示，本文以南京主城区为研究范围（为突出研究主题，江北地区和江宁地区选取绕城高速为边界，将老山、将军山和牛首山纳入研究区），遴选出区域内单体面积大于 50000 m²（5 hm²）的山水景观资源共计 61 个，包括城市大型公园绿地和自然山体水体，河流主要选取长江与秦淮河（包括夹江、内外秦淮河与护城河）。</p></div><div class=\"para\" data-idx=\"11\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"f8c35a1743\"><p class=\"en\">To identify landscape-gentrified spaces and their degree, the study takes residential quarters near landscape resources as its objects and builds a socio-spatial attribute database with the residential quarter (xiaoqu) as the basic unit. Community attributes such as each quarter's location, boundaries, year of construction, green-space ratio and price per unit area (2020 average) come from Amap (amap.com) and the China Real Estate Price Platform (creprice.cn). Group-structure attributes such as residents' age, occupation, household composition and consumption level come from mobile phone user-portrait data on a 152 m × 152 m grid, collected in November 2020 by the Getui (getui.com) big-data platform of Daily Interactive. The platform holds accumulated push-service data from 110,000 apps including Baidu Maps, Didi, JD.com and China UnionPay, with mobile terminal coverage above 95%, and can effectively collect the LBS data called by multiple apps, ensuring collection frequency and accuracy. By training models on long-term data about users' workplaces and residences, offline behaviour and scene preferences, and online app types and habits, it derives social attributes such as age group, gender, occupation, consumption level and household assets.</p><p class=\"zh\">为辨识景观绅士化空间及其程度，以靠近山水景观资源的居住小区为研究对象，构建以小区为基本单元的社会空间属性数据库。其中住宅小区的空间位置、四至边界、建成年代、绿化率和单位面积价格（2020 年均价）等社区属性数据，来源于高德地图（amap.com）和中国房价行情平台（creprice.cn）。小区居民年龄、职业、家庭构成、消费水平等群体结构属性数据，来源于每日互动“个推”（getui.com）大数据智能服务平台于 2020 年 11 月采集的 152 m×152 m 网格单元<a class=\"gref\" href=\"#g-portrait\">手机用户画像</a>数据。该平台掌握着包括百度地图、滴滴出行、京东、中国银联等 11 万个 App 的推送服务数据积累，移动终端覆盖率超过 95%，能够有效采集多个 App 调用的 LBS 数据，从而保证数据采集频率和精度，进而通过长期学习手机用户工作地和居住地、线下行为与场景偏好、线上 App 使用类型和习惯等数据进行模型训练，获取用户年龄段、性别、职业、消费水平和家庭资产等群体社会属性。</p></div><h3 class=\"sec\" data-secidx=\"12\"><span class=\"en\">1.2 Research design and analytical method</span><span class=\"zh\">1.2 研究设计与分析方法</span></h3><div class=\"para\" data-idx=\"13\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"04af26f516\"><p class=\"en\">Western studies generally use buffer zones around green space or census tracts as spatial units, and quantitatively evaluate the degree of gentrification by measuring the relative level and change of composite indicators such as housing prices, the share of white residents, the share of highly educated people and high-income households, and the number of high-end consumption venues [15-17]. Quantitative gentrification research in China is still exploratory. Given the complexity of urban socio-spatial differentiation and its influencing factors, large aggregate units such as buffers or census tracts make it hard to exclude the influence of factors such as school districts, transport location and public services. This paper therefore uses the residential quarter as the spatial unit and selects the 1,267 quarters near shanshui resources (where landscape gentrification may occur) as evaluation objects, quantitatively measuring and comparing their socio-spatial attributes to judge whether landscape gentrification has occurred around the shanshui resources.</p><p class=\"zh\">西方普遍以绿地周边缓冲区或人口普查区为空间单元，通过测度住房价格、白人比例、高学历人口和高收入家庭比例，以及高消费场所数量等综合指标的相对高低及其变化，量化评价某地区的绅士化程度［15-17］。国内的定量绅士化研究尚处于探索阶段，考虑到城市社会空间分异及其影响因素的复杂性，采用缓冲区或人口普查区等大尺度空间汇总单元，难以剔除诸如学区、交通区位和公共服务等因素的影响，故本文以居住小区为空间单元，选择邻近山水资源（有可能发生景观绅士化）的 1267 个居住小区为评价对象，通过量化测度与比较其社会空间属性特征，判断山水资源周边是否发生了景观绅士化。</p></div><div class=\"para\" data-idx=\"14\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"3da19baab6\"><p class=\"en\">In selecting evaluation indicators: first, proximity to shanshui landscape is the basic condition of a landscape-gentrified community, because landscape housing is scarce and expensive, and the higher the grade of the landscape resource and the closer the housing is to it, the more pronounced the price spillover effect [18-19]; second, landscape gentrifiers generally have higher socio-economic status, and while pursuing ecological and landscape quality outside the community, they also have high requirements for private green space and environmental quality inside it [20]. The paper therefore selects seven indicators across three dimensions of each quarter (landscape, price and group attributes): landscape distance, community environment, housing price, premium level, occupation type, consumption level and household assets (Table 1), and uses a random forest model to determine each quarter's degree of landscape gentrification.</p><p class=\"zh\">在评价指标的选取上，首先，邻近山水景观是景观绅士化社区的基本条件，因景观型住宅具有稀缺性，房价较高，而且越是高等级的山水资源和越接近山水景观的住宅，其房价溢出效应越明显［18-19］；其次，景观绅士化群体一般具备较高的经济社会地位，他们在追求社区外部生态与景观质量的同时，对于社区内部的私有绿地和环境品质同样具有较高的要求［20］。因此，本文从居住小区的景观属性、房价属性和群体属性 3 个方面分别选取景观距离、社区环境、住宅价格、溢价程度、职业类型、消费水平和家庭资产 7 个<a class=\"gref\" href=\"#g-indicators\">特征指标</a>（表 1），采用随机森林模型（Random forest）判定居住小区的景观绅士化程度。</p></div><div class=\"para\" data-idx=\"15\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"0add022a30\"><p class=\"en\">Table 1 (identification factors and descriptions): Landscape attributes — landscape distance (walking distance from the quarter's nearest entrance to the landscape resource, m); community environment (green-space ratio: quarter green area / site area, %). Price attributes — housing price (average annual listing price per unit area, yuan/m²); premium level (relative price advantage: ratio of the quarter's price to the average price within 500 m, %). Group attributes — occu
