pation type (share of white-collar groups, from mobile location combined with online and offline behaviour, %); consumption level (share of high-consumption groups, equivalent to monthly income above 20,000 yuan, based on consumption habits, %); household assets (share of groups owning a house and a car: the sum of the shares owning private housing and owning a private car, %). Data sources: China Real Estate Price Platform; Getui big-data platform; Amap; OSM (openstreetmap.org).</p><p class=\"zh\">表 1 南京景观绅士化特征指标及描述：景观属性——景观距离（邻近景观程度，m；小区最近出入口到山水资源的步行距离）、社区环境（居住小区绿化率，%；小区绿化面积与占地面积之比）；房价属性——住宅价格（单位面积均价，元/m²；小区住宅单位面积年度挂牌均价）、溢价程度（房价相对优势度，%；小区房价与周边 500 m 范围平均房价之比）；群体属性——职业类型（白领职业群体占比，%；根据手机定位结合线上线下行为特征）、消费水平（高消费群体占比，%；根据消费习惯，相当于月收入 2 万元以上）、家庭资产（有房有车群体占比，%；拥有私有住房与拥有私家车群体比例之和）。数据来源：中国房价行情平台；“个推”大数据平台；高德地图；OSM（openstreetmap.org）。</p></div><div class=\"para\" data-idx=\"16\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"2c20fc9a21\"><p class=\"en\">The random forest model is a popular supervised machine-learning algorithm in recent years. It runs efficiently, adapts well to datasets and is highly accurate; it handles both continuous and discrete values, processes high-dimensional data directly, and detects interactions among features while identifying key features. Its principle is to randomly select training samples and feature parameters from all samples for classification: samples are drawn with replacement from the training set to form sample sets, each weak classifier is a CART decision tree, and the final result is decided by the vote or average of all trees, giving the overall model high accuracy. This paper runs the random forest model on the residential quarters' feature indicators to accurately identify landscape-gentrified communities of different degrees among all quarter samples.</p><p class=\"zh\">随机森林模型是近年来热门的监督机器学习算法，具有运行高效、对数据集适应能力强、准确率高等特点，既能处理连续值也能处理离散值，可直接处理高维数据，检测特征间的相互关系并识别关键特征要素。其原理是在全部样本中随机选择训练样本和特征参数用于分类，在训练样本中有放回地随机抽取样本组成样本集，每一个弱分类器即为 CART 决策树，最终结果由每棵决策树结果投票或取均值，使得整体模型的结果具有较高的精确度。本文针对居住小区的特征指标开展随机森林模型运算，用以在所有小区样本中精准识别不同发育程度的景观绅士化社区。</p></div><div class=\"para\" data-idx=\"17\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"3020dcf7c2\"><p class=\"en\">The study uses the random forest classification algorithm in ArcGIS Pro; the procedure is shown in Fig. 2. First, using expert consultation, five experts from institutions including Nanjing University, the Nanjing Academy of Urban Planning and Design and the \"I Love My Home\" real-estate agency were invited. After the concept of landscape gentrification was explained to them, each freely selected, from the 1,267 quarters, a number of quarters they considered to show typical, partial or no landscape-gentrification features, classed as high, moderate and low (i.e. none) landscape-gentrified quarters. After integrating and de-duplicating the results and removing outliers following field surveys, 100 quarters were obtained as training samples (30 high, 41 moderate, 29 low). The landscape-gentrification type of each quarter (high, moderate, low) was then taken as the dependent variable and the seven feature indicators as independent variables, and entered into the random forest model for training. Quarters were classified while trying different model parameters (such as number of iterations, number of trees and the proportion of validation samples), and classification accuracy was observed under each. After comparison, overall classification accuracy was highest (91.7%) with 400 trees, 100 iterations and a 36% validation share. Finally, the classification results were returned to the experts for a further round of consultation to obtain optimised results.</p><p class=\"zh\">本文采用 ArcGIS Pro 中的随机森林分类算法，具体流程如图 2 所示。首先采用专家咨询法，邀请包括来自南京大学、南京城市规划设计研究院、“爱我家”房产中介等机构的 5 位领域内专家，在向其阐释景观绅士化概念内涵的前提下，请专家从 1267 个居住小区中自由选取各自认为符合典型景观绅士化特征、部分具备景观绅士化特征和不具有景观绅士化特征的居住小区若干，区分为高度、中度和低度（即未发生）景观绅士化小区，通过对咨询结果的整合去重与实地踏勘后的排异剔除，获取 100 个小区作为训练样本（高度 30 个、中度 41 个、低度 29 个）。然后将小区的景观绅士化类型（高度、中度、低度）作为因变量，小区的 7 个特征指标作为自变量，导入随机森林模型进行样本特征训练，通过尝试不同的模型参数（如迭代次数、决策树数量和验证样本比例等）将居住小区进行分类，并观测不同参数下的分类精度；通过比选，当决策树数量为 400，迭代次数为 100，验证样本比例为 36% 时，模型总体分类精度达到最高（91.7%）。最后将此分类结果反馈给专家再度咨询，得到进一步优化结果。</p></div><h2 class=\"sec\" data-secidx=\"18\"><span class=\"en\">2 Socio-spatial Characteristics of Landscape Gentrification in Nanjing</span><span class=\"zh\">2 南京景观绅士化社会空间特征</span></h2><h3 class=\"sec\" data-secidx=\"19\"><span class=\"en\">2.1 Identification results</span><span class=\"zh\">2.1 景观绅士化甄别结果</span></h3><div class=\"para\" data-idx=\"20\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"78a3134715\"><p class=\"en\">The spatial identification results for Nanjing's landscape-gentrified communities are shown in Fig. 3. In number, there are 132 high (10.42%), 516 moderate (40.73%) and 619 low (48.85%) landscape-gentrified communities: quarters with typical landscape-gentrification features make up only about one tenth, and the great majority show little landscape gentrification. Spatially, highly gentrified quarters are concentrated at the foot of Zijin, Laoshan and Jiangjun mountains and along the inner Qinhuai River, Yueya Lake and Baijia Lake, with others scattered around other landscape resources. By community type, highly gentrified quarters are mainly relatively upmarket gated communities, among which villa estates with high green ratios, low floor-area ratios, high prices and large unit sizes make up a high proportion.</p><p class=\"zh\">南京景观绅士化社区空间识别结果如图 3。从数量规模上看，高度、中度和低度景观绅士化社区分别为 132 个（10.42%）、516 个（40.73%）和 619 个（48.85%），即具有典型景观绅士化特征的居住小区仅占 1/10 左右，而绝大多数小区的景观绅士化程度不高。从空间分布上看，高度景观绅士化居住小区主要集中于紫金山、老山、将军山脚下和内秦淮河、月牙湖和百家湖畔等地，以及零星散落在其他山水资源周边。从社区类型上看，高度绅士化居住小区主要是较为高档的<a class=\"gref\" href=\"#g-gated\">封闭社区</a>，其中具有高绿化率、低容积率、高房价和大面积等特征的别墅住宅区占有较高比例。</p></div><div class=\"para\" data-idx=\"21\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"c6544deb35\"><p class=\"en\">Comparing the characteristics of high, moderate and low landscape-gentrified communities at the level of the residential quarter① (Table 2), the study finds: (1) highly gentrified communities are close to shanshui resources, at an average minimum distance of 66 m, and more than a third are immediately adjacent to the landscape or even embedded inside the mountain, such as the Dihao International Garden and Deji Zijin Villa within Zijin Mountain, and villa estates such as Pearl Spring No. 9, Ziran Tiancheng and Greenland Rose Garden within Laoshan; (2) high price is another marked feature: the average unit price of housing in highly gentrified quarters reaches 44,000 yuan/m², 1.5 times that of low-gentrified communities, and on average more than 1.33 times the price of surrounding housing, a clear premium effect; (3) matching their upmarket housing, residents of highly gentrified communities have relatively higher socio-economic status: the shares of \"white-collar\", \"high-consumption\" and \"house-and-car-owning\" groups are all much higher than in low-gentrified communities.</p><p class=\"zh\">基于居住小区的角度，通过对高、中、低不同程度景观绅士化社区的特征比较后发现①（表 2）：①高度景观绅士化社区靠近山水资源，平均最短距离为 66 m，其中超过 1/3 的小区紧邻山水景观甚至嵌入山体内部，例如紫金山中的帝豪国际花园和德基紫金山庄，以及老山中的珍珠泉 9 号、自然天成和绿地玫瑰园等别墅区；②高房价是景观绅士化住宅的另一显著特征，高度绅士化居住区住宅的单位面积均价达到 4.4 万元/m²，是低度绅士化社区的 1.5 倍，而且高度绅士化住宅价格平均在周边社区住宅价格的 1.33 倍以上，溢价效应明显；③与高档次的住宅相匹配，居住在高度绅士化社区中的居民具有相对更高的社会经济地位，如社区“白领职业群体”“高消费群体”和“有房有车群体”占比均大幅高于低度绅士化社区。</p></div><div class=\"para\" data-idx=\"22\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"7f37f82a7f\"><p class=\"en\">Footnote ①: To highlight the influence of landscape on residential quarters and reduce interference from other important locational factors such as education and transport, \"school-district housing\" (within the catchments of the top 10 public primary and junior secondary schools) and \"metro housing\" (within a 5-minute walk of the nearest metro entrance) were excluded from the statistics.</p><p class=\"zh\">脚注①：为突出山水景观要素对居住小区的影响，降低教育、交通等其他重要区位因素的干扰，统计中剔除了“<a class=\"gref\" href=\"#g-xuequ\">学区房</a>”（位于排名前 10 公办小学、初中学区内）和“地铁房”（距离最近地铁口步行 5 min 范围内）。</p></div><h3 class=\"sec\" data-secidx=\"23\"><span class=\"en\">2.2 Spatial models of landscape gentrification</span><span class=\"zh\">2.2 景观绅士化空间模式</span></h3><div class=\"para\" data-idx=\"24\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"636bbb5f44\"><p class=\"en\">In terms of the spatial relationship between shanshui resources and landscape-gentrified communities, varying degrees of landscape gentrification can occur around both the large, culturally rich and well-known landscapes of the urban core and the smaller, less famous blue-green spaces of the periphery (Fig. 3). Observation shows that the degree of landscape gentrification around a resource has no clear or fixed relationship with the resource's location, scale, fame or importance; rather, it is closely related to the resource's public attribute or degree of openness. That is, landscape gentrification is unlikely around resources with good publicness and openness, such as Xuanwu Lake; whereas around resources where housing is built against the mountain and beside the water, restricting others' access, or even cutting up shorelines and embedding into mountains through exclusive development, marked and clustered landscape gentrification is more likely, as at Baijia Lake and Jiangjun Mountain. It can therefore be judged that the open or enclosed character of urban shanshui resources is associated with the degree of landscape gentrification of surrounding quarters. According to the scale of public space between quarters and landscape resources, the paper divides the ways urban shanshui resources are developed and used into three models: \"enclosure and exclusive occupation\" (public space 0 m), \"corridor separation\" (public space roughly 10–50 m wide) and \"open sharing\" (public space on average more than 100 m wide).</p><p class=\"zh\">从山水资源与景观绅士化社区的空间关系上看，不管是城市核心区具有深厚文化底蕴和较高知名度的大型山水，还是城市外围规模较小、知名度不高的蓝绿空间，其周边均可能存在不同程度的景观绅士化现象（图 3）。通过观察发现，山水资源周边景观绅士化发育程度，与山水资源的区位、规模、知名度和重要性等属性，并不存在明显的关联或固定的规律，而是与山水资源的公共属性或开放程度存在较为密切关联。即是说，具有良好公共性和开放性的山水资源周边，不容易出现景观绅士化现象，如玄武湖；而采取住宅区依山傍水而建，限制他人进入，甚至通过切割水体岸线、嵌入山体空间等排他性开发方式的山水资源周边，更容易产生显著且集聚的景观绅士化现象，如百家湖和将军山。由此判断，城市山水资源空间开放/封闭属性与其周边居住小区景观绅士化程度之间存在关联。根据居住小区与山水资源之间的公共空间尺度特征，本文将城市山水资源空间开发利用方式划分为“<a class=\"gref\" href=\"#g-modes\">封闭独占</a>”（公共空间为 0 m）、“通道分隔”（公共空间宽度约为 10～50 m）和“开放共享”（公共空间宽度平均在 100 m 以上）3 种模式。</p></div><div class=\"para\" data-idx=\"25\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"5c4110b54d\"><p class=\"en\">(1) Enclosure and exclusive occupation. In this model natural mountains and water are tightly joined to residential quarters with no public corridor between them; private housing in the form of gated communities cuts up and occupies waterfront shorelines or mountain green space. Because housing that monopolises shanshui resources is scarce and positioned as high-quality, it more easily produces high prices and attracts high-income groups, giving rise to high-level landscape gentrification and the privatisation of urban shanshui resources and public space. Taking Baijia Lake and Jiangjun Mountain as examples (Fig. 4), several villa estates of high and moderate gentrification are distributed along the west bank of Baijia Lake (Fig. 4a) and the eastern foot of Jiangjun Mountain (Fig. 4b), blocking residents outside the communities from approaching the mountain and water.</p><p class=\"zh\">①封闭独占模式。该模式下自然山水与居住小区紧密相连，两者间缺乏公共廊道，私人住宅以封闭社区的形式切割占据滨水岸线或山体绿地。由于独占山水资源住宅的稀缺性和高品质定位，更容易产生高房价和吸引高收入群体，催生高度景观绅士化现象，并造成城市山水资源和公共空间的私有化。以百家湖和将军山为例，如图 4 所示，百家湖西畔（图 4a）与将军山东麓（图 4b）分布有多个高、中绅士化程度的别墅住宅区，阻隔社区外部居民近山亲水。</p></div><div class=\"para\" data-idx=\"26\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"4d6adfd20e\"><p class=\"en\">(2) Corridor separation. Here the landscape and the residential quarters are separated by city roads or pedestrian paths: residents can reach the shanshui resources, but there is not enough public space. This model safeguards the public attribute of the resources and ordinary citizens' accessibility, while keeping nearby housing close to them, but the insufficient supply of public space reduces the resources' attractiveness and reach. Along the Qinhuai River and Yueya Lake (Fig. 5), for example, in the urban renewal campaign launched at the end of the twentieth century, many dilapidated traditional waterside houses were demolished and rebuilt as modern residential quarters, and upmarket estates with prime location and landscape became typical landscape-gentrified communities.</p><p class=\"zh\">②通道分隔模式。指山水景观与居住小区之间通过城市道路或人行步道进行分隔，城市居民可以接触到山水资源，但缺乏足够的公共空间。该模式保障了城市山水资源的公共属性和普通市民的可进入性，也使周边住宅区足够亲近山水资源，但由于公共空间供给不足，降低了山水资源的吸引力和影响范围。如秦淮河与月牙湖沿岸（图 5），在 20 世纪末启动的城市更新改造运动中，大量传统临水而建的破旧民房被推倒重建为现代化的住宅小区，拥有优质区位和景观的高档住宅区成为典型的景观绅士化社区。</p></div><div class=\"para\" data-idx=\"27\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"346460d1aa\"><p class=\"en\">(3) Open sharing. This model respects the public attribute and comprehensive value of shanshui resources: with natural mountains and water at its core, it retains or expands ample green public open space around them, better protecting ecological space and providing residents with comfortable places for leisure. Under this model residents can share shanshui resources relatively fairly, preventing prime landscape space from being privately occupied by a small affluent group, so clusters of highly gentrified communities are unlikely to appear. At Xuanwu Lake and Jiulong Lake, for example, only Jinling Imperial Garden at the south-east corner of Xuanwu Lake, right on the lakeshore, is a highly gentrified community (Fig. 6a); and Jiulong Lake, not far from Jiangjun Mountain and Baijia Lake, abandoned the enclosed, exclusive development model of those two, so that only the Jiulong Lake Villas at its north-west corner is highly gentrified (Fig. 6b).</p><p class=\"zh\">③开放共享模式。此模式尊重山水资源的公共属性与综合价值，以自然山水为核心，外围保留或拓展充足的绿色公共开敞空间，更好保护山水生态空间并为居民提供舒适的休闲游憩场所。该模式下城市居民可以相对公平地共享山水资源，避免了优质景观空间被少量富裕群体私占，因此不易出现高度绅士化社区集聚的现象。以玄武湖和九龙湖为例，玄武湖边唯有东南角紧邻湖面的金陵御花园呈现为高度绅士化社区（图 6a）；而距将军山与百家湖不远的九龙湖，因摒弃了前两者封闭独占式的开发模式，周边仅有西北角的九龙湖别墅为高度景观绅士化社区（图 6b）。</p></div><div class=\"para\" data-idx=\"28\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"ad84e99cf7\"><p class=\"en\">The comparison of these models confirms that as the spatial development model of urban shanshui resources moves from enclosed to open, the degree of landscape gentrification of surrounding communities moves from strong to weak. Enclosing and monopolising shanshui landscape is a spatial-resource development model adopted by local governments in pursuit of short-term economic returns, and the resulting clusters of highly gentrified communities may bring problems such as inefficient use of scarce urban resources, weakened ecological functions of the landscape, intensified residential differentiation and environmental justice [21]. Therefore, from the perspective of tapping and amplifying the comprehensive benefits of urban shanshui resources to the fullest, developing and using them through the open-sharing model can extend the service radius of natural landscape resources, increase the long-term returns of surrounding land management, ease the socio-spatial polarisation of the city, and avoid the unequal allocation of natural resources and social inequity caused by excessive landscape gentrification.</p><p class=\"zh\">通过上述景观绅士化模式的比较，证实随着城市山水资源空间开发模式由封闭到开放，其周边社区景观绅士化程度则由强到弱。封闭独占山水景观是地方政府追求短期经济效益采取的空间资源开发模式，由此产生的高度景观绅士化社区集聚现象，可能带来城市稀缺资源低效利用、景观生态功能弱化、<a class=\"gref\" href=\"#g-fenyi\">居住分异</a>加剧和环境正义等问题［21］。因此，从最大限度挖潜、放大城市山水资源综合效益的角度考虑，采用开放共享模式开发利用城市山水资源，能够扩大自然景观资源的服务辐射范围，增加周边土地经营的长期收益，还可以缓解城市社会空间分异极化现象，规避过度景观绅士化导致的自然资源配置不均衡和社会不公平问题。</p></div><h3 class=\"sec\" data-secidx=\"29\"><span class=\"en\">2.3 Replacement process of landscape gentrification</span><span class=\"zh\">2.3 景观绅士化置换过程</span></h3><div class=\"para\" data-idx=\"30\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"a27e259d73\"><p class=\"en\">Spatial upgrading and replacement is an important marker of the gentrification process [22]. Taking the highly gentrified communities as examples, to examine the type and timing of their spatial replacement, replacement is roughly divided into three types — shantytown redevelopment, urban renewal and reconstruction, and development of unused land (including redevelopment of rural construction land) — and three periods: before 2000, 2001–2010 and 2011–2020. As shown in Fig. 7, of the 132 highly gentrified communities, 33 came from shantytown demolition and redevelopment and 36 from urban renewal and reconstruction, together 52.27% of the total, located mainly on both banks of the inner Qinhuai River in the core of the main city; 63 were newly built on unused land, of which nearly 70% (44) are in the periphery of the main city. In time, fewer than 10% (13) arose before 2000, all on the waterfront of the main-city core; those arising in 2001–2010 and 2011–2020 account for 50.76% (67) and 39.39% (52) respectively, with a relatively balanced spatial distribution.</p><p class=\"zh\">空间升级置换是绅士化过程的重要标识［22］。以高度景观绅士化社区为例，为考察其空间置换类型与发生时间，将绅士化社区空间置换大致区分为城市棚户区改造、城市更新与重建、未利用土地开发（包括农村建设用地再开发）3 种类型，发生时间上划分为 2000 年以前、2001—2010 年、2011—2020 年 3 个阶段。如图 7 所示，在 132 个高度景观绅士化社区中，由棚户区拆迁改造和城市更新重建而来的社区分别为 33 和 36 个，合占总数的 52.27%，空间上主要位于主城核心区内秦淮河两岸，而在未利用土地上开发新建的社区为 63 个，其中近七成（44 个）位于主城外围地区。时间上产生于 2000 年以前的景观绅士化社区不足 10%（13 个），且均分布在主城核心区滨水地带，发生在 2001—2010 和 2011—2020 年的绅士化案例分别占 50.76%（67 个）和 39.39%（52 个），空间分布上相对较为均衡。</p></div><div class=\"para\" data-idx=\"31\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"2b4c5980d7\"><p class=\"en\">In terms of spatial model (Fig. 8), most highly gentrified communities are of the corridor-separation type (60.61%), open sharing accounts for only 2.27%, and enclosure and exclusive occupation is as high as 37.12%. Compared with landscape-gentrified communities in the main-city core produced through shantytown redevelopment or urban renewal and reconstruction, those newly built on unused or rural land in the periphery more often adopt the enclosed, exclusive model (Fig. 8a). Corridor separation dominates in every period, but the share of enclosed, exclusive communities reached 44.8% in 2001–2010, significantly higher than in the periods before and after (Fig. 8b).</p><p class=\"zh\">从图 8 空间模式上看，高度绅士化社区中通道分隔式居多（60.61%），开放共享模式仅占 2.27%，而封闭独占式社区高达 37.12%；相对主城核心区通过棚改或城市更新与重建的景观绅士化社区，主城外围地区在未利用土地或农村土地上新建的绅士化社区，更多采取封闭独占式的空间模式（图 8a）；不同阶段均以通道分隔式绅士化社区为主，其中 2001—2010 年封闭独占式社区占比高达 44.8%，显著高于其前后 2 个时期（图 8b）。</p></div><div class=\"para\" data-idx=\"32\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"f75a8e4772\"><p class=\"en\">Overall, landscape-gentrified communities can be produced either through redevelopment or through new building on vacant land, and since the market reform of housing, residential areas built under the corridor-separation and enclosure models have more easily become highly gentrified communities. Of course, whether urban landscape gentrification occurs depends not only on the spatial development models of shanshui resources and residential communities; behind it lie relatively complex driving mechanisms and multiple after-effects. Only by probing the drivers and effects of landscape gentrification in depth can effective means and measures be proposed to scientifically guide the rational use of urban shanshui resources and the benign development of landscape gentrification.</p><p class=\"zh\">综合判断，通过改造重建或空地新建方式均可产生景观绅士化社区，而<a class=\"gref\" href=\"#g-housingreform\">住房市场化改革</a>后，采用通道分隔与封闭独占模式建设的居住区，更容易成为高度绅士化社区。当然，城市景观绅士化现象的发生不仅取决于山水资源和居住社区的空间开发建设模式，其背后更隐匿着相对复杂的驱动机制和多重后效，惟有对景观绅士化驱力和效应的深度探究，方能提出科学引导城市山水资源合理利用和景观绅士化良性发展的有效手段与措施。</p></div><h2 class=\"sec\" data-secidx=\"33\"><span class=\"en\">3 Supply–Demand Mechanisms and Positive and Negative Effects of Landscape Gentrification</span><span class=\"zh\">3 景观绅士化的供需机制与正负效应</span></h2><h3 class=\"sec\" data-secidx=\"34\"><span class=\"en\">3.1 Mechanisms of spatial production and consumption</span><span class=\"zh\">3.1 空间生产与消费机制</span></h3><div class=\"para\" data-idx=\"35\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"820e76f598\"><p class=\"en\">Gentrification in Europe and North America was initially seen as driven by middle-class lifestyles and residential preferences [23]. Neil Smith then proposed the well-known \"rent gap\" theory, stressing that macroeconomic factors on the supply side are the core driver of gentrification [24]. Although the demand-side camp represented by David Ley criticised Smith's economic determinism for seriously neglecting the socio-cultural characteristics and active consumption demands of gentrifiers [25], with the neoliberal global turn, the practice of more and more countries shows that government, capital and the market are the main driving forces of gentrification [26]. Particularly in the Chinese context of public land ownership and new-build gentrification as the dominant model, strong government intervention and market mechanisms have greater explanatory power for urban landscape gentrification than the cultural preferences and consumption drive of the affluent urban middle class [27].</p><p class=\"zh\">欧美绅士化现象最初被认为是中产阶层生活方式和居住偏好驱动的结果［23］。<a class=\"gref\" href=\"#g-smith\">Neil Smith</a> 则提出著名的“<a class=\"gref\" href=\"#g-rentgap\">租差</a>”（Rent Gap）理论，强调供给端的宏观经济因素才是发生绅士化的核心驱力［24］。尽管以 <a class=\"gref\" href=\"#g-ley\">David Ley</a> 为代表的需求端阵营批评 Smith 的经济决定论严重忽视绅士化群体的社会文化特征与能动消费需求［25］，但伴随新自由主义全球化转型，越来越多国家的实践表明，政府、资本和市场是绅士化进程的主要驱动力量［26］。特别是在中国土地公有制和以新建绅士化为主导模式的语境下，相对于城市富裕中产阶层的文化偏好与消费驱力［27］，强有力的政府干预与市场化机制对于城市景观绅士化现象更具解释力。</p></div><div class=\"para\" data-idx=\"36\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"f9a0ad617d\"><p class=\"en\">First, from the supply-side perspective of local government urban management and the production of space: the high dependence of city governments on land finance is an undisputed fact, and because the areas around shanshui landscapes are beautiful and scarce, they have become huge \"activatable capital\" that local governments are keen to manage, and an effective tool for the \"growth coalition\" of government, developers and financial institutions to pursue capital appreciation [28-29]. In rapid urbanisation and urban renewal, city governments — to boost the urban economy, improve spatial quality, upgrade the living environment and expand urban space — create conditions for developing landscape space by consolidating land rights, demolition and resettlement, and land transfer, and (re)produce the spaces around shanshui resources once occupied by industrial enterprises and low-end housing, or left unused, as high-end landscape residential areas that cater to the housing demands and tastes of affluent groups. In terms of rent-gap theory, shanshui resources can generate a \"green rent gap\" [30]; spaces adjoining important landscapes that are occupied by low-end functions or unused have especially large rent gaps, more readily attracting local governments to renew and develop them and stimulating real-estate capital's enthusiasm for investment, thereby driving landscape gentrification. For example, during Nanjing's shantytown redevelopment (2008–2020), many shantytowns in landscape locations along the Yangtze, beside the Qinhuai and at the foot of Mufu Mountain were among the first to be demolished and rebuilt as modern residential or commercial areas [31].</p><p class=\"zh\">首先，从供给端的地方政府城市经营与空间生产视角解读。城市政府对<a class=\"gref\" href=\"#g-landfinance\">土地财政</a>的高依赖度已经是不争的事实，而山水景观周边地区因环境优美和资源稀缺等特点，成为地方政府热衷经营的巨大“可活化资本”，以及政府、开发商和金融机构“<a class=\"gref\" href=\"#g-growth\">增长联盟</a>”追逐资本增值的有效工具［28-29］。在快速城市化和城市更新过程中，城市政府出于拉动城市经济、提升空间品质、改善居住环境和拓展城市空间等目的，通过整理土地权属、拆迁安置和土地出让等手段为山水景观空间开发创造条件，将山水景观资源周边原本被工业企业和低端住房占据的空间或未利用土地，空间（再）生产为迎合富裕群体居住需求和生活品位的高端景观型住宅区。基于“租差理论”理解，山水资源可以产生“<a class=\"gref\" href=\"#g-greenrentgap\">绿色租差</a>”（Green rent gap）［30］，特别是毗邻重要山水景观，被低端功能占据或未被利用的空间，其“租差”较大，更容易吸引地方政府更新改造和开发建设以及激发房地产资本的投资热情，由此推动景观绅士化的发生。例如在南京城市棚户区改造（2008—2020 年）过程中，大量位于长江边、秦淮河畔、幕府山脚下等景观地段的棚户区较早被推倒重建为现代化住宅区或商业区［31］。</p></div><div class=\"para\" data-idx=\"37\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"d233643c9e\"><p class=\"en\">Second, from the demand side of affluent groups' landscape consumption and market bid-rent: entering the period of ecological civilisation construction and the building of a moderately prosperous society in all respects, urban residents increasingly value living environment and quality of life. Affluent and middle-class households in particular have enormous demand for shanshui landscape housing that combines urban convenience with living comfort, becoming the consumption-side driver of landscape gentrification. Under the principle of market allocation of housing, the prices of scenic and scarce \"landscape homes\" keep climbing, turning them into sought-after \"luxury goods\" that quickly attract large numbers of high-income groups to cluster in landscape communities beside mountains and water [32]. As Ley and others emphasised the importance of gentrifiers' cultural demands and consumption tastes from the perspective of post-industrial urban transformation [33], superior shanshui landscape and community environment better meet the needs and tastes of middle-aged households of higher socio-economic status, which in turn stimulates local governments and developers to produce and supply landscape housing, and, through publicity and marketing, to continually induce and implant the status symbolism and class connotations of landscape community housing. As a result, large numbers of landscape-gentrified communities with distinct locational features and class (sub)cultural attributes have formed around urban shanshui resources.</p><p class=\"zh\">其次，从需求端的富裕群体景观消费与市场竞租层面理解。进入<a class=\"gref\" href=\"#g-shengtai\">生态文明建设和全面小康</a>时期，城市居民日益重视居住环境与生活品质，特别是富裕和中产家庭，对于兼具城市便利性和生活舒适性的山水景观型住宅产生巨大需求，成为景观绅士化消费端的驱动力量。在住房市场化配置原则下，风景宜人、数量稀缺的“景观房”价格不断攀高，变为炙手可热、竞相追逐的“奢侈品”，并迅速吸引大批高收入群体聚居于依山傍水的景观型社区［32］。正如 Ley 等基于后工业社会城市转型角度强调绅士化群体文化需求和消费品味的重要性［33］，优越的山水景观与社区环境，更能满足城市中具有较高经济社会地位中年家庭的需求与品味，亦刺激着地方政府与开发商空间生产供给景观型住宅，并通过宣传营销不断诱导与植入景观型社区住宅的身份象征与阶层意涵，从而在城市山水资源周边形成大量具有鲜明空间区位特征和阶层（亚）文化属性的景观绅士化社区。</p></div><h3 class=\"sec\" data-secidx=\"38\"><span class=\"en\">3.2 Effects of spatial appreciation and exclusion</span><span class=\"zh\">3.2 空间增值与排挤效应</span></h3><div class=\"para\" data-idx=\"39\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"7b81f8326e\"><p class=\"en\">As a phenomenon of \"upscale\" socio-spatial replacement and restructuring, gentrification's social effects are highly contested. Supporters, usually out of concern for urban management and regional development, stress that gentrification helps increase fiscal revenue and ease local decline, so that local government, gentrifiers and local residents can all benefit; critics generally stand with the groups displaced in the process, arguing that the \"displacement\" of original residents harms their interests and causes class division and social injustice [34]. As for landscape gentrification, related Western gentrification concepts have been steeped in critique since their birth, whereas urban landscape gentrification in China has not produced social contradictions and conflicts as serious as in the West and shows mostly positive economic and social effects; but because of inappropriate resource allocation and spatial development models, the process of landscape gentrification also contains socio-spatial problems that deserve attention and vigilance.</p><p class=\"zh\">绅士化作为一种城市社会空间“高级化”置换与重构现象，其社会效应极富争议。支持者通常出于城市经营与区域发展的考虑，强调绅士化有利于增加财政收入和缓解地区衰退，地方政府、绅士化群体（Gentrifiers）和地区居民皆可受益；批评者则普遍站在绅士化过程中被置换群体的立场，认为原住居民的“流离失所”使其利益受损，并造成阶层分化与社会不公等后果［34］。就景观绅士化而言，国外相关绅士化概念自诞生之日起即饱含批判性，而中国城市景观绅士化并未出现类似西方较为严重的社会矛盾与冲突，更多呈现出的是积极的经济与社会效应，但因不恰当的资源配置方式和空间开发模式，景观绅士化过程中同样存在一些值得关注和警惕的社会空间问题。</p></div><div class=\"para\" data-idx=\"40\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"8c1b4e5f3d\"><p class=\"en\">The positive effects of landscape gentrification lie mainly in the following. (1) Raising land value. European and North American research shows that green space positively affects property values [35]; this paper also confirms that housing prices and their growth in landscape-gentrified communities are significantly higher than in non-landscape communities with similar locational conditions, while also pulling up surrounding land and housing prices. By closing the \"rent gap\", the value of land is fully tapped, commerce and consumption are upgraded, and local fiscal revenue and the regional economy are boosted through multiple channels — as in the Yueya Lake area, which became Nanjing's first \"rich district\" after the commodification reform of housing. (2) Improving the urban landscape. By clearing and replacing abandoned \"brownfields\" or dilapidated neighbourhoods in the city's shanshui areas, landscape gentrification greatly improves the physical landscape and liveability of communities, expands space for social interaction, can even effectively reduce crime [36], and highlights the landscape value of shanshui resources, improving the city's overall image — as in the area along the Qinhuai River, successfully transformed into an \"urban scenic belt\" through environmental improvement and urban renewal. (3) Expanding urban space. People's desire for shanshui landscape makes peripheral shanshui resources important spatial engines of urban expansion. With shanshui resources at its core and housing development as its vanguard, landscape gentrification's ring-like expansion from inside out and its extension from residential to other functions are an effective tool and typical model for driving peripheral development — as with Xianlin Lake, a \"green core\" driving the development of a new town on the outskirts.</p><p class=\"zh\">从景观绅士化的积极效应来看，主要表现为以下方面：①提升土地价值。欧美相关研究表明绿色空间对于房地产价值具有积极影响［35］，本文亦证实景观绅士化社区房价及其增速显著高于相似区位条件下的非景观社区，同时拉动周边地价与房价上涨，通过弥合“租差”充分挖潜土地价值亦带动商业和消费升级，多渠道增加地方财税收入与繁荣地区经济，例如住房商品化改革后最早成为南京“富人区”的月牙湖地区。②改善城市景观。景观绅士化过程通过清除和置换城市内部山水地带的废弃“棕地”或破败邻里，极大改善社区物质景观与宜居环境，扩大了社会交往空间，甚至可以有效降低犯罪率［36］，凸显山水资源的景观价值进而提升城市整体形象面貌，例如通过环境整治与城市更新成功蜕变为“城市风光带”的沿秦淮河地区。③拓展城市空间。人们对山水景观的渴望使城市外围的山水资源成为城市拓展的重要空间引擎。景观绅士化以山水资源为核心、住宅开发为先导，由内向外的圈层式拓展和由居住向其他职能的延伸，是推动城市外围开发建设的有效工具与典型模式，如作为“绿核”带动城市远郊新城开发的仙林湖。</p></div><div class=\"para\" data-idx=\"41\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"5073cf553c\"><p class=\"en\">The negative effects of landscape gentrification are mainly the privatisation of urban shanshui resources and the resulting problem of \"spatial displacement\". Because of the high land and housing prices around shanshui resources, landscape-gentrified communities are spaces \"conquered\" by capital: only groups holding substantial economic or power capital can occupy prime landscape space. Worse still, the enclosed, exclusive landscape-gentrified communities around Baijia Lake and Jiangjun Mountain, seeking exclusive views, turn shanshui resources that should be public space into \"private territory\", producing the \"club-isation\" of landscape resources and the degradation of their social function. As Western scholars have criticised, gentrification under the logic of capital keeps raising the cost for vulnerable groups of sharing green space, so that prime landscape resources ultimately become \"enclaves\" of a privileged few [37] — a process of \"green grabbing\" [38] and \"resource appropriation\" [39]. Chinese scholars have also argued that market mechanisms for allocating landscape resources and the gentrification process have produced differences among groups in access to parks and green space in large cities such as Shanghai and Nanjing, and environmental inequality caused by \"displacement\" [20, 40]. This \"displacement\" exists at least: (1) for lower-income original residents who cannot afford the rebuilt commodity housing and are forced to move away — direct \"spatial displacement\" — or who suffer indirect \"cultural displacement\" when neighbourhood relations change and emotional ties are damaged [41]; (2) for potential buyers who aspire to landscape housing, for whom continually rising prices make purchase ever harder; especially within metropolises where shanshui resources are scarce, landscape housing gradually becomes the exclusive commodity of affluent groups, and most residents face \"exclusionary displacement\" because of affordability [42]; (3) for all urban residents and outsiders, landscape gentrification may produce spatial exclusion beyond the community scale — especially gentrified communities that cut up shorelines or are built hard against mountains, which objectively encroach on or even deprive residents outside the community of the right to approach the city's shanshui resources, producing city-scale spatial segregation and group displacement in a broad sense.</p><p class=\"zh\">从景观绅士化的消极影响来看，突出体现为城市山水资源的私有化和由此导致的“空间失所”问题。由于山水资源周边的高地价和高房价，景观绅士化社区是一种被资本“征服”的空间，唯有掌握较多经济或权力资本的群体才能占有优质的景观空间。更有甚者如百家湖和将军山周边封闭独占式的景观绅士化社区，为追求独享景观而将本属于公共空间的山水资源转变为“私人领地”，造成景观资源的“<a class=\"gref\" href=\"#g-club\">空间俱乐部化</a>”与社会功能退化。正如西方学者所批评的，资本逻辑下的绅士化不断增加弱势群体分享绿色空间的成本，优质景观资源最终沦为少数特权阶层的“飞地”［37］，成为一种“<a class=\"gref\" href=\"#g-grab\">绿色掠夺</a>”（Green Grabbing）［38］和“资源侵占”（Resource Appropriation）［39］过程。国内学者亦提出，景观资源配置的市场化机制与绅士化过程，造成上海、南京等大城市公园绿地可达性的群体间差异和由于“失所”带来的环境不平等现象［20，40］。这种“失所”至少存在于：①对于较低收入的原住居民，因难以负担重建后的商品住宅而被迫迁离，即直接的“空间失所”，或因社区邻里关系改变和情感破坏而造成间接的“<a class=\"gref\" href=\"#g-cultural\">文化失所</a>”（Cultural Displacement）［41］；②对于渴望居住在景观型住宅的潜在消费者，持续攀升的房价不断增加其购房难度，特别是山水资源稀缺的大都市内部，景观住宅逐渐成为富裕群体的专属商品，大部分城市居民则因经济负担能力问题而面临“<a class=\"gref\" href=\"#g-exclusive\">排斥性失所</a>”（Exclusive Displacement）［42］；③对于所有城市居民和外来群体而言，景观绅士化有可能产生超越社区尺度的空间排斥效应，尤其是切割岸线或紧贴山体而建的绅士化社区，客观上侵占甚至剥夺了社区外居民亲近城市山水资源的权利，由此造成城市尺度的空间隔离和广义范畴的群体失所。</p></div><h2 class=\"sec\" data-secidx=\"42\"><span class=\"en\">4 Spatial Planning and Regulation Proposals Based on Optimal Benefits</span><span class=\"zh\">4 基于效益最优的空间规划管制建议</span></h2><div class=\"para\" data-idx=\"43\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"9906ab856f\"><p class=\"en\">Rational development of urban natural resources and the intensive, efficient use of spatial resources are important elements of territorial spatial planning. Mountains and water bodies are important scarce spatial resources within cities: they not only raise land-use value and urban economic competitiveness but also improve the urban ecological environment and microclimate, and provide places for leisure, sport and sightseeing, helping promote social interaction and integration and raise residents' well-being, bringing comprehensive economic, ecological, social and cultural benefits. Article 9 of the Constitution of the People's Republic of China provides that mineral resources, waters, forests, mountains, grasslands, unreclaimed land, beaches and other natural resources are owned by the state, that is, by the whole people, and that the appropriation or destruction of natural resources by any organisation or individual by whatever means is prohibited. It follows that urban shanshui resources are a \"pure public good\" with the characteristics of equality, sharedness, non-rivalry and non-excludability, and should be jointly owned and shared by all. Under the \"public trust doctrine\" for natural resources, the government, entrusted by all the people, is obliged to manage urban shanshui resources, should maintain their public use and may not dispose of them on the market at will, and should above all avoid exclusive use. In reality, however, city governments' shanshui-resource management philosophy of pursuing short-term economic returns has produced large numbers of enclosed-exclusive and corridor-separated landscape-gentrified communities. This mode of development and use not only fails to fully reflect the public attribute of urban shanshui resources but even \"privatises\" a public good, seriously affecting the comprehensive benefits of shanshui resources (Fig. 9); it is in fact an inefficient use of the city's prime spatial resources [21].</p><p class=\"zh\">合理开发城市自然资源，实现空间资源集约高效利用，是国土空间规划的重要内涵。山体、水体是城市内部重要的稀缺空间资源，不但能提高土地利用价值和城市经济竞争力，还能改善城市生态环境和微气候条件，更为人们提供休闲运动与观光游憩场所，有利于促进社会交往融合与提升居民幸福感，发挥着经济、生态、社会和文化等综合效益。《中华人民共和国宪法》第九条规定：矿藏、水流、森林、山岭、草原、荒地、滩涂等自然资源，都属于国家所有，即全民所有；禁止任何组织或者个人用任何手段侵占或者破坏自然资源。由此判断，城市山水资源是一种具有平等性、共享性、非竞争性和非排他性特征的“<a class=\"gref\" href=\"#g-publicgood\">纯公共物品</a>”，理应由全民共有共享。根据自然资源的“<a class=\"gref\" href=\"#g-trust\">公共信托原则</a>”，政府受全体人民的委托义务性管理城市山水资源，应维护其公共用途并不可随意市场化处置，特别要避免排他性的使用。但现实中，城市政府追逐短期经济效益的山水资源经营理念，使城市中出现大量封闭独占式和通道分隔式的景观绅士化社区，这种开发利用模式非但未能充分体现城市山水资源的公共属性，甚至将公共物品“私有化”，严重影响山水资源综合效益的发挥（图 9），实则是对城市优质空间资源的低效利用［21］。</p></div><div class=\"para\" data-idx=\"44\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"1bd29dd2d7\"><p class=\"en\">In response to the social problems brought by green gentrification, European and North American scholars have argued that green space should not be used as a tool of real-estate development and that the rights of vulnerable groups and green environmental justice should be safeguarded [30], and have proposed \"anti-gentrification\" strategies such as providing affordable housing for low-income groups, collective resistance to the influx of gentrifiers, dispersing small green spaces, and \"just green enough\" greening [43]. Although Chinese urban landscape gentrification also involves low-income residents being displaced and replaced, unlike in Europe and North America the construction of large urban green infrastructure is widely welcomed, and the problem that truly needs solving is the privatised appropriation of natural shanshui resources. To this end, with the goals of maximising the comprehensive benefits of shanshui resources and reducing the negative effects of landscape gentrification, the paper proposes spatial control measures for the development and use of large urban natural shanshui resources. First, the public attribute of shanshui resources should be established and protected: for example, modelled on spatial controls such as the urban blue line and green line, an \"urban white line\" [21] management regime should be set in territorial spatial planning, designating a certain range around shanshui resources as public space where buildings for private use are prohibited, to prevent shanshui resources from being carved up and \"enclosed\" by upmarket gated communities and degraded into the \"private property\" of gentrifiers. Second, for enclosed-exclusive landscape-gentrified residential areas, administrative or economic interventions such as mandatory wall setbacks, opening landscape walkways, encouraging the opening of residential quarters and moderately raising property tax are recommended, to add public spaces such as citizen passages between gated quarters and shanshui resources wherever possible so that more residents can share them. Finally, long-term urban management strategies and planning philosophies should be cultivated: grading shanshui resources by importance, encouraging developers to set back and provide public open space through floor-area-ratio bonuses or lower tax rates, while bringing in citizens to supervise the fairness of the government's allocation of spatial resources, exploring a balance among government, market and society to achieve a win-win of economic efficiency, social equity and spatial justice in the use of urban shanshui resources [21].</p><p class=\"zh\">欧美学者针对绿色绅士化带来的社会问题，提出不应将绿色空间作为房地产开发工具，而应保障弱势群体权利和绿色环境正义［30］，并建议为低收入群体提供可支付住房、集体抵抗绅士化群体侵入、分散布局小规模绿色空间和“<a class=\"gref\" href=\"#g-jge\">适可而止的绿化</a>”（Just Green Enough）等“反绅士化”（Anti-gentrification）策略［43］。中国城市景观绅士化过程中尽管也存在低收入居民被置换取代的现象，但与欧美不同，城市大型绿色基础设施的建设受到广泛欢迎，真正亟待解决的是自然山水资源被私有化侵占的问题。为此，以山水资源综合效益最大化和减少景观绅士化消极作用为目标，提出城市大型自然山水资源开发利用的空间管控措施：首先，应确立和保护山水资源的公共属性，例如仿效城市蓝线、绿线等空间管控措施，在国土空间规划中制定“<a class=\"gref\" href=\"#g-whiteline\">城市白线</a>”［21］管理办法，即划定山水资源周边一定范围为公共空间，禁止建造私人用途建筑，避免山水资源被高档封闭社区切割“圈地”和退化为绅士化群体的“私产”。其次，针对“封闭独占”式的景观绅士化居住区，建议采用强制围墙退让、开辟景观步道、鼓励小区开放、适度提高房产税等行政或经济干预手段，尽量在封闭住宅小区与山水景观资源之间增设市民通道等公共空间，让更多城市居民能够共享山水景观资源。最后，应培育长效城市经营策略和规划理念，将山水资源根据重要程度分等定级，通过奖励容积率或降低税率鼓励开发商退让和提供公共开敞空间，同时发挥市民力量监督政府空间资源配置的公平性，探索政府、市场、社会三者制衡实现城市山水资源利用经济效益、社会公平和空间正义的共赢［21］。</p></div><h2 class=\"sec\" data-secidx=\"45\"><span class=\"en\">5 Conclusion and Discussion</span><span class=\"zh\">5 结论与讨论</span></h2><div class=\"para\" data-idx=\"46\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"a54e3dfcf8\"><p class=\"en\">Taking gentrification driven by urban blue-green space as its object, and on the basis of comparing similar Chinese and Western gentrification phenomena, this paper proposes the concept of \"landscape gentrification\", which better reflects the orientation toward large shanshui resources within Chinese cities. Through systematic analysis of the spatial identification, multidimensional characteristics, typical models, driving mechanisms and comprehensive effects of landscape gentrification in Nanjing, it reaches the following main conclusions: (1) typical landscape-gentrified communities are limited in number but widely distributed, and are generally adjacent to shanshui resources, with high community quality, housing prices and residents' socio-economic status; (2) landscape gentrification does not necessarily occur around shanshui resources; besides landscape quality and location, whether it occurs depends more on the public attribute and openness of the resources, and enclosed, exclusive development more easily induces high-level landscape gentrification; (3) landscape gentrification is driven jointly by the growth coalition on the supply side and affluent classes on the demand side; while affirming its inevitability and reasonableness, one must also guard against the negative effects of the \"privatisation\" of shanshui resources and \"excessive\" landscape gentrification; (4) the public-good attribute of urban shanshui resources should be clarified and emphasised, an open-sharing model of spatial development advocated, and planning policy instruments such as the \"urban white line\" used to guide the scientific development and sustainable use of shanshui resources.</p><p class=\"zh\">本文以城市蓝绿空间驱动的绅士化类型为研究对象，在比较中西方类似绅士化现象的基础上，提出更能体现中国城市内部大型山水资源导向特征的“景观绅士化”概念。通过对南京景观绅士化空间甄别、多维特征、典型模式、驱动机制与综合效应的系统分析，得出主要结论如下：①典型景观绅士化社区数量有限但分布广泛，一般具有紧邻山水资源，社区品质、住宅价格与居民社会经济地位较高等特点；②山水资源周边并非必然出现景观绅士化，除景观质量和区位条件等因素外，是否发生景观绅士化更多取决于山水资源的公共属性与开放程度，封闭独占式的资源开发模式更容易诱发高度景观绅士化现象；③景观绅士化过程由供需两端的增长联盟和富裕阶层共同推动，在肯定其必然性与合理性的同时，亦要警惕山水资源“私有化”和“过度”景观绅士化带来的负面效应；④应明确和强调城市山水资源的公共物品属性，倡导开放共享式的空间开发模式，采用“城市白线”等规划政策手段引导山水资源的科学开发与永续利用。</p></div><div class=\"para\" data-idx=\"47\" data-doc=\"song-2023-landscape-gentrification-nanjing\" data-nid=\"d7d31261e5\"><p class=\"en\">It must be acknowledged that landscape gentrification is only one type of residential gentrification in Chinese cities today, favoured and driven mainly by middle-class households pursuing a high-quality living environment. The diversification of urban households' housing needs and preferences has given rise to diverse forms of gentrification. For example, under the urban \"school district\" system and the East Asian cultural emphasis on education, more and more young middle-class families are voluntarily giving up prime landscape locations and moving into run-down \"school-district housing\" in the old city, and the resulting \"school-district gentrification\" also has distinctly Chinese characteristics. The era of planetary gentrification requires gentrification research to de-centre Europe and North America and to emphasise the indigenous problems of different countries and regions. After 20 years, Chinese gentrification research has become increasingly systematic, and exploring gentrification phenomena with local characteristics has become a current focus. The concept of landscape gentrification proposed here can enrich and complete the \"family\" of Chinese gentrification research and facilitate international exchange, dialogue and comparison. This paper has analysed the overall socio-spatial characteristics of landscape gentrification mainly at the scale of the residential quarter; future work needs to combine socio-spatial big data with small data such as questionnaires and interviews to explore in depth the typical models and communities of landscape gentrification, the main stakeholder groups, after-effect evaluation and policy responses, deepening understanding of the gentrifying restructuring of Chinese urban space and its social governance in the new era, and providing decision-making references for building people-centred, fair and shared park cities and people's cities.</p><p class=\"zh\">必须承认，景观绅士化仅是当下中国城市居住绅士化中的一种类型，更多受追求高品质居住环境的中产阶层家庭的青睐和推动。城市家庭居住需求和偏好的多元分化，催生了多样化的绅士化现象，比如城市“学区”制度和东方“重教”文化背景下，越来越多的年轻中产阶层家庭主动放弃优质景观地段，选择并迁居至城市老城区破旧的“学区房”，由此带来的“学区绅士化”现象亦具有鲜明的中国特色。星球绅士化时代要求绅士化研究去欧美中心化，强调不同国家或地区本土化的原生性问题。中国绅士化研究历经 20 年已日臻系统化，发掘探索具有本土化特征的绅士化现象成为当前热点方向。本文景观绅士化的提出可以丰富和完善中国绅士化研究“家族”序列，有利于开展相关领域的国际交流、对话与比较。本文重点从居住小区尺度分析了景观绅士化的总体社会空间特征，未来还需结合社会空间大数据与问卷访谈等小数据，针对景观绅士化的典型模式与社区、各主要利益相关群体、后效评估及政策应对等方面展开深度探讨，深化对新时期中国城市空间绅士化重构及其社会治理等问题的理解，为推进以人为本、公平共享的<a class=\"gref\" href=\"#g-renmin\">公园城市和人民城市</a>建设提供决策参考。</p></div>", "toc": [{"idx": 0, "level": "h2", "en": "Abstract", "zh": "摘要"}, {"idx": 3, "level": "h2", "en": "Introduction", "zh": "引言"}, {"idx": 8, "level": "h2", "en": "1 Data and Methods", "zh": "1 数据与方法"}, {"idx": 9, "level": "h3", "en": "1.1 Study area and data sources", "zh": "1.1 研究区概况与数据来源"}, {"idx": 12, "level": "h3", "en": "1.2 Research design and analytical method", "zh": "1.2 研究设计与分析方法"}, {"idx": 18, "level": "h2", "en": "2 Socio-spatial Characteristics of Landscape Gentrification in Nanjing", "zh": "2 南京景观绅士化社会空间特征"}, {"idx": 19, "level": "h3", "en": "2.1 Identification results", "zh": "2.1 景观绅士化甄别结果"}, {"idx": 23, "level": "h3", "en": "2.2 Spatial models of landscape gentrification", "zh": "2.2 景观绅士化空间模式"}, {"idx": 29, "level": "h3", "en": "2.3 Replacement process of landscape gentrification", "zh": "2.3 景观绅士化置换过程"}, {"idx": 33, "level": "h2", "en": "3 Supply–Demand Mechanisms and Positive and Negative Effects of Landscape Gentrification", "zh": "3 景观绅士化的供需机制与正负效应"}, {"idx": 34, "level": "h3", "en": "3.1 Mechanisms of spatial production and consumption", "zh": "3.1 空间生产与消费机制"}, {"idx": 38, "level": "h3", "en": "3.2 Effects of spatial appreciation and exclusion", "zh": "3.2 空间增值与排挤效应"}, {"idx": 42, "level": "h2", "en": "4 Spatial Planning and Regulation Proposals Based on Optimal Benefits", "zh": "4 基于效益最优的空间规划管制建议"}, {"idx": 45, "level": "h2", "en": "5 Conclusion and Discussion", "zh": "5 结论与讨论"}]}, "urban-studies-reading-guide": {"meta": {"title_en": "Urban Studies Reading Guide", "title_zh": "Urban Studies 读物总览", "crumb": "Reading Guide · 四单元读物总览"}, "html": "<h2 class=\"sec\" data-secidx=\"0\"><span class=\"en\">Unit 1 · Introduction · 13.1 · Where urban studies came from, and what \"the urban\" is</span><span class=\"zh\">第一单元 · Introduction · 13.1 · 学科起源与\"什么是城市\"</span></h2><div class=\"para\" data-idx=\"1\" data-doc=\"urban-studies-reading-guide\" data-nid=\"494f5b953f\"><p class=\"en\">This unit had no assigned journal readings. The lecture slides draw on founding urban theorists to sketch how the discipline emerged and how different schools defined \"the urban\". Slides: Lectures-20260706/introduction.pdf. Bilingual notes on Simmel, Wirth, Sennett and Ilmonen are in Research-Strategy/Draft-*.md.</p><p class=\"zh\">这个单元没有布置期刊阅读，讲义里穿插引用了几位城市理论奠基人物，勾勒城市研究这门学科怎么来、\"the urban\"怎么被不同学派定义。讲义：<span>Lectures-20260706/introduction.pdf</span>。Simmel、Wirth、Sennett、Ilmonen 另有双语课程笔记，在 <span>Research-Strategy/Draft-*.md</span>。</p></div><h3 class=\"sec\" data-secidx=\"2\"><span class=\"en\">0.0 · From the slides — Origins and schools of thought</span><span class=\"zh\">0.0 · 讲义原文梳理 · 学科起源与几大流派</span></h3><div class=\"para\" data-idx=\"3\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2c1902062d\"><p class=\"en\">Engels (1844): The Condition of the Working-Class in England: the miserable conditions of the industrial city (life expectancy 26 years) prompted the first impulse to study cities, responding through mapping and action, together with an anti-urban bias.</p><p class=\"zh\"><strong>Engels (1844)</strong>：《英国工人阶级状况》：工业城市的悲惨条件（平均寿命 26 岁）促成最早的城市研究冲动，通过制图和行动回应城市问题，也伴随一种\"反城市偏见\"（anti-urban bias）。</p></div><div class=\"para\" data-idx=\"4\" data-doc=\"urban-studies-reading-guide\" data-nid=\"7d01f96989\"><p class=\"en\">Chicago School (from the 1920s): Urban development is driven by competition for space and the choices of individuals; defined the American city as unequal and segregated.</p><p class=\"zh\"><strong>芝加哥学派（1920s 起）</strong>：城市发展由<b>空间竞争与个体选择</b>驱动，把美国城市定义为不平等、隔离的。</p></div><div class=\"para\" data-idx=\"5\" data-doc=\"urban-studies-reading-guide\" data-nid=\"f5c1416fdf\"><p class=\"en\">1970s political-economy critique: Competition and individual choice are not characteristics of \"the city\" but of a specific city, the capitalist city. The Chicago School naturalized the unequal city, which suited the political elite. Spatial inequality comes from the politics of the state and city, the power of landowners and the profit-seeking of developers.</p><p class=\"zh\"><strong>1970 年代政治经济学批评</strong>：竞争和个人选择不是\"城市\"的特征，而是\"资本主义城市\"的特征；芝加哥学派把不平等的城市<b>\"自然化\"</b>了，客观上服务于政治精英。空间不平等来自<b>国家与城市的政治、地主的权力、开发商的逐利</b>。</p></div><div class=\"para\" data-idx=\"6\" data-doc=\"urban-studies-reading-guide\" data-nid=\"52b74aea26\"><p class=\"en\">Los Angeles School: A separate slide listing urban form: fragmented, polycentric, decentralized, multi-ethnic, controlled, fortified.</p><p class=\"zh\"><strong>洛杉矶学派</strong>：讲义单独一页，只列城市形态特征：碎片化（fragmented）、多中心（polycentric）、去中心化（decentralized）、多族裔（multi-ethnic）、受控（controlled）、堡垒化（fortified）。</p></div><div class=\"para\" data-idx=\"7\" data-doc=\"urban-studies-reading-guide\" data-nid=\"e8bc22f335\"><p class=\"en\">Weber (1921): The European city as a unique social and political entity: the market, its own laws, autonomy, an association of urban residents. Contrasted with Asian cities.</p><p class=\"zh\"><strong>Weber (1921)</strong>：欧洲城市是独特的社会政治实体：市场、自身的法律、自治、市民的某种联合体，用以与亚洲城市对照。</p></div><div class=\"para\" data-idx=\"8\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2c3c1a1ecb\"><p class=\"en\">Sassen (1991): Global cities such as New York, London and Tokyo become hubs that manage, coordinate and drive globalization, and are also sites of deep inequality and social transformation.</p><p class=\"zh\"><strong>Sassen (1991)</strong>：纽约、伦敦、东京等<b>全球城市</b>成为管理、协调、驱动全球化的枢纽，同时也是深刻不平等与社会转型的场所。</p></div><div class=\"para\" data-idx=\"9\" data-doc=\"urban-studies-reading-guide\" data-nid=\"24fc393d5a\"><p class=\"en\">Brenner &amp; Schmid (2021): Planetary urbanism: urbanization is a global process driven by capitalism, neoliberalism and globalization, occurring at urban and rural scales. It is a \"terrain of struggle\" over land, housing, environmental justice and access to basic services, so the agency of social groups matters.</p><p class=\"zh\"><strong>Brenner & Schmid (2021)</strong>：<b>星球城市化</b>：城市化是由资本主义、新自由主义、全球化驱动的全球过程，发生在城乡各种尺度上；城市化是围绕土地、住房、环境正义、基本服务准入的\"terrain of struggle\"，要理解各社会群体的能动性。</p></div><div class=\"para\" data-idx=\"10\" data-doc=\"urban-studies-reading-guide\" data-nid=\"bfa62780d0\"><p class=\"en\">Correction An earlier version attributed the \"state, landowners, developers\" passage to the Los Angeles School. In the slides these are two separate pages and are now listed separately.</p><p class=\"zh\"><b>更正</b>早先版本把\"国家、地主、开发商\"那段 1970 年代批评归给了洛杉矶学派。讲义里两者是分开的两页，现已拆开。</p></div><h3 class=\"sec\" data-secidx=\"11\"><span class=\"en\">0.0b · Beyond the slides — The Los Angeles School and the Chicago model it answers</span><span class=\"zh\">0.0b · 讲义外补充 · 洛杉矶学派，以及它回应的芝加哥模型</span></h3><div class=\"para\" data-idx=\"12\" data-doc=\"urban-studies-reading-guide\" data-nid=\"d9a1e58584\"><p class=\"en\">[Note] The slides list only six words for the Los Angeles School. This section adds background from the literature; it is not slide content. Check the original works before citing.</p><p class=\"zh\"><strong>【说明】</strong>讲义对洛杉矶学派只列了六个词。这一节是根据相关文献补充的背景，不是讲义原文，写进论文前请核对原著。</p></div><div class=\"para\" data-idx=\"13\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ccc97d29af\"><p class=\"en\">[Who] In the 1980s–90s a group of scholars working in Los Angeles (UCLA, USC) argued that the Chicago School model no longer fitted, and that Los Angeles showed what the contemporary city looks like. Key works: Edward Soja, Postmodern Geographies (1989); Mike Davis, City of Quartz (1990), especially the chapter \"Fortress L.A.\"; Michael Dear &amp; Steven Flusty, \"Postmodern urbanism\", Annals of the AAG 88(1) (1998); Michael Dear (ed.), From Chicago to L.A. (2002).</p><p class=\"zh\"><strong>【是谁】</strong>1980–90 年代，一批在洛杉矶（UCLA、USC）工作的学者提出：芝加哥学派的城市模型已经不适用，洛杉矶才代表当代城市的样子。代表著作：Edward Soja《Postmodern Geographies》（1989）；Mike Davis《City of Quartz》（1990），尤其是\"Fortress L.A.\"一章；Michael Dear &amp; Steven Flusty《Postmodern urbanism》，<em>Annals of the AAG</em> 88(1)（1998）；Michael Dear（编）《From Chicago to L.A.》（2002）。</p></div><div class=\"para\" data-idx=\"15\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ef3e934b6f\"><p class=\"en\">[Chicago model] Burgess pictured the city growing outward from one centre in rings: the Loop (CBD), a zone in transition where new immigrants and the poor first settle, workers' homes, middle-class residences, and an outer commuter zone. Groups move outward as they rise, through \"invasion and succession\", an analogy borrowed from plant ecology. This is why the slides say the Chicago School naturalized the unequal city: sorting by income looks like a natural ecological process rather than the result of institutions.</p><p class=\"zh\"><strong>【芝加哥模型】</strong>Burgess 设想城市从一个中心向外一圈圈生长：中心商务区（Loop）、新移民和穷人最先落脚的过渡区、工人住宅区、中产住宅区、最外层的通勤区。群体地位上升后就往外搬，即\"入侵与演替\"（invasion and succession），这是从植物生态学借来的类比。讲义说芝加哥学派把不平等的城市\"自然化\"了，原因就在这里：按收入分层看起来像自然的生态过程，而不是制度造成的结果。</p></div><div class=\"para\" data-idx=\"17\" data-doc=\"urban-studies-reading-guide\" data-nid=\"6d5cbe5b43\"><p class=\"en\">[Core claim] Los Angeles has no dominant centre. Dear &amp; Flusty argue that the periphery organises the centre, not the other way round; they describe development as \"keno capitalism\", where parcels on a grid are developed seemingly at random rather than spreading out in rings.</p><p class=\"zh\"><strong>【核心主张】</strong>洛杉矶没有主导性的中心。Dear &amp; Flusty 认为是外围在组织中心，而不是中心组织外围；他们把这种开发方式称为\"基诺资本主义\"（keno capitalism）：网格上的地块像彩票开奖一样看似随机地被开发，而不是一圈圈向外扩散。</p></div><div class=\"para\" data-idx=\"18\" data-doc=\"urban-studies-reading-guide\" data-nid=\"fedf3c02c0\"><p class=\"en\">[fragmented] The city is cut into disconnected pieces, socially and administratively. Los Angeles County is made up of many separate municipalities, each governing itself.</p><p class=\"zh\"><strong>【fragmented 碎片化】</strong>城市被切成互不相连的小块，社会上、行政上都是。洛杉矶县由许多独立的市组成，各管各的。</p></div><div class=\"para\" data-idx=\"19\" data-doc=\"urban-studies-reading-guide\" data-nid=\"35938b22e0\"><p class=\"en\">[polycentric] There is not one downtown but several functional centres; business and employment are spread across the region, the \"edge city\" pattern.</p><p class=\"zh\"><strong>【polycentric 多中心】</strong>不止一个市中心，而是多个功能中心，商务区和就业区散布各地，即\"边缘城市\"（edge city）。</p></div><div class=\"para\" data-idx=\"20\" data-doc=\"urban-studies-reading-guide\" data-nid=\"f1beb973d4\"><p class=\"en\">[decentralized] Development spreads outward and the suburbs no longer depend on the centre; a sprawling city tied together by freeways.</p><p class=\"zh\"><strong>【decentralized 去中心化】</strong>发展向外扩散，郊区不再依附市中心，是一座由高速公路连起来的蔓延式城市。</p></div><div class=\"para\" data-idx=\"21\" data-doc=\"urban-studies-reading-guide\" data-nid=\"613c9d3a96\"><p class=\"en\">[multi-ethnic] A city of immigrants in which ethnic enclaves sit side by side, such as Koreatown and Little Tokyo. The Koreatown case in DeVerteuil's typology is here.</p><p class=\"zh\"><strong>【multi-ethnic 多族裔】</strong>由移民构成，族裔聚居区并存，如韩国城、小东京。课上 DeVerteuil 类型学里的韩国城案例就在这里。</p></div><div class=\"para\" data-idx=\"22\" data-doc=\"urban-studies-reading-guide\" data-nid=\"4b07e7ab75\"><p class=\"en\">[controlled] Space is surveilled and privately governed: homeowners' associations, private security, cameras.</p><p class=\"zh\"><strong>【controlled 受控】</strong>空间被监控、被私人化管理：业主协会、私人保安、监控摄像。</p></div><div class=\"para\" data-idx=\"23\" data-doc=\"urban-studies-reading-guide\" data-nid=\"3bc9f3bb7b\"><p class=\"en\">[fortified] People are separated by physical means: gated communities, defensive architecture, privatised \"public\" space. Mike Davis argued that urban space was increasingly designed to keep unwanted people out.</p><p class=\"zh\"><strong>【fortified 堡垒化】</strong>用物理手段把人隔开：门禁社区、防御性建筑、被私有化的\"公共\"空间。Mike Davis 认为，城市空间越来越被设计成把\"不受欢迎的人\"挡在外面。</p></div><div class=\"para\" data-idx=\"24\" data-doc=\"urban-studies-reading-guide\" data-nid=\"574dcf17ca\"><p class=\"en\">[vs the 1970s critique] The 1970s political-economy critique asks who causes inequality (the state, landowners, developers, capital); the Los Angeles School describes what the resulting city looks like (fragments, many centres, fortification). They do not contradict each other, and several LA School members, such as Soja and Davis, were themselves Marxist. Read in order, the three slides go: the Chicago School naturalizes inequality → the 1970s critique says institutions produce it → the LA School shows the shape of the city that results.</p><p class=\"zh\"><strong>【和 1970 年代批评的区别】</strong>1970 年代政治经济学批评问的是\"不平等是谁造成的\"（国家、地主、开发商、资本）；洛杉矶学派描述的是\"结果城市长成什么样\"（碎片、多中心、堡垒化）。两者不矛盾，Soja、Davis 等成员本身也是马克思主义取向。讲义三页按顺序读：芝加哥学派把不平等自然化 → 1970 年代学者指出不平等由制度造成 → 洛杉矶学派描述这种城市最后的空间形态。</p></div><div class=\"para\" data-idx=\"25\" data-doc=\"urban-studies-reading-guide\" data-nid=\"617af8ad36\"><p class=\"en\">[Criticism] The main criticism of the LA School mirrors its own criticism of Chicago: it treats the features of one city as a universal model of the city.</p><p class=\"zh\"><strong>【主要批评】</strong>学界对洛杉矶学派的主要批评，和它批评芝加哥学派的理由一样：把一座城市的特征当成了所有城市的普遍模式。</p></div><div class=\"para\" data-idx=\"26\" data-doc=\"urban-studies-reading-guide\" data-nid=\"7aee81540a\"><p class=\"en\">[Links to your material] Nanjing (Song et al. 2023): most highly gentrified quarters are gated communities, and the authors' \"club-isation\" of landscape is a Chinese version of fortified and controlled. Kern (2007): condos turn security into a purchasable commodity, the same logic. Hangzhou: Qianjiang New Town, Binjiang, Future Sci-Tech City and Xiaoshan existing side by side is a ready example of polycentric and decentralized.</p><p class=\"zh\"><strong>【和你手上材料的联系】</strong>南京（宋伟轩等 2023）：高度绅士化小区多为封闭社区，作者说的\"空间俱乐部化\"就是 fortified 和 controlled 的中国版本。Kern（2007）：公寓把\"安全\"变成可以买的商品，也是同一逻辑。杭州：钱江新城、滨江、未来科技城、萧山并存，是 polycentric 和 decentralized 的现成例子。</p></div><h3 class=\"sec\" data-secidx=\"27\"><span class=\"en\">0.1 · Simmel (1903) — The Metropolis and Mental Life</span><span class=\"zh\">0.1 · Simmel (1903) · The Metropolis and Mental Life 大都市与精神生活</span></h3><div class=\"para\" data-idx=\"28\" data-doc=\"urban-studies-reading-guide\" data-nid=\"19096fffa9\"><p class=\"en\">Notes: Research-Strategy/Draft-Simmel-1903.md</p><p class=\"zh\">笔记：Research-Strategy/Draft-Simmel-1903.md</p></div><div class=\"para\" data-idx=\"29\" data-doc=\"urban-studies-reading-guide\" data-nid=\"c27485d6a2\"><p class=\"en\">[Core argument] City life changes people at the psychological level. The pace, density and complexity of the metropolis produce a distinct mental attitude.</p><p class=\"zh\"><strong>【核心论点】</strong>城市生活从心理层面深刻改变人：大都市的快节奏、高密度、复杂性塑造出一种独特的心理状态。</p></div><div class=\"para\" data-idx=\"30\" data-doc=\"urban-studies-reading-guide\" data-nid=\"9486907cb5\"><p class=\"en\">[Key concepts] Rural relationships are few, deep and built over time; metropolitan ones are many, shallow and anonymous, so city dwellers come to place their trust in money and exchange. The blasé attitude: emotional detachment as self-protection against overstimulation.</p><p class=\"zh\"><strong>【关键概念】</strong>乡村关系少而深、靠时间积累；大都市关系多而浅、大量匿名，城市居民转而与<b>货币和交换</b>建立信任。<b>Blasé attitude（冷漠态度）</b>：面对过度刺激，以情感疏离作为自我保护。</p></div><h3 class=\"sec\" data-secidx=\"31\"><span class=\"en\">0.2 · Wirth (1938) — Urbanism as a Way of Life</span><span class=\"zh\">0.2 · Wirth (1938) · Urbanism as a Way of Life 都市主义作为一种生活方式</span></h3><div class=\"para\" data-idx=\"32\" data-doc=\"urban-studies-reading-guide\" data-nid=\"cb2b369115\"><p class=\"en\">Notes: Research-Strategy/Draft-Wirth-1938.md</p><p class=\"zh\">笔记：Research-Strategy/Draft-Wirth-1938.md</p></div><div class=\"para\" data-idx=\"33\" data-doc=\"urban-studies-reading-guide\" data-nid=\"fd97b65011\"><p class=\"en\">[Core argument] Three structural variables, size, density and heterogeneity, explain five features of urbanism as a distinct way of life.</p><p class=\"zh\"><strong>【核心论点】</strong>用<b>规模、密度、异质性</b>三个结构变量，解释都市主义作为一种独特生活方式的五个特征。</p></div><div class=\"para\" data-idx=\"34\" data-doc=\"urban-studies-reading-guide\" data-nid=\"34d9ba2e4a\"><p class=\"en\">[Five features] Anonymity and impersonal relationships</p><p class=\"zh\"><strong>【五大特征】</strong>匿名性与非个人化关系</p></div><div class=\"para\" data-idx=\"35\" data-doc=\"urban-studies-reading-guide\" data-nid=\"833f4b7b60\"><p class=\"en\">[Five features] Specialization and division of labour (economic interdependence)</p><p class=\"zh\"><strong>【五大特征】</strong>专业化与劳动分工（经济互赖）</p></div><div class=\"para\" data-idx=\"36\" data-doc=\"urban-studies-reading-guide\" data-nid=\"257be0b6a1\"><p class=\"en\">[Five features] Cultural diversity (promotes tolerance, may also cause fragmentation and conflict)</p><p class=\"zh\"><strong>【五大特征】</strong>文化多样性（促进宽容，也可能导致碎片化和冲突）</p></div><div class=\"para\" data-idx=\"37\" data-doc=\"urban-studies-reading-guide\" data-nid=\"c940ba3ba4\"><p class=\"en\">[Five features] Rational, calculated, goal-oriented behaviour (individualism over community ties)</p><p class=\"zh\"><strong>【五大特征】</strong>行为理性化、目标导向（以社群纽带换取个人主义）</p></div><div class=\"para\" data-idx=\"38\" data-doc=\"urban-studies-reading-guide\" data-nid=\"282ba000e8\"><p class=\"en\">[Five features] Weakened social ties</p><p class=\"zh\"><strong>【五大特征】</strong>社会纽带弱化</p></div><div class=\"para\" data-idx=\"39\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2715957932\"><p class=\"en\">[vs Simmel] Simmel focuses on psychological mechanism (stimulation → blasé); Wirth on social structure (size + density + heterogeneity → anonymity, division of labour, weak ties). Much Chicago School research builds on accounts like Wirth's.</p><p class=\"zh\"><strong>【与 Simmel】</strong>Simmel 偏心理机制（刺激 → blasé），Wirth 偏社会结构（规模 + 密度 + 异质性 → 匿名、分工、纽带弱化）。芝加哥学派的城市研究很大程度建立在这类论述之上。</p></div><h3 class=\"sec\" data-secidx=\"40\"><span class=\"en\">0.3 · Sennett (2018; slides 2019) — Building and Dwelling: Ethics for the City</span><span class=\"zh\">0.3 · Sennett (2018 / 讲义 2019) · Building and Dwelling: Ethics for the City</span></h3><div class=\"para\" data-idx=\"41\" data-doc=\"urban-studies-reading-guide\" data-nid=\"aaadd8d9e1\"><p class=\"en\">Notes: Research-Strategy/Draft-Sennett-2019.md</p><p class=\"zh\">笔记：Research-Strategy/Draft-Sennett-2019.md</p></div><div class=\"para\" data-idx=\"42\" data-doc=\"urban-studies-reading-guide\" data-nid=\"3c01771c87\"><p class=\"en\">[Core argument] There is a tension between building (the physical construction of cities) and dwelling (how people experience and live in them). Better cities balance the technical side of planning with residents' lived experience.</p><p class=\"zh\"><strong>【核心论点】</strong>城市的物质建设（building）与人们如何体验和生活其中（dwelling）之间存在张力；更好的城市要平衡规划设计的技术面与居民的真实生活经验。</p></div><div class=\"para\" data-idx=\"43\" data-doc=\"urban-studies-reading-guide\" data-nid=\"03512753b0\"><p class=\"en\">[Key definition] A city is \"a human settlement in which strangers are likely to meet\". Cities should have public spaces where residents acquire urban competence by learning to socialize with strangers.</p><p class=\"zh\"><strong>【关键定义】</strong>城市是 <em>\"a human settlement in which strangers are likely to meet\"</em>。城市应提供公共空间，让居民通过与陌生人交往习得 <b>urban competence（都市能力）</b>。</p></div><h3 class=\"sec\" data-secidx=\"44\"><span class=\"en\">0.4 · Ilmonen (2016) — \"The Changing Urban Question\" — title slide</span><span class=\"zh\">0.4 · Ilmonen (2016) · \"The Changing Urban Question\" 标题页</span></h3><div class=\"para\" data-idx=\"45\" data-doc=\"urban-studies-reading-guide\" data-nid=\"f2667f1011\"><p class=\"en\">[Verified] The Introduction slides contain only a title page reading \"Ilmonen 2016: The Changing Urban Question\", with no further content. The author is Mervi Ilmonen (Aalto University), co-editor of Ways of Residing in Transformation (2016).</p><p class=\"zh\"><strong>【已核实】</strong>Introduction 讲义里只有一张标题页写着 \"Ilmonen 2016: The Changing Urban Question\"，没有展开内容。作者全名 <b>Mervi Ilmonen</b>（Aalto 大学），是 <em>Ways of Residing in Transformation</em>（2016）的共同编者之一。</p></div><div class=\"para\" data-idx=\"46\" data-doc=\"urban-studies-reading-guide\" data-nid=\"1c03753db3\"><p class=\"en\">[Inference] It is probably the same framework as the full \"The Changing Housing Question (Mervi Ilmonen)\" table in the Housing slides. This is an inference from comparing the two slide decks, not confirmed; worth checking with the teacher.</p><p class=\"zh\"><strong>【推断】</strong>它和 Housing 讲义里完整的 \"The Changing Housing Question (Mervi Ilmonen)\" 对照表很可能是同一个框架。这是交叉比对两份讲义的推断，不是确证，可以问老师确认。</p></div><div class=\"para\" data-idx=\"47\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ef3a57b76b\"><p class=\"en\">Correction log An earlier version included an extended \"industrial vs post-industrial city\" table whose wording does not appear in the slides; it has been removed. The author's first name was mistyped as \"Mauri\" and is corrected to Mervi.</p><p class=\"zh\"><b>更正记录</b>早先这里放过一张\"工业城市 vs 后工业城市\"的扩展表，措辞在讲义原文里找不到，已删除；作者名\"Mauri\"是笔误，已改为 Mervi。</p></div><h3 class=\"sec\" data-secidx=\"48\"><span class=\"en\">0.5 · An open question from the slides — What is the urban?</span><span class=\"zh\">0.5 · 讲义留下的开放问题 · What is the urban?</span></h3><div class=\"para\" data-idx=\"49\" data-doc=\"urban-studies-reading-guide\" data-nid=\"d09aeded95\"><p class=\"en\">[Slides] \"If you stand naked on the front porch and the neighbours can't see you, it's rural; if they call the cops, it's suburban; if they ignore you, it's urban.\" This echoes Berndt (2015): cities are less physical entities than a theoretical category for arguing about wider social transformation.</p><p class=\"zh\"><strong>【讲义】</strong>\"如果你裸体站在门廊上，邻居看不见，那是乡村；邻居报警，那是郊区；邻居毫不在意，那才是城市。\"呼应 Berndt (2015)：城市未必是纯粹的物理实体，而是一种用来论证社会整体转型的<b>理论范畴</b>。</p></div><div class=\"para\" data-idx=\"50\" data-doc=\"urban-studies-reading-guide\" data-nid=\"e9dc78dc4c\"><p class=\"en\">[Assignment] The slides already list example essay topics such as \"gendered spaces\", \"demographic changes\" and \"a specific building\". The full text is in Assignments.md.</p><p class=\"zh\"><strong>【作业措辞】</strong>导论讲义已给出选题示例，包括 \"gendered spaces\"、\"demographic changes\"、\"a specific building\" 等，完整收录在 <span>Assignments.md</span>。</p></div><h2 class=\"sec\" data-secidx=\"51\"><span class=\"en\">Unit 2 · Housing · 20.1 · Housing: home, commodity or asset</span><span class=\"zh\">第二单元 · Housing · 20.1 · 住房：家、商品还是资产</span></h2><div class=\"para\" data-idx=\"52\" data-doc=\"urban-studies-reading-guide\" data-nid=\"54e86820ba\"><p class=\"en\">Slides Lectures-20260706/housing.pdf in three parts: what housing is, housing preferences, housing policy. Class task: find at least one policy document related to the readings and introduce it in class.</p><p class=\"zh\">讲义 <span>Lectures-20260706/housing.pdf</span> 分三部分：住房是什么、住房偏好、住房政策。课堂任务：找至少一份与读物相关的政策文件，在课上介绍。</p></div><h3 class=\"sec\" data-secidx=\"53\"><span class=\"en\">2.0 · Lecture framework — Eight points</span><span class=\"zh\">2.0 · 讲义框架 · 八个要点</span></h3><div class=\"para\" data-idx=\"54\" data-doc=\"urban-studies-reading-guide\" data-nid=\"4a9ccf3b94\"><p class=\"en\">[① What is housing] A basic need (who should provide it?), a commodity from which to extract wealth, or a way of life?</p><p class=\"zh\"><strong>【① 住房是什么】</strong>基本需求（谁该提供？）、榨取财富的商品，还是一种生活方式？</p></div><div class=\"para\" data-idx=\"55\" data-doc=\"urban-studies-reading-guide\" data-nid=\"020d04a1fd\"><p class=\"en\">[① What is housing] \"Today there is a conflict between housing as lived, social space and housing as an instrument for profitmaking – a conflict between home and real estate.\" (Madden &amp; Marcuse 2016, 4)</p><p class=\"zh\"><strong>【① 住房是什么】</strong><em>\"Today there is a conflict between housing as lived, social space and housing as an instrument for profitmaking – a conflict between home and real estate.\"</em>（Madden & Marcuse 2016, 4）</p></div><div class=\"para\" data-idx=\"56\" data-doc=\"urban-studies-reading-guide\" data-nid=\"1638fc7870\"><p class=\"en\">[② Financialization] Aalbers (2016): the increasing role of financial motives, markets and actors in shaping housing. Christophers (2015) contests the concept; Aalbers (2019) stresses context-specific outcomes. Actors include institutional and international investors, listed and non-listed real-estate investment companies (REITs) and foundations.</p><p class=\"zh\"><strong>【② 金融化】</strong><b>Aalbers (2016)</b>：金融动机、市场与行为者在塑造住房中的作用日益增强。Christophers (2015) 指出概念有争议；Aalbers (2019) 强调结果因语境而异。行为者包括机构投资者、国际投资者、上市与非上市房地产投资公司（REITs）、基金会。</p></div><div class=\"para\" data-idx=\"57\" data-doc=\"urban-studies-reading-guide\" data-nid=\"601537da7a\"><p class=\"en\">[② Financialization] \"Housing is at the heart of the growing economic divide in Europe and the US.\" (Clark 2021, 151)</p><p class=\"zh\"><strong>【② 金融化】</strong><em>\"Housing is at the heart of the growing economic divide in Europe and the US.\"</em>（Clark 2021, 151）</p></div><div class=\"para\" data-idx=\"58\" data-doc=\"urban-studies-reading-guide\" data-nid=\"3e37f59c3d\"><p class=\"en\">[③ Ilmonen] Housing situation: Housing shortage | \"Affordable housing\"</p><p class=\"zh\"><strong>【③ Ilmonen】</strong><strong>住房状况</strong>：住房短缺｜\"可负担住房\"</p></div><div class=\"para\" data-idx=\"59\" data-doc=\"urban-studies-reading-guide\" data-nid=\"7fc58db67d\"><p class=\"en\">[③ Ilmonen] Household size: Large families | Small households</p><p class=\"zh\"><strong>【③ Ilmonen】</strong><strong>家庭规模</strong>：大家庭｜小家户</p></div><div class=\"para\" data-idx=\"60\" data-doc=\"urban-studies-reading-guide\" data-nid=\"4de8697ba3\"><p class=\"en\">[③ Ilmonen] Role of housing: Housing as need | Housing as consumption</p><p class=\"zh\"><strong>【③ Ilmonen】</strong><strong>住房定位</strong>：住房作为需求（need）｜住房作为消费（consumption）</p></div><div class=\"para\" data-idx=\"61\" data-doc=\"urban-studies-reading-guide\" data-nid=\"48991b634d\"><p class=\"en\">[③ Ilmonen] Type of need: Quantitative needs | Qualitative needs</p><p class=\"zh\"><strong>【③ Ilmonen】</strong><strong>需求性质</strong>：量的需求｜质的需求</p></div><div class=\"para\" data-idx=\"62\" data-doc=\"urban-studies-reading-guide\" data-nid=\"f95097462e\"><p class=\"en\">[③ Ilmonen] Main group: Working class | Middle class; diversifying residents</p><p class=\"zh\"><strong>【③ Ilmonen】</strong><strong>主要人群</strong>：工人阶级｜中产阶级，人群日益分化</p></div><div class=\"para\" data-idx=\"63\" data-doc=\"urban-studies-reading-guide\" data-nid=\"372d760f2e\"><p class=\"en\">[③ Ilmonen] Checked word for word against the slides. Matches the \"first / second housing question\" framework in Ilmonen's (2016) chapter.</p><p class=\"zh\"><strong>【③ Ilmonen】</strong>已逐字核对讲义原文。与 Ilmonen (2016) 章节里\"第一住房问题 / 第二住房问题\"的框架吻合。</p></div><div class=\"para\" data-idx=\"64\" data-doc=\"urban-studies-reading-guide\" data-nid=\"9c6d0bc031\"><p class=\"en\">[④ Finnish tenures] Owner occupation: single-family houses, or the asunto-osakeyhtiö (limited liability housing company: you buy shares that entitle you to use a given flat)</p><p class=\"zh\"><strong>【④ 芬兰权属】</strong><b>自住产权</b>：独栋住宅，或 asunto-osakeyhtiö（有限责任住房公司，购买股份获得特定公寓的使用权）</p></div><div class=\"para\" data-idx=\"65\" data-doc=\"urban-studies-reading-guide\" data-nid=\"d5b3c05222\"><p class=\"en\">[④ Finnish tenures] Right of occupancy (asumisoikeusasunto): pay 15% of the property's value upfront for the right to live there, plus a monthly fee; a hybrid of renting and owning</p><p class=\"zh\"><strong>【④ 芬兰权属】</strong><b>居住权住房</b>（asumisoikeusasunto）：预付房价 15% 换取居住权，另付月费，介于租与买之间</p></div><div class=\"para\" data-idx=\"66\" data-doc=\"urban-studies-reading-guide\" data-nid=\"5856054fdc\"><p class=\"en\">[④ Finnish tenures] Cooperative housing</p><p class=\"zh\"><strong>【④ 芬兰权属】</strong><b>合作社住房</b></p></div><div class=\"para\" data-idx=\"67\" data-doc=\"urban-studies-reading-guide\" data-nid=\"af8c5c6562\"><p class=\"en\">[⑤ Rental market] Finnish renting is split into two separate systems, which the lecture calls a dualist rental market.</p><p class=\"zh\"><strong>【⑤ 租赁市场】</strong>芬兰的租房分成两套互不相通的系统，讲义叫它\"<b>二元租赁市场</b>\"（dualist rental market）。</p></div><div class=\"para\" data-idx=\"68\" data-doc=\"urban-studies-reading-guide\" data-nid=\"c5c7c796a5\"><p class=\"en\">[⑤ Rental market] System 1: private rental. Landlords are companies or individuals. The landlord sets the rent at market level and chooses the tenant; the state regulates neither.</p><p class=\"zh\"><strong>【⑤ 租赁市场】</strong><b>第一套：私人租赁。</b>房东可以是公司，也可以是个人。租金多少由房东按市场定，租给谁也由房东决定，政府两样都不管。</p></div><div class=\"para\" data-idx=\"69\" data-doc=\"urban-studies-reading-guide\" data-nid=\"4679ccb58a\"><p class=\"en\">[⑤ Rental market] System 2: social (ARA) housing. Built with low-interest loans or subsidies from ARA, the state housing finance agency. Three features: subsidized (the state helps pay for construction); cost-based rent (rent covers building and upkeep costs, not market rates); means-tested (applicants' income and assets must qualify). Ruonavaara (2017, 9) sums up the difference from private rental: \"not priced by the market and primarily targeted at low and middle-income households\".</p><p class=\"zh\"><strong>【⑤ 租赁市场】</strong><b>第二套：社会住房（ARA 住房）。</b>由国家住房金融机构 ARA 提供低息贷款或补贴建造，有三个特点：<b>受补贴</b>（国家出钱帮忙建）；<b>按成本定租金</b>（租金只要覆盖建造和维护成本，不按市场行情收）；<b>要审查收入</b>（申请人的收入和资产要符合条件，即 means-tested）。Ruonavaara (2017, 9) 一句话概括了它和私人租赁的区别：\"not priced by the market and primarily targeted at low and middle-income households\"，意思是不按市场定价，主要给中低收入家庭。</p></div><div class=\"para\" data-idx=\"70\" data-doc=\"urban-studies-reading-guide\" data-nid=\"b4f456e95d\"><p class=\"en\">[⑤ Rental market] Why it matters: the Segregation lecture notes that the larger the private rental sector, the less a municipality can influence who lives where, so social mixing gets harder.</p><p class=\"zh\"><strong>【⑤ 租赁市场】</strong><b>为什么重要：</b>Segregation 讲义说，私人租赁越多，市政府越管不了谁住在哪里，社会混合就越难做。</p></div><div class=\"para\" data-idx=\"71\" data-doc=\"urban-studies-reading-guide\" data-nid=\"9d0b974637\"><p class=\"en\">[⑤ Rental market] Background (beyond the slides): the term \"dualist\" comes from Jim Kemeny (1995). Its opposite is an \"integrated\" (unitary) rental market, where social and private rental compete in one market and hold rents down. Australia, with social housing at about 4% of households, is a dualist system with a residualised social sector, a useful contrast for Waterloo.</p><p class=\"zh\"><strong>【⑤ 租赁市场】</strong><b>背景（讲义外补充）：</b>\"二元\"一词来自 Jim Kemeny (1995)。与它相对的是\"一体化\"租赁市场，那里社会住房和私人租赁在同一个市场里竞争、互相压低租金。澳大利亚社会住房只占约 4%，属于二元而且社会住房被边缘化的体系，可以和 Waterloo 对照。</p></div><div class=\"para\" data-idx=\"72\" data-doc=\"urban-studies-reading-guide\" data-nid=\"a16092f9dd\"><p class=\"en\">[⑥ Housing policy] Finnish Constitution §19: public authorities shall promote everyone's right to housing. Ministry of the Environment (2019): housing policy promotes decent housing for all, sustainable development, the functioning of society and the labour market, and empowerment. Instruments are demand-side subsidies (to households) and supply-side subsidies (to production). 1995–2023 saw a shift from the supply side to the demand side.</p><p class=\"zh\"><strong>【⑥ 住房政策】</strong>芬兰宪法第 19 条：公共权力机构要促进每个人的住房权。环境部（2019）：住房政策要促进人人享有体面住房、可持续发展、社会与劳动力市场运转和赋权。工具分需求侧补贴（给家户）和供给侧补贴（补贴生产）；1995–2023 年芬兰<b>从供给侧转向需求侧</b>。</p></div><div class=\"para\" data-idx=\"73\" data-doc=\"urban-studies-reading-guide\" data-nid=\"9f789f9ede\"><p class=\"en\">[⑦ Why so expensive] \"We must go beyond just looking at the supply of housing and examine demand, in particular the demand for housing as a financial asset.\" (Ryan-Collins 2019)</p><p class=\"zh\"><strong>【⑦ 为什么贵】</strong><em>\"We must go beyond just looking at the supply of housing and examine demand, in particular the demand for housing as a financial asset.\"</em>（Ryan-Collins 2019）</p></div><div class=\"para\" data-idx=\"74\" data-doc=\"urban-studies-reading-guide\" data-nid=\"abee23a40d\"><p class=\"en\">[⑦ Why so expensive] Harvey (1978): wealth flows into real estate rather than productive investment. The lecture's own line: \"Housing is not just about homes, it's an asset class.\"</p><p class=\"zh\"><strong>【⑦ 为什么贵】</strong>Harvey (1978)：财富被投入房地产而非生产性投资。讲义自己的表述：<b>\"Housing is not just about homes, it's an asset class.\"</b></p></div><div class=\"para\" data-idx=\"75\" data-doc=\"urban-studies-reading-guide\" data-nid=\"5036f7347b\"><p class=\"en\">[⑧ What can be done] Regulate lending; treat different tenures equally; develop more social housing; stop developing buy-to-lets.</p><p class=\"zh\"><strong>【⑧ 可以做什么】</strong>管制信贷；平等对待不同权属；发展更多社会住房；停止发展 buy-to-let。</p></div><h3 class=\"sec\" data-secidx=\"76\"><span class=\"en\">5 · Ruonavaara (2025) — An idea that refuses to die: Rise, fall and resurgence of \"housing class\"</span><span class=\"zh\">5 · Ruonavaara (2025) · An idea that refuses to die: Rise, fall and resurgence of \"housing class\"</span></h3><div class=\"para\" data-idx=\"77\" data-doc=\"urban-studies-reading-guide\" data-nid=\"4e8e45b7e2\"><p class=\"en\">Housing Studies 40(11), 2507–2527</p><p class=\"zh\">Housing Studies 40(11), 2507–2527</p></div><div class=\"para\" data-idx=\"78\" data-doc=\"urban-studies-reading-guide\" data-nid=\"5e08b910dc\"><p class=\"en\">[Core argument] Traces the intellectual history of \"housing class\" from Rex &amp; Moore (1967), through Saunders' property class, to the 2020s revival as asset-based class (Adkins et al.).</p><p class=\"zh\"><strong>【核心论点】</strong>梳理 housing class 理论从 Rex & Moore (1967)，到 Saunders 的 property class，再到 2020 年代 Adkins 等人 asset class 理论复兴的学术史。</p></div><div class=\"para\" data-idx=\"79\" data-doc=\"urban-studies-reading-guide\" data-nid=\"787d1a99f7\"><p class=\"en\">[Key concepts] Rex &amp; Moore (1967): in Birmingham's Sparkbrook, people's relation to housing (owning, council renting, private renting) forms a \"class\" independent of relations of production.</p><p class=\"zh\"><strong>【关键概念】</strong><b>Rex &amp; Moore (1967)</b>：伯明翰 Sparkbrook 移民社区；人与住房资源的关系（自住、公租、私租）构成独立于生产关系的\"阶级\"。</p></div><div class=\"para\" data-idx=\"80\" data-doc=\"urban-studies-reading-guide\" data-nid=\"daaf437b00\"><p class=\"en\">[Key concepts] Saunders: suppliers of housing capital (developers, landlords, financial institutions), non-owners (tenants, the homeless), and owner-occupiers who accumulate capital gains
