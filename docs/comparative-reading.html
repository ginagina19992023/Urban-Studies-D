有居民的生活质量（Smith, 1996；Atkinson, 2000）。此外，绅士化诱发的社会混合，还威胁到了生活在构成互补、彼此相近的家庭所组成的街区中所能获得的福利收益与支持性网络（Cheshire, 2006）。它摧毁了一种社会资本，去尝试创造另一种。在这个意义上，社会混合被视为威胁到了社会隔离本可积累的种种收益。芝加哥大学政策分析师 John Betancur 发现，绅士化的确摧毁了芝加哥西城区（West Town）的街区支持网络与各类机构：</p></div><div class=\"para quote\" data-idx=\"85\" data-doc=\"lees-2008-social-mixing\" data-nid=\"294529e09e\"><p class=\"en\">Much of West Town is now gentrified. Even entrenched minority, low-income clusters have seen gentrification push through their borders. Churches, service organizations, schools and institutions have been affected by it. Their numbers have dwindled or their constituencies changed. Many small churches have closed; public school enrolment has decreased in the most gentrified sections, and higher-income children are taking over local private schools (Betancur, 2002, p. 792).</p><p class=\"zh\">西城区如今大部分已经绅士化。即便是那些根深蒂固的少数族裔低收入聚居地，也已被绅士化突破了边界。教堂、服务机构、学校与其他各类机构都受到了影响：它们的数量在萎缩，服务对象也在改变。许多小教堂已经关闭；在绅士化程度最深的地段，公立学校的入学人数在下降，而本地私立学校则正被高收入家庭的孩子所占据（Betancur, 2002, 第792页）。</p><span class=\"attrib\">John Betancur（芝加哥大学政策分析师）原话，经 Lees 转引——Betancur 本人的实证研究发现，Lees 认同并借用，作为“批判之四”的具体案例证据。</span></div><div class=\"para\" data-idx=\"86\" data-doc=\"lees-2008-social-mixing\" data-nid=\"3d395773b7\"><p class=\"en\">Peach (1996, p. 387) has argued that segregation can play an important role in sustaining groups, whether deprived or affluent, for “Segregation and concentration fulfils a protective role, like that of a herd of buffalo, holding off wolves”. He suggests that a positive aspect of segregation may be that politically disenfranchised groups might find a sanctuary and an inversion of the kinds of power relations found outside areas of low-income or ethnic concentration. The positive aspects of social segregation are dismissed in policy discussions on social mixing. That evidence base needs to be re-evaluated and/or created for, as Cheshire (2008, p. 17) argues, people’s welfare does not depend on their own income as much as their own income relative to other people’s income living near to them. Luttmer (2005) points to this as a powerful reason why people choose to live in neighbourhoods segregated by income. As Cheshire (2008, p. 17) states: “This suggests the very reverse of a policy of ‘mixed neighbourhoods’”.</p><p class=\"zh\">Peach（1996，第387页）主张，隔离可以在维系群体——无论是弱势群体还是富裕群体——方面发挥重要作用，因为“隔离与集聚发挥着一种<strong>保护性</strong>作用，就像野牛群抵御群狼一样”。他提出，隔离的一个正面意义，或许在于它能让政治上被剥夺权利的群体找到一处庇护所，并在其中实现一种与低收入或族裔集聚地区之外那套权力关系相反转的秩序。而在关于社会混合的政策讨论中，社会隔离的这些正面意义却被<strong>弃置不顾</strong>。这方面的证据基础需要被重新评估、抑或从头建立，因为正如 Cheshire（2008，第17页）所论，人们的福祉，与其说取决于自身的绝对收入，不如说更多取决于自身收入相对于居住在附近的其他人收入的<strong>相对水平</strong>。Luttmer（2005）指出，这正是人们选择居住在按收入隔离的街区中的一个有力原因。正如 Cheshire（2008，第17页）所言：“这恰恰暗示着与‘混合街区’政策<strong>截然相反</strong>的方向”。</p></div><h2 class=\"sec\" data-secidx=\"87\"><span class=\"en\">Critique 5 — Social Mix Policy Fails to Demonstrate How ‘Social Mixing’ between Diverse Neighbourhood Groups is Going to be Achieved</span><span class=\"zh\">批判之五 —— 社会混合政策从未说明，不同街区群体之间的“社会混合”究竟要如何实现</span></h2><div class=\"para\" data-idx=\"88\" data-doc=\"lees-2008-social-mixing\" data-nid=\"54c3d1579f\"><p class=\"en\">Social mix policies fail to demonstrate how ‘social mixing’ between diverse neighbourhood groups is actually going to be achieved. The assumption is that if you place middle-class people side-by-side with poor people, they will make the decision to mix and thereby start mixing. Yet, as discussed earlier, Butler with Robson (2003) have argued that the spatial proximity of middle-class and working-class groups in gentrified/fying neighbourhoods does not automatically generate neighbourhood-level social mixing (see also Freeman, 2006; Davidson, under review).</p><p class=\"zh\">社会混合政策从未说明，不同街区群体之间的“<a class=\"gref\" href=\"#g-socialmix\">社会混合</a>”实际上要如何达成。其预设是：只要把中产阶级和穷人并排安置在一起，他们就会作出混合的决定，混合于是开始发生。然而，如前文所论，Butler 与 Robson（2003）主张，在已绅士化／正在绅士化的街区中，中产阶级与工人阶级群体在空间上的邻近，并不会自动生成街区层面的社会混合（另见 Freeman, 2006；Davidson，审稿中）。</p></div><div class=\"para\" data-idx=\"89\" data-doc=\"lees-2008-social-mixing\" data-nid=\"d0851cb1f0\"><p class=\"en\">Other, much earlier, sociological literature seems to back this up. Much of the sociological literature in the 1960s/1970s was concerned with the consequences of ‘affluence’ on the class structure and specifically whether the working-class were becoming middle-class. In a definitive critique of the affluence debate, Goldthorpe et al. (1969) dismissed any simple economically assimilationist explanation. They argued that not only would the working class have to acquire middle-class economic status, but they would also have to demonstrate similar cultural and social behaviours. Critically, they argued the working class would have to be accepted by the middle class—i.e. there would need to be a normative as well as a social and economic dimension to social mixing.</p><p class=\"zh\">另一批年代久远得多的社会学文献，似乎也支持这一点。1960—70 年代的大量社会学研究，关注的是“<a class=\"gref\" href=\"#g-affluence\">富裕化</a>”（affluence）对阶级结构的后果，尤其是工人阶级是否正在变成中产阶级。在对这场“富裕化辩论”的一次决定性批判中，Goldthorpe 等人（1969）否定了任何简单的经济同化式解释。他们主张，工人阶级不仅必须获得中产阶级的经济地位，还必须表现出相似的文化与社会行为。而关键在于，他们主张：工人阶级还必须<strong>被中产阶级所接纳</strong>——也就是说，社会混合除了社会与经济维度之外，还必须有一个规范性（normative）维度。</p></div><div class=\"para\" data-idx=\"90\" data-doc=\"lees-2008-social-mixing\" data-nid=\"8fea9571c1\"><p class=\"en\">They concluded that, while there was evidence of economic convergence, there was little evidence of social and normative convergence. It was not simply that the middle class did not want to accept the affluent working classes into their communities, there was little evidence that the affluent workers wanted to join them. The community studies literature of the same period pointed to a similar social, cultural and spatial segregation.</p><p class=\"zh\">他们的结论是：虽然存在经济趋同的证据，社会与规范层面趋同的证据却很少。而且，问题并不只是中产阶级不愿意把富裕起来的工人阶级接纳进自己的社区——同样几乎没有证据表明，富裕起来的工人<strong>想要</strong>加入他们。同一时期的社区研究文献，也指向了类似的社会、文化与空间隔离。</p></div><div class=\"para\" data-idx=\"91\" data-doc=\"lees-2008-social-mixing\" data-nid=\"6c5836d9c1\"><p class=\"en\">The government’s mechanisms designed identify how the rhetoric of social mixing via gentrification will be converted into a strong neighbourhood social tissue. [Column-break damage in source.]</p><p class=\"zh\">政府所设计的机制⋯⋯辨明经由绅士化而来的社会混合修辞，将如何转化为坚实的街区社会肌理。<br><em>［原文此处分栏错位，语义不全——此句在纸本中应有缺失成分，请以出版商版本核对］</em></p></div><h2 class=\"sec\" data-secidx=\"92\"><span class=\"en\">Critique 6 — What Kinds and How Much Social Mixing — And Why — Are Often Poorly Specified</span><span class=\"zh\">批判之六 —— 究竟需要何种、多少社会混合，以及为什么，政策文献往往语焉不详</span></h2><div class=\"para\" data-idx=\"93\" data-doc=\"lees-2008-social-mixing\" data-nid=\"9bb3225b9d\"><p class=\"en\">Precisely what kinds and how much social mixing are best for fostering an inclusive urban renaissance—and why—are often poorly specified in the policy literature (Randolph and Wood, 2003). For instance, in his testimony to the Select Committee on Environment, Transport and Regional Affairs (2001, para 33), Labour MP Nick Raynsford maintained that</p><p class=\"zh\">究竟哪一种、多大程度的社会混合最有利于培育一场包容的<a class=\"gref\" href=\"#g-renaissance\">城市复兴</a>——以及为什么——在政策文献中往往被交代得很含糊（Randolph and Wood, 2003）。举例来说，工党议员 Nick Raynsford 在向环境、交通与地区事务特别委员会作证时（2001，第 33 段）主张：</p></div><div class=\"para quote\" data-idx=\"94\" data-doc=\"lees-2008-social-mixing\" data-nid=\"998468155d\"><p class=\"en\">the division between areas exclusively of owner occupation and exclusively of renting, which was very much a creation of the 20th Century, has not been a happy one in our view, and led to social polarisation and social exclusion. We believe that new developments should contain a mix of housing.</p><p class=\"zh\">在我们看来，纯自有住房区域与纯租赁区域之间的分割——这在很大程度上是二十世纪的产物——并不是一件好事，它导致了社会两极化与社会排斥。我们相信，新开发项目应当包含混合的住房类型。</p><span class=\"attrib\">Nick Raynsford 工党议员 (2001) 证词原话，经 Lees 转引——这是 Lees 用来展示政策话语含糊性的&lt;strong&gt;被批判对象&lt;/strong&gt;，不是她本人立场。注意此处政策语言只说“应当混合”，却未界定混合什么、混合多少。</span></div><div class=\"para\" data-idx=\"95\" data-doc=\"lees-2008-social-mixing\" data-nid=\"85e02ab3cf\"><p class=\"en\">The then Deputy Prime Minister John Prescott signed approvingly: “Our social mix is geared to achieve that” (para 33). However, empirical research suggests that the effects of tenurial diversification (mixing) are often disappointing and always context-dependent (Atkinson and Kintrea, 2001; Wood, 2003). In addition, policy documents that promote social mixing fail to define what a ‘good’ social mix is, or what kinds of communities are well balanced [column-break damage] social mix is merely a description that may apply to virtually any urban neighbourhood. No neighbourhood has a completely homogeneous population (Goodchild and Cole, 2001, pp. 103–104).</p><p class=\"zh\">时任副首相 John Prescott 表示赞同：“我们的社会混合正是为达成这一点而设计的”（第 33 段）。然而，经验研究表明，<a class=\"gref\" href=\"#g-tenure\">业权</a>多元化（即混合）的效果往往令人失望，且<strong>始终依赖于具体语境</strong>（Atkinson and Kintrea, 2001；Wood, 2003）。此外，倡导社会混合的政策文件，从未界定什么才算“好的”社会混合，或什么样的社区才算均衡⋯⋯<em>［原文此处分栏错位］</em>⋯⋯社会混合不过是一个几乎可以套用于任何城市街区的描述而已。没有哪个街区的人口是完全同质的（Goodchild and Cole, 2001, pp. 103–104）。</p></div><div class=\"para\" data-idx=\"96\" data-doc=\"lees-2008-social-mixing\" data-nid=\"03ab65ce93\"><p class=\"en\">Without governments asserting what kinds of social mix are required (for example, percentages and types—such as income, class, age, ethnicity, tenure) in urban communities, it is difficult to assess just what kinds of change in neighbourhood character—such as changing ethnicity or class composition—are intended to aid neighbourhood communities in bringing about an urban renaissance. […] to increase social mixing, placing poor and middle-class people cheek-by-jowl, may therefore prove ineffective in increasing social mixing.</p><p class=\"zh\">如果政府不明确指出城市社区中究竟需要哪一类社会混合（例如比例与类型——收入、阶级、年龄、族裔、业权），那就很难评估：街区特征上的哪些变化（比如族裔构成或阶级构成的改变），才是被寄望于帮助街区社区实现城市复兴的。⋯⋯因此，那些旨在增加社会混合、把穷人与中产阶级紧挨着安置的做法，在增加社会混合这件事上，可能被证明是无效的。</p></div><div class=\"para\" data-idx=\"97\" data-doc=\"lees-2008-social-mixing\" data-nid=\"4bfd8b8568\"><p class=\"en\">These six critiques force us to ask the question: is gentrification-induced social mixing a good thing? Goodchild and Cole (2001) considered the question whether social mixing was a good thing by asking whether greater neighbourhood social diversity actually increased interaction between the rich and poor, and whether social mix improved the quality of life for neighbourhood residents. If we ask these same questions of gentrification-induced social mixing, then the evidence discussed here says no.</p><p class=\"zh\">这六条批判迫使我们追问一个问题：由绅士化所诱发的社会混合，是一件好事吗？Goodchild 与 Cole（2001）在考察“社会混合是否是好事”时，提出的追问方式是：更高的街区社会多样性，是否真的增加了富人与穷人之间的互动？社会混合是否改善了街区居民的生活质量？如果我们把同样的问题拿来问“由绅士化所诱发的社会混合”，那么本文所讨论的证据给出的答案是：<strong>不</strong>。</p></div><h2 class=\"sec\" data-secidx=\"98\"><span class=\"en\">Conclusion</span><span class=\"zh\">结论</span></h2><div class=\"para\" data-idx=\"99\" data-doc=\"lees-2008-social-mixing\" data-nid=\"662f106dca\"><p class=\"en\">Socially mixed urban communities created by the in-movement of middle-class people into poor, marginal areas of the inner city are being posited, under the rubric of urban renaissance, as the desegregating answer to lives that are lived in parallel or in isolation along class, income, ethnic and tenurial fault lines. It is ironic that a process that results in segregation and polarisation—gentrification—is being promoted via social mix policies as the ‘positive’ solution to segregation. By abstractly celebrating formal equality under the law, the rhetoric of social mixing tends to conceal the inequalities of fortune and economic circumstance that are produced through the process of gentrification.</p><p class=\"zh\">由中产阶级迁入内城贫困、边缘地带所造就的社会混合型城市社区，正在“城市复兴”的名目下，被设定为一剂去隔离的解药——用以对治那些沿着阶级、收入、族裔与业权断层线各自平行、彼此隔绝地过着的生活。而讽刺之处在于：一个<strong>本身导致隔离与两极化</strong>的过程——绅士化——正通过社会混合政策，被推销为解决隔离问题的“正面”方案。社会混合的修辞，通过抽象地颂扬法律面前的形式平等，往往遮蔽了绅士化过程所生产出来的财富与经济境遇上的不平等。</p></div><div class=\"para\" data-idx=\"100\" data-doc=\"lees-2008-social-mixing\" data-nid=\"69b0ba364a\"><p class=\"en\">Social mix policies rely on a common set of beliefs about the benefits of mixed communities, with little evidence to support them, and a growing evidence base that contradicts the precepts embedded in social mix policies that should make policy-makers sit up and take note. As Cheshire (2008) argues, a mixed communities policy is essentially a faith-based policy since there is scant real evidence that making communities more mixed makes the life-chances of the poor any better.</p><p class=\"zh\">社会混合政策依赖于一套关于混合社区好处的共同信念，而支持这些信念的证据极少；与此同时，与社会混合政策所内嵌的那些信条相矛盾的证据基础却在不断增长，这本应让政策制定者警醒。正如 Cheshire（2008）所论，混合社区政策<strong>本质上是一种信仰式政策</strong>（faith-based policy），因为几乎没有真实证据表明，让社区变得更混合，能让穷人的人生机会变好哪怕一点。</p></div><div class=\"para\" data-idx=\"101\" data-doc=\"lees-2008-social-mixing\" data-nid=\"7e34667f4c\"><p class=\"en\">Social mix policies are cosmetic policies rather than ones prepared to deal with the whole host of complex social, economic and cultural reasons as to why there are concentrations of poor, economically inactive people in our central cities. As Cheshire (2006, p. 1241) argues</p><p class=\"zh\">社会混合政策是<strong>化妆式</strong>（cosmetic）的政策，而不是准备去应对那一整套复杂原因的政策——即，为什么我们的中心城市里会出现贫困、经济上不活跃人口的集聚。正如 Cheshire（2006, p. 1241）所论：</p></div><div class=\"para quote\" data-idx=\"102\" data-doc=\"lees-2008-social-mixing\" data-nid=\"ed93a50b18\"><p class=\"en\">forcing neighbourhoods to be mixed in social and economic terms is treating the symptoms of inequality, not the cause ... on a par with applying leeches to lower a fever</p><p class=\"zh\">强迫街区在社会与经济意义上变得混合，是在治疗不平等的<strong>症状</strong>，而不是病因⋯⋯这与用水蛭放血来退烧无异。</p><span class=\"attrib\">Cheshire (2006: 1241) 原话，经 Lees 转引——Lees &lt;strong&gt;认同并借用&lt;/strong&gt;此论断。“用水蛭退烧”是全文最锋利的比喻，可直接引用。</span></div><div class=\"para\" data-idx=\"103\" data-doc=\"lees-2008-social-mixing\" data-nid=\"b25638d38c\"><p class=\"en\">Deprivation, like gentrification and social exclusion, is a process, not a condition. And the evidence outlined earlier suggests that over the longer term poor people suffer more from the loss of benefits of living in a poor neighbourhood, than they gain from living in a more affluent one. This leads Cheshire (2008) to suggest that efforts to improve social equity would be more effective if directed towards people themselves rather than moving people around to mix neighbourhoods. Indeed, the neighbourhood itself needs to be re-evaluated (see also Galster, 2007) as the locus of these policies; neighbourhoods are not static but dynamic entities.</p><p class=\"zh\">贫困剥夺（deprivation）与绅士化、社会排斥一样，是一个<strong>过程</strong>，而非一种<strong>状态</strong>。而前文列出的证据表明：从更长的时段看，穷人因失去“住在穷街区所带来的好处”而蒙受的损失，大于他们因“住进更富裕街区”而获得的收益。这使 Cheshire（2008）提出：若要改善社会公平，把力气直接用在<strong>人</strong>身上，会比把人搬来搬去以混合街区更有效。事实上，作为这些政策着力点的“街区”本身，就需要被重新评估（另见 Galster, 2007）——街区不是静态的，而是动态的实体。</p></div><div class=\"para\" data-idx=\"104\" data-doc=\"lees-2008-social-mixing\" data-nid=\"f830e28739\"><p class=\"en\">Social mix policies also destroy, in my mind, their moral authority (see Blomley, 2004) because they socially construct the middle class or middle-income groups as a natural category in contrast to a demonised working class or low-income groups (and this is done spatially). They push the idea that we all should somehow be/become middle class and that we all want to be middle class. They are about social engineering (social cleansing) and all the problematic connotations that go with that. They forge a relationship between property and propriety, owner-occupiers are well behaved and ‘normal’, whilst social tenants are problematic and abnormal—they are ‘othered’.</p><p class=\"zh\">在我看来，社会混合政策还摧毁了它们自身的道德权威（见 <a class=\"gref\" href=\"#g-blomley\">Blomley, 2004</a>）：因为它们把中产阶级或中等收入群体在社会意义上建构成一个<strong>自然的</strong>范畴，与之对照的则是被妖魔化的工人阶级或低收入群体——而这一建构是<strong>通过空间</strong>完成的。它们推销这样一种观念：我们所有人都理应以某种方式成为中产阶级，而且我们所有人都<strong>想要</strong>成为中产阶级。它们所做的是社会工程（<a class=\"gref\" href=\"#g-cleansing\">社会清洗</a>），以及随之而来的一切成问题的含义。它们在“财产”（property）与“得体”（propriety）之间锻造出一种关联：自有房产者行为良好、是“正常的”，而社会住房租户则是麻烦的、不正常的——他们被“他者化”了。</p></div><div class=\"para\" data-idx=\"105\" data-doc=\"lees-2008-social-mixing\" data-nid=\"76caa5c071\"><p class=\"en\">In this paper, I have forged the beginnings of an evidence base from which to reject the policy ideas about gentrification and social mixing outlined in this paper, but further research is needed. For those who find it difficult to throw the concept of social mixing overboard, future research needs to compare more systematically, interviewing or surveying both gentrifiers and non-gentrifiers living in the same neighbourhoods, social mixing in neighbourhoods at different stages of gentrification (see Rose, 2004).</p><p class=\"zh\">在本文中，我已着手锻造一个证据基础的雏形，据以拒斥文中所述那些关于绅士化与社会混合的政策观念；但仍需进一步研究。对于那些觉得难以把“社会混合”这一概念整个抛弃的人来说，未来研究需要更系统地进行比较：访谈或调查居住在同一街区的绅士化者与非绅士化者，比较处于绅士化<strong>不同阶段</strong>的街区中的社会混合情形（见 Rose, 2004）。</p></div><div class=\"para\" data-idx=\"106\" data-doc=\"lees-2008-social-mixing\" data-nid=\"04cd37a42b\"><p class=\"en\">For, as Butler and Lees (2006) have suggested, pioneer gentrifiers tend to be pro-social-mixing whilst contemporary (third- or fourth-wave) gentrifiers tend not to be of the left liberal variety; they are more individualistic and prefer sanitised and relatively homogeneous neighbourhoods. If these are the middle-class people through whom New Labour (and other governments) want to promote social mixing, then it will be stonewalled.</p><p class=\"zh\">因为，正如 Butler 与 Lees（2006）所提示的：<strong>先锋型</strong>绅士化者往往支持社会混合，而当代的（第三波或第四波）绅士化者则往往不属于左翼自由派那一类——他们更个人主义，偏好经过净化、相对同质的街区。如果<a class=\"gref\" href=\"#g-newlabour\">新工党</a>（以及其他政府）指望通过这批中产阶级来推动社会混合，那么这件事将被硬生生挡回去。</p></div><div class=\"para\" data-idx=\"107\" data-doc=\"lees-2008-social-mixing\" data-nid=\"71f9dab722\"><p class=\"en\">We also need to look at neighbourhoods that demonstrate different types of gentrification, for as Butler with Robson (2003) have shown neighbourhood context can be directly correlated with typologies of gentrifiers (in terms of politics, lifestyles, etc.)—a gentrifier in Brixton is quite different from a gentrifier in Barnsbury or Docklands, and their views on social mixing will be quite different too. Debates are taking place in the absence of a significant knowledge base as to how social mix is experienced on a day-to-day basis within the different contexts of gentrification in our cities. It is our responsibility as gentrification researchers to create the evidence base needed to refute or revise the claims of policy-makers about gentrification and social mixing as an inclusive form of urban renaissance.</p><p class=\"zh\">我们还需要考察那些呈现出<strong>不同类型</strong>绅士化的街区，因为正如 Butler 与 Robson（2003）所展示的，街区语境可以与绅士化者的类型学（在政治、生活方式等方面）直接相关联——布里克斯顿（Brixton）的绅士化者与巴恩斯伯里（Barnsbury）或码头区（Docklands）的绅士化者相当不同，他们对社会混合的看法也会相当不同。当下的种种争论，是在缺乏一个重要知识基础的情况下展开的：即，在我们城市中不同的绅士化语境里，社会混合在<strong>日常层面</strong>究竟是如何被经验到的。作为绅士化研究者，创造出足以驳斥或修正政策制定者主张（即把绅士化与社会混合说成一种包容式城市复兴）的证据基础，是我们的责任。</p></div><div class=\"para\" data-idx=\"108\" data-doc=\"lees-2008-social-mixing\" data-nid=\"1dfac5b12f\"><p class=\"en\">It is worth mulling over Susan Fainstein’s ideas about ‘the just city’ here</p><p class=\"zh\">此处值得反复琢磨 Susan Fainstein 关于“<a class=\"gref\" href=\"#g-justcity\">正义之城</a>”的看法：</p></div><div class=\"para quote\" data-idx=\"109\" data-doc=\"lees-2008-social-mixing\" data-nid=\"0aecf08d8b\"><p class=\"en\">The new urbanist approach of intermixing a variety of building types and levels of affordability ... is not the panacea that some of its supporters assume. If, however, it becomes the template for infill development (rather than the formula to justify the destruction of public housing) it can provide a physical framework for a city that offers a higher quality of life to residents and visitors. Developing an appropriate physical setting for a heterogeneous urbanity, however, can go only so far in the generation of a just city. Most crucial is a political consciousness that supports progressive moves at national and local levels towards respectfulness to others and greater equality.</p><p class=\"zh\">新城市主义那种把多种建筑类型与多档可负担水平混合起来的做法⋯⋯并不是其某些支持者所设想的万灵药。然而，如果它成为<strong>填充式开发</strong>（infill development）的模板，<strong>而不是被用来为摧毁公共住房提供正当性的公式</strong>，那么它确实能为一座城市提供一个物质框架，使居民与访客获得更高的生活质量。不过，为异质性的都市生活营造出合适的物质环境，对于生成一座正义之城而言，所能达到的程度终归有限。最关键的，是一种在国家与地方层面支持进步举措、朝向尊重他者与更大平等迈进的<strong>政治意识</strong>。</p><span class=\"attrib\">Fainstein (2005: 16) 原话，经 Lees 转引——Lees &lt;strong&gt;认同并引为出路&lt;/strong&gt;。请特别注意括号中那句“而不是被用来为摧毁公共住房提供正当性的公式”：这正是把混合业权模板用于拆除公屋区（如 Waterloo、Elephant and Castle）时，最直接的批判依据。</span></div><div class=\"para\" data-idx=\"110\" data-doc=\"lees-2008-social-mixing\" data-nid=\"c53ccc4b65\"><p class=\"en\">For those committed to throwing neighbourhood-based social mix policies overboard, as they are currently framed, we need to come up with some alternative ideas. How can we frame a socially inclusive urban renaissance? We can learn some things from the work on the just and the ideal city, work that seems to have been forgotten along the way. Iris Marion Young’s (1990) defence of the politics of difference is important in the face of the above critiques of social mix policies.</p><p class=\"zh\">对于那些决心把当前形式的、以街区为基础的社会混合政策整个抛弃的人来说，我们需要提出一些替代性构想。我们该如何构想一场社会包容的城市复兴？我们可以从关于“正义之城”与“理想之城”的研究中学到一些东西——这些研究似乎在一路上被遗忘了。面对上述对社会混合政策的种种批判，<a class=\"gref\" href=\"#g-young\">Iris Marion Young</a>（1990）对“差异政治”（politics of difference）的辩护，就显得相当重要。</p></div><div class=\"para\" data-idx=\"111\" data-doc=\"lees-2008-social-mixing\" data-nid=\"a95f4f4c44\"><p class=\"en\">Young accepts the domination of specific neighbourhoods by single groups, as long as the boundaries between these neighbourhoods remain blurred (fuzzy borders or fuzzy boundaries). In her ideal of city life, there is group differentiation and the interfusion of these groups occurs through social space. It is an openness to unassimilated otherness (see Lees, 2004, ch. 1). She highlights the need to provide spaces (not neighbourhoods) that offer opportunities for social interaction amongst people from different social backgrounds (see also Lofland, 1998). The problem with this is that on the surface it accepts the gentrified neighbourhood in its own right.</p><p class=\"zh\">Young 接受特定街区由单一群体所主导——<strong>只要这些街区之间的边界保持模糊</strong>（fuzzy borders／模糊边界）。在她理想的城市生活图景中，存在群体分化，而这些群体的交融是<strong>通过社会空间</strong>发生的。这是一种对“未被同化的他异性”（unassimilated otherness）的开放（见 Lees, 2004, 第 1 章）。她强调，需要提供的是<strong>空间</strong>（而非街区），以为不同社会背景的人提供社会互动的机会（另见 Lofland, 1998）。这一思路的问题在于：它表面上等于承认了已绅士化街区本身的正当性。</p></div><div class=\"para\" data-idx=\"112\" data-doc=\"lees-2008-social-mixing\" data-nid=\"e0800e6c58\"><p class=\"en\">My feeling is that if people prefer to live with people like themselves we should not be forcing them to mix, because ultimately this will fail; rather, we should be keeping the possibility for mixing open to them. This means a refocus on urban design, disallowing fortress-style architecture and gated communities and rethinking the architecture of insecurity and fear. For as Atkinson (2006, p. 831) argues, it would appear that governments espouse social mix policies that “preach the value of integration” at the same time as they facilitate “residential changes of voluntary disaffiliation” that “surely damage” future prospects for civic vitality in cities. Yet it also means remaining critical of the process of gentrification and in particular of state-led policies of gentrification that are trying to socially engineer, dare I say socially cleanse, our central cities (see Lees et al., 2008).</p><p class=\"zh\">我的感觉是：如果人们偏好与自己相似的人住在一起，我们就<strong>不应当强迫他们混合</strong>，因为这最终会失败；相反，我们应当为他们<strong>保留混合的可能性</strong>。这意味着重新聚焦于城市设计：不允许堡垒式建筑与门禁社区，并重新思考那种以不安全感与恐惧为底色的建筑学。因为正如 Atkinson（2006, p. 831）所论，政府看起来一面拥护那些“宣讲融合之价值”的社会混合政策，一面又在促成“自愿脱离式的居住变迁”，而后者“必定损害”城市未来的公民活力前景。但这同时也意味着：要对绅士化过程保持批判，尤其是对那些试图对我们的中心城市进行社会工程改造——我甚至敢说是<strong>社会清洗</strong>——的国家主导型绅士化政策保持批判（见 Lees et al., 2008）。</p></div>", "toc": [{"idx": 0, "level": "h2", "en": "Introduction", "zh": "引言"}, {"idx": 2, "level": "h2", "en": "Gentrification and Social Mixing", "zh": "绅士化与社会混合"}, {"idx": 15, "level": "h2", "en": "Policies of Gentrification and Social Mixing", "zh": "绅士化与社会混合的政策"}, {"idx": 23, "level": "h3", "en": "The United Kingdom", "zh": "英国"}, {"idx": 36, "level": "h3", "en": "The United States", "zh": "美国"}, {"idx": 46, "level": "h3", "en": "The Netherlands", "zh": "荷兰"}, {"idx": 53, "level": "h2", "en": "Gentrification and Social Mixing: A Critique", "zh": "绅士化与社会混合：一种批判"}, {"idx": 57, "level": "h2", "en": "Critique 1 — Gentrification Causes Overwhelmingly Negative Effects", "zh": "批判之一 —— 绅士化导致压倒性的负面效应"}, {"idx": 64, "level": "h2", "en": "Critique 2 — Gentrification does not engender social mixing", "zh": "批判之二 —— 绅士化并不会催生社会混合"}, {"idx": 80, "level": "h2", "en": "Critique 3 — Social Mixing is a One-sided Strategy that is Seldom Advocated in Wealthier Neighbourhoods", "zh": "批判之三 —— 社会混合是一种单方面的策略，鲜少被提倡用于更富裕的街区"}, {"idx": 83, "level": "h2", "en": "Critique 4 — Gentrification-induced Social Mix Threatens the Benefits Accrued from Social Segregation", "zh": "批判之四 —— 绅士化诱发的社会混合，威胁到了社会隔离本可积累的种种收益"}, {"idx": 87, "level": "h2", "en": "Critique 5 — Social Mix Policy Fails to Demonstrate How ‘Social Mixing’ between Diverse Neighbourhood Groups is Going to be Achieved", "zh": "批判之五 —— 社会混合政策从未说明，不同街区群体之间的“社会混合”究竟要如何实现"}, {"idx": 92, "level": "h2", "en": "Critique 6 — What Kinds and How Much Social Mixing — And Why — Are Often Poorly Specified", "zh": "批判之六 —— 究竟需要何种、多少社会混合，以及为什么，政策文献往往语焉不详"}, {"idx": 98, "level": "h2", "en": "Conclusion", "zh": "结论"}]}, "yrjana-2026-helsinki-state-led-gentrification": {"meta": {"title_en": "By any means necessary: the anti-segregation efforts and state-led gentrification in Helsinki", "title_zh": "不惜一切手段:赫尔辛基的反隔离努力与国家主导型绅士化", "crumb": "Yrjänä 2026 · 赫尔辛基国家主导型绅士化"}, "html": "<h2 class=\"sec\" data-secidx=\"0\"><span class=\"en\">1. Introduction</span><span class=\"zh\">1. 引言</span></h2><div class=\"para quote\" data-idx=\"1\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"326278898a\"><p class=\"en\">“By looking at Sweden or France, you can see that segregation is a real danger. Now we are trying to avoid the development where not all children can participate in society and where neighborhoods become unequal”</p><p class=\"zh\">“看看瑞典或法国就知道,居住隔离是一种真实的危险。我们现在要努力避免的,就是那种不是所有孩子都能参与社会生活、社区之间彼此不平等的发展方向。”</p><span class=\"attrib\">当时的赫尔辛基市长 Juhana Vartiainen 接受《赫尔辛基新闻》(Helsingin Sanomat,芬兰发行量最大的报纸)采访时的原话(Palkoaho, 2024)——这是作者Yrjänä 在文章开篇引用的政治人物话语,用来呈现她接下来要分析、质疑的官方话语本身,并不是作者本人的立场。</span></div><div class=\"para\" data-idx=\"2\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"b25d095bec\"><p class=\"en\">Whether Finland is on ‘Sweden’s way’ towards increased riots and street violence, or not, has been a hot topic in Finland in recent years. In European comparison, Finland has a relatively low level of residential segregation (Tammaru et al., 2021). Matti Kortteinen (2022, p. 32) notes that discussions about segregation and its consequences, such as riots seen in the outskirts of Swedish and French cities, often start from the assumption that due to social mix policies and more moderate immigration, the situation is fundamentally different in Finland than in other countries. However, a concern about the increase in segregation is shared in three major cities (Helsinki, Tampere and Turku). They all apply social mixing to a varying degree, though the history of social mixing is longest in Helsinki (Ruonavaara et al., 2025).</p><p class=\"zh\">芬兰是否正走在‘瑞典式’骚乱与街头暴力增多的道路上,近年来一直是芬兰社会热议的话题。就欧洲范围的比较而言,芬兰的居住隔离程度相对较低(Tammaru et al., 2021)。Matti Kortteinen(2022, 第32页)指出,有关隔离及其后果(比如瑞典和法国城市外围发生的骚乱)的讨论,往往一开始就预设:由于社会混合政策和较为温和的移民政策,芬兰的情况与其他国家有根本性的不同。然而,对隔离加剧的担忧在三大城市(赫尔辛基、坦佩雷和图尔库)中都存在。三座城市都在不同程度上实行社会混合,但赫尔辛基推行社会混合的历史最为悠久(Ruonavaara et al., 2025)。</p></div><div class=\"para\" data-idx=\"3\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"74fb12ab16\"><p class=\"en\">Social mix policies have historically responded to fears that the concentration of working-class people would lead to more open class conflict and social disorder (Arthurson, 2008). That was the case also in Helsinki. Working-class families that were relocated from inner-city neighborhoods during the slum clearance settled in a newly built post-war social housing estate in eastern Helsinki. Political concerns about disorder emerged from clashes between local youth and the police, birthing the idea of deconcentrating working-class populations in the early 1960s (Schulman et al., 2000). Due to its systematic social mix policy in the development of new residential areas since the 1970s (Kortteinen, 2022), the City of Helsinki prides itself for having better prevented segregation than its peer cities.</p><p class=\"zh\">从历史上看,社会混合政策的出台,是为了回应人们对于工人阶级人口集中可能导致更公开的阶级冲突和社会失序的担忧(<a class=\"gref\" href=\"#g-arthurson\">Arthurson</a>, 2008)。赫尔辛基的情况也是如此。在贫民窟清理过程中从内城社区迁出的工人阶级家庭,被安置进了赫尔辛基东部一处新建的战后社会住房社区。当地青年与警察之间发生的冲突,引发了政治层面对社会失序的忧虑,并由此催生了在20世纪60年代初分散工人阶级人口的构想(Schulman et al., 2000)。由于自20世纪70年代以来在新住宅区开发中系统性地推行社会混合政策(Kortteinen, 2022),赫尔辛基市一直以自己比同类城市更好地防止了隔离而自豪。</p></div><div class=\"para\" data-idx=\"4\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"c7cc8e12db\"><p class=\"en\">To implement Helsinki’s strategic goal of maintaining its position as a European textbook example in how to prevent segregation, a ‘new urban regeneration model’ was launched in 2020. The aims of the model are to deconcentrate socioeconomically disadvantaged groups and ethnic minorities and to increase property values and the share of owner-occupied housing in four residential areas with considerable social rental housing. Some of the neighborhoods in question have for decades been objects of area-based initiatives, promoted and funded both nationally and by the European Union, such as URBAN II (2000–2006). Helsinki has had about twice as many area-based initiatives targeted to deprived neighborhoods than the other two major cities in Finland (see Ruonavaara et al., 2025).</p><p class=\"zh\">为了落实赫尔辛基‘保持其作为欧洲防止隔离教科书式典范地位’这一战略目标,该市于2020年推出了一套<a class=\"gref\" href=\"#g-kaupunkiuudistus\">‘城市更新新模式’(new urban regeneration model)</a>。这一模式的目标是分散社会经济弱势群体和少数族裔的聚居,并在四个社会租赁住房占比较高的居住区中提升房产价值和自有产权住房的比例。其中一些社区数十年来一直是各类‘片区计划’(area-based initiatives)的对象,这些计划由国家和欧盟共同推动和资助,例如<a class=\"gref\" href=\"#g-urbanii\">URBAN II 计划</a>(2000–2006年)。相比芬兰另外两座大城市,赫尔辛基针对弱势社区实施的片区计划数量大约是它们的两倍(见 Ruonavaara et al., 2025)。</p></div><div class=\"para\" data-idx=\"5\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"956210ecac\"><p class=\"en\">Against this historical continuum of urban policy that constitutes the regeneration areas as “objects of intervention” (Dikeç, 2007, p. 21), this article analyzes the role of anti-segregation discourse in the latest round of public investments directed at two peripheral residential areas in eastern Helsinki: Mellunkylä and Meri-Rastila. A few words on the Finnish housing regime are in order. In Finland, the supply of housing has mostly been left to the market. Owner-occupation is seen as the standard and renting is considered something temporary or for those unable to access owner-occupation. Housing policy is a social policy providing state-subsidized social rental housing and housing allowances primarily for those who cannot afford private rental housing. The role of Finnish housing policy is therefore to correct the failures of the housing market (see Rasinkangas et al., 2024).</p><p class=\"zh\">正是在这样一种将更新片区不断建构为“干预对象”(Dikeç, 2007, 第21页)的城市政策历史延续中,本文分析了反隔离话语在最新一轮针对赫尔辛基东部两个边缘居住区——<a class=\"gref\" href=\"#g-mellunkyla\">Mellunkylä</a> 和 <a class=\"gref\" href=\"#g-merirastila\">Meri-Rastila</a>——的公共投资中所扮演的角色。这里有必要先简要说明芬兰的住房体制。在芬兰,住房供给主要交由市场。自有产权被视为标准状态,而租赁则被视为一种临时安排,或是那些无法获得自有产权的人的选择。住房政策属于社会政策的一部分,主要面向那些无力负担私人租赁住房的人群,提供国家补贴的社会租赁住房和住房补贴。因此,芬兰住房政策的作用是纠正住房市场的失灵(见 Rasinkangas et al., 2024)。</p></div><div class=\"para\" data-idx=\"6\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"051496b371\"><p class=\"en\">An early 1990s retrenchment phase introduced heightened selectivity, and tenants were increasingly chosen based on social criteria. This resulted in state-subsidized housing being associated with marginalized people and perceived as a form of social assistance. In Helsinki, the stigmatization of the tenure form has contributed to territorial stigmatization of the peripheral housing estates, where social housing is disproportionally located (Hyötyläinen, 2020). It is these neighborhoods that policymakers are increasingly worried about ‘lagging behind’ the city’s socioeconomic average.</p><p class=\"zh\">20世纪90年代初的一轮紧缩改革带来了更严格的准入筛选,承租人的选择也越来越依据社会性标准。这使得国家补贴住房与边缘化群体产生了关联,被视为一种社会救助形式。在赫尔辛基,这种租赁形式本身的污名化,进一步造成了社会住房过度集中的边缘居住区的地域污名化(territorial stigmatization)(Hyötyläinen, 2020)。正是这些社区,让政策制定者越来越担心其社会经济水平‘落后于’全市平均水平。</p></div><div class=\"para\" data-idx=\"7\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"716022fdb1\"><p class=\"en\">If there is Finnish exceptionalism regarding the regulation of segregation (Kortteinen, 2022), this is perhaps even more so the case with gentrification. With a recent exception (Drain, 2024), gentrification in Helsinki has attracted little scholarly attention. Even less attention has been paid to the municipality’s active role in gentrification dynamics, despite the strong currency of social mix in redeveloping neighborhoods with a large number of social housing estates, which, in international literature, is associated with gentrification (see Arthurson et al., 2015; Lees, 2008). The absence of displacement in terms of spatial relocation in regeneration processes in Helsinki (Saarimaa &amp; Ventovuori, 2024) has been indirectly advocated as ‘positive gentrification’ (Shaw &amp; Hagemans, 2015).</p><p class=\"zh\">如果说在隔离治理问题上确实存在“芬兰例外论”(Kortteinen, 2022),那么这一点在绅士化问题上或许更加突出。除了最近的一项例外研究(Drain, 2024),赫尔辛基的绅士化几乎没有得到学界关注,而市政当局在绅士化动态中所扮演的能动角色,受到的关注就更少了——尽管在国际文献中,社会混合恰恰与大量社会住房社区的重建密切相关,并被普遍视为绅士化的一种形式(见 Arthurson et al., 2015; <a class=\"gref\" href=\"#g-lees\">Lees</a>, 2008)。赫尔辛基更新过程中在空间迁移意义上不存在“置换”(displacement)这一事实(Saarimaa & Ventovuori, 2024),已被间接地包装为一种‘<a class=\"gref\" href=\"#g-positive-gent\">积极的绅士化</a>’(positive gentrification)(Shaw & Hagemans, 2015)。</p></div><div class=\"para\" data-idx=\"8\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"28b4f8085a\"><p class=\"en\">In fact, Helsinki has explicitly viewed gentrification as a counterforce to segregation.</p><p class=\"zh\">事实上,赫尔辛基一直明确地将绅士化视为对抗隔离的一种反作用力。</p></div><div class=\"para quote\" data-idx=\"9\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"8938d37436\"><p class=\"en\">“When planning infill construction, segregation can be purposefully combated, and the possibility of the areas’ gentrification can be emphasized. Gentrification refers to the socio-economic rise of areas with lower status.”</p><p class=\"zh\">“在规划填充式建设(infill construction)时,可以有意识地对抗隔离,并强调这些片区实现绅士化的可能性。绅士化指的是地位较低地区在社会经济层面的地位上升。”</p><span class=\"attrib\">赫尔辛基市城市规划文件《郊区复兴》(Suburban Renaissance, City of Helsinki, 2008: 9)原文——作者引用这份官方规划文件,是为了证明赫尔辛基城市政策曾经何等直白地把‘绅士化’当作反隔离的正面手段来使用,这是作者接下来要批判、揭示其代价的官方话语,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"10\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1044467ab9\"><p class=\"en\">Although policy language has since replaced the ‘dirty word’ (Smith, 1996) with terms that avoid class dispositions of the process, such as urban regeneration, urban renaissance, and urban sustainability (Porter &amp; Shaw, 2013; Smith, 1996), the goals and the means of land use and housing policies remain. Increased financialization of housing markets and intensified urban regeneration processes have already caused concerns about displacement pressures in other Nordic states, which have historically had regulated housing systems and good tenant protections (Listerborn &amp; Baeten, 2022). However, contemporary gentrification is a global phenomenon with local variations (Thörn &amp; Holgersson, 2016), and the legal and institutional framework that regulates investment and disinvestment (Krijnen, 2018) distinguishes Helsinki from its Nordic counterparts as well.</p><p class=\"zh\">虽然此后的政策话语已经用‘城市更新’(urban regeneration)、‘城市复兴’(urban renaissance)、‘城市可持续性’(urban sustainability)等回避阶级色彩的说法,取代了‘绅士化’这个‘脏词’(dirty word)(<a class=\"gref\" href=\"#g-smith\">Smith</a>, 1996;Porter & Shaw, 2013),但土地利用与住房政策的目标和手段并没有改变。住房市场金融化程度的加深和城市更新进程的加剧,已经在其他北欧国家引发了对置换压力的担忧,而这些国家历来拥有受管制的住房体系和较好的租户保护(Listerborn & Baeten, 2022)。然而,当代绅士化是一种具有地方差异的全球现象(Thörn & Holgersson, 2016),而调节投资与撤资的法律与制度框架(<a class=\"gref\" href=\"#g-krijnen\">Krijnen</a>, 2018),同样使赫尔辛基有别于其北欧同类城市。</p></div><div class=\"para\" data-idx=\"11\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"765a29b29f\"><p class=\"en\">This article contributes to the burgeoning literature on state-led gentrification in the Nordic countries by asking: What is the significance of policy in creating gentrifiable areas in Helsinki and how is the policy legitimated? Inspired by Maarten Hajer (1995), this article looks at how politically approved urban planning documents create the problem of segregation in Helsinki in such a way that urban regeneration offers a solution to it. The policy analysis is enriched with ethnographic fieldnotes from the regeneration areas Mellunkylä and Meri-Rastila and other case study methods, to identify the inherent instability of urban regeneration and its material consequences.</p><p class=\"zh\">本文通过提出以下问题,为方兴未艾的北欧<a class=\"gref\" href=\"#g-stateled\">国家主导型绅士化</a>(state-led gentrification)研究文献作出贡献:政策在赫尔辛基‘使某些片区变得可绅士化’(gentrifiable)的过程中发挥了怎样的作用?这种政策又是如何获得正当性的?受 Maarten Hajer(1995)启发,本文考察了经过政治程序批准的城市规划文件,是如何在赫尔辛基建构出‘隔离问题’,并使城市更新恰好成为这一问题的解决方案的。政策分析还辅以来自 Mellunkylä 和 Meri-Rastila 两个更新片区的民族志田野笔记及其他案例研究方法,以识别城市更新内在的不稳定性及其在物质层面的后果。</p></div><div class=\"para\" data-idx=\"12\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"95446beb9d\"><p class=\"en\">Not only has current economic uncertainty stagnated the construction industry, but the regeneration areas can be considered difficult to develop (Hackworth &amp; Smith, 2001) due to vast municipal landownership and the stigma attached to dense social housing. These factors have hindered investments and made state interventions necessary. This article thus responds to Gray and Kallin (2023) call to critically investigate the state’s facilitation in stagnant regeneration processes. The article continues with an elaboration of a theoretical framework on state-led gentrification. It then presents the city’s new urban regeneration model, the selected case areas and the methods. It next analyzes the justifications for urban regeneration and how the city utilizes planning monopoly and land ownership in attempts to form and close rent gaps in the two disinvested areas. It concludes that Helsinki’s social mix policy as a corrective anti-segregation measure is a form of state-led gentrification that, instead of challenging urban inequality, legitimizes the status quo of neoliberal urbanism.</p><p class=\"zh\">当前的经济不确定性不仅使建筑行业陷入停滞,更新片区本身也因大量的市属土地所有权和高密度社会住房带来的污名,而可以被视为‘难以开发’的地区(Hackworth & Smith, 2001)。这些因素阻碍了投资,使得国家干预变得必要。因此,本文回应了 <a class=\"gref\" href=\"#g-gray\">Gray</a> 和 Kallin(2023)提出的呼吁,即批判性地考察国家在停滞的更新进程中所起的促成作用。文章接下来先阐述国家主导型绅士化的理论框架,再介绍该市的城市更新新模式、所选案例片区及研究方法;随后分析城市更新的正当化论述,以及该市如何运用其<a class=\"gref\" href=\"#g-planningmonopoly\">规划垄断</a>权和土地所有权,试图在两个撤资片区中形成并弥合租隙(rent gap)。最后得出结论:赫尔辛基将社会混合政策作为一种反隔离的矫正措施,实质上是国家主导型绅士化的一种形式——它非但没有挑战城市不平等,反而使新自由主义城市主义的现状得以正当化。</p></div><h2 class=\"sec\" data-secidx=\"13\"><span class=\"en\">2. Theoretical perspective: State-led gentrification</span><span class=\"zh\">2. 理论视角:国家主导型绅士化</span></h2><div class=\"para\" data-idx=\"14\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"cd69e906de\"><p class=\"en\">European welfare states have historically been able to moderate gentrification’s worst social consequences by stricter regulation of the movement of capital (Lees, 2012; Risager, 2022). However, even in Nordic welfare states, where planning and regulation have usually ruled over the land market, local governments are increasingly treating land as a financial asset according to the rent it grants (Hyötyläinen, 2022). Since the neoliberalization of the Nordic welfare state, welfare provision and governance have relied increasingly on the movement of capital. Processes like gentrification are thus sometimes instrumentalized by the state without the movement of capital as its only aim (Krijnen, 2018; Risager, 2022).</p><p class=\"zh\">从历史上看,欧洲福利国家一直能够通过对资本流动的更严格管制,来缓和绅士化最严重的社会后果(Lees, 2012; Risager, 2022)。然而,即便在规划与管制历来主导土地市场的北欧福利国家,地方政府也越来越倾向于按照土地所能带来的地租,把土地当作一种金融资产来对待(Hyötyläinen, 2022)。自北欧福利国家新自由主义化以来,福利供给与治理越来越依赖资本的流动。因此,像绅士化这样的过程,有时会被国家工具化地加以利用,而资本流动本身并非其唯一目的(Krijnen, 2018; Risager, 2022)。</p></div><div class=\"para\" data-idx=\"15\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"145b60e90f\"><p class=\"en\">The gentrification process is famously explained by Neil Smith’s (1979) rent gap theory. Rent-gap refers to the increase in the value of land and real estate brought about by different urban development strategies when the state seeks to maximize the value of real estate and land, by bridging the gap between current and potential value. The urban development strategies can include densification (Cavicchia, 2021) and demolition (Watt, 2023), or be more related to green gentrification, for example investing in parks and public spaces (Wallin, 2021) and transit-oriented development (Lutz et al., 2024).</p><p class=\"zh\">绅士化过程最著名的理论解释来自 Neil Smith(1979)的<a class=\"gref\" href=\"#g-rentgap\">租隙理论(rent gap theory)</a>。<a class=\"gref\" href=\"#g-rentgap\">租隙(rent gap)</a>指的是当国家试图通过弥合土地与地产的现有价值与潜在价值之间的差距,来实现地产与土地价值最大化时,不同城市开发策略所带来的土地与地产价值的增长。这些城市开发策略可以包括密集化建设(densification)(Cavicchia, 2021)和拆除重建(demolition)(<a class=\"gref\" href=\"#g-watt\">Watt</a>, 2023),也可以更多地与绿色绅士化(green gentrification)相关,例如对公园和公共空间的投资(Wallin, 2021),以及以公共交通为导向的开发(transit-oriented development)(Lutz et al., 2024)。</p></div><div class=\"para\" data-idx=\"16\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"e9da49b5e5\"><p class=\"en\">Although gentrification has been an urban planning strategy in Helsinki for years (Mäenpää, 2011), the peripheral neighborhoods with concentrated social housing stock continue to be ‘objects of intervention’ (Dikeç, 2007, p. 21) – implying some type of ‘failure’. Krijnen (2018) proposes an analytical distinction between rent gap formation and rent gap closure: formation of a rent gap does not guarantee its closure, e.g., gentrification. How rent gaps are formed depends on institutional frameworks including political, social, and cultural processes that regulate investment and disinvestment in a given location. The state’s role in the formation and closure of rent gaps becomes even more central in ‘difficult-to-develop’ neighborhoods (Hackworth &amp; Smith, 2001; Mösgen et al., 2019) and in times of economic crisis.</p><p class=\"zh\">尽管绅士化作为一种城市规划策略,在赫尔辛基已经存在多年(Mäenpää, 2011),但社会住房高度集中的边缘社区却始终是‘干预对象’(Dikeç, 2007, 第21页)——这本身就暗示着某种‘失败’。Krijnen(2018)提出了一个分析性的区分:租隙的形成(rent gap formation)与租隙的弥合(rent gap closure)。租隙的形成并不保证它一定会被弥合,也就是说,并不必然导向绅士化。租隙如何形成,取决于调节特定地点投资与撤资的制度框架,包括政治、社会和文化过程。在‘难以开发’的社区(Hackworth & Smith, 2001; Mösgen et al., 2019)以及经济危机时期,国家在租隙形成与弥合中所扮演的角色就变得尤为关键。</p></div><div class=\"para\" data-idx=\"17\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"27a14353f0\"><p class=\"en\">State subsidy gap refers to the economic gap that the state must bridge to de-risk development and create the conditions for private investments. The state can bridge the subsidy gap through, for example, land remedies, land sales, and increased land purchases from private landowners (Gray, 2022; Gray &amp; Kallin, 2023). The discourse that has resonated loudest in urban regeneration, and through which the need for it has been most frequently articulated and justified, has been one of lessening concentrated disadvantage through social mix (Sisson, 2021a). Statistical data and cartographic representations have played important roles in legitimating the discourse of social mix by portraying housing estates as if they were separate and isolated territories of disadvantage that are disconnected from their surrounding sociopolitical context (Dikeç, 2007; Sisson, 2021a).</p><p class=\"zh\"><a class=\"gref\" href=\"#g-subsidygap\">国家补贴缺口(state subsidy gap)</a>指的是国家为给开发‘去风险’(de-risk)、为私人投资创造条件而必须弥合的那部分经济缺口。国家可以通过诸如土地整治、出售土地、加大从私人土地所有者手中购地等方式来弥合这一补贴缺口(Gray, 2022; Gray & Kallin, 2023)。在城市更新中回响最响亮、最经常被用来阐述和正当化更新必要性的话语,是通过<a class=\"gref\" href=\"#g-socialmix\">社会混合(social mix)</a>来减少弱势群体集中的话语(Sisson, 2021a)。统计数据和制图表征在使社会混合话语正当化的过程中发挥了重要作用,它们把住房社区描绘成仿佛是与周围社会政治情境相脱节的、孤立分离的弱势‘领地’(Dikeç, 2007; Sisson, 2021a)。</p></div><div class=\"para\" data-idx=\"18\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"a0c67306ef\"><p class=\"en\">Indeed, the formation of rent gaps cannot exist without the activation of territorial stigma (Kallin &amp; Slater, 2014; Thörn &amp; Holgersson, 2016), that reduces a place to a one-dimensional ‘badland’ (Dikeç, 2007) and thus justifies radical policy interventions targeted at the stigmatized neighborhoods (Olsen &amp; Larsen, 2023). Kallin (2017) introduces the term reputational gap to explain the role of territorial stigma in the visionary work of state-led gentrification. Holding the imagined ‘potential’ of a place against the current defamed version serves to increase the chances of urban intervention. The state thus facilitates the stigma of a place to form the rent gap that it aims to close through urban regeneration. For Kallin (2017) the emphasis is on the desire and determination for the existence of a rent gap, which have more power than the actual existence of one.</p><p class=\"zh\">事实上,租隙的形成离不开<a class=\"gref\" href=\"#g-territorialstigma\">地域污名(territorial stigma)</a>的激活(Kallin & <a class=\"gref\" href=\"#g-slater\">Slater</a>, 2014; Thörn & Holgersson, 2016)——污名将一个地方简化为单一维度的‘恶地’(badland)(Dikeç, 2007),从而使针对污名化社区的激进政策干预获得正当性(Olsen & Larsen, 2023)。<a class=\"gref\" href=\"#g-kallin\">Kallin</a>(2017)提出了<a class=\"gref\" href=\"#g-reputationgap\">声誉缺口(reputational gap)</a>这一概念,用以解释地域污名在国家主导型绅士化的‘愿景构建’工作中所起的作用。将一个地方想象中的‘潜力’与其当下被污名化的版本相对照,能够提高城市干预获得推进的机会。由此,国家借助地方污名来形成它随后打算通过城市更新加以弥合的租隙。对 Kallin(2017)而言,重点在于人们对租隙存在的渴望与决心,而这种渴望和决心,其力量甚至超过了租隙是否真实存在本身。</p></div><div class=\"para\" data-idx=\"19\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"925021cc99\"><p class=\"en\">The effects of gentrification on the poor are often linked to physical displacement, which can occur via demolition of public housing estates and the following redevelopment of the area as mixed tenure (Hubbard &amp; Lees, 2021; Watt, 2021) or via other regeneration strategies like renovation and upgrading of existing estates (Baeten et al., 2017; Polanska &amp; Richard, 2021; Pull &amp; Richard, 2021). Nevertheless, an understanding of displacement only as a spatial event of relocation is insufficient and can serve to legitimize pro-gentrification policies (Davidson, 2009), when the absence of physical relocation is taken as an absence of displacement (see Saarimaa &amp; Ventovuori, 2024).</p><p class=\"zh\">绅士化对穷人的影响,通常被与物理性的<a class=\"gref\" href=\"#g-displacement\">置换(displacement)</a>联系在一起——这种置换可能通过拆除公共住房社区、随后将该地区重建为混合产权住区而发生(Hubbard & Lees, 2021; Watt, 2021),也可能通过翻新和升级既有社区等其他更新策略而发生(Baeten et al., 2017; Polanska & Richard, 2021; Pull & Richard, 2021)。然而,仅仅把置换理解为一种空间上的迁移事件是不够的,当没有发生实际的物理迁移就被当作没有发生置换时(见 Saarimaa & Ventovuori, 2024),这种理解甚至可能反过来为支持绅士化的政策提供正当性(Davidson, 2009)。</p></div><div class=\"para\" data-idx=\"20\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"23bf4494f1\"><p class=\"en\">A socio-cultural displacement can occur when a person continues to live in the same apartment, but the neighborhood and environment become a foreign place to them, for example through new infill construction (Davidson, 2009, 228.) The precarity of urban regeneration in itself can create ontological insecurity among residents (Watt, 2021). Displacement can also be indirect and exclusionary (Marcuse, 1985) – when the pool of affordable housing becomes smaller, this prevents lower income households from moving into a neighborhood.</p><p class=\"zh\">社会文化层面的置换(socio-cultural displacement)也可能发生:一个人仍然住在同一套公寓里,但由于新的填充式建设等原因,周边的社区和环境已经变得对他们而言十分陌生(Davidson, 2009, 第228页)。城市更新本身的不确定性,就可能在居民中造成本体论层面的不安全感(ontological insecurity)(Watt, 2021)。置换也可能是间接的、排斥性的(exclusionary)(Marcuse, 1985)——当可负担住房的存量变小时,这会阻止低收入家庭迁入某个社区。</p></div><h2 class=\"sec\" data-secidx=\"21\"><span class=\"en\">3. Case: Helsinki’s new urban regeneration model</span><span class=\"zh\">3. 案例:赫尔辛基的城市更新新模式</span></h2><div class=\"para\" data-idx=\"22\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"73ba4e3249\"><p class=\"en\">Helsinki Metropolitan Area is the largest urban area in Finland. In 2025, the population of the metropolitan area was around 1,280,000, of which around 689,758 lived in the city of Helsinki. Helsinki has a higher population growth rate than most other municipalities, and much of it is due to a growing immigrant population. However, Finland has a rather novel history with immigration, and ethnic segregation in Helsinki is not comparable to other Nordic capitals such as Stockholm (see Tammaru et al., 2021). Segregation in Helsinki is foremost socioeconomic, although ethnic and socioeconomic segregation are increasingly overlapping also in the Finnish capital (Bernelius &amp; Vilkama, 2019; Saikkonen et al., 2018).</p><p class=\"zh\">赫尔辛基都市区是芬兰最大的城市区域。截至2025年,该都市区人口约128万,其中约689,758人居住在赫尔辛基市本身。赫尔辛基的人口增长率高于芬兰大多数其他市镇,其中很大一部分增长来自移民人口的增加。然而,芬兰在移民问题上的历史相当晚近,赫尔辛基的族裔隔离程度也无法与斯德哥尔摩等其他北欧首都相比(见 Tammaru et al., 2021)。赫尔辛基的隔离首先是社会经济性质的,尽管在这座芬兰首都,族裔隔离与社会经济隔离也正日益重叠(Bernelius & Vilkama, 2019; Saikkonen et al., 2018)。</p></div><div class=\"para\" data-idx=\"23\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"59096229b6\"><p class=\"en\">To realize its strategic anti-segregation goal, the City of Helsinki launched a new urban regeneration model in 2020 as part of the Implementation Program on Housing and Related Land Use. The model, focusing on four urban regeneration areas in the periphery of Helsinki (Fig. 1), is planned to serve as a pilot for future development of disadvantaged neighborhoods. The stated purposes of the urban regeneration are to strengthen the social sustainability and the overall comfort and safety of the areas, and to upgrade the profile and reputation of the neighborhoods through increased vitality and attractiveness. The development is monitored using indicators such as share of foreign language speakers, a socioeconomic sum index (education, income, and unemployment levels), the number of recipients of housing allowance and income support, price per square meter, and distribution of housing tenure:</p><p class=\"zh\">为了实现其反隔离的战略目标,赫尔辛基市于2020年作为<a class=\"gref\" href=\"#g-landuseprogram\">《住房及相关土地利用实施方案》</a>(Implementation Program on Housing and Related Land Use)的一部分,推出了一套城市更新新模式。该模式聚焦于赫尔辛基边缘地区的四个城市更新片区(见图1),计划作为未来开发弱势社区的试点。城市更新的官方目标是加强这些片区的社会可持续性以及整体的舒适度与安全性,并通过提升活力与吸引力来改善社区的形象和声誉。这一开发过程通过以下指标加以监测:外语使用人口比例、社会经济综合指数(教育、收入与失业水平)、住房补贴与收入救济领取人数、每平方米房价,以及住房产权形式的分布:</p></div><div class=\"para quote\" data-idx=\"24\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"e0eb4bb691\"><p class=\"en\">Considering various factors, these areas need special attention from the city to stay comfortable and attractive. The areas have lagged behind the rest of the city in terms of socio-economic indicators.</p><p class=\"zh\">综合考虑各种因素,这些片区需要市政府的特别关注,才能维持其舒适性与吸引力。这些片区在社会经济指标上,已经落后于全市其他地区。</p><span class=\"attrib\">赫尔辛基市官方说明文件原文(City of Helsinki, n.d.-a)——作者引用这段城市官方话语,是为了呈现城市自身如何用‘落后’‘需要特别关注’这类语言来界定和证成对这些片区的干预,并非作者本人的评价。</span></div><div class=\"para\" data-idx=\"25\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"6936fb8ed8\"><p class=\"en\">In addition to socioeconomic factors, an important requirement for the development of regeneration areas was their location along rail networks. In accordance with the cross-municipal development strategy (MAL), transit nodes along the railway and metro lines are made into hotspots of densification. It makes them easily accessible by public transportation, which will be expanded within the regeneration timeline. Another criterion for regeneration was the share of rentals. The areas’ socioeconomic decline has long been associated with the share of social rental housing, but developments in recent years have shown that increased financialization and concentrations of private rentals have also become a segregating factor in the capital region (see City of Helsinki, 2021a; Lilius &amp; Hirvonen, 2021; Rosengren et al., 2024). Therefore, in areas where the share of rentals exceeds 50 % of the area’s housing stock and does not align with the city’s goal (City of Helsinki, 2021a, p. 70), urban regeneration focuses mostly on introducing owner-occupied housing through infill development. Densification is primarily zoned on existing plots and around metro stations.</p><p class=\"zh\">除了社会经济因素之外,更新片区能否入选的一项重要条件,是它们是否位于轨道交通网络沿线。根据跨市镇发展战略(MAL),铁路和地铁沿线的交通节点被打造成密集化建设的热点区域,这使得这些片区更容易通过公共交通到达,而公共交通网络也将在更新的时间框架内进一步扩展。更新片区的另一项遴选标准,是租赁住房的比例。这些片区社会经济地位的下滑长期以来被归因于社会租赁住房的比例,但近年来的发展表明,金融化程度的加深以及私人租赁住房的集中,也已成为都市区的一种致隔离因素(见 City of Helsinki, 2021a; Lilius & Hirvonen, 2021; Rosengren et al., 2024)。因此,在租赁住房比例超过该片区住房存量50%、与城市目标不符的地区(City of Helsinki, 2021a, 第70页),城市更新的重点主要是通过填充式开发引入自有产权住房。密集化建设主要规划在既有地块以及地铁站周边区域。</p></div><div class=\"para\" data-idx=\"26\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1dab1dfc36\"><p class=\"en\">The urban regeneration model, despite being a meaningful part of the city’s urban policy, lacks official documents on the strategy and details of the model. This can be explained by the fact that Helsinki does not have a specific program or policy aimed at segregation. An anti-segregation framework is integrated into the strategy, land use, and housing policies. The article’s analysis is primarily based on the following documents that were selected based on being (politically negotiated) guiding policy documents. Finnish municipalities have legal planning monopolies, but growing urban regions are also bounded by MAL-agreements. MAL-agreement is a cross-municipal planning cooperation, where agreements regarding land use (M), housing (A) and transportation (L) are made between urban regions and the state. MAL-agreements from 2020 and 2024 were analyzed here. The 2024 agreement, agreed during Petteri Orpo’s right-wing government, differs significantly from its predecessor in that it does not provide municipalities with state support for implementing housing policy or achieving housing production targets.</p><p class=\"zh\">尽管城市更新新模式已是该市城市政策中颇具分量的一部分,但关于该模式的战略和细节,却并没有专门的官方文件。这可以解释为:赫尔辛基并没有一项专门针对隔离问题的独立方案或政策,反隔离框架是被整合进城市战略、土地利用与住房政策之中的。本文的分析主要基于以下几类文件,它们均是经过政治协商、具有指导性的政策文件。芬兰各市镇在法律上拥有规划垄断权(planning monopoly),但不断扩张的城市区域也受制于<a class=\"gref\" href=\"#g-mal\">MAL协议(MAL-agreement)</a>的约束。MAL协议是一种跨市镇的规划合作机制,由城市区域与国家就土地利用(M)、住房(A)和交通(L)达成协议。本文分析了2020年和2024年两版MAL协议。2024年协议是在 Petteri Orpo 领导的右翼政府任内达成的,与前一版相比有显著差异:它不再为市镇提供落实住房政策或实现住房建设目标所需的国家支持。</p></div><div class=\"para\" data-idx=\"27\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"29d220da47\"><p class=\"en\">Helsinki City Strategies (2017 and 2021) serve as guidelines for the city’s future operations and finances for four years and are its most explicitly political documents. That is where branding happens, and the future is imagined. The Master Plan (City of Helsinki, 2013) is a long-term land use plan that guides development of the city’s urban structure and predicts what Helsinki will be like decades from now. The Master Plan is drawn up approximately every 10 years. The long-term planning of housing and land policy is steered by the Implementation Program on Housing and Related Land Use (hereafter Land Use), which is prepared every council term. The most recent Land Use program (City of Helsinki, 2024a) envisions a Helsinki growing in a socially sustainable manner with diverse high-quality housing options that contribute to the vitality and attractiveness of the city. Most of the urban regeneration is discussed in Land Use programs from 2020 and 2024.</p><p class=\"zh\">赫尔辛基《城市战略》(City Strategy,2017年版与2021年版)是该市未来四年运营和财政的指导文件,也是其政治色彩最为鲜明的文件——品牌化的塑造和未来的想象,正是在这里完成的。《总体规划》(Master Plan, City of Helsinki, 2013)是一份长期土地利用规划,用以指导该市城市结构的发展,并对赫尔辛基未来数十年的面貌作出预测,大约每十年编制一次。住房与土地政策的长期规划,则由每届市议会任期编制一次的《住房及相关土地利用实施方案》(Implementation Program on Housing and Related Land Use,以下简称“土地利用方案”/Land Use)来引导。最新一版土地利用方案(City of Helsinki, 2024a)设想赫尔辛基将以一种社会可持续的方式增长,提供多样化、高品质的住房选择,以增进城市的活力与吸引力。本文讨论的绝大多数城市更新内容,均出自2020年版和2024年版的土地利用方案。</p></div><div class=\"para\" data-idx=\"28\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"b6c64960bb\"><p class=\"en\">My approach to the urban policy documents was inspired by Maarten Hajer. I wanted to understand why a particular approach to preventing urban inequality at this time and place gains (and maintains) authority while discrediting other measures. According to Hajer (1995), policymaking is the creation of the kinds of problems that institutions can handle and respond to. Central to Hajer’s work is the concept of storylines that reduce the discursive complexity of a problem and create the possibility of a problem closure, where fragmented meanings given to physical and social reality are made into one. As the storyline is increasingly accepted by different actors, it starts to give a certain permanence to debate, rationalizing a particular approach to what seems to be a consistent problem.</p><p class=\"zh\">我对这些城市政策文件的分析方法,受到了 Maarten Hajer 的启发。我想理解的是:为什么在此时此地,某种特定的应对城市不平等的方式能够获得(并维持)权威地位,同时使其他措施丧失说服力。按照 Hajer(1995)的观点,政策制定的本质,是创造出那些制度能够处理和回应的‘问题’。<a class=\"gref\" href=\"#g-hajer\">Hajer</a>理论的核心概念是<a class=\"gref\" href=\"#g-storyline\">故事线(storyline)</a>:它把一个问题的话语复杂性加以简化,并由此创造出‘问题封闭’(problem closure)的可能性——原本对物理与社会现实赋予的碎片化意义,被整合成了单一的一种意义。随着某一故事线被越来越多的行动者所接受,它开始为相关争论赋予某种持久性,并使一种针对‘看似一以贯之的问题’的特定应对方式得到合理化。</p></div><div class=\"para quote\" data-idx=\"29\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"85e44a2c59\"><p class=\"en\">the power of storylines is essentially based on the idea that it sounds about right.</p><p class=\"zh\">故事线的力量,本质上建立在‘听起来大致没错’这种感觉之上。</p><span class=\"attrib\">Hajer(1995, 第63页)本人的理论表述——作者引用这句话是采纳、赞同 Hajer 的理论立场,作为本文分析框架的核心依据,而非要反驳的对象。</span></div><div class=\"para\" data-idx=\"30\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"100d3e78e6\"><p class=\"en\">Storylines help create the problem that the policy solves, but they also aid in constructing social and moral order in domains. Storylines can also influence knowledge production of actors (Hajer, 1995, p. 67). In the field of urban studies, the “subordination of scholarly to policy agendas” has been criticized by Slater (2021, p. 3) among many others. Storylines gain a hegemonic position when they fulfill the conditions of discourse structuration, i.e., when the credibility of actors requires them to draw on concepts and ideas from the discourse, and discourse institutionalization, when the discourse is integrated into political practices and institutional arrangements. Through this hegemonization process discursive closure is reached, giving the policymaking a defined target (Hajer, 1995).</p><p class=\"zh\">故事线不仅有助于制造出政策所要解决的‘问题’本身,也有助于在各个领域构建社会与道德秩序。故事线还可以影响行动者的知识生产过程(Hajer, 1995, 第67页)。在城市研究领域,‘学术议程从属于政策议程’这一现象,已受到 Slater(2021, 第3页)等诸多学者的批评。当故事线满足以下两个条件时,便能获得霸权地位:一是<a class=\"gref\" href=\"#g-storyline\">话语结构化(discourse structuration)</a>——即行动者的可信度要求他们援引该话语中的概念与观念;二是话语制度化(discourse institutionalization)——即该话语被整合进政治实践和制度安排之中。通过这一霸权化过程,话语封闭(discursive closure)得以实现,政策制定由此获得一个确定的目标(Hajer, 1995)。</p></div><div class=\"para\" data-idx=\"31\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"d68ff44d2e\"><p class=\"en\">The present policy analysis is enriched with ethnographic case study methods focusing on two regeneration areas located in East Helsinki (Fig. 1): Meri-Rastila and the Mellunkylä district. Selection of the case areas was influenced by the fact that both have been subjected to territorial stigma (Wacquant et al., 2014) and then efforts to revitalize them, for decades. Mellunkylä (comprising neighborhoods Mellunmäki, Kontula, Vesala, Kivikko and Kurkimäki) is the largest district in Helsinki with 40,000 residents. Vesala consists mainly of single-family houses from the 1950s and apartment buildings from the 1980s. The largest neighborhoods in the district, Mellunmäki and Kontula, have large-scale post-war housing developed during the 1960s and 1970s when Finland was undergoing rapid urbanization.</p><p class=\"zh\">本文的政策分析还辅以聚焦于赫尔辛基东部两个更新片区(见图1)的民族志案例研究方法:Meri-Rastila 和 Mellunkylä 区。之所以选择这两个案例片区,是因为它们都数十年来一直遭受地域污名(Wacquant et al., 2014),随后又都经历了旨在使其‘复兴’的种种努力。Mellunkylä(包括 <a class=\"gref\" href=\"#g-mellunmaki\">Mellunmäki</a>、<a class=\"gref\" href=\"#g-kontula\">Kontula</a>、<a class=\"gref\" href=\"#g-vesala\">Vesala</a>、Kivikko 和 Kurkimäki 等社区)是赫尔辛基最大的行政区,居民约4万人。Vesala 主要由20世纪50年代的独户住宅和80年代的公寓楼组成。该区最大的两个社区 Mellunmäki 和 Kontula,拥有芬兰在20世纪60至70年代快速城市化时期建成的大规模战后住宅。</p></div><div class=\"para\" data-idx=\"32\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"ea8e089465\"><p class=\"en\">In an attempt to meet the increased demand for housing, the state subsidized construction of both owner-occupied and an increased share of social rental housing in the periphery of the city (see Juntto, 1990). Since their construction, Kontula in particular has symbolized a failed urbanity ranging from the ‘rootlessness’ of rural people during urbanization to recession and ethnic segregation since the 1990s (Tuominen, 2020). Kurkimäki and Kivikko were built next to Kontula in the 1980s and 1990s as state-subsidized infill constructions, increasing the share of social housing in the Mellunkylä district. In 2024, the share of foreign-language speakers in the district ranged between 30 and 49.5 % compared to the city average of 20.8 % (City of Helsinki, n.d.-b).</p><p class=\"zh\">为了应对住房需求的增长,国家在城市边缘地区补贴建设了自有产权住房,也提高了社会租赁住房的比例(见 Juntto, 1990)。自建成以来,Kontula 尤其象征着一种失败的城市性(failed urbanity)——从城市化过程中乡村人口的‘无根性’(rootlessness),到20世纪90年代以来的经济衰退与族裔隔离,无所不包(Tuominen, 2020)。Kurkimäki 和 Kivikko 是在20世纪80至90年代,作为国家补贴的填充式建设项目建在 Kontula 旁边的,进一步提高了 Mellunkylä 区社会住房的比例。截至2024年,该区外语使用人口的比例在30%至49.5%之间,而全市平均水平为20.8%(City of Helsinki, n.d.-b)。</p></div><div class=\"para\" data-idx=\"33\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"0b751126d9\"><p class=\"en\">Meri-Rastila is a smaller seaside neighborhood belonging to the Vuosaari district. It consists of low-rise buildings and was built in the early 1990s with state subsidies when private housing production was impacted by a severe recession. That caused a large share of the building stock to be social housing. The share of foreign-language speakers in Meri-Rastila ranged between 40 and 49.5 % in 2024 (City of Helsinki, n.d.-b). The share of people with an immigrant background and the abundance of social housing have both significantly contributed to the neighborhood’s stigma.</p><p class=\"zh\">Meri-Rastila 是隶属于 <a class=\"gref\" href=\"#g-vuosaari\">Vuosaari</a> 区的一个规模较小的滨海社区,由低层建筑组成,建于20世纪90年代初——当时私人住房建设正受到一场严重经济衰退的冲击,该社区因此得到了国家补贴,这也导致其住房存量中有很大比例是社会住房。2024年,Meri-Rastila 的外语使用人口比例在40%至49.5%之间(City of Helsinki, n.d.-b)。移民背景人口的比例与社会住房的大量存在,二者都对该社区的污名化产生了重要影响。</p></div><div class=\"para\" data-idx=\"34\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"7c52e93262\"><p class=\"en\">The fieldwork was initially meant to serve as background information for the policy analysis. However, several visits to the field over a period of more than two years revealed the precarity of urban regeneration and nuanced my understanding of the city’s efforts to make the neighborhoods gentrifiable. That in turn influenced the theoretical choice to study the reputational gap and subsidy gap (see Gray &amp; Kallin, 2023) that the city need to bridge in order for regeneration to proceed. Most of the relevant data for this article was collected in 2024–2025 when I participated in various community events in Meri-Rastila and all of the Mellunkylä neighborhoods. These events were often coordinated by local activists and majority of them focused on urban regeneration, with planners and politicians presenting the regeneration plans to residents who were able to comment and ask questions. At these events I talked to residents, activists, local retailers, and city authorities. Detailed fieldnotes were written after every visit to the neighborhoods. To get a more comprehensive understanding of some of the plans, the observations, informal conversations and document analysis were complemented with one semi-structured interview conducted with an urban planner working with the urban regeneration.</p><p class=\"zh\">最初,田野调查只是打算为政策分析提供背景信息。然而,两年多时间里多次的实地走访,揭示出城市更新过程本身的不稳定性(precarity),也让我对该市‘使这些社区变得可绅士化’之努力的理解更加细致入微。这反过来影响了我的理论选择——转而研究该市为推进更新所必须弥合的声誉缺口与补贴缺口(见 Gray & Kallin, 2023)。本文所用的大部分相关数据,收集于2024至2025年间,当时我参与了 Meri-Rastila 及 Mellunkylä 各社区的多场社区活动。这些活动通常由当地活动人士组织协调,大多数聚焦于城市更新议题,由规划师和政治人物向居民介绍更新方案,居民则可以发表意见和提问。在这些活动中,我与居民、活动人士、本地商户以及市政当局人员进行了交谈。每次实地走访之后,我都撰写了详细的田野笔记。为了更全面地理解部分规划方案,除了观察、非正式交谈和文件分析之外,我还与一位参与城市更新工作的城市规划师进行了一次半结构化访谈。</p></div><h2 class=\"sec\" data-secidx=\"35\"><span class=\"en\">4. Helsinki: “a textbook example in how to prevent segregation”</span><span class=\"zh\">4. 赫尔辛基:“防止隔离的教科书式典范”</span></h2><div class=\"para\" data-idx=\"36\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"6fdc306f5f\"><p class=\"en\">Both physical and economic growth of Helsinki rely greatly on extensive densification, which the Master Plan (City of Helsinki, 2013) enables everywhere in the city. However, a majority of infill construction is allocated to the regeneration areas, where the goal of the Land Use program 2020 (City of Helsinki, 2021a) was to ensure the conditions for a 30 % increase in housing stock by 2035. Infill construction is presented as a way to prevent segregation and improve the social sustainability of the regeneration areas, by developing the distribution of tenure forms in the housing stock towards the city’s set goals. Preventing segregation, along with ecological and energy efficient construction, is presented as the goal that all land use decisions must adhere to. In his foreword to the Land Use program (City of Helsinki, 2024a), the Mayor of Helsinki promises that the city will do everything it can to combat the ‘unfortunate trend’ of segregation. Maintaining social cohesion was seen as an important competitive factor for Helsinki even during the previous council term:</p><p class=\"zh\">赫尔辛基无论是物理空间还是经济上的增长,都在很大程度上依赖于大规模的密集化建设,而《总体规划》(City of Helsinki, 2013)在全市范围内都为此类建设开了绿灯。然而,大部分填充式建设被分配到了更新片区,2020年版土地利用方案(City of Helsinki, 2021a)的目标是确保到2035年住房存量增长30%的条件。填充式建设被呈现为一种防止隔离、改善更新片区社会可持续性的方式,其手段是推动住房存量中产权形式的分布向该市设定的目标靠拢。防止隔离,连同生态与节能建设一起,被呈现为所有土地利用决策都必须遵循的目标。在为土地利用方案(City of Helsinki, 2024a)所作的前言中,赫尔辛基市长承诺该市将竭尽全力对抗这种‘令人遗憾的’隔离趋势。即便在上一届市议会任期内,维持社会凝聚力也被视为赫尔辛基一项重要的竞争优势:</p></div><div class=\"para quote\" data-idx=\"37\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"d8f48b61bb\"><p class=\"en\">In Helsinki, the differentiation between different neighborhoods in terms of income and wellbeing is taken very seriously. By international comparison, Helsinki has managed to control such differentiation better than most peer cities. In the future, too, Helsinki will strive to hold its position as a textbook example of how to prevent segregation.</p><p class=\"zh\">在赫尔辛基,不同社区之间在收入和福祉方面的分化被极为严肃地对待。就国际比较而言,赫尔辛基在控制这种分化方面,做得比大多数同类城市都要好。未来,赫尔辛基也将继续努力,保持其作为防止隔离教科书式典范的地位。</p><span class=\"attrib\">赫尔辛基《城市战略2017—2021》原文(City of Helsinki, 2017)——作者引用这段市政官方自我表述,是为了呈现城市如何自我定位为‘防止隔离的典范’,以便接下来揭示这一自我形象与其实际政策后果之间的落差,并非作者本人的评价。</span></div><div class=\"para\" data-idx=\"38\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"8d3a5c2763\"><p class=\"en\">Despite its current position as a poster child of segregation prevention, the city is increasingly concerned about “vulnerable people in urban places, where destitution, illness and crime often congregate” (City of Helsinki, 2021b, p. 8). The strategy presents a multisectoral anti-segregation approach in all its activities from housing policy and zoning to social work, education, culture, and leisure (ibid.) This positive discrimination directs investments specifically to urban regeneration areas that “lag behind” the development of the rest of the city in terms of socioeconomic indicators, i.e., income and education levels and employment rates (City of Helsinki, n.d.-a).</p><p class=\"zh\">尽管目前已是隔离防治的‘模范生’,该市却越来越担忧“城市空间中那些贫困、疾病和犯罪往往聚集在一起的弱势人群”(City of Helsinki, 2021b, 第8页)。《城市战略》提出了一种跨部门的反隔离方法,贯穿从住房政策、区划到社会工作、教育、文化和休闲的方方面面(同上)。这种‘积极歧视’(positive discrimination)将投资专门导向那些在社会经济指标(即收入、教育水平和就业率)上“落后于”全市其他地区发展水平的城市更新片区(City of Helsinki, n.d.-a)。</p></div><div class=\"para\" data-idx=\"39\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"eab7969a0f\"><p class=\"en\">Policymakers in Helsinki seem to have fallen into an imported “segregation mania” (Tahvilzadeh, 2021, p. 14), where anti-segregation policies are discussed mainly in terms of problems found in certain ‘socially disadvantaged’ residential areas. Although residualization has disproportionally concentrated stigmatized groups to social housing estates in the regeneration areas (see Hyötyläinen, 2020), it is equally true that Mellunkylä is a good example of a truly mixed and diverse district with owner-occupied, intermediate, and rental (both social and private) housing ranging from single-family homes to apartment buildings.</p><p class=\"zh\">赫尔辛基的政策制定者们,似乎已经陷入了一种由外部输入的“隔离狂热”(segregation mania)(Tahvilzadeh, 2021, 第14页):反隔离政策的讨论,主要围绕在某些‘社会弱势’居住区中发现的‘问题’展开。虽然剩余化(residualization)确实使污名化群体过度集中在更新片区的社会住房社区中(见 Hyötyläinen, 2020),但同样真实的是:Mellunkylä 本身其实就是一个真正混合多元的社区的良好范例——它兼有自有产权住房、中间产权住房和租赁住房(既有社会租赁,也有私人租赁),住宅类型从独户住宅到公寓楼一应俱全。</p></div><div class=\"para\" data-idx=\"40\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"f8741b67ef\"><p class=\"en\">To obscure the regeneration’s ulterior objectives, such as increased land value and set construction goals, the city portrays, with the help of statistical representations like Helsinki’s socioeconomic index, the regeneration neighborhoods as “one-sided” territories of disadvantage (see Sisson, 2021a):</p><p class=\"zh\">为了掩盖城市更新背后的真实目的——比如提升土地价值、完成既定建设目标——该市借助赫尔辛基社会经济指数等统计表征手段,将这些更新社区描绘成“单一化”的弱势‘领地’(见 Sisson, 2021a):</p></div><div class=\"para quote\" data-idx=\"41\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"516f7dd0df\"><p class=\"en\">One-sided residential areas are to be avoided. The share of apartments located in rental apartment buildings in the area’s housing stock should, as a general rule, be no more than 50 %.</p><p class=\"zh\">应当避免单一化的居住区。原则上,一个片区住房存量中位于租赁公寓楼内的住宅比例,一般不应超过50%。</p><span class=\"attrib\">赫尔辛基2021年版《住房及相关土地利用实施方案》原文(City of Helsinki, 2021a)——城市官方政策文件语言,作者引用它来呈现城市自身如何设定和证成‘产权混合’的量化标准,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"42\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"bb9b03ddca\"><p class=\"en\">To legitimate its policy of ‘diversifying’ the neighborhoods, the city channels the stigma of social housing and their residents:</p><p class=\"zh\">为了使自己‘使社区多元化’的政策获得正当性,该市借用了社会住房及其居民所背负的污名:</p></div><div class=\"para quote\" data-idx=\"43\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"cb07fd75b4\"><p class=\"en\">The most challenging times were during the economic recession of the 1990s, when for the revival of the construction industry, the production of rental housing was almost exclusively state-subsidized for a few years. However, there were only a few residential areas under construction, which resulted in strong concentrations of rental housing. Work has been done to address the challenges of these areas for years, and in the future, efforts should be made to diversify the areas, especially through densification.</p><p class=\"zh\">最艰难的时期是在20世纪90年代的经济衰退期间,当时为了振兴建筑行业,有几年时间里租赁住房的建设几乎完全依靠国家补贴。然而,当时在建的居住区数量有限,这导致了租赁住房的高度集中。多年来,针对这些片区所面临的挑战,已经开展了不少工作,今后也应继续努力,尤其是通过密集化建设,使这些片区变得更加多元化。</p><span class=\"attrib\">赫尔辛基2021年版《住房及相关土地利用实施方案》原文(City of Helsinki, 2021a)——城市官方政策文件语言,作者引用它来展示城市如何把90年代福利紧缩时期国家补贴集中建设租赁住房的历史,重新讲述为一个需要‘多元化’来纠正的‘问题’,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"44\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"d69b6f423e\"><p class=\"en\">The land use program engages in a “false choice urbanism” narrative (Slater, 2014) by presenting gentrification as the only alternative to decline. By utilizing the history of failed area-based initiatives in neighborhoods with social housing estates, the city can legitimize gentrification as the ‘only hope’ in its anti-segregation work. Representations of urban places as “beyond salvage” (Wacquant, 2010, p. 218) where “something must be done” (Gray &amp; Kallin, 2023, p. 1036) provides policy makers a moral legitimacy to restructure the areas. An important aspect of gentrification is the idea that the retrieval of a place is accomplished by civilizing it, which in the policy lingo tends to be described in terms of “upgrading”, “sustainability” and “safety” (Thörn &amp; Holgersson, 2016, p. 671).</p><p class=\"zh\">这份土地利用方案采用了一种“虚假选择的城市主义”(false choice urbanism)叙事(Slater, 2014),把绅士化呈现为对抗衰败的唯一选项。通过援引社会住房社区中片区计划屡屡失败的历史,该市得以把绅士化正当化为其反隔离工作中的‘唯一希望’。将某个城市地方表征为“无可挽救”(beyond salvage)(Wacquant, 2010, 第218页)、“必须有所作为”(something must be done)(Gray & Kallin, 2023, 第1036页)之地,为政策制定者重构这些地区提供了道德上的正当性。绅士化的一个重要面向,在于这样一种观念:对一个地方的‘挽救’是通过使其‘文明化’来实现的,而这种文明化在政策话语中,往往被描述为“提档升级”(upgrading)、“可持续性”(sustainability)和“安全”(safety)(Thörn & Holgersson, 2016, 第671页)。</p></div><div class=\"para\" data-idx=\"45\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"5a712c8d00\"><p class=\"en\">By densifying urban regeneration areas in the periphery of the city, Helsinki claims to maintain their vitality and social sustainability, increase their attractivity and raise their profiles:</p><p class=\"zh\">通过对边缘地区更新片区的密集化建设,赫尔辛基声称自己能够维持这些片区的活力和社会可持续性,提升其吸引力,改善其形象:</p></div><div class=\"para quote\" data-idx=\"46\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"66d3d80d2a\"><p class=\"en\">The goal of housing production in urban regeneration areas is to balance the area’s housing stock structure, increase the number of residents in areas with an aging population structure, and raise the profile of the areas by means of new construction. For this reason, housing production in urban renewal areas cannot only aim for quantity, but housing production must be of high-quality and attractive and primarily focused on other than rental housing.</p><p class=\"zh\">城市更新片区住房建设的目标,是平衡该片区的住房存量结构,在人口结构趋于老龄化的片区增加居民数量,并通过新建来提升该片区的形象。为此,城市更新片区的住房建设不能只追求数量,还必须是高品质、有吸引力的,并且主要面向租赁住房以外的其他产权形式。</p><span class=\"attrib\">赫尔辛基2024年版《住房及相关土地利用实施方案》原文(City of Helsinki, 2024a)——城市官方政策文件语言,作者引用它来说明该市如何明确将新建住房的产权类型限定为‘非租赁’,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"47\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"155b04b4ee\"><p class=\"en\">Social mix is an unwritten rule in Helsinki (Ruonavaara et al., 2025). As is often the case with social mix policies (Blomley, 2004), urban policy in Helsinki tends to assume that it is neighborhoods characterized by high levels of social housing that lack mix, hence the focus on introducing larger proportions of owner occupation. A change in the tenure structure and population composition of an area, even without an actual change in local social processes, is believed to suffice to improve the reputation of an area (Livingston et al., 2013).</p><p class=\"zh\">社会混合在赫尔辛基是一条不成文的规则(Ruonavaara et al., 2025)。正如社会混合政策通常呈现出的那样(Blomley, 2004),赫尔辛基的城市政策往往预设:正是社会住房比例高的社区缺乏‘混合’,因此政策重点便放在引入更高比例的自有产权住房上。人们认为,即便在地方社会过程本身没有实际改变的情况下,仅仅改变一个片区的产权结构和人口构成,就足以改善该片区的声誉(Livingston et al., 2013)。</p></div><div class=\"para\" data-idx=\"48\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"030c360706\"><p class=\"en\">While city strategies still embrace an ideal of diverse housing stock throughout the city, the Land Use program (City of Helsinki, 2024a) acknowledges the difficulty of implementing social housing in central locations due to the high cost of new build construction and higher land rent. In search of a problem for already existing solutions, it is thus convenient for the city to imply that it is neighborhoods with social housing that lack mix. That ‘problem’ (Hajer, 1995) is easier for the city to solve through housing policy than the concentration of wealthy residents and rising land and property values in other parts of the city.</p><p class=\"zh\">虽然《城市战略》仍然坚持全市住房存量多元化这一理想,但土地利用方案(City of Helsinki, 2024a)也承认,由于新建成本高、地租更高,在市中心地段推行社会住房存在困难。在为既有的解决方案寻找问题的过程中,该市很方便地暗示:正是拥有社会住房的社区才‘缺乏混合’。相比城市其他地区富裕居民的聚集以及地价和房价的上涨,这个被建构出来的‘问题’(Hajer, 1995)对该市而言,显然更容易通过住房政策来‘解决’。</p></div><div class=\"para\" data-idx=\"49\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"44c22ddb6f\"><p class=\"en\">However, territorial stigma and the pro-gentrification policies it legitimizes are also contested (Sisson, 2021b). In Meri-Rastila, some residents have raised concerns about the area losing its character due to extensive densification. One January evening, a former chapel building, which a local activist group had saved from demolition, was filled with residents listening to politicians and city authorities discuss their plans for the area:</p><p class=\"zh\">然而,地域污名以及它所正当化的支持绅士化的政策,也并非没有争议(Sisson, 2021b)。在 Meri-Rastila,一些居民对大规模密集化建设可能使该地区失去自身特色表示担忧。一月的一个傍晚,一座曾被当地活动人士团体从拆除中挽救下来的旧教堂建筑内,坐满了前来聆听政治人物和市政官员讨论该地区规划方案的居民:</p></div><div class=\"para quote\" data-idx=\"50\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"8414692fb8\"><p class=\"en\">Referring to activists’ and some residents’ earlier criticism of urban regeneration as a process of reorganizing the area, the deputy mayor reassured the residents of Meri-Rastila that the aim of regeneration is not to replace the buildings and the people. The aim is to make the “old and new meet” and make the area more attractive also for the current residents.</p><p class=\"zh\">针对此前活动人士和部分居民对城市更新是‘重组该地区’的过程这一批评,副市长向 Meri-Rastila 的居民保证,更新的目的并不是要替换掉建筑和居民,而是要让“新旧相遇”,并让该地区对现有居民而言也更具吸引力。</p><span class=\"attrib\">作者本人的田野笔记(Fieldnote 01/23/2025),记录副市长在社区会议上的发言——这是作者以民族志方式记录下的政治人物话语,用以呈现官方对居民置换疑虑的公开回应,并非作者本人的立场;作者紧接着在下一段明确指出,实际的更新做法恰恰与这番安抚言辞相悖。</span></div><div class=\"para\" data-idx=\"51\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"e074813172\"><p class=\"en\">Next, I discuss how the city’s implementation of social mix as a corrective measure (see Ruonavaara et al., 2025) against segregation does in fact replace several buildings and may risk replacing the people too, despite the deputy mayor’s eloquent speeches.</p><p class=\"zh\">接下来,我将讨论该市将社会混合作为对抗隔离的一种矫正措施(见 Ruonavaara et al., 2025)加以落实的过程中,如何在事实上替换掉了若干建筑,并且也可能有替换居民本身的风险—
