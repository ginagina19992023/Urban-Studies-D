through inflation, negative real interest rates and tax subsidies.</p><p class=\"zh\"><strong>【关键概念】</strong><b>Saunders</b>：住房资本供给者（开发商、房东、金融机构）、非产权者（租户、无家可归者）、自住业主；后者通过通胀、负实际利率、税收补贴积累资本利得。</p></div><div class=\"para\" data-idx=\"81\" data-doc=\"urban-studies-reading-guide\" data-nid=\"929689e1fb\"><p class=\"en\">[Key concepts] Piketty: residential property is about half of total capital, and returns on assets persistently outpace wage growth.</p><p class=\"zh\"><strong>【关键概念】</strong><b>Piketty</b>：住宅地产约占总资本一半，资产回报率持续超过工资增长率。</p></div><div class=\"para\" data-idx=\"82\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2de3ee49ec\"><p class=\"en\">[Key concepts] Adkins, Cooper &amp; Konings: class turns on whether you own assets that outpace inflation and wages. Five groups: investors, outright owners, mortgaged owners, renters, the homeless.</p><p class=\"zh\"><strong>【关键概念】</strong><b>Adkins, Cooper &amp; Konings</b>：阶级的关键是是否拥有能跑赢通胀和工资的资产。五类：投资者、无贷款自住者、有贷款自住者、租客、无家可归者。</p></div><div class=\"para\" data-idx=\"83\" data-doc=\"urban-studies-reading-guide\" data-nid=\"d8035734d2\"><p class=\"en\">[Conclusion] Housing class does not hold up as a \"class\" in theory and is better understood as a Weberian status group. But the effect of housing-wealth inequality on life chances is real and growing.</p><p class=\"zh\"><strong>【结论】</strong>作者认为 housing class 作为\"阶级\"在理论上站不住，更适合理解为韦伯意义上的<b>地位群体</b>（status group）；但住房资产不平等对生活机会的影响是真实且日益加剧的。</p></div><h3 class=\"sec\" data-secidx=\"84\"><span class=\"en\">6 · Hirvonen &amp; Lilius (2019) — Do neighbour relationships still matter?</span><span class=\"zh\">6 · Hirvonen &amp; Lilius (2019) · Do neighbour relationships still matter?</span></h3><div class=\"para\" data-idx=\"85\" data-doc=\"urban-studies-reading-guide\" data-nid=\"4e9651ab82\"><p class=\"en\">The reading list also includes Lilius &amp; Hirvonen (2023), Journal of Housing and the Built Environment 38</p><p class=\"zh\">阅读清单另列 Lilius & Hirvonen (2023), Journal of Housing and the Built Environment 38</p></div><div class=\"para\" data-idx=\"86\" data-doc=\"urban-studies-reading-guide\" data-nid=\"99a6b69729\"><p class=\"en\">[Core argument] Compares Finnish national surveys from 1986 and 2012 to trace changes in weak and strong neighbour ties.</p><p class=\"zh\"><strong>【核心论点】</strong>对比 1986 年与 2012 年两次芬兰全国问卷，分析邻里弱关系和强关系的变化。</p></div><div class=\"para\" data-idx=\"87\" data-doc=\"urban-studies-reading-guide\" data-nid=\"97cf64d035\"><p class=\"en\">[Findings] Under-45s have significantly fewer weak and strong ties: a generational decline, not just a life-stage effect</p><p class=\"zh\"><strong>【主要发现】</strong>45 岁以下世代的弱关系和强关系都显著减少，是<b>世代性下降</b>，不只是生命阶段效应</p></div><div class=\"para\" data-idx=\"88\" data-doc=\"urban-studies-reading-guide\" data-nid=\"af92eed2aa\"><p class=\"en\">[Findings] Problematic neighbour relations rose slightly, more so among the young</p><p class=\"zh\"><strong>【主要发现】</strong>问题性邻里关系略有上升，年轻群体更明显</p></div><div class=\"para\" data-idx=\"89\" data-doc=\"urban-studies-reading-guide\" data-nid=\"0812e405ba\"><p class=\"en\">[Findings] Degree of urbanization matters little; central Helsinki and rural areas show similar trends</p><p class=\"zh\"><strong>【主要发现】</strong>城市化程度影响很弱，赫尔辛基市中心与农村趋势相似</p></div><div class=\"para\" data-idx=\"90\" data-doc=\"urban-studies-reading-guide\" data-nid=\"bb65693adf\"><p class=\"en\">[Findings] Housing type is not significant once age and length of residence are controlled</p><p class=\"zh\"><strong>【主要发现】</strong>控制年龄和居住时长后，住房类型影响不显著</p></div><div class=\"para\" data-idx=\"91\" data-doc=\"urban-studies-reading-guide\" data-nid=\"8a1398626b\"><p class=\"en\">[Findings] Tenants have fewer weak ties yet want to know neighbours more (46% vs 31% of owners): a \"subjective contact gap\"</p><p class=\"zh\"><strong>【主要发现】</strong>租户的邻里弱联系更少，却更想认识邻居（46% vs 业主 31%），存在\"主观邻里接触缺口\"</p></div><div class=\"para\" data-idx=\"92\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2141dbb23f\"><p class=\"en\">[Findings] Semi-detached residents chat most, and also report the most problems</p><p class=\"zh\"><strong>【主要发现】</strong>联排住宅居民聊天最多，问题性关系也最多</p></div><div class=\"para\" data-idx=\"93\" data-doc=\"urban-studies-reading-guide\" data-nid=\"e4c2a9c540\"><p class=\"en\">[Policy] Apartment blocks should provide shared social space; high turnover in rental housing should be curbed; the assumption that urban life necessarily weakens neighbour ties does not hold.</p><p class=\"zh\"><strong>【政策启示】</strong>公寓楼应提供公共社交空间；应抑制出租住宅的高流动率；\"城市生活必然削弱邻里关系\"这一假设不成立。</p></div><h3 class=\"sec\" data-secidx=\"94\"><span class=\"en\">7 · Kern (2007) — Reshaping the Boundaries of Public and Private Life: Gender, Condominium Development, and the Neoliberalization of Urban Living</span><span class=\"zh\">7 · Kern (2007) · Reshaping the Boundaries of Public and Private Life: Gender, Condominium Development, and the Neoliberalization of Urban Living</span></h3><div class=\"para\" data-idx=\"95\" data-doc=\"urban-studies-reading-guide\" data-nid=\"573ab143f0\"><p class=\"en\">Urban Geography 28(7), 657–681</p><p class=\"zh\">Urban Geography 28(7), 657–681</p></div><div class=\"para\" data-idx=\"96\" data-doc=\"urban-studies-reading-guide\" data-nid=\"14130df629\"><p class=\"en\">[Core argument] Uses Toronto's condo boom to show how new-build gentrification, through condo ownership, reshapes women's sense of the public/private boundary, and how neoliberal governance appropriates \"empowerment\" talk for a story of consumption and privatization.</p><p class=\"zh\"><strong>【核心论点】</strong>以多伦多公寓开发热潮为例，分析新建绅士化如何通过公寓所有权重塑女性对公共与私人边界的认知，以及新自由主义治理如何把\"赋权\"话语挪用为消费和私有化叙事。</p></div><div class=\"para\" data-idx=\"97\" data-doc=\"urban-studies-reading-guide\" data-nid=\"9274e8a57d\"><p class=\"en\">[Key concepts] Condos are framed as the \"natural\" answer to sprawl, deindustrialization and housing demand: a depoliticizing neoliberal strategy</p><p class=\"zh\"><strong>【关键概念】</strong>公寓开发被包装成解决蔓延、去工业化、住房需求的\"自然\"方案，是新自由主义的<b>去政治化</b>策略</p></div><div class=\"para\" data-idx=\"98\" data-doc=\"urban-studies-reading-guide\" data-nid=\"96fd54e349\"><p class=\"en\">[Key concepts] Single women are about 40% of Toronto condo buyers, presented by the media as women's liberation</p><p class=\"zh\"><strong>【关键概念】</strong>单身女性约占多伦多公寓购买者 40%，媒体包装为\"女性解放\"</p></div><div class=\"para\" data-idx=\"99\" data-doc=\"urban-studies-reading-guide\" data-nid=\"068c540ee5\"><p class=\"en\">[Key concepts] Four themes from interviews with 21 women owners: tenure (individualized, debt-based freedom), security (redefined as a privately purchasable commodity), community (class-homogeneous and exclusive), proximity (consumer citizenship)</p><p class=\"zh\"><strong>【关键概念】</strong>21 位女性业主访谈的四个主题：<b>产权</b>（个人化的负债自由）、<b>安全</b>（被重新定义为可购买的私人商品）、<b>社群</b>（阶层同质的排他性）、<b>邻近性</b>（消费导向的公民身份）</p></div><div class=\"para\" data-idx=\"100\" data-doc=\"urban-studies-reading-guide\" data-nid=\"8fb881a7c3\"><p class=\"en\">[Key concepts] Draws on Neil Smith's revanchist city: condos as a quieter way for the middle class to \"retake\" the core</p><p class=\"zh\"><strong>【关键概念】</strong>引 Neil Smith 的 revanchist city：公寓开发是中产\"夺回\"市中心的隐蔽方式</p></div><div class=\"para\" data-idx=\"101\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ef89c8405f\"><p class=\"en\">[Quotable] The \"freedom\" women owners experience must be read in the context of class privilege; it signals no broad change in gender relations but benefits a socio-economically privileged few.</p><p class=\"zh\"><strong>【可引用】</strong>女性业主体验到的\"自由\"必须放在阶级特权语境下理解，它不代表性别关系的广泛改变，而是让少数特权群体获益。</p></div><h3 class=\"sec\" data-secidx=\"102\"><span class=\"en\">8 · Ronald &amp; Kadi (2017) — The Revival of Private Landlords in Britain's Post-Homeownership Society</span><span class=\"zh\">8 · Ronald &amp; Kadi (2017) · The Revival of Private Landlords in Britain's Post-Homeownership Society</span></h3><div class=\"para\" data-idx=\"103\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ab234ad2e1\"><p class=\"en\">New Political Economy 2017(6), 786–803</p><p class=\"zh\">New Political Economy 2017(6), 786–803</p></div><div class=\"para\" data-idx=\"104\" data-doc=\"urban-studies-reading-guide\" data-nid=\"65442984a9\"><p class=\"en\">[Core argument] UK homeownership fell from a 71% peak to 63% (2014) while private renting doubled. Alongside \"generation rent\" came a less visible \"generation landlord\" of middle-aged, middle-class amateur landlords.</p><p class=\"zh\"><strong>【核心论点】</strong>英国自住率从 71% 峰值降到 63%（2014），私人租赁翻倍。与 generation rent 并行的是 <b>generation landlord</b>：大量中年中产的\"业余\"小房东。</p></div><div class=\"para\" data-idx=\"105\" data-doc=\"urban-studies-reading-guide\" data-nid=\"993cdf6ae6\"><p class=\"en\">[Key concepts] Post-homeownership society: ownership has peaked and fallen in the UK, Australia, Ireland, the US, Japan and Korea</p><p class=\"zh\"><strong>【关键概念】</strong><b>后自住社会</b>：英、澳、爱、美、日韩等国自住率见顶回落</p></div><div class=\"para\" data-idx=\"106\" data-doc=\"urban-studies-reading-guide\" data-nid=\"5246b11d98\"><p class=\"en\">[Key concepts] Buy-to-let mortgages (introduced 1996) were the key financial tool; BTL investment rose after 2008</p><p class=\"zh\"><strong>【关键概念】</strong><b>Buy-to-Let 按揭</b>（1996 年推出）是关键金融工具，2008 年后 BTL 投资不降反升</p></div><div class=\"para\" data-idx=\"107\" data-doc=\"urban-studies-reading-guide\" data-nid=\"813a301716\"><p class=\"en\">[Key concepts] Landlords grew from about 560,000 (1991) to over 2.1 million (2012); about 89% are individuals or couples and about 78% let one property</p><p class=\"zh\"><strong>【关键概念】</strong>房东从 1991 年约 56 万增至 2012 年逾 210 万；约 89% 是个人或夫妻，约 78% 只出租一套</p></div><div class=\"para\" data-idx=\"108\" data-doc=\"urban-studies-reading-guide\" data-nid=\"c5fb918bee\"><p class=\"en\">[Key concepts] The 40–60 cohort converts equity built up in their own homes into second homes to let, as a pension substitute: property-based welfare</p><p class=\"zh\"><strong>【关键概念】</strong>40–60 岁世代把自住房积累的权益转为购买第二套房出租，作为替代养老金：<b>property-based welfare</b></p></div><div class=\"para\" data-idx=\"109\" data-doc=\"urban-studies-reading-guide\" data-nid=\"19999778f1\"><p class=\"en\">[Key concepts] Housing inheritance also drives multiple ownership</p><p class=\"zh\"><strong>【关键概念】</strong>住房继承也推动多套持有</p></div><div class=\"para\" data-idx=\"110\" data-doc=\"urban-studies-reading-guide\" data-nid=\"b4e803653a\"><p class=\"en\">[Significance] An evolving asset-based welfare regime: as state pensions shrink, people rely on property for retirement, deepening intergenerational inequality.</p><p class=\"zh\"><strong>【意义】</strong>资产型福利体制的演化：国家养老金收缩后，人们依赖私有房产作退休保障，加剧代际不平等。</p></div><h3 class=\"sec\" data-secidx=\"111\"><span class=\"en\">9 · Paadam et al. / Ilmonen (2016) — Ways of Residing in Transformation (edited volume)</span><span class=\"zh\">9 · Paadam et al. / Ilmonen (2016) · Ways of Residing in Transformation （章节合集）</span></h3><div class=\"para\" data-idx=\"112\" data-doc=\"urban-studies-reading-guide\" data-nid=\"15ba1429bd\"><p class=\"en\">Ilmonen chapter: On Housing Preferences and Housing Choices, pp. 35–56, Ashgate</p><p class=\"zh\">Ilmonen 章：On Housing Preferences and Housing Choices, pp. 35–56, Ashgate</p></div><div class=\"para\" data-idx=\"113\" data-doc=\"urban-studies-reading-guide\" data-nid=\"d593edcd1f\"><p class=\"en\">[Chapter 1] Replaces \"housing\" with ways of residing: residing as a subjectively constructed, dynamic socio-spatial practice. Uses Kemeny's three levels (household, dwelling, residence) and Bourdieu's habitus. Cases include industrial-heritage conversion in Tallinn, senior co-housing in London, gated communities in Bulgaria, standardized housing production in Finland and the UK, and Reykjavík's post-bubble \"ghost suburbs\".</p><p class=\"zh\"><strong>【第 1 章】</strong>用 <b>ways of residing</b> 取代传统 housing 概念，强调居住是主观建构、动态的社会空间实践。借 Kemeny 的居住社会学三层（住户、住宅、居所）和 Bourdieu 的 habitus。案例包括塔林工业遗产改造、伦敦老年合作居住、保加利亚门禁社区、芬兰和英国住房生产标准化、雷克雅未克泡沫后的\"幽灵郊区\"。</p></div><div class=\"para\" data-idx=\"114\" data-doc=\"urban-studies-reading-guide\" data-nid=\"3ac1c5447d\"><p class=\"en\">[Chapter 3 Ilmonen] The \"first housing question\" (shortage, poverty) vs the \"second housing question\" (housing shifts from need to consumption, carrying identity and lifestyle)</p><p class=\"zh\"><strong>【第 3 章 Ilmonen】</strong>\"第一住房问题\"（短缺、贫困）与\"<b>第二住房问题</b>\"（住房从需求变为消费，承载身份与生活方式）</p></div><div class=\"para\" data-idx=\"115\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ba79b25f38\"><p class=\"en\">[Chapter 3 Ilmonen] Stated vs revealed preferences: what people say they want often differs from what they buy</p><p class=\"zh\"><strong>【第 3 章 Ilmonen】</strong><b>stated preferences</b> vs <b>revealed preferences</b>：说想要的和实际买的经常不同</p></div><div class=\"para\" data-idx=\"116\" data-doc=\"urban-studies-reading-guide\" data-nid=\"0dcabbcc0d\"><p class=\"en\">[Chapter 3 Ilmonen] Via Bourdieu and Giddens: housing choice is a \"narrative of self-identity\", shaped by economic resources and cultural capital</p><p class=\"zh\"><strong>【第 3 章 Ilmonen】</strong>借 Bourdieu 与 Giddens：住房选择是一种\"自我认同的叙事\"，受经济资源与文化资本共同塑造</p></div><div class=\"para\" data-idx=\"117\" data-doc=\"urban-studies-reading-guide\" data-nid=\"29e275f30f\"><p class=\"en\">[Chapter 3 Ilmonen] Research gap: most work asks what people want, little asks why</p><p class=\"zh\"><strong>【第 3 章 Ilmonen】</strong>研究空白：多数研究关注人们想要什么，很少关注为什么</p></div><div class=\"para\" data-idx=\"118\" data-doc=\"urban-studies-reading-guide\" data-nid=\"21b43984b4\"><p class=\"en\">[Chapter 3 Ilmonen] Singleton society: the EU share of one-person households is projected to rise from 30% (2015) to 36%</p><p class=\"zh\"><strong>【第 3 章 Ilmonen】</strong>单人户社会：欧盟单人户比例预计从 2015 年 30% 升至 36%</p></div><h3 class=\"sec\" data-secidx=\"119\"><span class=\"en\">Map — Lecture concepts and readings</span><span class=\"zh\">对照 · 讲义概念与读物的对应</span></h3><div class=\"para\" data-idx=\"120\" data-doc=\"urban-studies-reading-guide\" data-nid=\"8c9717b6ae\"><p class=\"en\">First / second housing question, housing preferences: Ilmonen (2016)</p><p class=\"zh\"><strong>第一 / 第二住房问题、住房偏好</strong>：Ilmonen (2016)</p></div><div class=\"para\" data-idx=\"121\" data-doc=\"urban-studies-reading-guide\" data-nid=\"99de1cbcaa\"><p class=\"en\">Financialization, asset class: Ronald &amp; Kadi (2017); Ruonavaara (2025)</p><p class=\"zh\"><strong>住房金融化、资产阶级</strong>：Ronald & Kadi (2017)；Ruonavaara (2025)</p></div><div class=\"para\" data-idx=\"122\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2830b4a976\"><p class=\"en\">Housing as consumption and lifestyle, gendered space: Kern (2007)</p><p class=\"zh\"><strong>住房作为消费与生活方式、性别化空间</strong>：Kern (2007)</p></div><div class=\"para\" data-idx=\"123\" data-doc=\"urban-studies-reading-guide\" data-nid=\"adca5234aa\"><p class=\"en\">Apartment communities, neighbour relations: Hirvonen &amp; Lilius (2019 / 2023)</p><p class=\"zh\"><strong>公寓社区、邻里关系</strong>：Hirvonen & Lilius (2019 / 2023)</p></div><h2 class=\"sec\" data-secidx=\"124\"><span class=\"en\">Unit 3 · Segregation · 27.1 · Katriina Rosengren · Segregation in a retrenching housing regime</span><span class=\"zh\">第三单元 · Segregation · 27.1 · Katriina Rosengren · 隔离：住房体制收缩下的空间不平等</span></h2><div class=\"para\" data-idx=\"125\" data-doc=\"urban-studies-reading-guide\" data-nid=\"7468d508b5\"><p class=\"en\">The readings were not uploaded; SEGREGATION.docx contains only the list. Lecture highlights come first (added in this version), then the reading list.</p><p class=\"zh\">读物原文未上传，<span>SEGREGATION.docx</span> 只有文献清单。下面先列讲义要点（本版新增），再列阅读清单。</p></div><h3 class=\"sec\" data-secidx=\"126\"><span class=\"en\">3.0 · Lecture highlights New — Segregation in a retrenching housing regime</span><span class=\"zh\">3.0 · 讲义要点 本版新增 · Segregation in a retrenching housing regime</span></h3><div class=\"para\" data-idx=\"127\" data-doc=\"urban-studies-reading-guide\" data-nid=\"0437b68fe6\"><p class=\"en\">Slides: Lectures-20260706/Segregation_270126.pdf</p><p class=\"zh\">讲义：Lectures-20260706/Segregation_270126.pdf</p></div><div class=\"para\" data-idx=\"128\" data-doc=\"urban-studies-reading-guide\" data-nid=\"a81bc1f703\"><p class=\"en\">[Definitions] Neutral: Massey &amp; Denton (1988) \"the degree to which two or more groups live separately from one another\"; Andersson &amp; Turner (2014) the unequal representation of groups across space.</p><p class=\"zh\"><strong>【定义】</strong><b>中性</b>：Massey & Denton (1988) <em>\"the degree to which two or more groups live separately from one another\"</em>；Andersson & Turner (2014) 各类群体在空间上的不均等分布。</p></div><div class=\"para\" data-idx=\"129\" data-doc=\"urban-studies-reading-guide\" data-nid=\"a2ccc98da5\"><p class=\"en\">[Definitions] Detrimental: Marcuse (2005, 16) a group treated as inferior is forced, involuntarily, to cluster in a defined area; Tammaru et al. (2021) \"Advantage breeds advantage and disadvantage breeds disadvantage.\"</p><p class=\"zh\"><strong>【定义】</strong><b>有害</b>：Marcuse (2005, 16) 被视为低等的群体<b>非自愿地</b>聚集在某一空间；Tammaru et al. (2021) <em>\"Advantage breeds advantage and disadvantage breeds disadvantage.\"</em></p></div><div class=\"para\" data-idx=\"130\" data-doc=\"urban-studies-reading-guide\" data-nid=\"318dd86fe2\"><p class=\"en\">[Definitions] The slides flag one pair of terms: 'segregation' vs 'spatial differentiation'.</p><p class=\"zh\"><strong>【定义】</strong>讲义特别列出一组术语：<b>'Segregation' vs 'spatial differentiation'</b>。</p></div><div class=\"para\" data-idx=\"131\" data-doc=\"urban-studies-reading-guide\" data-nid=\"0c1dc38052\"><p class=\"en\">[Measurement] Dissimilarity index (Finnish regions 2022; Finnish cities 2000–2018); Gini coefficient and low-income rate (natives vs residents with foreign background, 1995–2024).</p><p class=\"zh\"><strong>【测量】</strong>Dissimilarity index（芬兰各地区 2022、芬兰城市 2000–2018）；基尼系数与低收入率（本地人 vs 外国背景居民，1995–2024）。</p></div><div class=\"para\" data-idx=\"132\" data-doc=\"urban-studies-reading-guide\" data-nid=\"a7a90540a3\"><p class=\"en\">[Wicked problem] Rittel &amp; Webber (1973): complex, interconnected, affecting many stakeholders, persistent and ever-morphing; it cannot be reduced to a problem–solution frame.</p><p class=\"zh\"><strong>【棘手问题】</strong>Rittel & Webber (1973) 的 <b>wicked problem</b>：复杂、相互交织、涉及多方、长期存在且不断变形，无法化约为\"问题—方案\"。</p></div><div class=\"para\" data-idx=\"133\" data-doc=\"urban-studies-reading-guide\" data-nid=\"6043efec24\"><p class=\"en\">[Vicious circle] Tammaru et al. (2021): people are sorted into activity sites by buying or renting a home, starting school or taking a job, then experience contextual effects there. Five steps:</p><p class=\"zh\"><strong>【恶性循环】</strong>Tammaru et al. (2021)：人们通过买房、租房、入学、就业被<b>分选</b>进具体场所，再在那里承受<b>情境效应</b>。五个环节：</p></div><div class=\"para\" data-idx=\"134\" data-doc=\"urban-studies-reading-guide\" data-nid=\"29920b0b22\"><p class=\"en\">[Vicious circle] Disadvantage clusters spatially (concentrated social housing, lack of affordable market housing)</p><p class=\"zh\"><strong>【恶性循环】</strong>劣势在空间上聚集（社会住房集中、缺乏可负担的市场住房）</p></div><div class=\"para\" data-idx=\"135\" data-doc=\"urban-studies-reading-guide\" data-nid=\"b89ae80563\"><p class=\"en\">[Vicious circle] Neighbourhood effects: objective (services, education) and subjective (perceived upkeep)</p><p class=\"zh\"><strong>【恶性循环】</strong>邻里效应：客观（服务、教育）与主观（对维护状况的感知）</p></div><div class=\"para\" data-idx=\"136\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2dc48a117b\"><p class=\"en\">[Vicious circle] Selective mobility: fear of negative effects shapes moving preferences</p><p class=\"zh\"><strong>【恶性循环】</strong>选择性迁移：对负面邻里效应的担忧影响迁居偏好</p></div><div class=\"para\" data-idx=\"137\" data-doc=\"urban-studies-reading-guide\" data-nid=\"5737b546de\"><p class=\"en\">[Vicious circle] Spread to other life domains (van Ham &amp; Tammaru 2016): schools, workplaces, travel</p><p class=\"zh\"><strong>【恶性循环】</strong>扩展到其他生活领域（van Ham & Tammaru 2016）：学校、工作场所、通勤</p></div><div class=\"para\" data-idx=\"138\" data-doc=\"urban-studies-reading-guide\" data-nid=\"67c904052a\"><p class=\"en\">[Vicious circle] Persistence across the life course and generations; management grows harder</p><p class=\"zh\"><strong>【恶性循环】</strong>跨生命历程、跨代际延续，管理越来越难</p></div><div class=\"para\" data-idx=\"139\" data-doc=\"urban-studies-reading-guide\" data-nid=\"78fa4ced84\"><p class=\"en\">[Managing it] Neighbourhood effects, area-based interventions, social mixing, providing spatial justice, equalizing structural inequalities.</p><p class=\"zh\"><strong>【管理路径】</strong>neighborhood effects、area-based interventions、social mixing、providing spatial justice、equalizing structural inequalities。</p></div><div class=\"para\" data-idx=\"140\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ebd2d73938\"><p class=\"en\">[Finland] From afar: low segregation by European and Nordic standards, no negative neighbourhood effects; small-scale social mixing in Helsinki since the 1970s, resting on a large social housing sector.</p><p class=\"zh\"><strong>【芬兰】</strong><b>远看</b>：隔离水平在欧洲和北欧都偏低，缺乏负面邻里效应；赫尔辛基自 1970 年代起实行小尺度社会混合，依托庞大的社会住房部门。</p></div><div class=\"para\" data-idx=\"141\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2b32015c3e\"><p class=\"en\">[Finland] Up close: in the era of market-oriented housing production, segregation has risen across Europe, Finland included; in Finland's largest cities it has grown steadily, challenging the welfare-state ethos.</p><p class=\"zh\"><strong>【芬兰】</strong><b>近看</b>：市场导向的住房生产时代，包括芬兰在内的欧洲国家隔离上升；芬兰最大城市的隔离近几十年持续增长，挑战福利国家理念。</p></div><div class=\"para\" data-idx=\"142\" data-doc=\"urban-studies-reading-guide\" data-nid=\"e86d369769\"><p class=\"en\">[Finland] From proactive housing policy to reactive social policy: area-based initiatives spread nationwide in the 1990s; supply-side subsidies gave way to demand-side ones; in the 2010s the social housing stock declined and private renting grew, criticized as accelerating financialization; municipalities cannot influence tenant selection in market housing.</p><p class=\"zh\"><strong>【芬兰】</strong><b>从主动住房政策转向被动社会政策</b>：1990 年代区域干预全国推广；供给侧补贴被需求侧取代；2010 年代社会住房存量下降、私人租赁增长，被批评加速了金融化；市政府无法影响市场化住房的租客选择。</p></div><div class=\"para\" data-idx=\"143\" data-doc=\"urban-studies-reading-guide\" data-nid=\"f2c822c5df\"><p class=\"en\">[Finland] A retrenching regime: since 2024 housing benefits have been cut along with other social security; retrenchment began in the 1980s; Kynsilehto &amp; Alastalo (2024) call it a \" post-welfare state \", with segregation delegated to local levels and responsibility for housing markets increasingly shared with the private sector.</p><p class=\"zh\"><strong>【芬兰】</strong><b>收缩中的住房体制</b>：2024 年起住房补贴随其他社保一起削减；收缩始于 1980 年代；Kynsilehto & Alastalo (2024) 称之为\"<b>post-welfare state</b>\"，隔离等社会问题被下放到地方，住房市场的责任越来越多地与私人部门分担。</p></div><h3 class=\"sec\" data-secidx=\"144\"><span class=\"en\">Reading list — Four assigned readings (not uploaded)</span><span class=\"zh\">阅读清单 · 四篇指定读物（原文未上传）</span></h3><div class=\"para\" data-idx=\"145\" data-doc=\"urban-studies-reading-guide\" data-nid=\"32a893d3e9\"><p class=\"en\">Tammaru et al. (2025). A comparative study of socio-economic segregation in European capital city-regions: From segregation to desegregation? Urban Studies.</p><p class=\"zh\">Tammaru et al. (2025). <em>A comparative study of socio-economic segregation in European capital city-regions: From segregation to desegregation?</em> Urban Studies.</p></div><div class=\"para\" data-idx=\"146\" data-doc=\"urban-studies-reading-guide\" data-nid=\"72b4f0c67b\"><p class=\"en\">van Ham &amp; Tammaru (2016). New perspectives on ethnic segregation over time and space: A domains approach. Urban Geography 37(7).</p><p class=\"zh\">van Ham & Tammaru (2016). <em>New perspectives on ethnic segregation over time and space: A domains approach.</em> Urban Geography 37(7).</p></div><div class=\"para\" data-idx=\"147\" data-doc=\"urban-studies-reading-guide\" data-nid=\"b3f3819acd\"><p class=\"en\">Ruonavaara, Rasinkangas &amp; Rosengren (2025). Preventing, curing, mitigating: Anti-segregation policies in urban Finland. Cities 160.</p><p class=\"zh\">Ruonavaara, Rasinkangas & Rosengren (2025). <em>Preventing, curing, mitigating: Anti-segregation policies in urban Finland.</em> Cities 160.</p></div><div class=\"para\" data-idx=\"148\" data-doc=\"urban-studies-reading-guide\" data-nid=\"61eb75f8b5\"><p class=\"en\">Stjernberg et al. (2025). Beyond segregation: Nordic approaches to socially inclusive cities. Nordregio.</p><p class=\"zh\">Stjernberg et al. (2025). <em>Beyond segregation: Nordic approaches to socially inclusive cities.</em> Nordregio.</p></div><h2 class=\"sec\" data-secidx=\"149\"><span class=\"en\">Unit 4 · Gentrification · 3.2 · Gentrification: where the course converges</span><span class=\"zh\">第四单元 · Gentrification · 3.2 · 绅士化：课程的汇合点</span></h2><div class=\"para\" data-idx=\"150\" data-doc=\"urban-studies-reading-guide\" data-nid=\"8fdbdaecb3\"><p class=\"en\">Close-reading pages: Reading-Pages/davidson-newbuild-gentrification.html, lees-2008-social-mixing.html, yrjana-2026-helsinki.html. The reading list also includes Lees et al. (2017), Hochstenbach (2017), Kadi &amp; Matznetter (2022) and Lees (2022); see Readings.md.</p><p class=\"zh\">精读页：<span>Reading-Pages/davidson-newbuild-gentrification.html</span>、<span>lees-2008-social-mixing.html</span>、<span>yrjana-2026-helsinki.html</span>。阅读清单另列 Lees et al. (2017)、Hochstenbach (2017)、Kadi & Matznetter (2022)、Lees (2022)，见 <span>Readings.md</span>。</p></div><h3 class=\"sec\" data-secidx=\"151\"><span class=\"en\">1 · Shaw (2008) — Gentrification: What It Is, Why It Is, and What Can Be Done about It</span><span class=\"zh\">1 · Shaw (2008) · Gentrification: What It Is, Why It Is, and What Can Be Done about It</span></h3><div class=\"para\" data-idx=\"152\" data-doc=\"urban-studies-reading-guide\" data-nid=\"1230c2efd9\"><p class=\"en\">[Core argument] Gentrification is a continuum of social and economic geographic change, from outright disinvestment to super-gentrification. There is no need to assume every neighbourhood passes through every stage.</p><p class=\"zh\"><strong>【核心论点】</strong>绅士化是一个社会与经济地理变化的<b>连续谱</b>，从彻底撤资到 super-gentrification，不必预设所有社区都走完阶段模型。</p></div><div class=\"para\" data-idx=\"153\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2364987a24\"><p class=\"en\">[Key concepts] Ruth Glass (1964) coined the term for the \"gentry\" moving into working-class London and renovating old houses</p><p class=\"zh\"><strong>【关键概念】</strong>Ruth Glass (1964) 首创这个词，指\"绅士\"涌入伦敦工人阶级社区、买下并翻新老房子</p></div><div class=\"para\" data-idx=\"154\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ea27a43fc4\"><p class=\"en\">[Key concepts] Neil Smith stresses its class character: working-class neighbourhoods \"rehabilitated\" by middle-class buyers, landlords and developers</p><p class=\"zh\"><strong>【关键概念】</strong>Neil Smith 强调阶级性质：工人阶级社区被中产购房者、房东和开发商\"修复\"</p></div><div class=\"para\" data-idx=\"155\" data-doc=\"urban-studies-reading-guide\" data-nid=\"a9b59bad05\"><p class=\"en\">[Key concepts] Rent gap: when the gap between capitalized and potential ground rent is wide enough, redevelopment pays and the area is \"ripe\"</p><p class=\"zh\"><strong>【关键概念】</strong><b>Rent gap</b>：当前资本化地租与潜在地租的差距足够大时，开发有利可图，社区\"成熟\"到可以被绅士化</p></div><div class=\"para\" data-idx=\"156\" data-doc=\"urban-studies-reading-guide\" data-nid=\"16053a1d52\"><p class=\"en\">[Key concepts] Three waves (Hackworth &amp; Smith 2001): sporadic and state-funded → market-driven and resisted → corporate capital with systemic state involvement; Lees et al. propose a fourth wave (financialization + pro-gentrification policy)</p><p class=\"zh\"><strong>【关键概念】</strong><b>三波绅士化</b>（Hackworth & Smith 2001）：零星、政府资助 → 市场驱动、伴随抵抗 → 大资本主导、国家系统性介入；Lees et al. 提出第四波（金融化 + 亲绅士化政策）</p></div><div class=\"para\" data-idx=\"157\" data-doc=\"urban-studies-reading-guide\" data-nid=\"c451747278\"><p class=\"en\">[Key concepts] The displacement debate: Tom Slater argues that gentrification research has itself been gentrified, no longer attending to displacement</p><p class=\"zh\"><strong>【关键概念】</strong><b>置换争议</b>：Tom Slater 批评\"绅士化研究本身已经被绅士化\"，研究者不再关注置换</p></div><div class=\"para\" data-idx=\"158\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ce028f6fec\"><p class=\"en\">[Policy] Gentrification advances fastest where new investment is least needed. The best time to intervene is before the rent gap fully opens, when protecting low-income areas and investing in public facilities is most feasible economically and politically.</p><p class=\"zh\"><strong>【政策启示】</strong>绅士化在最不需要新投资的地方推进最快；介入的最佳时机是租差尚未完全打开之前，此时保护低收入社区、投资公共设施在经济和政治上都最可行。</p></div><h3 class=\"sec\" data-secidx=\"159\"><span class=\"en\">2 · Davidson (2018) — New-build gentrification (Handbook of Gentrification Studies, ch. 15)</span><span class=\"zh\">2 · Davidson (2018) · New-build gentrification （绅士化研究手册第 15 章）</span></h3><div class=\"para\" data-idx=\"160\" data-doc=\"urban-studies-reading-guide\" data-nid=\"1f7325f8cf\"><p class=\"en\">[Core argument] New-build gentrification (new condo towers, waterfront developments) has become the dominant form of third-wave gentrification, often actively backed by the state: state-led gentrification.</p><p class=\"zh\"><strong>【核心论点】</strong>新建绅士化（新建公寓塔楼、滨水开发）已成为第三波绅士化的主导形式，常有国家积极支持，即 state-led gentrification。</p></div><div class=\"para\" data-idx=\"161\" data-doc=\"urban-studies-reading-guide\" data-nid=\"5d02b96a90\"><p class=\"en\">[Key concepts] Davidson &amp; Lees (2005), four elements: reinvestment of capital, social upgrading, landscape change, direct or indirect displacement</p><p class=\"zh\"><strong>【关键概念】</strong>Davidson & Lees (2005) 四要素：<b>资本再投资、社会阶层升级、景观变化、直接或间接置换</b></p></div><div class=\"para\" data-idx=\"162\" data-doc=\"urban-studies-reading-guide\" data-nid=\"25354afa68\"><p class=\"en\">[Key concepts] The residentialization debate: Lambert &amp; Boddy argue new-build without direct displacement is not gentrification; Davidson &amp; Lees reply with indirect displacement (the area becomes unaffordable, existing shops and services disappear)</p><p class=\"zh\"><strong>【关键概念】</strong><b>Residentialization 之争</b>：Lambert & Boddy 认为没有直接置换就不算绅士化；Davidson & Lees 以<b>间接置换</b>反驳（社区变得难以负担、原有商店服务消失）</p></div><div class=\"para\" data-idx=\"163\" data-doc=\"urban-studies-reading-guide\" data-nid=\"8fa05564cc\"><p class=\"en\">[Key concepts] Reurbanization: a European term for population returning to the core that sidesteps class displacement; the author argues it hides the class dimension</p><p class=\"zh\"><strong>【关键概念】</strong><b>Reurbanization</b>：欧洲学者用来描述人口回流市中心、回避阶级置换的说法，作者认为它掩盖了阶级维度</p></div><div class=\"para\" data-idx=\"164\" data-doc=\"urban-studies-reading-guide\" data-nid=\"4d08340e9a\"><p class=\"en\">[Key concepts] Global new-build gentrification takes different state–capital forms in China (state-led, large-scale demolition), the UK, Sweden, the Philippines and elsewhere</p><p class=\"zh\"><strong>【关键概念】</strong>全球新建绅士化：中国（国家主导、大规模拆迁）、英国、瑞典、菲律宾等地的国家与资本关系各不相同</p></div><div class=\"para\" data-idx=\"165\" data-doc=\"urban-studies-reading-guide\" data-nid=\"9a951150dc\"><p class=\"en\">[Quotable] \"gentrification without displacement is not gentrification\". Indirect displacement and the pressure created by social-mix policy are often overlooked.</p><p class=\"zh\"><strong>【可引用】</strong><em>\"gentrification without displacement is not gentrification\"</em>。但间接置换、social mix 政策造成的驱逐压力常被忽视。</p></div><h3 class=\"sec\" data-secidx=\"166\"><span class=\"en\">3 · DeVerteuil (2018) — Immigration and gentrification (same handbook, ch. 25)</span><span class=\"zh\">3 · DeVerteuil (2018) · Immigration and gentrification （同一手册第 25 章）</span></h3><div class=\"para\" data-idx=\"167\" data-doc=\"urban-studies-reading-guide\" data-nid=\"1e7cc2a715\"><p class=\"en\">[Core argument] The relationship between immigration and gentrification has long been neglected and is more complex than \"immigrants get displaced\". Five types:</p><p class=\"zh\"><strong>【核心论点】</strong>移民与绅士化的关系长期被忽视，远比\"移民被驱逐\"复杂。提出五类关系：</p></div><div class=\"para\" data-idx=\"168\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ceafd106f6\"><p class=\"en\">[Five types] Immigrants as a barrier to gentrification (Goutte d'Or, Paris)</p><p class=\"zh\"><strong>【五种类型】</strong>移民作为绅士化的<b>屏障</b>（巴黎 Goutte d'Or）</p></div><div class=\"para\" data-idx=\"169\" data-doc=\"urban-studies-reading-guide\" data-nid=\"817683c03e\"><p class=\"en\">[Five types] Immigrants and gentrifiers coexisting (bubble model, Stoke Newington, London)</p><p class=\"zh\"><strong>【五种类型】</strong>移民与绅士化者<b>并存</b>（bubble model，伦敦 Stoke Newington）</p></div><div class=\"para\" data-idx=\"170\" data-doc=\"urban-studies-reading-guide\" data-nid=\"150e4565d9\"><p class=\"en\">[Five types] Immigrants displaced (the classic case, Chinatowns)</p><p class=\"zh\"><strong>【五种类型】</strong>移民<b>被驱逐</b>（经典案例，唐人街）</p></div><div class=\"para\" data-idx=\"171\" data-doc=\"urban-studies-reading-guide\" data-nid=\"6b6b816d2e\"><p class=\"en\">[Five types] Immigrants avoiding gentrified areas (Chinese households moving to Vancouver's suburbs)</p><p class=\"zh\"><strong>【五种类型】</strong>移民<b>主动回避</b>已绅士化地区（温哥华华人迁往郊区）</p></div><div class=\"para\" data-idx=\"172\" data-doc=\"urban-studies-reading-guide\" data-nid=\"4972f3b9c1\"><p class=\"en\">[Five types] Immigrants as gentrifiers (Koreatown, Los Angeles: immigrant entrepreneurs reinvesting in their own enclave)</p><p class=\"zh\"><strong>【五种类型】</strong>移民<b>本身成为绅士化者</b>（洛杉矶韩国城，移民企业家再投资族裔飞地）</p></div><h3 class=\"sec\" data-secidx=\"173\"><span class=\"en\">4 · Lees (2008) — Gentrification and Social Mixing: Towards an Inclusive Urban Renaissance?</span><span class=\"zh\">4 · Lees (2008) · Gentrification and Social Mixing: Towards an Inclusive Urban Renaissance?</span></h3><div class=\"para\" data-idx=\"174\" data-doc=\"urban-studies-reading-guide\" data-nid=\"9bb99180bc\"><p class=\"en\">[Core argument] Governments in the UK, US and Netherlands present social-mix policy as the positive face of gentrification: moving middle-class residents into poor areas to reduce segregation and build \"community capital\". The evidence does not support this logic.</p><p class=\"zh\"><strong>【核心论点】</strong>英、美、荷政府把 social mix 政策当作绅士化的正面包装：把中产搬进贫困社区以减少隔离、提升\"社区资本\"。证据显示这套逻辑站不住。</p></div><div class=\"para\" data-idx=\"175\" data-doc=\"urban-studies-reading-guide\" data-nid=\"219a6cfbe3\"><p class=\"en\">[Six critiques] Gentrification produces displacement, segregation and polarization, not integration</p><p class=\"zh\"><strong>【六大批判】</strong>绅士化造成置换、隔离、两极化，而不是融合</p></div><div class=\"para\" data-idx=\"176\" data-doc=\"urban-studies-reading-guide\" data-nid=\"29bc282a61\"><p class=\"en\">[Six critiques] Gentrifiers do not really interact with low-income residents; their daily paths rarely cross</p><p class=\"zh\"><strong>【六大批判】</strong>绅士化者并不真正与低收入居民交往，生活轨迹几乎不交叉</p></div><div class=\"para\" data-idx=\"177\" data-doc=\"urban-studies-reading-guide\" data-nid=\"98f8cc1e2a\"><p class=\"en\">[Six critiques] Social mix is one-way: affluent areas are never asked to take in the poor</p><p class=\"zh\"><strong>【六大批判】</strong>social mix 是<b>单向</b>策略，从不要求富裕社区接纳穷人</p></div><div class=\"para\" data-idx=\"178\" data-doc=\"urban-studies-reading-guide\" data-nid=\"8cbf41c00f\"><p class=\"en\">[Six critiques] It destroys the mutual-support networks that clustering itself provides</p><p class=\"zh\"><strong>【六大批判】</strong>它摧毁了贫困聚居本身带来的互助网络</p></div><div class=\"para\" data-idx=\"179\" data-doc=\"urban-studies-reading-guide\" data-nid=\"072829e871\"><p class=\"en\">[Six critiques] Policy never says how much mix is enough</p><p class=\"zh\"><strong>【六大批判】</strong>政策从未说清多少混合才算够</p></div><div class=\"para\" data-idx=\"180\" data-doc=\"urban-studies-reading-guide\" data-nid=\"34a82601fb\"><p class=\"en\">[Six critiques] Policy never explains how mixing happens; putting people side by side does not produce it</p><p class=\"zh\"><strong>【六大批判】</strong>政策从未说明混合如何实现，把人放在一起不会自动产生混合</p></div><div class=\"para\" data-idx=\"181\" data-doc=\"urban-studies-reading-guide\" data-nid=\"032b9504f8\"><p class=\"en\">[Quotable] \"gentrification is part of an aggressive, revanchist ideology designed to retake the inner city for the middle classes\" (citing Neil Smith)</p><p class=\"zh\"><strong>【可引用】</strong><em>\"gentrification is part of an aggressive, revanchist ideology designed to retake the inner city for the middle classes\"</em>（引 Neil Smith）</p></div><h3 class=\"sec\" data-secidx=\"182\"><span class=\"en\">5 · Yrjänä (2026) — By any means necessary: the anti-segregation efforts and state-led gentrification in Helsinki</span><span class=\"zh\">5 · Yrjänä (2026) · By any means necessary: the anti-segregation efforts and state-led gentrification in Helsinki</span></h3><div class=\"para\" data-idx=\"183\" data-doc=\"urban-studies-reading-guide\" data-nid=\"4fe33885c8\"><p class=\"en\">Cities 170, 106718 · open access · full text: External-Sources/Yrjana-2026-Helsinki-State-led-Gentrification.pdf</p><p class=\"zh\">Cities 170, 106718 · 开放获取 · 全文：External-Sources/Yrjana-2026-Helsinki-State-led-Gentrification.pdf</p></div><div class=\"para\" data-idx=\"184\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2420b25c05\"><p class=\"en\">[Core argument] Helsinki's social-mix policy, pursued in the name of anti-segregation, amounts to state-led gentrification: a depoliticized, morally justified statistical discourse legitimizes the state's push for market dominance in housing and land.</p><p class=\"zh\"><strong>【核心论点】</strong>赫尔辛基以\"反隔离\"为名推行的 social mix 政策，实质是<b>国家主导绅士化</b>：用一套去政治化、道德正当的统计话语，为国家在住房和土地市场里加强市场支配提供合法性。</p></div><div class=\"para\" data-idx=\"185\" data-doc=\"urban-studies-reading-guide\" data-nid=\"074b76b159\"><p class=\"en\">[Case] Stigmatized eastern suburbs Mellunkylä and Meri-Rastila. The 2020 \"new urban renewal model\" targets four suburban renewal areas, aiming to deconcentrate disadvantaged and ethnic-minority groups and raise owner-occupation and the social-rental share.</p><p class=\"zh\"><strong>【案例】</strong>赫尔辛基东部被污名化的外围社区 Mellunkylä 和 Meri-Rastila。2020 年启动\"新城市更新模式\"，聚焦 4 个外围更新区，目标是分散弱势群体与族裔少数群体、提高自住率与社会租赁份额。</p></div><div class=\"para\" data-idx=\"186\" data-doc=\"urban-studies-reading-guide\" data-nid=\"b6f7102a2d\"><p class=\"en\">[Theoretical tools] Reputational gap (Kallin 2017): the distance between a place's imagined potential and its stigmatized present; the wider the gap, the more justified intervention appears</p><p class=\"zh\"><strong>【理论工具】</strong><b>声誉差距</b>（reputational gap，Kallin 2017）：地方被想象的潜力与被污名化的现状之间的差距，差距越大，干预越显得正当</p></div><div class=\"para\" data-idx=\"187\" data-doc=\"urban-studies-reading-guide\" data-nid=\"3df0d5fe62\"><p class=\"en\">[Theoretical tools] Subsidy gap (Gray &amp; Kallin 2023): the state first absorbs the costs of land assembly and acquisition to de-risk private capital</p><p class=\"zh\"><strong>【理论工具】</strong><b>补贴差距</b>（subsidy gap，Gray & Kallin 2023）：国家先垫付土地整备、征收等成本，为私人资本去风险</p></div><div class=\"para\" data-idx=\"188\" data-doc=\"urban-studies-reading-guide\" data-nid=\"2b7d09d4b3\"><p class=\"en\">[Theoretical tools] Social mix as corrective: decontextualized statistics frame the area as a \"problem\", justifying demolition and densification</p><p class=\"zh\"><strong>【理论工具】</strong><b>social mix 作为矫正措施</b>：用去语境化的统计描述把社区塑造成\"问题\"，为拆除和加密提供正当性</p></div><div class=\"para\" data-idx=\"189\" data-doc=\"urban-studies-reading-guide\" data-nid=\"7f8e2a7bed\"><p class=\"en\">[Theoretical tools] False choice urbanism (Slater 2014): the only alternative to gentrification is continued decline</p><p class=\"zh\"><strong>【理论工具】</strong><b>虚假选择城市主义</b>（false choice urbanism，Slater 2014）：除了绅士化只剩持续衰败</p></div><div class=\"para\" data-idx=\"190\" data-doc=\"urban-studies-reading-guide\" data-nid=\"ba29f22572\"><p class=\"en\">[Theoretical tools] Green gentrification (Wallin 2021): upgrading parks and public space to attract investment. A planner: \"If you think about it cynically, building this park is partly about raising the image of the area\"</p><p class=\"zh\"><strong>【理论工具】</strong><b>绿色绅士化</b>（Wallin 2021）：翻新公园和公共空间吸引投资。规划官员原话：\"如果你从犬儒角度想，建这个公园某种程度上就是为了提升这片区域的形象\"</p></div><div class=\"para\" data-idx=\"191\" data-doc=\"urban-studies-reading-guide\" data-nid=\"639281f26f\"><p class=\"en\">[Theoretical tools] Managed decline (Watt 2023): deliberate under-maintenance in anticipation of demolition</p><p class=\"zh\"><strong>【理论工具】</strong><b>管理式衰败</b>（managed decline，Watt 2023）：拆除预期下故意不维护</p></div><div class=\"para\" data-idx=\"192\" data-doc=\"urban-studies-reading-guide\" data-nid=\"26c370a55b\"><p class=\"en\">[Theoretical tools] Socializing risk, privatizing profit (Risager 2022)</p><p class=\"zh\"><strong>【理论工具】</strong><b>社会化风险、私有化利润</b>（Risager 2022）</p></div><div class=\"para\" data-idx=\"193\" data-doc=\"urban-studies-reading-guide\" data-nid=\"e872248b6b\"><p class=\"en\">[Fieldwork] 2024–2025: repairs stalled while rents rose (+8.4% in 2024, +5.3% in 2025); older residents worried about heating and snow clearing; families unable to plan schooling around uncertain demolition timelines; residents learned of demolition from the local paper; the \"right to return\" does not guarantee the original flat; the Kontula shopping-centre renewal deadlocked for 20 years, with developer NCC withdrawing in March 2025.</p><p class=\"zh\"><strong>【田野证据】</strong>2024–2025 年调研：维修停滞但租金照涨（2024 年 +8.4%，2025 年 +5.3%）；老人担心暖气和清雪；家庭因拆迁时间线不确定无法规划孩子上学；居民从本地报纸得知自家楼要拆；\"重返权\"不保证原公寓；Kontula 购物中心更新僵局 20 年，开发商 NCC 2025 年 3 月退出。</p></div><div class=\"para\" data-idx=\"194\" data-doc=\"urban-studies-reading-guide\" data-nid=\"1db8adf252\"><p class=\"en\">[Conclusion] Helsinki wants both deeper private dominance of the housing market and the prevention of segregation, and manages the contradiction through gentrification disguised as anti-segregation discourse (Lees 2008). The author suggests treating access to affordable housing as a normal need rather than a social-policy problem; with its planning monopoly and extensive land ownership, Helsinki could prioritize state-subsidized rental housing.</p><p class=\"zh\"><strong>【结论】</strong>赫尔辛基既想深化住房市场的私人主导，又想预防隔离，于是采用了\"<b>伪装成反隔离话语的绅士化</b>\"（Lees 2008）。作者建议把获得可负担住房当作正常需求而非社会政策问题；赫尔辛基有规划垄断权和大量土地所有权，完全有能力优先发展国家补贴租赁住房。</p></div><h2 class=\"sec\" data-secidx=\"195\"><span class=\"en\">Cross-links · Connecting the units</span><span class=\"zh\">跨主题 · 串联思路</span></h2><div class=\"para\" data-idx=\"196\" data-doc=\"urban-studies-reading-guide\" data-nid=\"6eec3af3bc\"><p class=\"en\">For the essay or a mind map.</p><p class=\"zh\">供论文或思维导图参考。</p></div><div class=\"para\" data-idx=\"197\" data-doc=\"urban-studies-reading-guide\" data-nid=\"5adeaf96c0\"><p class=\"en\">Gentrification × Housing — Kern's condo privatization and Davidson's new-build gentrification speak to each other: condo development is both the spatial vehicle of gentrification and the material base of asset-based welfare (Ronald &amp; Kadi).</p><p class=\"zh\"><strong>Gentrification × Housing</strong>　Kern 的公寓私有化与 Davidson 的新建绅士化直接呼应：公寓开发既是绅士化的空间载体，也是资产型福利的物质基础（Ronald & Kadi）。</p></div><div class=\"para\" data-idx=\"198\" data-doc=\"urban-studies-reading-guide\" data-nid=\"4ce7e4c404\"><p class=\"en\">Housing class × Gentrification — Ruonavaara's asset-class account explains who profits from gentrification (owners) and who is excluded: the real beneficiaries of the social-mix policy Lees criticizes.</p><p class=\"zh\"><strong>Housing class × Gentrification</strong>　Ruonavaara 的资产阶级理论可以解释谁能从绅士化中获利（有产者）、谁被排除，即 Lees 批判的 social mix 政策的实际受益者。</p></div><div class=\"para\" data-idx=\"199\" data-doc=\"urban-studies-reading-guide\" data-nid=\"52e309a052\"><p class=\"en\">Neighbour relations × Gentrification — Hirvonen &amp; Lilius find tenants have weaker ties but want to know neighbours more, echoing DeVerteuil and Lees on new and old residents whose paths never cross. Useful for the missing social integration in new-build apartment areas.</p><p class=\"zh\"><strong>邻里关系 × 绅士化</strong>　Hirvonen & Lilius 发现租户邻里联系更弱、更想认识邻居，与 DeVerteuil、Lees 讨论的\"新老居民生活轨迹不交叉\"呼应，可用于分析新建公寓社区的社会融合缺失。</p></div><div class=\"para\" data-idx=\"200\" data-doc=\"urban-studies-reading-guide\" data-nid=\"7fbe72aadd\"><p class=\"en\">Finnish angle — Hirvonen &amp; Lilius and both Ruonavaara pieces are Finnish studies, good \"local\" evidence to set against international frameworks (DeVerteuil, Lees, Kern), answering the class question: does Finland have gentrification?</p><p class=\"zh\"><strong>芬兰切入点</strong>　Hirvonen & Lilius、Ruonavaara 都是芬兰语境研究，适合作为\"本地化\"证据，与 DeVerteuil、Lees、Kern 等国际框架对话，回应课堂问题：芬兰是否存在绅士化？</p></div><div class=\"para\" data-idx=\"201\" data-doc=\"urban-studies-reading-guide\" data-nid=\"861269ac0f\"><p class=\"en\">Segregation × Gentrification New — Social mixing is one of the lecture's tools for managing segregation, and Lees (2008) and Yrjänä (2026) critique exactly how social mixing is used to package gentrification. These two readings bridge the units.</p><p class=\"zh\"><strong>Segregation × Gentrification <span>本版新增</span></strong>　讲义的管理路径里有 social mixing，而 Lees (2008) 和 Yrjänä (2026) 正是在批判 social mixing 被用来包装绅士化。这两篇是两个单元之间的桥。</p></div><div class=\"para\" data-idx=\"202\" data-doc=\"urban-studies-reading-guide\" data-nid=\"a0992d778b\"><p class=\"en\">Housing × Segregation New — Both lectures record Finland's shift from supply-side to demand-side subsidies. The Housing lecture treats it as a change in policy instruments; the Segregation lecture links it to shrinking social housing, harder mixing and faster financialization.</p><p class=\"zh\"><strong>Housing × Segregation <span>本版新增</span></strong>　两份讲义都记录了芬兰补贴从供给侧转向需求侧。Housing 讲义把它当作政策工具变化，Segregation 讲义把它和社会住房减少、混合变难、金融化加速连在一起。</p></div>", "toc": [{"idx": 0, "level": "h2", "en": "Unit 1 · Introduction · 13.1 · Where urban studies came from, and what \"the urban\" is", "zh": "第一单元 · Introduction · 13.1 · 学科起源与\"什么是城市\""}, {"idx": 2, "level": "h3", "en": "0.0 · From the slides — Origins and schools of thought", "zh": "0.0 · 讲义原文梳理 · 学科起源与几大流派"}, {"idx": 11, "level": "h3", "en": "0.0b · Beyond the slides — The Los Angeles School and the Chicago model it answers", "zh": "0.0b · 讲义外补充 · 洛杉矶学派，以及它回应的芝加哥模型"}, {"idx": 27, "level": "h3", "en": "0.1 · Simmel (1903) — The Metropolis and Mental Life", "zh": "0.1 · Simmel (1903) · The Metropolis and Mental Life 大都市与精神生活"}, {"idx": 31, "level": "h3", "en": "0.2 · Wirth (1938) — Urbanism as a Way of Life", "zh": "0.2 · Wirth (1938) · Urbanism as a Way of Life 都市主义作为一种生活方式"}, {"idx": 40, "level": "h3", "en": "0.3 · Sennett (2018; slides 2019) — Building and Dwelling: Ethics for the City", "zh": "0.3 · Sennett (2018 / 讲义 2019) · Building and Dwelling: Ethics for the City"}, {"idx": 44, "level": "h3", "en": "0.4 · Ilmonen (2016) — \"The Changing Urban Question\" — title slide", "zh": "0.4 · Ilmonen (2016) · \"The Changing Urban Question\" 标题页"}, {"idx": 48, "level": "h3", "en": "0.5 · An open question from the slides — What is the urban?", "zh": "0.5 · 讲义留下的开放问题 · What is the urban?"}, {"idx": 51, "level": "h2", "en": "Unit 2 · Housing · 20.1 · Housing: home, commodity or asset", "zh": "第二单元 · Housing · 20.1 · 住房：家、商品还是资产"}, {"idx": 53, "level": "h3", "en": "2.0 · Lecture framework — Eight points", "zh": "2.0 · 讲义框架 · 八个要点"}, {"idx": 76, "level": "h3", "en": "5 · Ruonavaara (2025) — An idea that refuses to die: Rise, fall and resurgence of \"housing class\"", "zh": "5 · Ruonavaara (2025) · An idea that refuses to die: Rise, fall and resurgence of \"housing class\""}, {"idx": 84, "level": "h3", "en": "6 · Hirvonen & Lilius (2019) — Do neighbour relationships still matter?", "zh": "6 · Hirvonen & Lilius (2019) · Do neighbour relationships still matter?"}, {"idx": 94, "level": "h3", "en": "7 · Kern (2007) — Reshaping the Boundaries of Public and Private Life: Gender, Condominium Development, and the Neoliberalization of Urban Living", "zh": "7 · Kern (2007) · Reshaping the Boundaries of Public and Private Life: Gender, Condominium Development, and the Neoliberalization of Urban Living"}, {"idx": 102, "level": "h3", "en": "8 · Ronald & Kadi (2017) — The Revival of Private Landlords in Britain's Post-Homeownership Society", "zh": "8 · Ronald & Kadi (2017) · The Revival of Private Landlords in Britain's Post-Homeownership Society"}, {"idx": 111, "level": "h3", "en": "9 · Paadam et al. / Ilmonen (2016) — Ways of Residing in Transformation (edited volume)", "zh": "9 · Paadam et al. / Ilmonen (2016) · Ways of Residing in Transformation （章节合集）"}, {"idx": 119, "level": "h3", "en": "Map — Lecture concepts and readings", "zh": "对照 · 讲义概念与读物的对应"}, {"idx": 124, "level": "h2", "en": "Unit 3 · Segregation · 27.1 · Katriina Rosengren · Segregation in a retrenching housing regime", "zh": "第三单元 · Segregation · 27.1 · Katriina Rosengren · 隔离：住房体制收缩下的空间不平等"}, {"idx": 126, "level": "h3", "en": "3.0 · Lecture highlights New — Segregation in a retrenching housing regime", "zh": "3.0 · 讲义要点 本版新增 · Segregation in a retrenching housing regime"}, {"idx": 144, "level": "h3", "en": "Reading list — Four assigned readings (not uploaded)", "zh": "阅读清单 · 四篇指定读物（原文未上传）"}, {"idx": 149, "level": "h2", "en": "Unit 4 · Gentrification · 3.2 · Gentrification: where the course converges", "zh": "第四单元 · Gentrification · 3.2 · 绅士化：课程的汇合点"}, {"idx": 151, "level": "h3", "en": "1 · Shaw (2008) — Gentrification: What It Is, Why It Is, and What Can Be Done about It", "zh": "1 · Shaw (2008) · Gentrification: What It Is, Why It Is, and What Can Be Done about It"}, {"idx": 159, "level": "h3", "en": "2 · Davidson (2018) — New-build gentrification (Handbook of Gentrification Studies, ch. 15)", "zh": "2 · Davidson (2018) · New-build gentrification （绅士化研究手册第 15 章）"}, {"idx": 166, "level": "h3", "en": "3 · DeVerteuil (2018) — Immigration and gentrification (same handbook, ch. 25)", "zh": "3 · DeVerteuil (2018) · Immigration and gentrification （同一手册第 25 章）"}, {"idx": 173, "level": "h3", "en": "4 · Lees (2008) — Gentrification and Social Mixing: Towards an Inclusive Urban Renaissance?", "zh": "4 · Lees (2008) · Gentrification and Social Mixing: Towards an Inclusive Urban Renaissance?"}, {"idx": 182, "level": "h3", "en": "5 · Yrjänä (2026) — By any means necessary: the anti-segregation efforts and state-led gentrification in Helsinki", "zh": "5 · Yrjänä (2026) · By any means necessary: the anti-segregation efforts and state-led gentrification in Helsinki"}, {"idx": 195, "level": "h2", "en": "Cross-links · Connecting the units", "zh": "跨主题 · 串联思路"}]}};window.__CR_DOC_ORDER=["lees-2008-social-mixing", "yrjana-2026-helsinki-state-led-gentrification", "zanardo-2024-wilful-ignorance-waterloo", "sisson-2024-public-housing-territorial-stigma", "song-2023-landscape-gentrification-nanjing", "urban-studies-reading-guide"];</script><script>
(function(){
  var CR_DOCS=window.__CR_DOCS, DOC_ORDER=window.__CR_DOC_ORDER;

  var modeBtns=document.querySelectorAll('.modes button');
  function setMode(m){
    document.body.dataset.mode=m;
    modeBtns.forEach(function(b){ b.classList.toggle('active', b.dataset.mode===m); });
    try{ localStorage.setItem('crMode', m); }catch(e){}
  }
  modeBtns.forEach(function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode); }); });
  var savedMode='bilingual';
  try{ savedMode=localStorage.getItem('crMode')||'bilingual'; }catch(e){}
  setMode(savedMode);

  /* jump-to-heading selects are rebuilt every time a pane's document
     changes, so this is delegated rather than bound once at load. */
  document.addEventListener('change', function(e){
    if(!e.target.classList.contains('jumpSelect')) return;
    var sel=e.target;
    if(!sel.value) return;
    var el=document.getElementById(sel.value);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    sel.value='';
  });

  function escHtml(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function truncate(s,n){ return s.length>n ? s.slice(0,n)+'…' : s; }
  function docLabel(id){ return CR_DOCS[id] ? CR_DOCS[id].meta.crumb : id; }

  /* ---- shared, library-wide cross-reference link store ----
     ONE key for the whole library, not one per pair: a link genuinely
     connects two SPECIFIC documents (recorded on the link itself as
     {doc,nid,text} per side), so it stays valid and findable no matter
     which pair happens to be open when you look for it again. */
  var KEY='br-crossrefs:library';
  var links=[];
  try{ links=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ links=[]; }
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(links)); }catch(e){} }

  var currentDoc={A:null, B:null};
  function relevantLinks(){
    var pair=[currentDoc.A, currentDoc.B];
    return links.filter(function(l){
      return pair.indexOf(l.a.doc)!==-1 && pair.indexOf(l.b.doc)!==-1;
    });
  }

  function paneOf(pid){ return pid.charAt(0); }
  function paraElForSide(side){
    return document.querySelector('.para[data-doc="'+side.doc+'"][data-nid="'+side.nid+'"] p.en');
  }

  function unwrapXrefs(){
    document.querySelectorAll('mark.xref').forEach(function(m){
      var parent=m.parentNode;
      while(m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
  }
  function wrapText(pEl, text, linkId){
    if(!pEl || !text) return false;
    var walker=document.createTreeWalker(pEl, NodeFilter.SHOW_TEXT, null, false);
    var node;
    while(node=walker.nextNode()){
      if(node.parentElement && node.parentElement.closest('mark.xref')) continue;
      var idx=node.nodeValue.indexOf(text);
      if(idx===-1) continue;
      var range=document.createRange();
      range.setStart(node, idx); range.setEnd(node, idx+text.length);
      var mark=document.createElement('mark');
      mark.className='xref'; mark.dataset.xrefId=linkId;
      try{ range.surroundContents(mark); }catch(e){ continue; }
      mark.addEventListener('click', function(){ openLinkCard(linkId); });
      return true;
    }
    return false;
  }
  function paintLinks(){
    unwrapXrefs();
    relevantLinks().forEach(function(l){
      wrapText(paraElForSide(l.a), l.a.text, l.id);
      wrapText(paraElForSide(l.b), l.b.text, l.id);
    });
  }

  function flashLink(id){
    document.querySelectorAll('mark.xref[data-xref-id="'+id+'"]').forEach(function(m){
      m.classList.add('flash');
      setTimeout(function(){ m.classList.remove('flash'); }, 1200);
    });
  }
  function jumpToLink(l){
    [l.a, l.b].forEach(function(side){
      var el=paraElForSide(side);
      if(el) el.closest('.para').scrollIntoView({behavior:'smooth', block:'center'});
    });
    setTimeout(function(){ flashLink(l.id); }, 350);
  }

  /* ---- selection -> pill -> second selection -> note card ---- */
  var pill=document.getElementById('selPill');
  var hint=document.getElementById('xrefHint');
  var hintText=document.getElementById('xrefHintText');
  var hintCancel=document.getElementById('xrefHintCancel');
  var pendingSel=null;   /* {pane,pid,doc,nid,text} currently under the pill */
  var draftSide=null;    /* the FIRST side already committed by clicking the pill */

  function hidePill(){ pill.style.display='none'; pendingSel=null; }
  function clearDraft(){ draftSide=null; hint.style.display='none'; hidePill(); }
  hintCancel.addEventListener('click', clearDraft);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') clearDraft(); });

  function currentSelectionInfo(){
    var sel=window.getSelection();
    if(!sel || sel.isCollapsed) return null;
    var text=sel.toString().trim();
    if(!text) return null;
    var range=sel.getRangeAt(0);
    var container=range.commonAncestorContainer;
    var elc=container.nodeType===3?container.parentElement:container;
    var pWrap=elc.closest('.para');
    var pEn=elc.closest('p.en');
    if(!pWrap || !pEn) return null;   /* only EN text is linkable (ZH may carry inline markup) */
    return {pane:paneOf(pWrap.dataset.pid), pid:pWrap.dataset.pid,
             doc:pWrap.dataset.doc, nid:pWrap.dataset.nid, text:text, range:range};
  }
  document.addEventListener('selectionchange', function(){
    clearTimeout(window.__crSelT);
    window.__crSelT=setTimeout(function(){
      var info=currentSelectionInfo();
      if(!info){ hidePill(); return; }
      var r=info.range.getBoundingClientRect();
      if(!r || (!r.width && !r.height)){ hidePill(); return; }
      pendingSel=info;
      pill.style.left=Math.max(8, r.left+window.scrollX)+'px';
      pill.style.top=Math.max(8, r.top+window.scrollY-34)+'px';
      pill.style.display='block';
    }, 120);
  });
  document.addEventListener('mousedown', function(e){
    if(pill.style.display!=='none' && !pill.contains(e.target) && !card.contains(e.target)) hidePill();
  });
  pill.addEventListener('mousedown', function(e){ e.preventDefault(); });
  pill.addEventListener('click', function(){
    if(!pendingSel) return;
    if(!draftSide){
      draftSide=pendingSel;
      hidePill();
      window.getSelection().removeAllRanges();
      hintText.textContent='已选中'+(draftSide.pane==='A'?'左侧':'右侧')+'文字。请在'+
        (draftSide.pane==='A'?'右侧':'左侧')+'选中对应段落以完成关联（Esc 取消）。';
      hint.style.display='flex';
    } else {
      if(pendingSel.pane===draftSide.pane){
        alert('请在另一侧选中对应段落，而不是同一侧。');
        return;
      }
      var a = draftSide.pane==='A' ? draftSide : pendingSel;
      var b = draftSide.pane==='A' ? pendingSel : draftSide;
      hidePill();
      window.getSelection().removeAllRanges();
      hint.style.display='none';
      draftSide=null;
      openNoteCard({a:{doc:a.doc, nid:a.nid, text:a.text}, b:{doc:b.doc, nid:b.nid, text:b.text}}, null);
    }
  });

  /* ---- note card (create or edit) ---- */
  var card=document.getElementById('xrefCard');
  var backdrop=document.getElementById('xrefBackdrop');
  var cardA=document.getElementById('xrefCardA');
  var cardB=document.getElementById('xrefCardB');
  var cardNote=document.getElementById('xrefCardNote');
  var cardSave=document.getElementById('xrefCardSave');
  var cardDelete=document.getElementById('xrefCardDelete');
  var cardCancel=document.getElementById('xrefCardCancel');
  var editingId=null, draftPair=null;

  function closeCard(){ card.style.display='none'; backdrop.classList.remove('open'); editingId=null; draftPair=null; }
  function openNoteCard(pair, existingId){
    /* Opening ANY card (new link or editing an existing one) abandons a
       half-started link: without this, clicking an unrelated existing mark
       while "已选中左侧文字，请在右侧选中..." is still showing left the hint
       and the stale pending selection sitting there after the card closed,
       confusing about what state the UI was actually in. */
    draftSide=null; hint.style.display='none'; hidePill();
    editingId=existingId;
    draftPair=pair;
    cardA.querySelector('.side-lbl').textContent=docLabel(pair.a.doc);
    cardB.querySelector('.side-lbl').textContent=docLabel(pair.b.doc);
    cardA.querySelector('.q').textContent='“'+pair.a.text+'”';
    cardB.querySelector('.q').textContent='“'+pair.b.text+'”';
    var existing=existingId?links.find(function(l){return l.id===existingId;}):null;
    cardNote.value=existing?existing.note:'';
    cardDelete.style.display=existingId?'':'none';
    card.style.display='block'; backdrop.classList.add('open');
    setTimeout(function(){ cardNote.focus(); }, 30);
  }
  function openLinkCard(id){
    var l=links.find(function(x){return x.id===id;});
    if(!l) return;
    openNoteCard({a:l.a, b:l.b}, id);
  }
  window.__openLinkCard=openLinkCard;
  backdrop.addEventListener('click', closeCard);
  cardCancel.addEventListener('click', closeCard);
  cardSave.addEventListener('click', function(){
    var text=cardNote.value.trim();
    if(!text){ alert('写点什么再保存吧。'); return; }
    if(editingId){
      var l=links.find(function(x){return x.id===editingId;});
      if(l) l.note=text;
    } else {
      links.push({id:'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                  a:draftPair.a, b:draftPair.b, note:text, ts:new Date().toISOString()});
    }
    persist(); paintLinks(); refreshPanel(); closeCard();
  });
  cardDelete.addEventListener('click', function(){
    if(!confirm('删除这条跨文献批注？')) return;
    links=links.filter(function(x){return x.id!==editingId;});
    persist(); paintLinks(); refreshPanel(); closeCard();
  });

  /* ---- side list panel (scoped to whichever pair is CURRENTLY open) ---- */
  var panel=document.getElementById('xrefPanel');
  var list=document.getElementById('xrefList');
  var openBtn=document.getElementById('xrefOpenBtn');
  var closeBtn=document.getElementById('xrefCloseBtn');
  function refreshPanel(){
    var rel=relevantLinks();
    openBtn.textContent='跨文献批注 ('+rel.length+')';
    list.innerHTML='';
    if(!rel.length){
      list.innerHTML='<div class="xempty">这两篇之间还没有跨文献批注。在左右两侧各选一段对应的文字，点出现的「+ 关联」即可建立一条。</div>';
      return;
    }
    rel.forEach(function(l){
      var row=document.createElement('div'); row.className='xrow';
      var qa=document.createElement('div'); qa.className='xq';
      qa.innerHTML='<b>'+escHtml(docLabel(l.a.doc))+'</b> “'+escHtml(truncate(l.a.text,60))+'”';
      var qb=document.createElement('div'); qb.className='xq';
      qb.innerHTML='<b>'+escHtml(docLabel(l.b.doc))+'</b> “'+escHtml(truncate(l.b.text,60))+'”';
      var note=document.createElement('div'); note.className='xnote'; note.textContent=l.note;
      row.appendChild(qa); row.appendChild(qb); row.appendChild(note);
      row.addEventListener('click', function(){ jumpToLink(l); });
      list.appendChild(row);
    });
  }
  openBtn.addEventListener('click', function(){ panel.classList.add('open'); });
  closeBtn.addEventListener('click', function(){ panel.classList.remove('open'); });

  /* ---- export / backup / import (same pattern as the single-paper pages).
     Export/clear act on the CURRENTLY OPEN PAIR only; import merges into the
     full shared library store by id regardless of which pair is open, so a
     backup can carry links spanning the whole library, not just one pair. */
  function markdown(){
    var rel=relevantLinks();
    var out=['# 跨文献批注 — '+docLabel(currentDoc.A)+' × '+docLabel(currentDoc.B), ''];
    rel.forEach(function(l,i){
      out.push('════ 第 '+(i+1)+' 条 ════');
      out.push('【'+docLabel(l.a.doc)+'】'+l.a.text);
      out.push('【'+docLabel(l.b.doc)+'】'+l.b.text);
      out.push('【批注】'+l.note);
      out.push('');
    });
    return out.join('\n');
  }
  function nativeDownload(filename, data){
    try{
      var blob=new Blob([data], {type:'text/plain;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return true;
    }catch(e){ return false; }
  }
  var dl=(window.claude && window.claude.downloads) ? window.claude.downloads : null;
  function offer(filename, data){
    if(dl){ dl.save({filename:filename, data:data}).catch(function(){ nativeDownload(filename, data); }); }
    else { nativeDownload(filename, data); }
  }
  document.getElementById('xrefExportMd').addEventListener('click', function(){
    if(!relevantLinks().length){ alert('这两篇之间还没有跨文献批注。'); return; }
    offer('cross-reference-notes.md', markdown());
  });
  document.getElementById('xrefExportJson').addEventListener('click', function(){
    var rel=relevantLinks();
    if(!rel.length){ alert('这两篇之间还没有跨文献批注。'); return; }
    offer('cross-reference-backup.json',
          JSON.stringify({pair:[currentDoc.A,currentDoc.B], saved:new Date().toISOString(), links:rel}, null, 2));
  });
  var importFile=document.getElementById('xrefImportFile');
  document.getElementById('xrefImportBtn').addEventListener('click', function(){ importFile.click(); });
  importFile.addEventListener('change', function(){
    var file=importFile.files[0]; importFile.value='';
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(){
      var data;
      try{ data=JSON.parse(reader.result); }catch(e){ alert('这不是有效的备份文件（JSON 解析失败）。'); return; }
      if(!Array.isArray(data.links)){ alert('备份文件里没有找到批注数据。'); return; }
      var byId={}; links.forEach(function(l){ byId[l.id]=l; });
      data.links.forEach(function(l){ byId[l.id]=l; });
      links=Object.keys(byId).map(function(k){ return byId[k]; });
      persist(); paintLinks(); refreshPanel();
      alert('导入完成，库里现有 '+links.length+' 条跨文献批注（含所有文献对）。');
    };
    reader.readAsText(file);
  });
  document.getElementById('xrefClear').addEventListener('click', function(){
    var rel=relevantLinks();
    if(!rel.length) return;
    if(!confirm('清空「'+docLabel(currentDoc.A)+'」和「'+docLabel(currentDoc.B)+'」之间的跨文献批注（共 '+rel.length+' 条）？'
      +'此操作无法撤销，建议先导出备份。其他文献对之间的批注不受影响。')) return;
    var relIds={}; rel.forEach(function(l){ relIds[l.id]=true; });
    links=links.filter(function(l){ return !relIds[l.id]; });
    persist(); paintLinks(); refreshPanel();
  });

  /* ---- read-only display of each OPEN side's OWN per-paragraph
     notes/highlights (from the full single-document reading pages) ----
     Only finds anything when this page is same-origin with those pages
     (e.g. all served from the same GitHub Pages site) -- localStorage is
     per-origin, so opened as a standalone Artifact this simply finds
     nothing, which is expected, not a bug. Read-only: editing a paragraph's
     own note/highlight is still the single-document page's job. */
  function parseNoteVal(raw){
    if(!raw) return '';
    if(typeof raw==='string') return raw;
    return raw.text||'';
  }
  function loadOwnAnnotations(docId){
    var byNid={};
    try{
      var notes=JSON.parse(localStorage.getItem('br-notes:'+docId)||'{}');
      Object.keys(notes).forEach(function(k){
        var v=parseNoteVal(notes[k]).trim();
        if(v) (byNid[k]=byNid[k]||[]).push(v);
      });
    }catch(e){}
    try{
      var hls=JSON.parse(localStorage.getItem('br-highlights:'+docId)||'[]');
      hls.forEach(function(h){
        var v=(h.note||'').trim();
        if(!v || !h.frags || !h.frags.length) return;
        (byNid[h.frags[0].nid]=byNid[h.frags[0].nid]||[]).push(v);
      });
    }catch(e){}
    return byNid;
  }
  function paintOwnAnnotations(){
    var total=0;
    ['A','B'].forEach(function(side){
      var docId=currentDoc[side];
      if(!docId) return;
      var byNid=loadOwnAnnotations(docId);
      document.querySelectorAll('.pane[data-side="'+side+'"] .para[data-nid]').forEach(function(para){
        para.querySelectorAll('.own-note').forEach(function(n){ n.remove(); });
        var texts=byNid[para.dataset.nid];
        if(!texts) return;
        total+=texts.length;
        texts.forEach(function(t){
          var box=document.createElement('div'); box.className='own-note';
          var lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent='已有批注';
          box.appendChild(lbl);
          box.appendChild(document.createTextNode(t));
          para.appendChild(box);
        });
      });
    });
    document.getElementById('ownNoteBanner').style.display = total ? 'none' : '';
    return total;
  }

  /* ---- paper picker: pick ANY two documents from the library ---- */
  function renderPane(side, docId){
    var doc=CR_DOCS[docId];
    var paneEl=document.querySelector('.pane[data-side="'+side+'"]');
    paneEl.querySelector('.t-en').textContent=doc.meta.title_en;
    var zhEl=paneEl.querySelector('.t-zh');
    zhEl.textContent=doc.meta.title_zh||'';
    zhEl.style.display=doc.meta.title_zh?'':'none';
    paneEl.querySelector('.pane-scroll').innerHTML=doc.html;
    paneEl.querySelectorAll('.sec[data-secidx]').forEach(function(h){ h.id=side+'sec-'+h.dataset.secidx; });
    paneEl.querySelectorAll('.para[data-idx]').forEach(function(p){ p.dataset.pid=side+p.dataset.idx; });
    var jsel=paneEl.querySelector('.jumpSelect');
    var opts=['<option value="">跳转到…</option>'];
    doc.toc.forEach(function(t){
      var indent=t.level==='h3'?'　':'';
      opts.push('<option value="'+side+'sec-'+t.idx+'">'+indent+escHtml(t.en)+'</option>');
    });
    jsel.innerHTML=opts.join('');
    currentDoc[side]=docId;
    var topSub=document.querySelector('.topbar .sub');
    if(currentDoc.A && currentDoc.B){
      topSub.textContent=docLabel(currentDoc.A)+' × '+docLabel(currentDoc.B)
        +' · 文献库共 '+DOC_ORDER.length+' 篇';
    }
    try{ if(currentDoc.A && currentDoc.B) localStorage.setItem('crLastPair', currentDoc.A+','+currentDoc.B); }catch(e){}
    paintLinks();
    paintOwnAnnotations();
    refreshPanel();
  }
  window.__crRenderPane=renderPane; /* exposed for tests */

  document.querySelectorAll('.paneDocSelect').forEach(function(sel){
    var side=sel.dataset.side;
    sel.innerHTML=DOC_ORDER.map(function(id){
      return '<option value="'+id+'">'+escHtml(CR_DOCS[id].meta.crumb)+'</option>';
    }).join('');
    sel.addEventListener('change', function(){ renderPane(side, sel.value); });
  });

  var savedPair=[];
  try{ savedPair=(localStorage.getItem('crLastPair')||'').split(','); }catch(e){}
  var initA = (savedPair[0] && CR_DOCS[savedPair[0]]) ? savedPair[0] : DOC_ORDER[0];
  var initB;
  if(savedPair[1] && CR_DOCS[savedPair[1]] && savedPair[1]!==initA){
    initB=savedPair[1];
  } else {
    initB = (DOC_ORDER[1] && DOC_ORDER[1]!==initA) ? DOC_ORDER[1] : DOC_ORDER[0];
  }
  document.querySelector('.paneDocSelect[data-side="A"]').value=initA;
  document.querySelector('.paneDocSelect[data-side="B"]').value=initB;
  renderPane('A', initA);
  renderPane('B', initB);
})();
</script></body></html>
