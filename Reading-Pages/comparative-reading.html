—尽管副市长的言辞十分动听。</p></div><h3 class=\"sec\" data-secidx=\"52\"><span class=\"en\">4.1. Mobilizing the potential</span><span class=\"zh\">4.1 动员“潜力”</span></h3><div class=\"para\" data-idx=\"53\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"934b6f91c0\"><p class=\"en\">In an interview for the city-owned magazine, a special planning officer coordinating the regeneration explained why, in addition to the anti-segregation perspective, investing in the neighborhoods is important:</p><p class=\"zh\">在接受市属杂志采访时,一位负责协调该更新工作的专项规划官员解释了为什么除了反隔离的视角之外,对这些社区进行投资也很重要:</p></div><div class=\"para quote\" data-idx=\"54\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"74674c4da5\"><p class=\"en\">We see potential in these areas. They have a strong local identity, diverse services, good transport connections, and a local nature where people like to spend their time.</p><p class=\"zh\">我们在这些片区看到了潜力。它们拥有强烈的地方认同感、多元化的服务、良好的交通连接,以及人们喜欢在其中消磨时光的本地自然环境。</p><span class=\"attrib\">市属《赫尔辛基杂志》(Helsinki Magazine, 2024)对一位负责更新工作的规划官员的采访原话——作者引用这段城市官员的话语,是把它作为‘声誉缺口’形成过程的经验证据来分析,而非作者本人对这些片区的评价。</span></div><div class=\"para\" data-idx=\"55\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"aba2060cc3\"><p class=\"en\">The fact that the city sees potential in the areas is an important part of the formation of the rent gap. Next, I will present two cases of reputational gap (Kallin, 2017) where the potential of the places has been held against their current defamed versions to increase the chances of urban intervention. The upgrading of Kontula, which has a long history as a national symbol of social problems, urban rootlessness, and failed integration of immigrants (Tuominen, 2020), is concentrated on refurbishment of the shopping mall. The Kontula mall has mainstream chain retailers, many bars, and ethnic retailers and the latter have spontaneously made it into one of the liveliest centers in Helsinki (see Hewidy &amp; Lilius, 2022). The mall, however, has been in a regeneration limbo since 2004, and a managed decline (Watt, 2023) is evident. The infrastructure is decayed, with small business owners reporting a fear of not being able to stay put in the new mall due to higher rents and the property owners’ hesitancy to maintain the premises due to demolition plans (Pietiläinen, 2023).</p><p class=\"zh\">城市‘在这些片区中看到潜力’这一事实本身,正是租隙形成过程中的重要一环。接下来,我将呈现两个声誉缺口(reputational gap)(Kallin, 2017)的案例,在这两个案例中,一个地方想象中的‘潜力’都被拿来与其当下被诋毁的版本相对照,以提高城市干预推进的机会。Kontula 长期以来一直是社会问题、城市无根性和移民融入失败的全国性象征(Tuominen, 2020),对它的‘提档升级’集中体现在对购物中心的翻新上。Kontula 购物中心拥有连锁零售商、众多酒吧以及族裔商户,后者自发地使其成为赫尔辛基最具活力的中心之一(见 Hewidy & Lilius, 2022)。然而,该购物中心自2004年以来一直处于更新的悬置状态,一种‘管理式衰败’(managed decline)(Watt, 2023)清晰可见。基础设施已经破败,小业主们反映,由于担心租金上涨,以及产权方因拆除计划而不愿维护物业,他们担心自己无法在新购物中心中继续立足(Pietiläinen, 2023)。</p></div><div class=\"para\" data-idx=\"56\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1ef672445a\"><p class=\"en\">In addition to the existing public services and retail stores, the Master Plan (City of Helsinki, 2013) enabled housing construction in the mall. An architectural competition, which can give legitimacy to political decisions by appearing neutral and technical (see Hautamäki &amp; Lindgren, 2025), was organized for the mall’s new vision. The winning plan, which involved complete demolition of the shopping mall, offered a stark contrast to its current condition and was with its imagined potential part of the formation of a reputational gap (Kallin, 2017) in Kontula. Uncertainty over the fate of the mall continued as of March 2025, when the Swedish developer NCC Property Development withdrew from the project.</p><p class=\"zh\">除了既有的公共服务和零售商店之外,《总体规划》(City of Helsinki, 2013)也为在购物中心内建设住房开了绿灯。市政府为购物中心的新愿景组织了一场建筑设计竞赛——这类竞赛因其看似中立、技术性的外观,能够为政治决策赋予正当性(见 Hautamäki & Lindgren, 2025)。获胜方案涉及对购物中心的整体拆除,与其当下的状况形成鲜明对比,其所设想的‘潜力’正是 Kontula 声誉缺口(Kallin, 2017)形成过程的一部分。截至2025年3月,购物中心的命运依然悬而未决——瑞典开发商 NCC Property Development 已退出该项目。</p></div><div class=\"para\" data-idx=\"57\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"aefb5a52fe\"><p class=\"en\">The reputational gap (Kallin, 2017) concerns all regeneration areas. However, the neighborhood’s proximity to green areas and beaches, elements which have increased property values in other parts of Helsinki (Lönnqvist, 2015), makes the reputational gap notably wide in Meri-Rastila. Lots of visionary work and branding has been done, including placemaking led by consulting firms and an architectural competition for the community center, the neighborhood’s flagship project. Another flagship project is the redevelopment of the Haruspuisto playground into a multifunctional park with an aquatic theme:</p><p class=\"zh\">声誉缺口(Kallin, 2017)是所有更新片区都存在的问题。然而,Meri-Rastila 因为毗邻绿地和海滩——这类要素在赫尔辛基其他地区已被证明能够提升房产价值(Lönnqvist, 2015)——其声誉缺口显得格外宽。大量的愿景构建与品牌塑造工作已经展开,包括由咨询公司主导的地方营造(placemaking),以及为该社区的旗舰项目——社区中心——举办的建筑设计竞赛。另一个旗舰项目,是将 Haruspuisto 游乐场改造为一座以水景为主题的多功能公园:</p></div><div class=\"para quote\" data-idx=\"58\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"cd1420596d\"><p class=\"en\">The goal of the urban renewal in Meri-Rastila is to diversify the housing stock. At the moment it seems to be the only goal, so to speak. And maybe, if you think about it cynically, the construction of the Haruspuisto and so on, they are kind of just doing it to raise the image of the area.</p><p class=\"zh\">Meri-Rastila 城市更新的目标是让住房存量多元化。可以说,目前这似乎是唯一的目标。而如果往悲观一点想,Haruspuisto 之类的建设,或许说白了就是为了提升这个片区的形象而已。</p><span class=\"attrib\">作者对一位城市规划师(City Planner)所做的半结构化访谈原话——这是一位受访规划从业者本人相当自我批判的坦言,作者引用它作为内部知情人对‘形象工程/声誉缺口’本质的证言,并非作者本人杜撰的评价,但与作者的分析结论方向一致。</span></div><div class=\"para\" data-idx=\"59\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"c1c262184c\"><p class=\"en\">Upgrading the image of the regeneration areas often focused on beautifying public spaces, such as the refurbishment of the playground in Meri-Rastila, or the demolition of old shopping malls. Demolition of residential buildings is not the primary method in the city of Helsinki’s densification efforts. However, it is in the toolbox:</p><p class=\"zh\">提升更新片区形象的努力,往往集中于美化公共空间,比如翻新 Meri-Rastila 的游乐场,或是拆除老旧购物中心。拆除住宅建筑并不是赫尔辛基密集化建设的主要手段,但它确实在这套工具箱之中:</p></div><div class=\"para quote\" data-idx=\"60\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"971afecfa4\"><p class=\"en\">Due to the poor condition of the housing stock in the urban regeneration areas and, as a rule, low construction efficiency, one third of the housing production is carried out as demolitions. For example, in Meri-Rastila, even more than 50 % of the new building rights are implemented by demolishing the existing residential buildings.</p><p class=\"zh\">由于城市更新片区住房存量的状况欠佳,加上通常较低的建设效率,三分之一的住房建设是通过拆除来实现的。例如在 Meri-Rastila,新建筑权中甚至有超过50%是通过拆除现有住宅建筑来落实的。</p><span class=\"attrib\">赫尔辛基2024年版《住房及相关土地利用实施方案》原文(City of Helsinki, 2024a)——城市官方政策文件语言,作者引用它作为拆除规模的数据证据,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"61\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"a082e58e06\"><p class=\"en\">Meri-Rastila has a large share of social housing stock in low-rise buildings that were built with significant state support in the early 1990s during the recession. The neighborhood is facing vast renewal to make more ‘efficient’ use of land by building more mixed-tenure high-rise buildings on existing plots. A local activist group managed to change the city’s previous plan to allocate densification to surrounding forest areas. Now, more than half of new building permits are implemented by demolishing 30-year-old, mostly social housing stock, that is in poor condition due to neglected maintenance. As symbolic denigration of disinvested neighborhoods is often linked to the built environment, the stigma thus ‘primes’ Meri-Rastila for renewal where demolitions appear necessary and even benevolent (see Wacquant, 2010).</p><p class=\"zh\">Meri-Rastila 的社会住房大量集中在20世纪90年代初经济衰退期间依靠大量国家支持建成的低层建筑中。该社区目前正面临大规模更新,通过在既有地块上建设更多混合产权的高层建筑,来实现土地的‘更高效’利用。当地一个活动人士团体成功促使该市改变了此前将密集化建设分配到周边林地的计划。如今,超过一半的新建许可,是通过拆除这些建成30年、以社会住房为主、因维护不善而状况不佳的建筑来落实的。由于对撤资社区的象征性贬低往往与建成环境本身相关联,污名因此为 Meri-Rastila 的更新做好了‘铺垫’(prime),使拆除显得不仅必要,甚至是善意之举(见 Wacquant, 2010)。</p></div><div class=\"para\" data-idx=\"62\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"2a7108a3c1\"><p class=\"en\">The tenure form on the Meri-Rastila demolition sites is secured, and the plan is to increase the total population so that the proportion but not the absolute number of low-income social housing dwellers declines – so called ‘positive gentrification’ (Shaw &amp; Hagemans, 2015). However, a few things can be expected to affect the availability of affordable housing. First, new production is always more expensive, leading to higher rents – even for social housing. Second, due to a change in the municipal housing company’s rent setting system in 2019 towards an emphasis on use value, the social housing rents now reflect the market rents of the area. After the renewal of Myllypuro, the city’s example of successful urban regeneration, the social housing rents increased more than in other neighborhoods, indicating that low-income households may pay the price for reinvestments in the area (see Lilius &amp; Hirvonen, 2021).</p><p class=\"zh\">Meri-Rastila 拆除地块上的产权形式是有保障的,计划是通过增加总人口,使低收入社会住房居民的比例(而非绝对数量)下降——也就是所谓的‘积极的绅士化’(positive gentrification)(Shaw & Hagemans, 2015)。然而,可以预见有几个因素将影响可负担住房的可得性。首先,新建住房的成本总是更高,这会导致租金上涨——即便是社会住房也不例外。其次,由于市属住房公司于2019年将其租金制定体系改为更强调‘使用价值’,社会住房的租金如今已经反映出该地区的市场租金水平。在该市引以为成功更新典范的 <a class=\"gref\" href=\"#g-myllypuro\">Myllypuro</a> 完成更新之后,当地社会住房租金的涨幅超过了其他社区,这表明低收入家庭可能正在为该地区的再投资付出代价(见 Lilius & Hirvonen, 2021)。</p></div><div class=\"para\" data-idx=\"63\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"5c0d3d1960\"><p class=\"en\">Therefore, the demolition of old rental housing, along with the rule of an increased share of owner-occupied housing, can lead to exclusionary displacement (Marcuse, 1985) of low-income people due to the lack of affordable housing following the increased land value. Then the expected advantages of densification, such as improved services, might mostly end up benefiting middle- and high-income people (see Lutz et al., 2024). The tension between the current and the potential has material consequences, and the dialectical nature of estate regeneration and degeneration (Watt, 2023) became clear during my fieldwork in the regeneration areas.</p><p class=\"zh\">因此,拆除老旧租赁住房,加上提高自有产权住房比例这一规则,可能会因土地价值上升后可负担住房的缺乏,而对低收入群体造成排斥性置换(exclusionary displacement)(Marcuse, 1985)。而密集化建设所预期带来的好处(比如服务设施的改善),到头来可能主要惠及中高收入群体(见 Lutz et al., 2024)。‘现状’与‘潜力’之间的张力具有实实在在的物质后果,而住区更新(regeneration)与衰败(degeneration)之间的辩证性质(Watt, 2023),在我于这些更新片区所做的田野调查中变得清晰可见。</p></div><div class=\"para\" data-idx=\"64\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"9d15b25852\"><p class=\"en\">In Vesala, seven social housing buildings built in the 1980s were zoned to be demolished and replaced with wooden buildings because the Mellunkylä district served as a ‘living lab’ for carbon neutral densification - yet another attempt to bridge the reputational gap. New building permits were granted to social rental and right-of-occupancy housing. However, because the city abolished its own regulated owner-occupied housing production (HITAS) and the government abolished the right-to-occupancy model, the plans were abandoned. In the time of writing, a new detailed plan was forthcoming but lacked developers.</p><p class=\"zh\">在 Vesala,七栋建于20世纪80年代的社会住房建筑被规划为拆除,并以木结构建筑取而代之,原因是 Mellunkylä 区被当作碳中和密集化建设的‘生活实验室’(living lab)——这是弥合声誉缺口的又一次尝试。新的建筑许可被批给了社会租赁住房和<a class=\"gref\" href=\"#g-hitas\">居住权住房(right-of-occupancy housing)</a>。然而,由于该市废止了自己受管制的自有产权住房建设项目(HITAS),中央政府又废止了居住权住房模式,这些计划最终被搁置。截至本文写作之时,一份新的详细规划正在酝酿之中,但尚未有开发商接手。</p></div><div class=\"para\" data-idx=\"65\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1a53e063a4\"><p class=\"en\">The following fieldnote is from a Q&amp;A meeting in Mellunmäki with local politicians and the board of the municipal rental housing company (Heka). The event, where the topic of drastic rent increases (8.4 % in 2024 and 5.3 % in 2025) was discussed, was held in the local elementary school cafeteria. The meeting attracted mostly social housing residents from all over Mellunkylä district, but some had even come from the other side of Helsinki.</p><p class=\"zh\">以下这段田野笔记,来自在 Mellunmäki 举行的一场问答会,与会者包括当地政治人物和市属租赁住房公司(<a class=\"gref\" href=\"#g-heka\">Heka</a>)董事会成员。会议在当地一所小学的食堂举行,讨论的主题是租金的大幅上涨(2024年上涨8.4%,2025年上涨5.3%)。前来参会的大多是来自 Mellunkylä 各社区的社会住房居民,其中一些人甚至是从赫尔辛基的另一端赶来的。</p></div><div class=\"para quote\" data-idx=\"66\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"2e030e9114\"><p class=\"en\">Several residents raised maintenance issues. A resident from the Vesala demolition sites expressed frustration over the fact that the rents were increasing although repairs were not being made due to the eventual demolition. The resident feared that the hardware in their home is going to break down at any moment but won’t be fixed. An elderly woman talked about her and her neighbors’ apartments being cold in the winter, and an elderly man expressed concern that due to poor snow plowing, emergency vehicles cannot access the buildings. Families also reported difficulties planning for the future, such as which school to register their children for, due to the uncertainty of relocation.</p><p class=\"zh\">多位居民提出了维护方面的问题。一位来自 Vesala 拆除地块的居民表达了不满,因为尽管房屋因最终将被拆除而不再进行维修,租金却仍在上涨。这位居民担心自家的设备随时可能损坏,却得不到维修。一位年长的女性谈到自己和邻居的公寓在冬天很冷,一位年长的男性则担忧由于除雪不到位,紧急车辆无法驶入楼群。也有家庭反映,由于搬迁的不确定性,他们在为未来做规划时遇到困难,比如不知道该给孩子登记哪所学校。</p><span class=\"attrib\">作者本人的田野笔记(Fieldnote 2/4/2025),记录社会住房居民在问答会上的发言——这是作者呈现的一手民族志证据,用以说明‘管理式衰败’对居民造成的实际伤害,是本文论证的重要经验支撑,而非作者引来反驳的对立观点。</span></div><div class=\"para\" data-idx=\"67\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"6dd3fb4976\"><p class=\"en\">Managed decline (Watt, 2023) during mid-phase regeneration, where existing buildings are neglected in expectation of demolition, had caused distress among the residents. Displacement anxiety (Watt, 2021) can occur when residents hear rumors and information about demolitions or other changes sometimes years before any actual proceedings (see Juhila et al., 2023). The stagnant and uncertain demolition timeline was also causing worry in Meri-Rastila, where social housing residents wished for better communication of plans:</p><p class=\"zh\">更新中期阶段的‘管理式衰败’(managed decline)(Watt, 2023)——即既有建筑因预期将被拆除而遭到忽视——已经给居民造成了困扰。置换焦虑(displacement anxiety)(Watt, 2021)可能在居民听到有关拆除或其他变化的传闻和信息时便已产生,而这往往发生在实际程序启动的数年之前(见 Juhila et al., 2023)。在 Meri-Rastila,停滞而不确定的拆除时间表同样引发了担忧,社会住房居民希望规划方能加强沟通:</p></div><div class=\"para quote\" data-idx=\"68\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"2dc69a07f8\"><p class=\"en\">As an example of poor communication, a resident brought up a nearby social housing estate where the residents found out about the demolition of their buildings from a local newspaper instead of Heka. Another social housing tenant wanted to know what will happen to her apartment. The representative of Heka explained that a return to the demolition sites is not guaranteed, because the new building does not necessarily have similar apartments. A separate decision will be made on the possible right of return, but it had not been made for the Meri-Rastila demolition sites.</p><p class=\"zh\">作为沟通不善的一个例子,一位居民提到附近一个社会住房社区,那里的居民是从地方报纸而不是从 Heka 那里得知自己所住楼栋将被拆除的消息的。另一位社会住房租户想知道自己的公寓将会怎样。Heka 的代表解释说,能否返回拆除地块并无保证,因为新建筑不一定会有类似的户型。是否享有回迁权,将另行作出决定,但就 Meri-Rastila 的拆除地块而言,这一决定尚未作出。</p><span class=\"attrib\">作者本人的田野笔记(Fieldnote 01/23/2025),记录社区会议中居民与 Heka 代表的对话——这是作者呈现的一手民族志证据,用以说明规划沟通不足给居民带来的不确定性,是本文论证的经验支撑,而非作者引来反驳的对立观点。</span></div><div class=\"para\" data-idx=\"69\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"d4db7d9f22\"><p class=\"en\">The municipal rental housing provider Heka is obligated to find temporary housing for tenants whose residential buildings are renovated or demolished. Tenants have the right to return to their renovated apartment or stay in their new apartment. However, according to the Heka representative, returning to the Meri-Rastila demolition sites was not guaranteed, because the new building might not meet tenant needs.</p><p class=\"zh\">市属租赁住房提供方 Heka 有义务为其住宅楼被翻新或拆除的租户安排临时住房。租户有权返回经翻新的公寓,或留在自己的新公寓中。然而,据 Heka 代表所说,返回 Meri-Rastila 拆除地块并无保证,因为新建筑可能无法满足租户的需求。</p></div><h3 class=\"sec\" data-secidx=\"70\"><span class=\"en\">4.2. Socializing risks</span><span class=\"zh\">4.2 将风险社会化</span></h3><div class=\"para\" data-idx=\"71\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1840a63509\"><p class=\"en\">The uncertainty of the regeneration timeline reflected in the displacement anxiety of some of the residents is the sum of many things. In the urban regeneration areas, site plan solutions must support the implementation of unregulated or intermediate housing production (City of Helsinki, 2021a). However, in 2024 the Finnish government decided to stop financing new production of right-to-occupancy housing by the end of 2025, phasing out the current system. This new and challenging ‘operational environment’ caused by the state’s welfare retrenchment was acknowledged in the latest Land Use program (City of Helsinki, 2024a), which emphasizes the increasing importance of the balancing role of new housing production during the current program period.</p><p class=\"zh\">部分居民置换焦虑中所反映出的更新时间表的不确定性,是多重因素叠加的结果。在城市更新片区,场地规划方案必须支持非管制住房或中间产权住房建设的落实(City of Helsinki, 2021a)。然而,芬兰政府在2024年决定,到2025年底停止资助新建居住权住房,逐步淘汰现行体制。国家福利紧缩所造成的这种全新且充满挑战的‘运作环境’,在最新版土地利用方案(City of Helsinki, 2024a)中得到了承认,该方案强调在当前规划周期内,新建住房所扮演的‘平衡’角色将愈发重要。</p></div><div class=\"para\" data-idx=\"72\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"c81e435b1b\"><p class=\"en\">Until Helsinki launches a new model for regulated owner-occupied housing, most of the housing production in the regeneration areas will be unregulated owner-occupied housing in the name of anti-segregation:</p><p class=\"zh\">在赫尔辛基推出新的受管制自有产权住房模式之前,更新片区中的大部分住房建设,都将以反隔离的名义,以非管制自有产权住房的形式进行:</p></div><div class=\"para quote\" data-idx=\"73\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"6aede2211c\"><p class=\"en\">In urban regeneration areas, intermediate housing production cannot be replaced by rental housing from the perspective of preventing segregation, so currently, unregulated owner-occupied housing production is almost the only alternative to right-of-occupancy production in these areas</p><p class=\"zh\">在城市更新片区,从防止隔离的角度出发,中间产权住房的建设不能被租赁住房所替代,因此目前在这些片区,非管制自有产权住房建设几乎是居住权住房建设唯一的替代选项</p><span class=\"attrib\">赫尔辛基2024年版《住房及相关土地利用实施方案》原文(City of Helsinki, 2024a)——城市官方政策文件语言,作者引用它来揭示该市如何用‘防止隔离’的理由,把‘非管制自有产权住房’论证为唯一可行的建设选项,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"74\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"d7441f42dd\"><p class=\"en\">Replacing the city’s own regulated owner-occupation with unregulated housing production is represented as the only alternative in areas dominated by rental apartments. It could be argued, with Lilius and Hirvonen (2021), that one factor that has been able to regulate negative consequences of gentrification in Helsinki (such as large-scale displacement of low-income residents) is the housing allowance. However, the housing allowance is one of the benefits that has been most targeted by the current Finnish government’s welfare cuts. Even though austerity politics at the national level can be expected to increase the need for affordable housing in Helsinki, the city stands firmly on its principle of mixed neighborhoods:</p><p class=\"zh\">以非管制住房建设取代该市自身受管制的自有产权住房建设,被呈现为在以租赁公寓为主的地区唯一可行的选项。可以援引 Lilius 和 Hirvonen(2021)的观点认为,住房补贴(housing allowance)正是能够在赫尔辛基调节绅士化负面后果(比如低收入居民的大规模置换)的因素之一。然而,住房补贴恰恰是当前芬兰政府福利削减最主要针对的福利项目之一。尽管可以预见国家层面的紧缩政治将增加赫尔辛基对可负担住房的需求,该市却依然坚定地固守其‘混合社区’的原则:</p></div><div class=\"para quote\" data-idx=\"75\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"024237786f\"><p class=\"en\">The city is hesitant to raise the total share of ARA [state-subsidized] rental production. Increased ARA production would mean increasing the share also in areas that already have plenty of ARA rental and other rental housing stock, and from the point of view of preventing segregation, increasing rental production in these areas is not recommended.</p><p class=\"zh\">该市不愿提高<a class=\"gref\" href=\"#g-ara\">ARA</a>[国家补贴]租赁住房建设的总体占比。增加ARA住房建设意味着也要在那些已经拥有大量ARA租赁住房及其他租赁住房存量的片区提高其比例,而从防止隔离的角度看,在这些片区增加租赁住房建设是不被推荐的。</p><span class=\"attrib\">赫尔辛基2024年版《住房及相关土地利用实施方案》原文(City of Helsinki, 2024a)——城市官方政策文件语言,作者引用它来展示该市如何用‘防止隔离’的说法为拒绝增加社会租赁住房辩护,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"76\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1dbea9d489\"><p class=\"en\">Furthermore, the City Council confirmed its own version of this same principle:</p><p class=\"zh\">此外,市议会也确认了同一原则的另一种官方表述:</p></div><div class=\"para quote\" data-idx=\"77\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"704a2a9d32\"><p class=\"en\">However, the city will adhere to the Land Use program’s segregation prevention goals in all situations. […] Therefore, for example, in areas already dominated by rental housing, changes from owner-occupied housing to rental housing would not be possible in principle in the future.</p><p class=\"zh\">然而,该市将在任何情况下都坚持土地利用方案所设定的防止隔离目标。［……］因此,举例来说,在已经以租赁住房为主的片区,原则上今后将不再可能出现从自有产权住房向租赁住房的转变。</p><span class=\"attrib\">赫尔辛基市议会决议原文(City Council, 2024)——市议会官方表态,作者引用它来说明‘防止隔离’的说法如何被用来把‘只增自有产权、不增租赁住房’的规则固定为原则,并非作者本人的立场。</span></div><div class=\"para\" data-idx=\"78\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"a92be4ebe2\"><p class=\"en\">As a municipality with a planning monopoly, Helsinki has the tools to influence the supply of social housing, if it wishes. The city is unwilling to raise the total share of state-subsidized rental production because doing so would hinder the goal of mixed communities in rental-dominated areas. City council confirmed that the city will adhere to segregation prevention goals in all situations, making changes in the production from owner-occupied to rental housing impossible in the regeneration areas. The quotes above demonstrate the common-sense position of social mix in Helsinki’s urban policy. Prioritizing diversification of the housing stock, even during an affordability crisis, shows how the hegemonic position of the storyline about the problems of social housing is integrated into political practices and institutional arrangements through social mix (see Hajer, 1995).</p><p class=\"zh\">作为一个拥有规划垄断权的市镇,赫尔辛基如果愿意,原本拥有影响社会住房供给的手段。该市之所以不愿提高国家补贴租赁住房建设的总体占比,是因为这样做会妨碍在以租赁住房为主的片区实现‘混合社区’的目标。市议会确认,该市将在任何情况下都坚持防止隔离的目标,这使得更新片区从自有产权住房向租赁住房方向的建设转变在原则上不再可能。以上引述表明,社会混合在赫尔辛基城市政策中所占据的、近乎常识般不容质疑的地位。即便在可负担性危机之中,也依然优先推进住房存量多元化,这恰恰说明了关于‘社会住房问题’的故事线的霸权地位,是如何通过社会混合被整合进政治实践与制度安排之中的(见 Hajer, 1995)。</p></div><div class=\"para\" data-idx=\"79\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1002ed27bd\"><p class=\"en\">However, diversification of the housing stock turned out to be more difficult than expected. Alongside the national changes to the housing policy, increased interest rates and their particularly negative impact on the construction industry were another challenge for Helsinki’s set goals for housing. Before the ongoing economic impacts of the Ukrainian war, real estate investors were interested in densification in urban regeneration areas (City of Helsinki, 2021a). According to city planners, large international investors such as NREP had made plot reservations in Meri-Rastila. Since then, regeneration has been disrupted because many plans have not attracted developers. The national government’s decision to stop funding right-of-occupancy production, which according to the Land Use program (City of Helsinki, 2024a) has encouraged the production of unregulated housing, was predicted to further slow all housing construction in the urban regeneration areas.</p><p class=\"zh\">然而,住房存量的多元化,结果被证明比预期更加困难。除了国家层面住房政策的变化之外,利率上升及其对建筑行业尤为负面的冲击,也给赫尔辛基既定的住房目标带来了另一重挑战。在乌克兰战争持续造成经济冲击之前,房地产投资者对更新片区的密集化建设一直抱有兴趣(City of Helsinki, 2021a)。据城市规划师介绍,像 NREP 这样的大型国际投资者曾在 Meri-Rastila 预留过地块。此后,由于许多规划方案未能吸引到开发商,更新工作因此受阻。据土地利用方案(City of Helsinki, 2024a)所述,中央政府停止资助居住权住房建设的决定,曾经推动了非管制住房的建设,而这一决定预计将进一步拖慢更新片区所有住房建设的步伐。</p></div><div class=\"para\" data-idx=\"80\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"34bcd5a7b5\"><p class=\"en\">When the city cannot de-risk (Gray, 2022) the development of unregulated housing with intermediate housing production, private investors are even less eager to invest. In this new situation the city, together with industry actors, has had to find other ways to stand for the risks and costs of land development so that private capital does not have to. To create better conditions for private investments in these “un-gentrifiable” (Mösgen et al., 2019) neighborhoods, the city has tried to initiate urban regeneration through green gentrification strategies (Wallin, 2021) such as refurbishing public environments, streets and parks, land remediation, and improving transport connections.</p><p class=\"zh\">当该市无法再借助中间产权住房建设来为非管制住房开发‘去风险’(de-risk)(Gray, 2022)时,私人投资者就更加缺乏投资意愿。在这一新的形势下,该市不得不与产业界行动者一道,寻找其他方式来承担土地开发的风险和成本,从而使私人资本不必承担这些风险和成本。为了给这些“不可绅士化”(un-gentrifiable)的社区(Mösgen et al., 2019)创造更好的私人投资条件,该市尝试通过绿色绅士化策略(green gentrification strategies)(Wallin, 2021)——比如翻新公共环境、街道和公园,进行土地整治,改善交通连接——来启动城市更新。</p></div><div class=\"para quote\" data-idx=\"81\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"4b46a48ad8\"><p class=\"en\">Haruspuisto is what they started the renewal of Meri-Rastila with, so that it would attract unregulated housing production there. But yes, there is also a will with that park planning project, that they really want to do good for the existing residents as well.</p><p class=\"zh\">他们是从 Haruspuisto 开始启动 Meri-Rastila 更新的,为的是能吸引非管制住房建设落地那里。不过没错,那个公园规划项目背后也确实有一份心意,他们也是真心希望能为现有居民做点好事的。</p><span class=\"attrib\">作者对城市规划师(City Planner)所做访谈的原话——受访规划从业者本人对公园项目‘引资’和‘为居民好’两种动机并存的坦承,作者引用它来支持其分析(公共投资首先是为‘去风险’服务),并非作者本人杜撰,而是与作者结论方向一致的第一手证言。</span></div><div class=\"para\" data-idx=\"82\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"6aa610651e\"><p class=\"en\">Although refurbished public spaces were thought to benefit existing residents as well, the main motive was for them to speed up housing production by attracting private investments. This has meant a significant increase in the city’s own investments in the areas. In the city budget for 2022, 7.5 million euros were allocated for the refurbishment of public spaces in Mellunkylä for the following three years (City of Helsinki, 2021c). Three years later, the city allocated 19.5 million euros for Mellunkylä and 14 million euros for Meri-Rastila for the next three years (City of Helsinki, 2024b).</p><p class=\"zh\">虽然翻新后的公共空间也被认为能让现有居民受益,但其主要动机是通过吸引私人投资来加快住房建设的速度。这意味着该市在这些片区自身投资的显著增加。在2022年城市预算中,未来三年用于 Mellunkylä 公共空间翻新的拨款为750万欧元(City of Helsinki, 2021c;当时 Meri-Rastila 尚未被纳入更新片区,故不计入此项预算)。三年后,该市为接下来三年在 Mellunkylä 和 Meri-Rastila 分别拨款1950万欧元和1400万欧元(City of Helsinki, 2024b)。</p></div><div class=\"para\" data-idx=\"83\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"546d20b8a7\"><p class=\"en\">In Kontula, where the development of the shopping mall was standing still, the city was frantically looking for solutions to show that something was being done for the area. Kontula was a pilot area for the ‘incentive experiment’ where the city offered to pay a larger share of the corresponding market value of the plot if the building right was sold to the city. Because densification is largely based on the initiative of private landowners and housing condominiums, the city encouraged them with financial incentives. Another policy measure to support the marketability of housing projects was to enable the sale of the plot at a ‘flexible’ price, instead of renting it (City of Helsinki, 2024a). The transfer of land by selling has increased in Helsinki (Hyötyläinen, 2015), in order to increase the city’s attractiveness and business activities, as well as to achieve set sales targets.</p><p class=\"zh\">在购物中心开发陷入停滞的 Kontula,该市正焦急地寻找各种解决方案,以显示自己正在为这个片区‘有所作为’。Kontula 是‘激励实验’(incentive experiment)的试点片区之一——在这一实验中,如果建筑权被出售给该市,市政府将支付相应地块市场价值中更大的一部分份额。由于密集化建设在很大程度上有赖于私人土地所有者和住宅公司的主动配合,该市便以财政激励来鼓励他们。另一项支持住房项目可销售性的政策措施,是允许以‘灵活’的价格出售地块,而不是出租地块(City of Helsinki, 2024a)。在赫尔辛基,以出售方式转让土地的做法已经有所增加(Hyötyläinen, 2015),目的是提升该市的吸引力和商业活动水平,并实现既定的销售目标。</p></div><div class=\"para\" data-idx=\"84\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"62ca34696d\"><p class=\"en\">In the city council’s decision (2024), the new policy of the sale of plots for unregulated owner-occupied housing production and increasing price competition to ensure market pricing of plots was mainly, but not only, limited to urban regeneration areas. An attempt by a representative from Left Alliance to restrict the sale of plots only to regeneration areas (City Council, 2024) implies that the storyline of the causes of urban inequality and the hegemonic position of social mix legitimizes neoliberal land use policy, even for political actors that would otherwise be critical of the marketization of urban land. These efforts by the city to address market failure show how crucial state intervention is to the formation and potential closure of rent gaps (Gray, 2022).</p><p class=\"zh\">在市议会的决议(2024年)中,这项为非管制自有产权住房建设出售地块、并通过加强价格竞争来确保地块市场化定价的新政策,主要(但不仅仅)局限于城市更新片区。左翼联盟(Left Alliance)一位代表曾试图将地块出售仅限制在更新片区范围内(City Council, 2024),这一尝试恰恰表明:关于城市不平等成因的故事线,以及社会混合的霸权地位,即便对那些本应对城市土地市场化持批判态度的政治行动者而言,也已经使新自由主义土地利用政策获得了正当性。该市为应对‘市场失灵’所做的这些努力表明,国家干预对于租隙的形成及其可能的弥合,是何等关键(Gray, 2022)。</p></div><h2 class=\"sec\" data-secidx=\"85\"><span class=\"en\">5. Discussion</span><span class=\"zh\">5. 讨论</span></h2><div class=\"para\" data-idx=\"86\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"74d22b6e6e\"><p class=\"en\">With a case of stalling urban regeneration in Helsinki, this article contributes to the literature on state-led gentrification by showing how the state intervention to capitalist reproduction has been justified with an anti-segregation narrative. The growth of Helsinki, both physically and economically, relies greatly on the densification of existing residential areas in the suburban zone. I argue that statistical representations (see Sisson, 2021a) of segregation offer a useful problem that gives the city a depoliticized, moral justification to intensified market dominance in housing and land use policy. At the same time, reorganizing the disinvested neighborhoods with increased owner-occupation allows Helsinki to maintain its image as the posterchild of segregation prevention and an (at least statistically) egalitarian city.</p><p class=\"zh\">通过一个赫尔辛基城市更新停滞的案例,本文为国家主导型绅士化的相关文献作出了贡献,展示了国家对资本主义再生产的干预,是如何借助反隔离叙事获得正当性的。赫尔辛基无论在物理空间还是经济层面的增长,都在很大程度上依赖于对郊区既有居住区的密集化建设。我认为,关于隔离的统计表征(见 Sisson, 2021a)提供了一个‘有用的问题’,使该市在住房和土地利用政策中不断强化的市场主导地位,获得了一种去政治化的道德正当性。与此同时,以增加自有产权住房的方式对撤资社区进行重组,也让赫尔辛基得以维持其作为隔离防治模范生、以及一座(至少在统计意义上)平等主义城市的形象。</p></div><div class=\"para\" data-idx=\"87\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"5623276c11\"><p class=\"en\">Through social mix discourse, the complexity of urban inequality is reduced to a problem of “one-sided housing stock” that can be solved through diversification policy. Legitimation for social mix now also as a corrective measure is not a difficult task in Helsinki, where social mix policy enjoys widespread popularity due to the city’s rather successful history of building mixed-tenure neighborhoods. The appeal of social mix is normative as well - “it sounds right” (Hajer, 1995, p. 63) to have mixed communities. The power of social mix discourse is in bringing different interests together by manufacturing consent (Bacqué &amp; Charmes, 2024).</p><p class=\"zh\">通过社会混合话语,城市不平等的复杂性被简化为一个“单一化住房存量”的问题,而这个问题可以通过多元化政策来解决。如今,把社会混合作为一种矫正措施加以正当化,在赫尔辛基并非难事,因为该市在建设混合产权社区方面有着相当成功的历史,社会混合政策因此享有广泛的支持度。社会混合的吸引力也具有规范性的一面——拥有混合社区“听起来就是对的”(Hajer, 1995, 第63页)。社会混合话语的力量,就在于它能够通过制造共识(manufacturing consent)把不同的利益方汇聚到一起(Bacqué & Charmes, 2024)。</p></div><div class=\"para\" data-idx=\"88\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"52bbf26126\"><p class=\"en\">While the motive for urban regeneration is ultimately profit, many of the actors and intentions behind its mechanics are well meaning (Krijnen, 2018); the city planners involved in the refurbishment of Haruspark in Meri-Rastila do it for the existing residents, not solely or even primarily to attract private investments in the area. It is important to note that there is moral commitment in the interventions, one which the stigmatizing storyline of \"problematic\" social housing concentrations has helped to construct. The stigma legitimates intervention through notions of fairness, not only as an external justification but likely also as an internal justification at the level of the institution (Kallin, 2017).</p><p class=\"zh\">虽然城市更新的动机归根结底是利润,但推动其运作机制的许多行动者及其意图,本身是出于善意的(Krijnen, 2018)——参与 Meri-Rastila 的 Haruspark(即 Haruspuisto)翻新工作的城市规划师们,是为了现有居民而这样做的,而不完全是、甚至主要不是为了吸引私人投资进入该地区。值得注意的是,这些干预措施中确实包含着一种道德承诺(moral commitment),而这种承诺,恰恰是被那套将‘问题化’的社会住房集聚地污名化的故事线所塑造出来的。污名通过‘公平’的观念使干预获得正当性,这种正当化不仅是一种对外的辩护,很可能也是一种在制度层面的内部自我辩护(Kallin, 2017)。</p></div><div class=\"para quote\" data-idx=\"89\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"bdebaceb2b\"><p class=\"en\">whether social mix policies are harmless or insidious depends in part on the social and political context in which they are situated.</p><p class=\"zh\">社会混合政策究竟是无害的,还是暗藏危害,部分取决于它们所处的社会和政治情境。</p><span class=\"attrib\">Arthurson(2008, 第499页)本人的理论表述——作者引用这句话是采纳、赞同其观点,并以此为跳板提出自己的判断(见下一句“I argue that…”),这是作者借他人之口引出自己论点的方式,并非要反驳的对象。</span></div><div class=\"para\" data-idx=\"90\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"eaa9557e91\"><p class=\"en\">I argue that, situated in the context of intensified welfare retrenchment, the city’s stubborn devotion to the social mix policy risks legitimizing instead of challenging urban inequality. The national government’s cuts to both supply-side housing subsidies (Rasinkangas et al., 2024) and housing allowances, together with rent increases in municipally owned social housing, have already materialized in increased evictions (Kuokkanen, 2024) and a rise in homelessness for the first time in over a decade (ARA, 2024). This can make the question of physical displacement relevant in the Finnish context, where it has until now remained a marginal phenomenon due to housing allowances that have allowed low-income households to stay put.</p><p class=\"zh\">我认为,在福利紧缩不断加剧的这一情境之下,该市对社会混合政策的固执坚持,有可能非但没有挑战城市不平等,反而使其获得正当性。中央政府对供给侧住房补贴(Rasinkangas et al., 2024)和住房补贴金(housing allowances)的双重削减,加上市属社会住房租金的上涨,已经切实转化为驱逐(evictions)案例的增加(Kuokkanen, 2024),以及十多年来首次出现的无家可归人数上升(ARA, 2024)。这可能使物理性置换问题在芬兰语境下重新变得具有现实意义——迄今为止,由于住房补贴金一直使低收入家庭得以留在原地,物理性置换在芬兰始终只是一个边缘现象。</p></div><div class=\"para\" data-idx=\"91\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"d3fa1759dd\"><p class=\"en\">Research has shown that home ownership among both low-income and middle-income households has decreased in Helsinki due to the high cost of housing (Saikkonen et al., 2018). For young people, home ownership has increasingly become out of reach due to financialization of smaller flats and the high cost of larger apartments (Vaattovaara &amp; Vuori, 2023). Still, the city insists on increasing the share of unregulated owner-occupation in the regeneration areas. By affirming the dominance of private market housing provision, the city does not only justify the status quo but, according to recent examples from the Helsinki Metropolitan Area, the city might contribute to increased financialization of housing, without much impact on the socioeconomic profile of the areas (see Lilius &amp; Hirvonen, 2021).</p><p class=\"zh\">研究表明,由于住房成本高昂,赫尔辛基低收入和中等收入家庭的自有住房率都在下降(Saikkonen et al., 2018)。对年轻人来说,由于小户型公寓的金融化以及大户型公寓的高昂成本,自有产权住房已经变得越来越遥不可及(Vaattovaara & Vuori, 2023)。尽管如此,该市仍然坚持在更新片区提高非管制自有产权住房的比例。通过肯定私人市场供房的主导地位,该市不仅使现状获得了正当性,而且根据赫尔辛基都市区近期的一些实例来看,该市的做法甚至可能加剧住房的金融化,却对这些片区的社会经济状况几乎没有什么实质影响(见 Lilius & Hirvonen, 2021)。</p></div><div class=\"para\" data-idx=\"92\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"0b3ae191b1\"><p class=\"en\">Furthermore, the mere focus on segregation metrics can result in false conclusion regarding increased equality by overlooking other dimensions of urban inequality, such as limited affordable housing options (Uitermark et al., 2024). As a Nordic municipality, the tools for securing housing affordability are good. But in adhering to its anti-segregation goal, the city is hesitating to increase the share of state-subsidized rental housing production in the city as a whole because doing so would mean increasing it in the urban regeneration areas as well. However, without genuine efforts to ensure access to affordable housing densification does not contribute to urban equality – it can contribute to gentrification (see Cavicchia, 2021).</p><p class=\"zh\">此外,单纯聚焦于隔离指标,可能会因忽视城市不平等的其他维度(比如可负担住房选择的有限性)(Uitermark et al., 2024),而得出关于‘平等程度提升’的错误结论。作为一个北欧市镇,赫尔辛基原本拥有确保住房可负担性的良好制度工具。但由于坚持其反隔离目标,该市在提高全市国家补贴租赁住房建设占比这件事上一直犹豫不决,因为这样做也就意味着要在城市更新片区提高这一比例。然而,如果缺乏确保可负担住房可得性的真正努力,密集化建设本身并不能促进城市平等——它反而可能助长绅士化(见 Cavicchia, 2021)。</p></div><div class=\"para\" data-idx=\"93\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"3d767d165e\"><p class=\"en\">The case areas, Mellunkylä and Meri-Rastila, have long histories with stigma and decades’ worth of efforts to ‘revitalize’ them. The efforts have formed the basis for the continuation of similar measures, such as the city’s new urban regeneration model scrutinized in this article. This article shows that by engaging in false choice urbanism (Slater, 2014) the city has successfully rationalized social mix as the only solution to what seems to be a ‘consistent problem’ (see Hajer, 1995) of enduring socioeconomic decline in its periphery. In spite of that, untapping the ‘potential’ of the selected regeneration areas required municipal interventions. Through placemaking and visionary work, such as architectural competitions and neighborhood branding through ‘innovation districts’ (seemingly neutral and technical processes), an imagined future was held against the current disinvested state of the neighborhoods. By exploiting the symbolic denigration of the areas to prime them for renewal, the city could justify radical measures like demolition.</p><p class=\"zh\">案例片区 Mellunkylä 和 Meri-Rastila,都有着长期背负污名、并被数十年来的种种努力‘复兴’的历史。这些努力构成了继续推行类似措施——比如本文所审视的这套城市更新新模式——的基础。本文表明,通过采取虚假选择的城市主义(false choice urbanism)(Slater, 2014),该市成功地将社会混合合理化为应对其边缘地区长期社会经济衰退这一看似‘一以贯之的问题’(见 Hajer, 1995)的唯一解决方案。尽管如此,要真正挖掘出所选更新片区的‘潜力’,依然离不开市政当局的干预。通过地方营造(placemaking)和愿景构建工作——比如建筑设计竞赛,以及借助‘创新街区’(innovation districts)之类看似中立、技术性的过程来进行社区品牌塑造——一个想象中的未来被拿来与这些社区当下的撤资状态相对照。通过利用对这些片区的象征性贬低来为更新‘铺垫’,该市得以将拆除之类的激进措施正当化。</p></div><div class=\"para\" data-idx=\"94\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"20cff88ac9\"><p class=\"en\">A reputational gap (Kallin, 2017) was formed, and urban regeneration was offered as a solution to its closure. However, working on the image of the neighborhoods was not enough for the formation of rent gaps; the city also had to materially bridge the subsidy gap (Gray, 2022). To improve conditions for private investment in these “economically risky” neighborhoods, the city initiated regeneration by significantly increasing public funding for the refurbishment of public spaces and other green gentrification strategies, as well as restructuring land ownership. In other words, the city has chosen to use its planning monopoly and land ownership as a tool (Olsson, 2018) to facilitate urban redevelopment by subsidizing investment costs for developers, thus “privatizing profits and socializing losses” (Risager, 2022, p. 209).</p><p class=\"zh\">一道声誉缺口(reputational gap)(Kallin, 2017)由此形成,而城市更新则被呈现为弥合这道缺口的解决方案。然而,仅仅在社区形象上做文章,并不足以形成租隙;该市还必须在物质层面弥合补贴缺口(subsidy gap)(Gray, 2022)。为了改善私人投资在这些“经济上高风险”社区的条件,该市大幅增加了用于公共空间翻新等绿色绅士化策略的公共资金投入,并对土地所有权进行了重组,以此启动更新工作。换言之,该市选择将自己的规划垄断权和土地所有权当作一种工具(Olsson, 2018),通过为开发商的投资成本提供补贴来促成城市重建,从而实现“利润私有化、损失社会化”(privatizing profits and socializing losses)(Risager, 2022, 第209页)。</p></div><div class=\"para\" data-idx=\"95\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"ee916a3252\"><p class=\"en\">The case of Helsinki has demonstrated the necessity of state mediation to the reproduction of capitalist relations, especially in times of economic crisis and in stigmatized, peripheral neighborhoods. Whether the city can revive the interrupted regeneration and close the rent gaps in the regeneration areas or not remains to be seen. Neighborhoods such as Kontula and Meri-Rastila, that are stuck in this regeneration limbo for years or even decades, are necessary casualties of the vulnerability of capitalist reproduction, when potential failure is baked into the profit logic that drives urban regeneration (see Gray &amp; Kallin, 2023).</p><p class=\"zh\">赫尔辛基这一案例,展示了国家中介(state mediation)对于资本主义关系再生产而言的必要性,尤其是在经济危机时期,以及在污名化的边缘社区之中。该市能否重启中断的更新进程、弥合这些更新片区的租隙,目前仍是未知数。像 Kontula 和 Meri-Rastila 这样已在更新悬置状态中滞留多年甚至数十年的社区,正是资本主义再生产脆弱性的必然代价——因为潜在的失败,本就内嵌在驱动城市更新的利润逻辑之中(见 Gray & Kallin, 2023)。</p></div><div class=\"para\" data-idx=\"96\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"5ab1aa01f7\"><p class=\"en\">Living through the precarities of urban regeneration has implications for residents, perhaps even more so in stalling regeneration processes (see Wallace, 2015). Although no definitive conclusions can be drawn from my ethnographic fieldwork, the ontological insecurity of the residents caused by degeneration (Watt, 2023) and uncertain demolition timelines should be taken seriously. Even without immediate displacement of lower income residents, the new urban regeneration model reflects a broader development where the city is produced for more affluent users (see Lilius, 2021). For those who want to see a just city, it is therefore important to acknowledge other forms of displacement (Davidson, 2009; Marcuse, 1985) to avoid falling into the seemingly progressive trap of pro-gentrification policies.</p><p class=\"zh\">亲身经历城市更新的不确定性,会给居民带来切实的影响,而在更新进程陷入停滞的情况下,这种影响或许更甚(见 Wallace, 2015)。虽然我的民族志田野调查无法得出确定性的结论,但由衰败(degeneration)(Watt, 2023)和不确定的拆除时间表所导致的居民本体论层面的不安全感,理应得到认真对待。即便低收入居民没有立即遭到置换,这套城市更新新模式,依然反映出一种更广泛的发展趋势——这座城市正在被生产出来,以服务于更富裕的使用者(见 Lilius, 2021)。因此,对于那些希望看到一座‘公正城市’的人而言,承认其他形式的置换(Davidson, 2009; Marcuse, 1985)十分重要,这样才能避免落入支持绅士化政策那种看似进步的陷阱之中。</p></div><div class=\"para\" data-idx=\"97\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"41614550f8\"><p class=\"en\">The article has shown that Helsinki, like many other Western European cities (Uitermark &amp; Bosker, 2014), is in a difficult and contradictory situation. The Finnish government wants to deepen private market dominance in housing policy, which leads to increased urban inequality. At the same time, both the state and the city want to prevent segregation to avoid going “Sweden’s way.” To manage this dilemma, the city has in its periphery implemented ‘gentrification in disguise’ (Lees, 2008), wrapped in anti-segregation discourse. However, this only affirms the status quo of neoliberal urbanism.</p><p class=\"zh\">本文表明,赫尔辛基与许多其他西欧城市一样(Uitermark & Bosker, 2014),正处于一种艰难而充满矛盾的处境之中。芬兰政府希望在住房政策中进一步深化私人市场的主导地位,而这会导致城市不平等的加剧;与此同时,国家和该市又都希望防止隔离,以避免走上‘瑞典式’道路。为了应对这一两难困境,该市在其边缘地区实施了一种包裹在反隔离话语之中的‘伪装的绅士化’(gentrification in disguise)(Lees, 2008)。然而,这样做只不过是在肯定新自由主义城市主义的现状而已。</p></div><div class=\"para\" data-idx=\"98\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"41c2208199\"><p class=\"en\">A better approach to the reasonable desire to combat segregation could be, for example, a proper housing policy where access to affordable housing is not regarded as a social policy but a normal need (see Hyötyläinen, 2020). Helsinki is ultimately, due to its planning monopoly and high land ownership, well-equipped to influence the supply of social housing. Instead of socializing risks when the development of unregulated housing fails to proceed, the city could prioritize state-subsidized rental housing. For Helsinki to truly be a counterforce to austerity politics on the national level, as some progressive councilors proudly describe it, it needs to reassess its position on social housing and public ownership.</p><p class=\"zh\">要回应对抗隔离这一合理诉求,一种更好的方式,或许是推行一套恰当的住房政策——将获得可负担住房视为一种正常需求,而不是一种社会救济(见 Hyötyläinen, 2020)。归根结底,凭借其规划垄断权和高比例的土地所有权,赫尔辛基原本完全有能力影响社会住房的供给。与其在非管制住房开发无法推进时选择将风险社会化,该市原本可以优先发展国家补贴租赁住房。如果赫尔辛基真的想成为一些进步派市议员所自豪宣称的那种、对抗国家层面紧缩政治的反作用力,它就需要重新审视自己在社会住房和公共产权问题上的立场。</p></div><h3 class=\"sec\" data-secidx=\"99\"><span class=\"en\">CRediT authorship contribution statement</span><span class=\"zh\">CRediT 作者贡献声明</span></h3><div class=\"para\" data-idx=\"100\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"01638eb152\"><p class=\"en\">Hanna Yrjänä: Writing – original draft, Project administration, Methodology, Formal analysis, Data curation, Conceptualization.</p><p class=\"zh\">Hanna Yrjänä:论文初稿撰写、项目管理、研究方法设计、正式分析、数据整理、概念构建。</p></div><h3 class=\"sec\" data-secidx=\"101\"><span class=\"en\">Declaration of competing interest</span><span class=\"zh\">利益冲突声明</span></h3><div class=\"para\" data-idx=\"102\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"1bdbb565b5\"><p class=\"en\">The authors declare that they have no known competing financial interests or personal relationships that could have appeared to influence the work reported in this paper.</p><p class=\"zh\">作者声明,本人不存在任何已知的、可能被认为影响本文所述研究工作的经济利益冲突或个人关系。</p></div><h3 class=\"sec\" data-secidx=\"103\"><span class=\"en\">Data availability</span><span class=\"zh\">数据可得性声明</span></h3><div class=\"para\" data-idx=\"104\" data-doc=\"yrjana-2026-helsinki-state-led-gentrification\" data-nid=\"c2d0c6849a\"><p class=\"en\">No data was used for the research described in the article.</p><p class=\"zh\">本文所述研究未使用可公开提供的数据集。</p></div>", "toc": [{"idx": 0, "level": "h2", "en": "1. Introduction", "zh": "1. 引言"}, {"idx": 13, "level": "h2", "en": "2. Theoretical perspective: State-led gentrification", "zh": "2. 理论视角:国家主导型绅士化"}, {"idx": 21, "level": "h2", "en": "3. Case: Helsinki’s new urban regeneration model", "zh": "3. 案例:赫尔辛基的城市更新新模式"}, {"idx": 35, "level": "h2", "en": "4. Helsinki: “a textbook example in how to prevent segregation”", "zh": "4. 赫尔辛基:“防止隔离的教科书式典范”"}, {"idx": 52, "level": "h3", "en": "4.1. Mobilizing the potential", "zh": "4.1 动员“潜力”"}, {"idx": 70, "level": "h3", "en": "4.2. Socializing risks", "zh": "4.2 将风险社会化"}, {"idx": 85, "level": "h2", "en": "5. Discussion", "zh": "5. 讨论"}, {"idx": 99, "level": "h3", "en": "CRediT authorship contribution statement", "zh": "CRediT 作者贡献声明"}, {"idx": 101, "level": "h3", "en": "Declaration of competing interest", "zh": "利益冲突声明"}, {"idx": 103, "level": "h3", "en": "Data availability", "zh": "数据可得性声明"}]}};window.__CR_DOC_ORDER=["lees-2008-social-mixing", "yrjana-2026-helsinki-state-led-gentrification"];</script><script>
(function(){
  var CR_DOCS=window.__CR_DOCS, DOC_ORDER=window.__CR_DOC_ORDER;

  var modeBtns=document.querySelectorAll('.modes button');
  function setMode(m){
    document.body.dataset.mode=m;
    modeBtns.forEach(function(b){ b.classList.toggle('active', b.dataset.mode===m); });
    try{ localStorage.setItem('crMode', m); }catch(e){}
  }
  modeBtns.forEach(function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode); }); });
  var savedMode='bilingual';
  try{ savedMode=localStorage.getItem('crMode')||'bilingual'; }catch(e){}
  setMode(savedMode);

  /* jump-to-heading selects are rebuilt every time a pane's document
     changes, so this is delegated rather than bound once at load. */
  document.addEventListener('change', function(e){
    if(!e.target.classList.contains('jumpSelect')) return;
    var sel=e.target;
    if(!sel.value) return;
    var el=document.getElementById(sel.value);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    sel.value='';
  });

  function escHtml(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function truncate(s,n){ return s.length>n ? s.slice(0,n)+'…' : s; }
  function docLabel(id){ return CR_DOCS[id] ? CR_DOCS[id].meta.crumb : id; }

  /* ---- shared, library-wide cross-reference link store ----
     ONE key for the whole library, not one per pair: a link genuinely
     connects two SPECIFIC documents (recorded on the link itself as
     {doc,nid,text} per side), so it stays valid and findable no matter
     which pair happens to be open when you look for it again. */
  var KEY='br-crossrefs:library';
  var links=[];
  try{ links=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ links=[]; }
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(links)); }catch(e){} }

  var currentDoc={A:null, B:null};
  function relevantLinks(){
    var pair=[currentDoc.A, currentDoc.B];
    return links.filter(function(l){
      return pair.indexOf(l.a.doc)!==-1 && pair.indexOf(l.b.doc)!==-1;
    });
  }

  function paneOf(pid){ return pid.charAt(0); }
  function paraElForSide(side){
    return document.querySelector('.para[data-doc="'+side.doc+'"][data-nid="'+side.nid+'"] p.en');
  }

  function unwrapXrefs(){
    document.querySelectorAll('mark.xref').forEach(function(m){
      var parent=m.parentNode;
      while(m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
  }
  function wrapText(pEl, text, linkId){
    if(!pEl || !text) return false;
    var walker=document.createTreeWalker(pEl, NodeFilter.SHOW_TEXT, null, false);
    var node;
    while(node=walker.nextNode()){
      if(node.parentElement && node.parentElement.closest('mark.xref')) continue;
      var idx=node.nodeValue.indexOf(text);
      if(idx===-1) continue;
      var range=document.createRange();
      range.setStart(node, idx); range.setEnd(node, idx+text.length);
      var mark=document.createElement('mark');
      mark.className='xref'; mark.dataset.xrefId=linkId;
      try{ range.surroundContents(mark); }catch(e){ continue; }
      mark.addEventListener('click', function(){ openLinkCard(linkId); });
      return true;
    }
    return false;
  }
  function paintLinks(){
    unwrapXrefs();
    relevantLinks().forEach(function(l){
      wrapText(paraElForSide(l.a), l.a.text, l.id);
      wrapText(paraElForSide(l.b), l.b.text, l.id);
    });
  }

  function flashLink(id){
    document.querySelectorAll('mark.xref[data-xref-id="'+id+'"]').forEach(function(m){
      m.classList.add('flash');
      setTimeout(function(){ m.classList.remove('flash'); }, 1200);
    });
  }
  function jumpToLink(l){
    [l.a, l.b].forEach(function(side){
      var el=paraElForSide(side);
      if(el) el.closest('.para').scrollIntoView({behavior:'smooth', block:'center'});
    });
    setTimeout(function(){ flashLink(l.id); }, 350);
  }

  /* ---- selection -> pill -> second selection -> note card ---- */
  var pill=document.getElementById('selPill');
  var hint=document.getElementById('xrefHint');
  var hintText=document.getElementById('xrefHintText');
  var hintCancel=document.getElementById('xrefHintCancel');
  var pendingSel=null;   /* {pane,pid,doc,nid,text} currently under the pill */
  var draftSide=null;    /* the FIRST side already committed by clicking the pill */

  function hidePill(){ pill.style.display='none'; pendingSel=null; }
  function clearDraft(){ draftSide=null; hint.style.display='none'; hidePill(); }
  hintCancel.addEventListener('click', clearDraft);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') clearDraft(); });

  function currentSelectionInfo(){
    var sel=window.getSelection();
    if(!sel || sel.isCollapsed) return null;
    var text=sel.toString().trim();
    if(!text) return null;
    var range=sel.getRangeAt(0);
    var container=range.commonAncestorContainer;
    var elc=container.nodeType===3?container.parentElement:container;
    var pWrap=elc.closest('.para');
    var pEn=elc.closest('p.en');
    if(!pWrap || !pEn) return null;   /* only EN text is linkable (ZH may carry inline markup) */
    return {pane:paneOf(pWrap.dataset.pid), pid:pWrap.dataset.pid,
             doc:pWrap.dataset.doc, nid:pWrap.dataset.nid, text:text, range:range};
  }
  document.addEventListener('selectionchange', function(){
    clearTimeout(window.__crSelT);
    window.__crSelT=setTimeout(function(){
      var info=currentSelectionInfo();
      if(!info){ hidePill(); return; }
      var r=info.range.getBoundingClientRect();
      if(!r || (!r.width && !r.height)){ hidePill(); return; }
      pendingSel=info;
      pill.style.left=Math.max(8, r.left+window.scrollX)+'px';
      pill.style.top=Math.max(8, r.top+window.scrollY-34)+'px';
      pill.style.display='block';
    }, 120);
  });
  document.addEventListener('mousedown', function(e){
    if(pill.style.display!=='none' && !pill.contains(e.target) && !card.contains(e.target)) hidePill();
  });
  pill.addEventListener('mousedown', function(e){ e.preventDefault(); });
  pill.addEventListener('click', function(){
    if(!pendingSel) return;
    if(!draftSide){
      draftSide=pendingSel;
      hidePill();
      window.getSelection().removeAllRanges();
      hintText.textContent='已选中'+(draftSide.pane==='A'?'左侧':'右侧')+'文字。请在'+
        (draftSide.pane==='A'?'右侧':'左侧')+'选中对应段落以完成关联（Esc 取消）。';
      hint.style.display='flex';
    } else {
      if(pendingSel.pane===draftSide.pane){
        alert('请在另一侧选中对应段落，而不是同一侧。');
        return;
      }
      var a = draftSide.pane==='A' ? draftSide : pendingSel;
      var b = draftSide.pane==='A' ? pendingSel : draftSide;
      hidePill();
      window.getSelection().removeAllRanges();
      hint.style.display='none';
      draftSide=null;
      openNoteCard({a:{doc:a.doc, nid:a.nid, text:a.text}, b:{doc:b.doc, nid:b.nid, text:b.text}}, null);
    }
  });

  /* ---- note card (create or edit) ---- */
  var card=document.getElementById('xrefCard');
  var backdrop=document.getElementById('xrefBackdrop');
  var cardA=document.getElementById('xrefCardA');
  var cardB=document.getElementById('xrefCardB');
  var cardNote=document.getElementById('xrefCardNote');
  var cardSave=document.getElementById('xrefCardSave');
  var cardDelete=document.getElementById('xrefCardDelete');
  var cardCancel=document.getElementById('xrefCardCancel');
  var editingId=null, draftPair=null;

  function closeCard(){ card.style.display='none'; backdrop.classList.remove('open'); editingId=null; draftPair=null; }
  function openNoteCard(pair, existingId){
    /* Opening ANY card (new link or editing an existing one) abandons a
       half-started link: without this, clicking an unrelated existing mark
       while "已选中左侧文字，请在右侧选中..." is still showing left the hint
       and the stale pending selection sitting there after the card closed,
       confusing about what state the UI was actually in. */
    draftSide=null; hint.style.display='none'; hidePill();
    editingId=existingId;
    draftPair=pair;
    cardA.querySelector('.side-lbl').textContent=docLabel(pair.a.doc);
    cardB.querySelector('.side-lbl').textContent=docLabel(pair.b.doc);
    cardA.querySelector('.q').textContent='“'+pair.a.text+'”';
    cardB.querySelector('.q').textContent='“'+pair.b.text+'”';
    var existing=existingId?links.find(function(l){return l.id===existingId;}):null;
    cardNote.value=existing?existing.note:'';
    cardDelete.style.display=existingId?'':'none';
    card.style.display='block'; backdrop.classList.add('open');
    setTimeout(function(){ cardNote.focus(); }, 30);
  }
  function openLinkCard(id){
    var l=links.find(function(x){return x.id===id;});
    if(!l) return;
    openNoteCard({a:l.a, b:l.b}, id);
  }
  window.__openLinkCard=openLinkCard;
  backdrop.addEventListener('click', closeCard);
  cardCancel.addEventListener('click', closeCard);
  cardSave.addEventListener('click', function(){
    var text=cardNote.value.trim();
    if(!text){ alert('写点什么再保存吧。'); return; }
    if(editingId){
      var l=links.find(function(x){return x.id===editingId;});
      if(l) l.note=text;
    } else {
      links.push({id:'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                  a:draftPair.a, b:draftPair.b, note:text, ts:new Date().toISOString()});
    }
    persist(); paintLinks(); refreshPanel(); closeCard();
  });
  cardDelete.addEventListener('click', function(){
    if(!confirm('删除这条跨文献批注？')) return;
    links=links.filter(function(x){return x.id!==editingId;});
    persist(); paintLinks(); refreshPanel(); closeCard();
  });

  /* ---- side list panel (scoped to whichever pair is CURRENTLY open) ---- */
  var panel=document.getElementById('xrefPanel');
  var list=document.getElementById('xrefList');
  var openBtn=document.getElementById('xrefOpenBtn');
  var closeBtn=document.getElementById('xrefCloseBtn');
  function refreshPanel(){
    var rel=relevantLinks();
    openBtn.textContent='跨文献批注 ('+rel.length+')';
    list.innerHTML='';
    if(!rel.length){
      list.innerHTML='<div class="xempty">这两篇之间还没有跨文献批注。在左右两侧各选一段对应的文字，点出现的「+ 关联」即可建立一条。</div>';
      return;
    }
    rel.forEach(function(l){
      var row=document.createElement('div'); row.className='xrow';
      var qa=document.createElement('div'); qa.className='xq';
      qa.innerHTML='<b>'+escHtml(docLabel(l.a.doc))+'</b> “'+escHtml(truncate(l.a.text,60))+'”';
      var qb=document.createElement('div'); qb.className='xq';
      qb.innerHTML='<b>'+escHtml(docLabel(l.b.doc))+'</b> “'+escHtml(truncate(l.b.text,60))+'”';
      var note=document.createElement('div'); note.className='xnote'; note.textContent=l.note;
      row.appendChild(qa); row.appendChild(qb); row.appendChild(note);
      row.addEventListener('click', function(){ jumpToLink(l); });
      list.appendChild(row);
    });
  }
  openBtn.addEventListener('click', function(){ panel.classList.add('open'); });
  closeBtn.addEventListener('click', function(){ panel.classList.remove('open'); });

  /* ---- export / backup / import (same pattern as the single-paper pages).
     Export/clear act on the CURRENTLY OPEN PAIR only; import merges into the
     full shared library store by id regardless of which pair is open, so a
     backup can carry links spanning the whole library, not just one pair. */
  function markdown(){
    var rel=relevantLinks();
    var out=['# 跨文献批注 — '+docLabel(currentDoc.A)+' × '+docLabel(currentDoc.B), ''];
    rel.forEach(function(l,i){
      out.push('════ 第 '+(i+1)+' 条 ════');
      out.push('【'+docLabel(l.a.doc)+'】'+l.a.text);
      out.push('【'+docLabel(l.b.doc)+'】'+l.b.text);
      out.push('【批注】'+l.note);
      out.push('');
    });
    return out.join('\n');
  }
  function nativeDownload(filename, data){
    try{
      var blob=new Blob([data], {type:'text/plain;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return true;
    }catch(e){ return false; }
  }
  var dl=(window.claude && window.claude.downloads) ? window.claude.downloads : null;
  function offer(filename, data){
    if(dl){ dl.save({filename:filename, data:data}).catch(function(){ nativeDownload(filename, data); }); }
    else { nativeDownload(filename, data); }
  }
  document.getElementById('xrefExportMd').addEventListener('click', function(){
    if(!relevantLinks().length){ alert('这两篇之间还没有跨文献批注。'); return; }
    offer('cross-reference-notes.md', markdown());
  });
  document.getElementById('xrefExportJson').addEventListener('click', function(){
    var rel=relevantLinks();
    if(!rel.length){ alert('这两篇之间还没有跨文献批注。'); return; }
    offer('cross-reference-backup.json',
          JSON.stringify({pair:[currentDoc.A,currentDoc.B], saved:new Date().toISOString(), links:rel}, null, 2));
  });
  var importFile=document.getElementById('xrefImportFile');
  document.getElementById('xrefImportBtn').addEventListener('click', function(){ importFile.click(); });
  importFile.addEventListener('change', function(){
    var file=importFile.files[0]; importFile.value='';
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(){
      var data;
      try{ data=JSON.parse(reader.result); }catch(e){ alert('这不是有效的备份文件（JSON 解析失败）。'); return; }
      if(!Array.isArray(data.links)){ alert('备份文件里没有找到批注数据。'); return; }
      var byId={}; links.forEach(function(l){ byId[l.id]=l; });
      data.links.forEach(function(l){ byId[l.id]=l; });
      links=Object.keys(byId).map(function(k){ return byId[k]; });
      persist(); paintLinks(); refreshPanel();
      alert('导入完成，库里现有 '+links.length+' 条跨文献批注（含所有文献对）。');
    };
    reader.readAsText(file);
  });
  document.getElementById('xrefClear').addEventListener('click', function(){
    var rel=relevantLinks();
    if(!rel.length) return;
    if(!confirm('清空「'+docLabel(currentDoc.A)+'」和「'+docLabel(currentDoc.B)+'」之间的跨文献批注（共 '+rel.length+' 条）？'
      +'此操作无法撤销，建议先导出备份。其他文献对之间的批注不受影响。')) return;
    var relIds={}; rel.forEach(function(l){ relIds[l.id]=true; });
    links=links.filter(function(l){ return !relIds[l.id]; });
    persist(); paintLinks(); refreshPanel();
  });

  /* ---- read-only display of each OPEN side's OWN per-paragraph
     notes/highlights (from the full single-document reading pages) ----
     Only finds anything when this page is same-origin with those pages
     (e.g. all served from the same GitHub Pages site) -- localStorage is
     per-origin, so opened as a standalone Artifact this simply finds
     nothing, which is expected, not a bug. Read-only: editing a paragraph's
     own note/highlight is still the single-document page's job. */
  function parseNoteVal(raw){
    if(!raw) return '';
    if(typeof raw==='string') return raw;
    return raw.text||'';
  }
  function loadOwnAnnotations(docId){
    var byNid={};
    try{
      var notes=JSON.parse(localStorage.getItem('br-notes:'+docId)||'{}');
      Object.keys(notes).forEach(function(k){
        var v=parseNoteVal(notes[k]).trim();
        if(v) (byNid[k]=byNid[k]||[]).push(v);
      });
    }catch(e){}
    try{
      var hls=JSON.parse(localStorage.getItem('br-highlights:'+docId)||'[]');
      hls.forEach(function(h){
        var v=(h.note||'').trim();
        if(!v || !h.frags || !h.frags.length) return;
        (byNid[h.frags[0].nid]=byNid[h.frags[0].nid]||[]).push(v);
      });
    }catch(e){}
    return byNid;
  }
  function paintOwnAnnotations(){
    var total=0;
    ['A','B'].forEach(function(side){
      var docId=currentDoc[side];
      if(!docId) return;
      var byNid=loadOwnAnnotations(docId);
      document.querySelectorAll('.pane[data-side="'+side+'"] .para[data-nid]').forEach(function(para){
        para.querySelectorAll('.own-note').forEach(function(n){ n.remove(); });
        var texts=byNid[para.dataset.nid];
        if(!texts) return;
        total+=texts.length;
        texts.forEach(function(t){
          var box=document.createElement('div'); box.className='own-note';
          var lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent='已有批注';
          box.appendChild(lbl);
          box.appendChild(document.createTextNode(t));
          para.appendChild(box);
        });
      });
    });
    document.getElementById('ownNoteBanner').style.display = total ? 'none' : '';
    return total;
  }

  /* ---- paper picker: pick ANY two documents from the library ---- */
  function renderPane(side, docId){
    var doc=CR_DOCS[docId];
    var paneEl=document.querySelector('.pane[data-side="'+side+'"]');
    paneEl.querySelector('.t-en').textContent=doc.meta.title_en;
    var zhEl=paneEl.querySelector('.t-zh');
    zhEl.textContent=doc.meta.title_zh||'';
    zhEl.style.display=doc.meta.title_zh?'':'none';
    paneEl.querySelector('.pane-scroll').innerHTML=doc.html;
    paneEl.querySelectorAll('.sec[data-secidx]').forEach(function(h){ h.id=side+'sec-'+h.dataset.secidx; });
    paneEl.querySelectorAll('.para[data-idx]').forEach(function(p){ p.dataset.pid=side+p.dataset.idx; });
    var jsel=paneEl.querySelector('.jumpSelect');
    var opts=['<option value="">跳转到…</option>'];
    doc.toc.forEach(function(t){
      var indent=t.level==='h3'?'　':'';
      opts.push('<option value="'+side+'sec-'+t.idx+'">'+indent+escHtml(t.en)+'</option>');
    });
    jsel.innerHTML=opts.join('');
    currentDoc[side]=docId;
    var topSub=document.querySelector('.topbar .sub');
    if(currentDoc.A && currentDoc.B){
      topSub.textContent=docLabel(currentDoc.A)+' × '+docLabel(currentDoc.B)
        +' · 文献库共 '+DOC_ORDER.length+' 篇';
    }
    try{ if(currentDoc.A && currentDoc.B) localStorage.setItem('crLastPair', currentDoc.A+','+currentDoc.B); }catch(e){}
    paintLinks();
    paintOwnAnnotations();
    refreshPanel();
  }
  window.__crRenderPane=renderPane; /* exposed for tests */

  document.querySelectorAll('.paneDocSelect').forEach(function(sel){
    var side=sel.dataset.side;
    sel.innerHTML=DOC_ORDER.map(function(id){
      return '<option value="'+id+'">'+escHtml(CR_DOCS[id].meta.crumb)+'</option>';
    }).join('');
    sel.addEventListener('change', function(){ renderPane(side, sel.value); });
  });

  var savedPair=[];
  try{ savedPair=(localStorage.getItem('crLastPair')||'').split(','); }catch(e){}
  var initA = (savedPair[0] && CR_DOCS[savedPair[0]]) ? savedPair[0] : DOC_ORDER[0];
  var initB;
  if(savedPair[1] && CR_DOCS[savedPair[1]] && savedPair[1]!==initA){
    initB=savedPair[1];
  } else {
    initB = (DOC_ORDER[1] && DOC_ORDER[1]!==initA) ? DOC_ORDER[1] : DOC_ORDER[0];
  }
  document.querySelector('.paneDocSelect[data-side="A"]').value=initA;
  document.querySelector('.paneDocSelect[data-side="B"]').value=initB;
  renderPane('A', initA);
  renderPane('B', initB);
})();
</script></body></html>
