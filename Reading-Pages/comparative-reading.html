kdown</button><button id="xrefExportJson" type="button">备份 .json</button><button id="xrefImportBtn" type="button">导入备份</button><input type="file" id="xrefImportFile" accept="application/json" style="display:none"><button id="xrefClear" type="button" style="color:var(--danger)">清空</button></div></div><script>window.__CR_DOCS={"lees-2008-social-mixing": {"meta": {"title_en": "Gentrification and Social Mixing: Towards an Inclusive Urban Renaissance?", "title_zh": "绅士化与社会混合：迈向一场包容的城市复兴？", "crumb": "Lees 2008 · 社会混合批判 + 结论"}, "html": "<h2 class=\"sec\" data-secidx=\"0\"><span class=\"en\">Introduction</span><span class=\"zh\">引言</span></h2><div class=\"para\" data-idx=\"1\" data-doc=\"lees-2008-social-mixing\" data-nid=\"4ac1b42783\"><p class=\"en\">Nearly 30 years ago now, Briavel Holcomb and Robert Beauregard (1981, p. 3) were critical of the way that it was assumed by authors like Altshuler (1969), Lowry (1960) and Smith (1971) that the benefits of urban revitalisation/gentrification would ‘trickle down’ to the lower and working classes in a manner similar to that hypothesised in the housing market. Nevertheless, despite fierce academic debate about whether or not gentrification leads to displacement, segregation and social polarisation, it is increasingly promoted in policy circles on the assumption that it will lead to more socially mixed, less segregated, more liveable and sustainable communities. In keeping with a longstanding strand of research that has identified the liberal desires of the new middle classes for difference and diversity in the city as key to the process of gentrification and to the creation of a more diverse and tolerant city (see Lees, 2000; and Lees et al., 2008, on ‘the emancipatory city thesis’), the benefits of functionally as well as socially mixed urban communities have become something of an unquestioned gospel in policy discourse (Lees, 2003a, 2003b). Yet there is a poor evidence base for the widespread policy assumption that gentrification will help increase the social mix, foster social mixing and thereby increase the social capital and social cohesion of inner-city communities. As Damaris Rose (2004, p. 280) says, there is an “uneasy cohabitation” between gentrification and social mix. It is this uneasy cohabitation that this paper investigates.</p><p class=\"zh\">早在近三十年前，Briavel Holcomb 与 Robert Beauregard（1981，第3页）就已批评过这样一种预设——Altshuler（1969）、Lowry（1960）与 <a class=\"gref\" href=\"#g-smith\">Smith</a>（1971）等作者曾假定，城市复兴／绅士化的好处会像住房市场理论所设想的那样，向下“渗滴”（trickle down）到中下层与工人阶级。然而，尽管学界围绕绅士化是否导致置换、隔离与社会两极化展开过激烈辩论，它在政策圈中却<strong>日益被提倡</strong>，其预设是：绅士化将带来更加社会混合、更少隔离、更宜居、更可持续的社区。与一支由来已久的研究脉络相呼应——该脉络认为，新中产阶级对城市中差异与多样性的自由派渴望，正是绅士化过程、以及营造一座更多样、更宽容之城市的关键所在（见 Lees, 2000；以及 Lees et al., 2008 论“<a class=\"gref\" href=\"#g-emancipatorycity\">解放性城市命题</a>”〔the emancipatory city thesis〕）——功能上与社会上都实现混合的城市社区所具有的种种好处，在政策话语中已然成为一种不容置疑的信条（Lees, 2003a, 2003b）。然而，对于“绅士化将有助于增加社会混合、促进社会混合、从而提升内城社区的社会资本与社会凝聚力”这一广泛流行的政策预设，其证据基础却相当<strong>薄弱</strong>。正如 Damaris Rose（2004，第280页）所言，绅士化与社会混合之间存在一种“别扭的同居关系”（uneasy cohabitation）。本文所探究的，正是这种别扭的同居关系。</p></div><h2 class=\"sec\" data-secidx=\"2\"><span class=\"en\">Gentrification and Social Mixing</span><span class=\"zh\">绅士化与社会混合</span></h2><div class=\"para\" data-idx=\"3\" data-doc=\"lees-2008-social-mixing\" data-nid=\"e15394e8c7\"><p class=\"en\">Gentrification has long been associated with appeals to diversity and difference, to social mixing. As Irving Allen argued, some time ago now, in an essay titled ‘The ideology of dense neighbourhood redevelopment’</p><p class=\"zh\">绅士化长期以来都与对多样性、差异，以及社会混合的诉求联系在一起。正如 Irving Allen 早年在一篇题为《密集街区再开发的意识形态》（'The ideology of dense neighbourhood redevelopment'）的文章中所论：</p></div><div class=\"para quote\" data-idx=\"4\" data-doc=\"lees-2008-social-mixing\" data-nid=\"13cb87f432\"><p class=\"en\">Sociocultural diversity is a leitmotif in the new tastes for central city housing and neighborhood. One of the great amenities of dense city living, it is said, is exposure to such social and cultural diversity as ethnicity. A composite statement of the idea made up from many fragments is as follows: A milieu of diversity represents a childrearing advantage over ‘homogeneous suburbs’, because children are exposed to social ‘reality’ and to the give and take of social and cultural accommodation with those who are different. For adults the urban ambience of diversity is a continual source of stimulation and renewal and a reminder of the cultural relativity of one’s own style of life. It is said to be a relief from the subcultural sameness and ‘boredom’ of many suburban communities (Allen, 1984, pp. 31–32).</p><p class=\"zh\">社会文化多样性，是当下中心城区住房与街区新品味中的一个主导旋律（leitmotif）。据说，密集城市生活的一大好处，正是接触到诸如族裔这样的社会与文化多样性。由许多碎片拼合而成的一种综合表述大致是这样的：多样性的环境，相较于“同质化的郊区”，在子女养育上具有优势，因为孩子们由此得以接触到社会“现实”，接触到与不同于自己者进行社会与文化调适时的相互给予。对成年人而言，都市里多样性的氛围则是持续的刺激与更新之源，也不断提醒着人们：自己的生活方式只是一种文化相对之物。据说，这也是对许多郊区社区那种亚文化式的同一与“乏味”的一种解脱（Allen, 1984, pp. 31–32）。</p><span class=\"attrib\">Irving Allen (1984) 原话，经 Lees 转引——这是 Allen 对“密集街区再开发”支持者们所持多样性论调的一段&lt;strong&gt;综合性、分析式复述&lt;/strong&gt;（他自己称之为由“许多碎片拼合而成”），并非 Allen 本人的规范性主张，也不是 Lees 本人立场。Lees 引用它只是为了呈现这套亲多样性话语的典型措辞，随后会用 Barnsbury 的实例来印证、并在文章后段加以批判。</span></div><div class=\"para\" data-idx=\"5\" data-doc=\"lees-2008-social-mixing\" data-nid=\"e4b11c35aa\"><p class=\"en\">In research undertaken in one of the first neighbourhoods in London to gentrify, Barnsbury in Islington (see Butler and Lees, 2006; Lees et al., 2008, ch. 1), such a leitmotif is certainly to be found. Pioneer gentrifiers in Barnsbury were part of a left liberal new middle class who actively sought social mixing, as seen in the fact that they were champions of the comprehensive school revolution of which Margaret Malden’s Islington Green was a prototype. As one Barnsbury gentrifier Mary Hall said in a letter to The Times (1977)</p><p class=\"zh\">在对伊斯灵顿（Islington）的巴恩斯伯里（Barnsbury）——伦敦最早绅士化的街区之一——所做的研究中（见 Butler and Lees, 2006；Lees et al., 2008, 第1章），的确能找到这一主导旋律。巴恩斯伯里的先锋型绅士化者，属于积极追求社会混合的左翼自由派新中产阶级——这一点从他们是“综合中学改革”的拥护者可以看出，玛格丽特·莫尔登（Margaret Malden）的伊斯灵顿绿地中学（Islington Green）正是这场改革的一个原型案例。正如巴恩斯伯里的一位绅士化者 Mary Hall 在一封致《泰晤士报》的信（1977）中所说：</p></div><div class=\"para quote\" data-idx=\"6\" data-doc=\"lees-2008-social-mixing\" data-nid=\"46f3347663\"><p class=\"en\">Sir, the Socialists are determined that we should sit side by side to be educated and lie side by side when ill. Why on earth, then, should we not also live side by side?.</p><p class=\"zh\">先生：社会党人执意要让我们坐在一起接受教育，病了也要躺在一起。那么，我们究竟为什么不能也住在一起呢？</p><span class=\"attrib\">Mary Hall（巴恩斯伯里先锋型绅士化者）致《泰晤士报》读者来信原话（1977），经 Lees 转引——这是 Lees 用作&lt;strong&gt;历史实例&lt;/strong&gt;的一位绅士化者本人的亲社会混合言论，代表这位写信人自己的立场，不是 Lees 本人的论断；Lees 引用它是为了展示当年绅士化者话语与后来政策修辞之间的相似性。</span></div><div class=\"para\" data-idx=\"7\" data-doc=\"lees-2008-social-mixing\" data-nid=\"123e58740d\"><p class=\"en\">And as Ken Pring, architect and pioneer Barnsbury gentrifer, said</p><p class=\"zh\">而建筑师、巴恩斯伯里先锋型绅士化者 Ken Pring 则说：</p></div><div class=\"para quote\" data-idx=\"8\" data-doc=\"lees-2008-social-mixing\" data-nid=\"f891f37437\"><p class=\"en\">The present trend towards a rising proportion of the middle classes in the population will continue. This will help create a better social balance in the structure of the community, and the professional expertise of the articulate few will ultimately benefit the underprivileged population (in Pitt, 1977, p. 1).</p><p class=\"zh\">当前人口中中产阶级比例上升的趋势将会持续下去。这将有助于在社区结构中创造出更好的社会平衡，而那少数善于表达者所具备的专业素养，最终将造福于弱势人口（收录于 Pitt, 1977, 第1页）。</p><span class=\"attrib\">Ken Pring（建筑师、巴恩斯伯里先锋型绅士化者）原话，经 Pitt (1977) 记录、Lees 转引——同样是绅士化者本人的立场，不是 Lees 的观点。请留意下一句：Lees 明确指出这段话“几乎是在附和当下的政策修辞”，也就是说，这段引文的作用是让读者看出：半个世纪后的官方“社会混合”话语，其实与这位绅士化者当年的自我辩护如出一辙——这是 Lees 埋下的一个批判性伏笔，而非认同。</span></div><div class=\"para\" data-idx=\"9\" data-doc=\"lees-2008-social-mixing\" data-nid=\"85ac39d01e\"><p class=\"en\">Such words virtually echo current policy rhetoric on social mixing as we shall see later in this paper.</p><p class=\"zh\">正如本文后面将会看到的，这番话几乎就是当下社会混合政策修辞的翻版。</p></div><div class=\"para\" data-idx=\"10\" data-doc=\"lees-2008-social-mixing\" data-nid=\"e4191b1952\"><p class=\"en\">Anti-gentrification groups active at the time, such as the Barnsbury People’s Forum, however, were much more sceptical about the merits of social mix/ing</p><p class=\"zh\">然而，当时活跃的反绅士化团体，例如“巴恩斯伯里人民论坛”（Barnsbury People's Forum），对社会混合／混合化的价值要怀疑得多：</p></div><div class=\"para quote\" data-idx=\"11\" data-doc=\"lees-2008-social-mixing\" data-nid=\"0c947fcaf2\"><p class=\"en\">Social balance or ‘mix’ is an argument about the consequences of social class patterns. It rests on the belief that there is an ideal composition of social and income groups which, when achieved, produces optimum individual and community well being. The assumed social advantages of the balanced community have been at the heart of nearly all debate on new towns and urban renewal ... The difficulty with the concept is that, despite numerous empirical investigations, very little is known about the advantages and disadvantages of different kinds of mix, nor at what level—street, neighbourhood, district, community—social balance would be a worthwhile goal for policy objectives (Pitt, 1977, p. 16).</p><p class=\"zh\">“社会平衡”或“混合”，是一种关于社会阶级格局之后果的论证。它建立在这样一种信念之上：存在着一种理想的社会与收入群体构成比例，一旦达成，就能产生个人与社区福祉的最优状态。“平衡社区”被假定具有的种种社会优势，几乎是新城建设与城市更新领域全部辩论的核心⋯⋯这一概念的困难在于：尽管有大量的经验研究，人们对不同种类的“混合”各自的利弊，依然知之甚少；究竟在哪个层级——街道、街区、地区、社区——社会平衡才称得上是一个值得追求的政策目标，也同样不清楚（Pitt, 1977, 第16页）。</p><span class=\"attrib\">巴恩斯伯里人民论坛（反绅士化团体）的立场，经 Pitt (1977) 记录、Lees 转引——这是与前面两位绅士化者相&lt;strong&gt;对立&lt;/strong&gt;的怀疑声音，Lees 引用它是为了佐证自己对社会混合政策的怀疑立场，属于她认同、并当作先声援引的观点，不是她要反驳的对象。</span></div><div class=\"para\" data-idx=\"12\" data-doc=\"lees-2008-social-mixing\" data-nid=\"b24617bf2c\"><p class=\"en\">Some early authors on gentrification also questioned whether the gentrifying middle classes and the pre-existing low-income communities could live side by side</p><p class=\"zh\">一些早期研究绅士化的作者，同样质疑过绅士化中的中产阶级能否与原有的低收入社区真正比邻而居：</p></div><div class=\"para quote\" data-idx=\"13\" data-doc=\"lees-2008-social-mixing\" data-nid=\"4153ef13fb\"><p class=\"en\">whether policy can promote population mixes of different socioeconomic and racial groups while simultaneously enhancing the civil class domination of the neighbourhood. In the past new people and incumbents have often not mixed well when they were of different races or socioeconomic statuses. The normative integration that is a prerequisite for upgrading does not develop ... This probably becomes more serious when racial mix is combined with socioeconomic mix (Clay, 1979, p. 70).</p><p class=\"zh\">政策能否在促成不同社会经济与种族群体的人口混合的同时，又同步强化街区的文明阶层主导地位，这一点仍存疑问。过去，当新来者与原住民种族或社会经济地位不同时，往往混合得并不理想。作为“升级”（upgrading）前提条件的规范性融合，往往并未真正发生⋯⋯当种族混合与社会经济混合叠加在一起时，这一问题很可能会变得更加严重（Clay, 1979, 第70页）。</p><span class=\"attrib\">Clay (1979) 原话，经 Lees 转引——早期对社会混合持怀疑态度的学术声音，Lees 将其列入她所承接的怀疑论谱系，是她&lt;strong&gt;援引以支持自身论点&lt;/strong&gt;的先行研究，不是被反驳对象。</span></div><div class=\"para\" data-idx=\"14\" data-doc=\"lees-2008-social-mixing\" data-nid=\"b6050e7fd2\"><p class=\"en\">In this paper, I question whether social mixing—moving middle-income people into low-income inner-city neighbourhoods—is a positive thing. There has been a large volume of work that has investigated the concept of social mixing or mixed communities, from detailed literature reviews (such as Goodchild and Cole, 2001; Atkinson, 2005; Tunstall and Fenton, 2006; Cheshire, 2007); to empirical research on tenurial diversification on public housing estates (such as Atkinson and Kintrea, 2000; Tunstall, 2003); to empirical work on mixed communities in new-build developments (Rowlands et al., 2006); and new work questioning social mixing policies (Galster, 2007). In this paper I bring together this work and the newly emerging work on gentrification and social mixing (for example, Davidson, under review; Freeman, 2006; Lees et al., 2008; Rose, 2004; Uitermark et al., 2007; Walks and Maaranen, 2008) to question the current policies on social mixing that are a central part of urban renaissance agendas in much of the developed world. In so doing, I develop a detailed critique of current policies on social mixing that seek to use gentrification as a ‘positive public policy tool’ to revitalise inner urban neighbourhoods (see Cameron, 2003, on gentrification as a ‘positive public policy tool’; and Lees et al., 2008, on state-led ‘positive’ gentrification).</p><p class=\"zh\">在本文中，我要质疑的是：社会混合——即把中等收入人群迁入低收入内城街区——究竟是不是一件好事。围绕“社会混合”或“混合社区”这一概念，已经积累了大量研究：从详尽的文献综述（如 Goodchild and Cole, 2001；Atkinson, 2005；Tunstall and Fenton, 2006；Cheshire, 2007），到关于公共住房社区<a class=\"gref\" href=\"#g-tenure\">业权</a>多元化的经验研究（如 Atkinson and Kintrea, 2000；Tunstall, 2003），再到关于新建开发项目中混合社区的经验研究（Rowlands et al., 2006），以及质疑社会混合政策本身的新近研究（Galster, 2007）。本文将汇集这些研究，以及新近涌现的关于绅士化与社会混合的研究（例如 Davidson，审稿中；Freeman, 2006；Lees et al., 2008；Rose, 2004；Uitermark et al., 2007；Walks and Maaranen, 2008），以质疑当下作为发达世界大部分“城市复兴”议程核心组成部分的社会混合政策。在此过程中，我将对那些试图把绅士化当作一种“积极的公共政策工具”、用以振兴内城街区的现行社会混合政策，展开详细的批判（关于绅士化作为“积极的公共政策工具”，见 Cameron, 2003；关于国家主导的“积极”绅士化，见 Lees et al., 2008）。</p></div><h2 class=\"sec\" data-secidx=\"15\"><span class=\"en\">Policies of Gentrification and Social Mixing</span><span class=\"zh\">绅士化与社会混合的政策</span></h2><div class=\"para\" data-idx=\"16\" data-doc=\"lees-2008-social-mixing\" data-nid=\"c20ccf482c\"><p class=\"en\">In recent years, there has been a resurgence of interest among national and local governments, urban policy-makers and urban scholars in the concept of social mixing. Encouraging socially mixed neighbourhoods and communities has become a major urban policy and planning goal in the UK, Ireland, the Netherlands, Scandinavia, Australia, Canada and the United States. As Rose argues</p><p class=\"zh\">近年来，国家与地方政府、城市政策制定者以及城市研究学者，对“社会混合”这一概念的兴趣再度高涨。鼓励社会混合的街区与社区，已成为英国、爱尔兰、荷兰、北欧诸国、澳大利亚、加拿大与美国的一项主要城市政策与规划目标。正如 Rose 所论：</p></div><div class=\"para quote\" data-idx=\"17\" data-doc=\"lees-2008-social-mixing\" data-nid=\"2fb70f2940\"><p class=\"en\">since the image of the ‘livable city’ has become a key aspect of a city’s ability to compete in a globalized, knowledge-based economy (Florida, 2003), post-industrial cities have a growing interest in marketing themselves as being built on a foundation of ‘inclusive’ neighbourhoods capable of harmoniously supporting a blend of incomes, cultures, age-groups and lifestyles (Rose, 2004, p. 281).</p><p class=\"zh\">由于“宜居城市”的形象已经成为一座城市能否在全球化、知识型经济中保持竞争力的关键要素之一（Florida, 2003），后工业城市越来越热衷于把自己包装为建立在“包容性”街区基础之上——这些街区据称能够和谐地容纳不同收入、文化、年龄群体与生活方式的混合（Rose, 2004, 第281页）。</p><span class=\"attrib\">Rose (2004) 原话，经 Lees 转引——这是 Rose 对更广泛政策语境的描述性分析，Lees 认同并借用它来交代社会混合政策兴起的宏观背景，不是被批判的对象。</span></div><div class=\"para\" data-idx=\"18\" data-doc=\"lees-2008-social-mixing\" data-nid=\"810c4881cf\"><p class=\"en\">Schoon (2001) identifies three distinct rationales in policy debates for social mixing. First, the ‘defending the neighbourhood’ argument claims that since middle-class people are stronger advocates for public resources, socially mixed neighbourhoods will fare better than those without middle-class households. Secondly, the ‘money-go-round’ argument claims that tenurially and socioeconomically mixed neighbourhoods are able to support a stronger local economy than areas of concentrated poverty. Finally, the ‘networks and contacts’ argument draws on Putnam’s (1995) influential account of bridging and bonding social capital to promote social mixing as the way to generate social cohesion and economic opportunity. However, the rhetoric of ‘social mix’ hides a gentrification strategy and in that a hidden social cleansing agenda (Cameron, 2003; Uitermark et al., 2007).</p><p class=\"zh\">Schoon（2001）识别出政策辩论中支持社会混合的三种不同论证理路。其一是“捍卫街区”论证：由于中产阶级是公共资源更有力的倡导者，社会混合的街区因而会比没有中产家庭的街区境况更好。其二是“钱财循环”（money-go-round）论证：业权与社会经济层面都实现混合的街区，比贫困集聚的地区更能支撑起较强劲的地方经济。其三是“网络与人脉”论证：借用 Putnam（1995）关于桥接型（bridging）与联结型（bonding）社会资本那一具有广泛影响力的论述，主张社会混合是生成社会凝聚力与经济机会的途径。<strong>然而</strong>，“社会混合”的修辞背后，掩藏着的其实是一套绅士化策略，而在这套策略之中，又藏着一个隐蔽的<a class=\"gref\" href=\"#g-cleansing\">社会清洗</a>议程（Cameron, 2003；Uitermark et al., 2007）。</p></div><div class=\"para\" data-idx=\"19\" data-doc=\"lees-2008-social-mixing\" data-nid=\"ab8d5688ba\"><p class=\"en\">Blomley demonstrates how the concept of social mix has been operationalised through gentrification in order to address—that is, cleanse—the long-term disinvestment and poverty in Vancouver’s Downtown Eastside</p><p class=\"zh\"><a class=\"gref\" href=\"#g-blomley\">Blomley</a> 展示了“社会混合”这一概念是如何通过绅士化被操作化，以此来应对——也就是说，清洗掉——温哥华市中心东区（Downtown Eastside）长期的资本撤离与贫困问题：</p></div><div class=\"para quote\" data-idx=\"20\" data-doc=\"lees-2008-social-mixing\" data-nid=\"e9be7e75a0\"><p class=\"en\">Programs of renewal often seek to encourage homeownership, given its supposed effects on economic self-reliance, entrepreneurship, and community pride. Gentrification, on this account, is to be encouraged, because it will mean the replacement of a marginal anti-community (nonproperty owning, transitory, and problematized) by an active, responsible, and improving population of homeowners (Blomley, 2004, p. 89).</p><p class=\"zh\">更新计划往往致力于鼓励自有住房，因为据信这有助于经济上的自立、创业精神与社区自豪感。按照这套说法，绅士化是应当被鼓励的，因为它意味着一个边缘化的“反社区”人口（不拥有产权、流动性强、被问题化）将被一群积极、负责、力求上进的有产者所取代（Blomley, 2004, 第89页）。</p><span class=\"attrib\">Blomley (2004) 原话，经 Lees 转引——这段话本身是 Blomley 复述、剖析&lt;strong&gt;政策制定者自己的说辞&lt;/strong&gt;（即他所批判的官方更新话语的逻辑），Lees 借 Blomley 之口引用这套官方逻辑，目的是揭露、而非认同它；引文内容代表的是被两人共同批判的“旧社区＝问题、新有产者＝改善”式官方叙事，不是 Blomley 或 Lees 本人的立场。</span></div><div class=\"para\" data-idx=\"21\" data-doc=\"lees-2008-social-mixing\" data-nid=\"b6e8ac8dad\"><p class=\"en\">It is a policy language that never uses the word ‘gentrification’ and thus consistently deflects criticism and resistance. Terms like urban renaissance, urban revitalisation, urban regeneration and urban sustainability are used instead, avoiding the class constitution of the processes involved and neutralising the negative image that the process of gentrification brings with it (Lees, 2003a; Lees et al., 2008). Criticism is also deflected through the construction of social mixing as a moralistic discourse that is about helping the poor (Blomley, 2004; Slater, 2005, 2006). It is difficult to be for gentrification, but who would oppose ‘social mixing’?</p><p class=\"zh\">这是一套从不使用“绅士化”一词的政策语言，因而得以持续地避开批评与抵制。取而代之的是<a class=\"gref\" href=\"#g-renaissance\">城市复兴</a>、城市振兴、城市更新、城市可持续性这类措辞，从而回避了其中所涉过程的阶级构成，也中和了绅士化过程自带的负面形象（Lees, 2003a；Lees et al., 2008）。批评还通过另一种方式被消解：把社会混合建构成一种道德化的话语，说成是在“帮助穷人”（Blomley, 2004；Slater, 2005, 2006）。要支持绅士化是困难的，但又有谁会反对“社会混合”呢？</p></div><div class=\"para\" data-idx=\"22\" data-doc=\"lees-2008-social-mixing\" data-nid=\"7f47fe1e91\"><p class=\"en\">Although authors have written about Ireland (for example, Norris, 2006), Scandinavia (for example, Musterd and Andersson, 2005), Australia (for example, Ruming et al., 2004), and the literature on Canada is growing (much of which is used later in this paper—see references there), the bulk of the literature on social mixing has focused on the UK, the US and the Netherlands. These three countries have enacted similar but different ways of promoting social mixing as part of their urban renaissance agendas. The UK has promoted the state-led gentrification of public housing through a mixed communities policy and the housing market renewal of areas of supposedly failing owner-occupied housing (usually working-class). The US has promoted social mixing through policies that seek the spatial deconcentration of poverty. And the Netherlands has pursued policies of breaking up, through demolition and rebuilding, significant areas of low-income housing. In similar vein to the UK, it has also enacted policy that regulates new developments by requiring mixed occupancy as a condition for planning approval and/or funding.</p><p class=\"zh\">尽管已有作者论及爱尔兰（如 Norris, 2006）、北欧（如 Musterd and Andersson, 2005）、澳大利亚（如 Ruming et al., 2004），关于加拿大的文献也在不断增长（本文后面会大量使用，详见相关处的引注），但社会混合方面的文献大多集中在英国、美国与荷兰这三个国家。这三个国家都把推动社会混合作为各自“城市复兴”议程的一部分，做法相似而又各有不同。英国是通过“混合社区”政策，以及针对（通常是工人阶级）自有住房“失败地区”所谓的“住房市场更新”，来推动公共住房的国家主导型绅士化。美国则是通过旨在实现<strong>贫困空间去集中化</strong>（spatial deconcentration of poverty）的政策来推动社会混合。而荷兰所奉行的政策，是通过拆除与重建，打散大片的低收入住房区域；与英国类似，荷兰也出台了相关政策，规定新开发项目必须满足“混合入住”的条件，方能获得规划许可与／或资金支持。</p></div><h3 class=\"sec\" data-secidx=\"23\"><span class=\"en\">The United Kingdom</span><span class=\"zh\">英国</span></h3><div class=\"para\" data-idx=\"24\" data-doc=\"lees-2008-social-mixing\" data-nid=\"b8e336f4f6\"><p class=\"en\">The UK’s New Labour government (under Tony Blair and now Gordon Brown) is as committed to social diversity and mixing as were Barnsbury’s pioneer gentrifiers, some of whom were quoted earlier. It is perhaps no surprise that Tony Blair and a number of other cabinet members have lived in Barnsbury! Their pro-urban and pro-social-mixing ideologies are those of classic gentrification texts. In recent policy statements they sell gentrification, which they prefer to call ‘urban renaissance’, to us through the neutralising vein of social mixing (Lees, 2003a; Lees et al., 2008). As stated earlier, the benefits of diversity and of functionally as well as socially mixed urban communities stand central to, and unquestioned in, these policy documents. The British government’s stated intention to bring the middle classes back to the central city, read gentrification, is motivated by, and indeed sold to us, as an attempt to reduce socio-spatial segregation and strengthen the ‘social tissue’ of deprived neighbourhoods. Social mixing and improved social balance are viewed as key to reducing what they term ‘neighbourhood effects’. This was the ODPM’s argument</p><p class=\"zh\">英国<a class=\"gref\" href=\"#g-newlabour\">新工党</a>政府（先是 Tony Blair，如今是 Gordon Brown 领导）对社会多样性与混合的执着，丝毫不逊于前文引述过的那几位巴恩斯伯里先锋型绅士化者。Tony Blair 与不少其他内阁成员都曾住在巴恩斯伯里，这或许并不令人意外！他们那套亲城市、亲社会混合的意识形态，正是经典绅士化文本中的那一套。在近期的政策声明中，他们通过“社会混合”这一中和性的话语，向我们兜售绅士化——尽管他们更愿意称之为“城市复兴”（Lees, 2003a；Lees et al., 2008）。如前所述，多样性以及功能上与社会上都实现混合的城市社区所具有的种种好处，在这些政策文件中始终居于核心地位，且从未受到质疑。英国政府所宣称的、要把中产阶级带回中心城区——说白了就是绅士化——这一意图，其动机（也正是其向我们兜售的说辞）被表述为：试图减少社会空间隔离，强化贫困街区的“社会肌理”。社会混合与更好的社会平衡，被视为削减他们所谓“街区效应”（neighbourhood effects）的关键所在。这正是 <a class=\"gref\" href=\"#g-odpm\">ODPM</a>（副首相办公室）的论证：</p></div><div class=\"para quote\" data-idx=\"25\" data-doc=\"lees-2008-social-mixing\" data-nid=\"699f2d2e54\"><p class=\"en\">People living in deprived neighbourhoods are less likely to work, more likely to be poor and have lower life expectancy, more likely to live in poorer housing in unattractive local environments with high levels of anti-social behaviour and lawlessness and more likely to receive poorer education and health services. Living in a deprived area adversely affects individual’s life chances over and above what would be predicted by their personal circumstances and characteristics (ODPM, 2005, p. 6).</p><p class=\"zh\">居住在贫困街区的人，就业可能性更低，陷入贫困、寿命更短的可能性更高，居住在环境欠佳、反社会行为与违法乱纪现象高发地区劣质住房中的可能性更高，获得的教育与医疗服务质量更差的可能性也更高。居住在贫困地区，会对个人的人生机会造成不利影响，其程度<strong>超出</strong>仅凭其个人处境与自身特征所能预测的范围（ODPM, 2005, 第6页）。</p><span class=\"attrib\">英国副首相办公室（ODPM）2005年官方论证原文，经 Lees 转引——这是 Lees 意在呈现并随后质疑的&lt;strong&gt;官方政策论证&lt;/strong&gt;，不是她本人的立场；她引用它是为了展示英国政府用以证成社会混合政策的“街区效应”逻辑本身。</span></div><div class=\"para\" data-idx=\"26\" data-doc=\"lees-2008-social-mixing\" data-nid=\"c3425ecb0e\"><p class=\"en\">Randolph and Wood explain the thinking behind this approach</p><p class=\"zh\">Randolph 与 Wood 解释了这套思路背后的逻辑：</p></div><div class=\"para quote\" data-idx=\"27\" data-doc=\"lees-2008-social-mixing\" data-nid=\"a51c09d7a9\"><p class=\"en\">The idea that social disadvantage is exacerbated by spatial concentration of disadvantaged populations is often now referred to in terms of ‘neighbourhood’ or ‘area effects’. Put simply, the concentration of poverty in local areas creates a social milieu that reinforces aspects of disadvantage and actively reduces an individual’s ability to move out of poverty or disadvantage (Randolph and Wood, 2003, p. iii).</p><p class=\"zh\">“弱势人口的空间集聚会加剧社会性弱势”这一观念，如今常被称作“街区效应”或“地区效应”。简单来说，贫困在局部地区的集聚，会造就一种强化弱势处境各方面特征的社会环境，并切实削弱个人摆脱贫困或弱势处境的能力（Randolph and Wood, 2003, 第iii页）。</p><span class=\"attrib\">Randolph and Wood (2003) 原话，经 Lees 转引——用以解释官方“街区效应”论证背后的学理逻辑，属于 Lees 概述、供读者理解政策思路的&lt;strong&gt;转述性引文&lt;/strong&gt;，尚非她本人赞同或反对的表态（她的批判在后文关于业权多元化“效果常令人失望”一句才展开）。</span></div><div class=\"para\" data-idx=\"28\" data-doc=\"lees-2008-social-mixing\" data-nid=\"b3ead3dd8c\"><p class=\"en\">The Social Exclusion Unit (1998) argued that social capital in excluded communities could be rebuilt if they socially mix</p><p class=\"zh\">社会排斥问题工作组（Social Exclusion Unit，1998）主张，被排斥社区的社会资本，可以通过社会混合得到重建：</p></div><div class=\"para quote\" data-idx=\"29\" data-doc=\"lees-2008-social-mixing\" data-nid=\"953329225f\"><p class=\"en\">it often brings people into contact with those outside their normal circle, broadening horizons and raising expectations, and can link people into informal networks through which work is more easily found (SEU, 1998, p. 53).</p><p class=\"zh\">它往往能让人们与自己平常圈子之外的人建立接触，拓宽眼界、提高期望，并能把人们联入非正式网络，通过这些网络，工作机会也更容易找到（SEU, 1998, 第53页）。</p><span class=\"attrib\">英国社会排斥问题工作组（SEU）1998年报告原话，经 Lees 转引——又一段 Lees 意在展示、随后加以质疑的&lt;strong&gt;官方政策论证&lt;/strong&gt;，不是她本人的主张。</span></div><div class=\"para\" data-idx=\"30\" data-doc=\"lees-2008-social-mixing\" data-nid=\"307e03f9d9\"><p class=\"en\">As Uitermark argues</p><p class=\"zh\">正如 <a class=\"gref\" href=\"#g-uitermark\">Uitermark</a> 所论：</p></div><div class=\"para quote\" data-idx=\"31\" data-doc=\"lees-2008-social-mixing\" data-nid=\"119dc1bcf5\"><p class=\"en\">It is frequently suggested by planners and politicians alike, that a policy that promotes ‘social mixing’ could strengthen the social tissue of a disadvantaged neighbourhood, thus saving its inhabitants from living in an environment that allegedly inhibits social and economic integration (Uitermark, 2003, p. 531).</p><p class=\"zh\">规划者与政治人物都常常提出这样的说法：一项促进“社会混合”的政策，能够强化弱势街区的社会肌理，从而将居民从据称会阻碍社会与经济融合的环境中“拯救”出来（Uitermark, 2003, 第531页）。</p><span class=\"attrib\">Uitermark (2003) 原话，经 Lees 转引——Uitermark 在此是以第三人称转述、剖析规划者与政治人物&lt;strong&gt;自己的说辞&lt;/strong&gt;（注意“It is frequently suggested by...”这一表述本身已带距离感），Lees 借此进一步佐证：无论英美荷三国，官方对“社会混合”的论证逻辑高度雷同。这不是 Uitermark 或 Lees 本人认同的主张。</span></div><div class=\"para\" data-idx=\"32\" data-doc=\"lees-2008-social-mixing\" data-nid=\"bb4240eb61\"><p class=\"en\">Through producing more socially balanced neighbourhoods via gentrification and thus reducing socio-spatial segregation, the British government expects to increase the stocks of social capital in disadvantaged neighbourhoods. The mixing of low-income and middle-income communities is therefore a necessary part of the British government’s programme to reduce social exclusion. The echoes of poverty deconcentration policies from the US (see next section) are quite apparent. Following the national lead, local urban renaissance initiatives are seeking to entice more affluent populations into low-income areas—what Stuart Cameron (2003, p. 2373) calls a policy of ‘positive gentrification’ or ‘gentrification as a positive public policy tool’—in order to diversify the social mix and dilute concentrations of poverty in the inner city.</p><p class=\"zh\">英国政府期望，通过绅士化催生出社会平衡程度更高的街区、从而减少社会空间隔离，来增加弱势街区的社会资本存量。因此，低收入与中等收入社区的混合，成了英国政府削减社会排斥这一施政方案中不可或缺的一环。这套逻辑与美国的“贫困去集中化”政策（见下一节）之间的呼应相当明显。追随这一国家层面的引导，地方层面的“城市复兴”行动也在设法把更富裕的人口吸引到低收入地区——Stuart Cameron（2003，第2373页）称之为“积极绅士化”（positive gentrification）或“绅士化作为一种积极的公共政策工具”的政策——目的是使社会混合更加多元，稀释内城的贫困集聚。</p></div><div class=\"para\" data-idx=\"33\" data-doc=\"lees-2008-social-mixing\" data-nid=\"ed974c303b\"><p class=\"en\">Davidson and Lees (under review) discuss the example of the Aylesbury estate near Elephant and Castle, one of the largest public housing estates in Europe, which is in the process of being demolished and replaced with mixed-income new-build housing. As the current Housing Green Paper states</p><p class=\"zh\">Davidson 与 Lees（审稿中）讨论了<a class=\"gref\" href=\"#g-aylesbury\">艾尔斯伯里社区</a>（Aylesbury estate）——毗邻<a class=\"gref\" href=\"#g-elephant\">象堡</a>（Elephant and Castle）、欧洲最大的公共住房社区之一——的案例：该社区正处于被拆除、并代之以混合收入新建住房的过程中。正如现行的《住房绿皮书》（Housing Green Paper）所述：</p></div><div class=\"para quote\" data-idx=\"34\" data-doc=\"lees-2008-social-mixing\" data-nid=\"996637942f\"><p class=\"en\">The purpose of an estate transformation venture would be the creation of a sustainable mixed community. This would be likely to involve selective demolition; provision of new housing supply for homeownership, market sale and low-cost homeownership; social rented and possibly council housing (DCLG, 2007, p. 111).</p><p class=\"zh\">社区转型项目的目的，将是创造出一个可持续的混合社区。这很可能涉及选择性拆除；提供新增住房供给，包括自有住房、市场销售住房与低成本自有住房；以及社会租赁住房，或许还包括市政住房（DCLG, 2007, 第111页）。</p><span class=\"attrib\">英国社区与地方政府部（DCLG）2007年《住房绿皮书》官方原话，经 Lees 转引——这是 Lees 意在展示并随后批判的&lt;strong&gt;官方政策表述&lt;/strong&gt;，紧接下一段她本人就指出，实际拆建比例（3200套私有 vs 2000套社会租赁）与这段“可持续混合社区”的说辞形成尖锐反差，因此这段引文不是她本人的立场，而是被摆出来接受检验的对象。</span></div><div class=\"para\" data-idx=\"35\" data-doc=\"lees-2008-social-mixing\" data-nid=\"50e8309e8c\"><p class=\"en\">The current strategy for the demolition and rebuilding of the Aylesbury estate lists the construction of 3200 private new-build homes and only 2000 social rented new-build homes. This fulfils the UDP requirement for 40 per cent social housing. In essence, they seek to demolish the vast majority of the Aylesbury estate (despite much of it being structurally sound) and to create a new-build development for a privileged middle class. This plan does not acknowledge the current mix already in the area (which is already very socially and ethnically diverse), nor does it address issues of social sustainability. As Chris Allen (2008) says, demolishing low-cost working-class houses in order to build high-value products that middle-class people will allegedly buy violates a whole way of working class ‘being’ towards houses (as places to dwell rather than a position within the space of positions).</p><p class=\"zh\">艾尔斯伯里社区当前的拆除与重建策略，规划建造3200套私有新建住房，而社会租赁新建住房却只有2000套——这恰好满足了统一开发规划（UDP）中“40%社会住房”的最低要求。实质上，他们要做的是拆除艾尔斯伯里社区的绝大部分（尽管其中许多建筑在结构上依然完好），并建起一片供享有特权的中产阶级居住的新建开发区。这一规划既没有承认该地区<strong>本已存在</strong>的混合状态（该地区在社会与族裔层面本就已经相当多样），也没有回应社会可持续性方面的种种问题。正如 Chris Allen（2008）所言，拆除低成本的工人阶级住房，去建造那些据称中产阶级会买单的高价值“产品”，这违背了工人阶级对待住房的整套“存在方式”（作为栖居之所，而非某种社会位置空间中的一个位置）。</p></div><h3 class=\"sec\" data-secidx=\"36\"><span class=\"en\">The United States</span><span class=\"zh\">美国</span></h3><div class=\"para\" data-idx=\"37\" data-doc=\"lees-2008-social-mixing\" data-nid=\"3b8f2e4fdc\"><p class=\"en\">Gentrification, marketed as poverty deconcentration in the US, is seen to be a spatial fix for the poor tax bases and concentrations of poverty in American inner cities. In cities that are highly dependent on property taxes as a source of revenue, seeking to increase your tax base by increasing the percentage of middle-class homeowners in the central city is seen to be fiscal pragmatism (Lees et al., 2008). Significant spatial concentrations of poverty are seen to produce certain pathologies</p><p class=\"zh\">在美国，绅士化被包装成“贫困去集中化”，被视为解决美国内城疲弱税基与贫困集聚问题的一种<strong>空间性对策</strong>（spatial fix）。在高度依赖财产税作为财政收入来源的城市里，通过提高中心城区中产阶级有房者的比例来扩大税基，被视为一种财政上务实的做法（Lees et al., 2008）。而显著的贫困空间集聚，则被认为会产生某些“病理”：</p></div><div class=\"para quote\" data-idx=\"38\" data-doc=\"lees-2008-social-mixing\" data-nid=\"1bb82aefea\"><p class=\"en\">While debate on these questions persists, the consensus among policy-makers is that poverty is fundamentally transformed by its spatial concentration: When [sic] neighbourhood poverty rates exceed some critical threshold, contagion effects spread behavioural pathologies through peer groups, while collective socialisation erodes because children no-longer see adults in positive role models as educated workers and married parents (Wyly and Hammel, 1999, p. 740).</p><p class=\"zh\">尽管围绕这些问题的争论仍在持续，但政策制定者之间的共识是：贫困一旦发生空间集聚，其性质会发生根本性转变。当〔原文如此〕街区贫困率超过某个临界阈值时，“传染效应”会通过同辈群体扩散各种行为“病理”，而集体社会化功能也会随之侵蚀，因为孩子们不再能从成年人身上看到“受教育的劳动者、已婚父母”这类正面榜样（Wyly and Hammel, 1999, 第740页）。</p><span class=\"attrib\">Wyly and Hammel (1999) 原话，经 Lees 转引——这段是 Wyly 与 Hammel 对&lt;strong&gt;美国政策制定者共识&lt;/strong&gt;的复述与刻画（他们自己也在做转述），Lees 引用它是为了呈现她随后要批判的那套“贫困集聚＝病理”官方论证逻辑，不是她本人或原作者赞同的观点。</span></div><div class=\"para\" data-idx=\"39\" data-doc=\"lees-2008-social-mixing\" data-nid=\"f026646fd7\"><p class=\"en\">The solution to this is to socially mix, in reality gentrify, such concentrations of poverty. The current trend in US housing redevelopment is to replace existing high-density social housing ‘projects’ with new lower-density mixed-income communities. This is the central thrust of the Federal Department of Housing and Urban Development’s HOPE VI programme which has been used to socially mix, and gentrify, public housing.</p><p class=\"zh\">针对这一“病理”，开出的药方是对贫困集聚区域实行社会混合——实质上就是绅士化。当前美国住房再开发的趋势，是用新建的低密度混合收入社区，取代既有的高密度社会住房“项目”（projects）。这正是联邦住房与城市发展部（HUD）“希望六号”（<a class=\"gref\" href=\"#g-hope6\">HOPE VI</a>）计划的核心主旨，该计划一直被用来对公共住房实施社会混合、亦即绅士化。</p></div><div class=\"para\" data-idx=\"40\" data-doc=\"lees-2008-social-mixing\" data-nid=\"41eec30d36\"><p class=\"en\">One infamous example is Cabrini Green in Chicago. In 1994, despite being located next to some of the most expensive real estate in Chicago, Cabrini Green qualified under HUD guidelines as the worst case of public housing in the US and received $50 million to redevelop a portion of the site (Lees et al., 2008). The reduction of densities from the demolition of units and the ‘vouchering out’ (for example, where residents were given vouchers for mainly private rented accommodation) of public housing tenants led to significant displacement of low-income tenants and gentrification (see Smith, 2001). By ‘manufacturing’ a socially mixed community in areas of poverty concentration, such as Cabrini Green, US policy-makers think that gentrification</p><p class=\"zh\">一个臭名昭著的例子，是芝加哥的<a class=\"gref\" href=\"#g-cabrini\">卡布里尼-格林</a>（Cabrini Green）。1994年，尽管卡布里尼-格林紧邻芝加哥地价最昂贵的一些地段，它却依据 HUD（联邦住房与城市发展部）的准则被认定为美国最恶劣的公共住房个案，并因此获得5000万美元资金，用于重新开发部分地块（Lees et al., 2008）。因单元拆除而带来的密度削减，以及对公共住房租户实施的“代金券化”（'vouchering out'，即让居民领取住房券、转而主要在私人租赁市场上寻找住处），导致了低收入租户的大规模置换与绅士化（见 Smith, 2001）。通过在卡布里尼-格林这类贫困集聚地区“人为制造”出一个社会混合社区，美国的政策制定者们相信，绅士化</p></div><div class=\"para quote\" data-idx=\"41\" data-doc=\"lees-2008-social-mixing\" data-nid=\"1b74696c86\"><p class=\"en\">can ameliorate the social isolation of the poor. New more affluent residents will rub shoulders with poorer existing residents on the streets, in shops, and within local institutions, such as public schools. Such newcomers may exhibit possibilities of social mobility and a determination to secure adequate public services that provide existing residents with the kind of role models and contacts the absence of which Wilson [W. J. Wilson, 1987] finds debilitating in the ghetto (Byrne, 2003, p. 422).</p><p class=\"zh\">能够缓解穷人的社会孤立处境。新迁入的、更富裕的居民，将在街头、商店、以及诸如公立学校这样的地方机构中，与既有的贫困居民“摩肩接踵”。这些新来者或许能展现出向上流动的可能性，并具有争取充足公共服务的决心，从而为既有居民提供某种榜样与人脉——而据 Wilson〔W. J. Wilson, 1987〕的研究，正是这类榜样与人脉的<strong>缺失</strong>，才是使贫民区陷入困顿的原因（Byrne, 2003, 第422页）。</p><span class=\"attrib\">Byrne (2003) 原话，经 Lees 转引——这段是 Byrne 转述&lt;strong&gt;美国政策制定者的思路本身&lt;/strong&gt;（前一句“US policy-makers think that gentrification...”已表明这是被转述的第三方看法），Lees 引用它是为了摆出这套官方乐观预期，供后文以卡布里尼-格林等实例检验、批判，不是 Lees 本人认同的判断。</span></div><div class=\"para\" data-idx=\"42\" data-doc=\"lees-2008-social-mixing\" data-nid=\"e7121cea93\"><p class=\"en\">By the end of 2004, the HOPE VI programme had demolished approximately 63 000 units and more than 20 300 units were redeveloped (Atkinson, 2005). Cunningham (2001), however, in his critique of HOPE VI in Washington DC, argues that HOPE VI has not aided the revitalisation of depressed neighbourhoods, rather it has reduced affordable housing and caused spiralling rents and prices. Gotham is on the ball when he states:</p><p class=\"zh\">截至2004年底，“希望六号”计划已拆除约63,000个住房单元，另有超过20,300个单元完成了再开发（Atkinson, 2005）。然而 Cunningham（2001）在其对华盛顿特区“希望六号”计划的批判中主张，该计划并未真正帮助萧条街区实现振兴，反而减少了可负担住房、并导致租金与房价螺旋式上涨。Gotham 一语中的：</p></div><div class=\"para quote\" data-idx=\"43\" data-doc=\"lees-2008-social-mixing\" data-nid=\"9ca9a3642f\"><p class=\"en\">the redevelopment of public housing [in the US] is a form of ‘exclusive’ development that is designed to exclude the very poor from the revitalized spaces and render them safe for resettlement by the wealthy and affluent (Gotham, 2001, p. 437).</p><p class=\"zh\">〔美国〕公共住房的再开发，是一种“排他式”开发，其设计目的正是要把赤贫者排除在被“振兴”过的空间之外，使这些空间对富人与富裕阶层而言变得“安全”，便于他们重新入住（Gotham, 2001, 第437页）。</p><span class=\"attrib\">Gotham (2001) 原话，经 Lees 转引——Lees 用“一语中的”（is on the ball）明确&lt;strong&gt;认同&lt;/strong&gt;此论断，这是她本人借他人之口表达的立场，用以点破“希望六号”式再开发的排他本质。</span></div><div class=\"para\" data-idx=\"44\" data-doc=\"lees-2008-social-mixing\" data-nid=\"d0a53ad2c7\"><p class=\"en\">This neo-liberal formula of social mixing, that promotes gentrification, can be seen operating at perhaps a more disturbing level in post-Katrina New Orleans. There conservative commentators and public officials have blamed the urban poverty in New Orleans on the failures of the liberal welfare state. Their aim is to lure middle-class families back into New Orleans and to build over, displace or ‘culturally integrate’ the African American/low-income communities (see Lees et al., 2008). As the National Housing Law Project et al. have argued</p><p class=\"zh\">这套助长绅士化的“社会混合”新自由主义公式，在卡特里娜飓风之后的新奥尔良，或许运作得更加令人不安。在那里，保守派评论人士与公职官员把新奥尔良的城市贫困归咎于自由派福利国家的失败。他们的目标是把中产家庭重新吸引回新奥尔良，同时通过在原地新建、置换，或所谓“文化整合”，来处置非裔美国人／低收入社区（见 Lees et al., 2008）。正如“全国住房法律项目”（National Housing Law Project）等机构所主张的：</p></div><div class=\"para quote\" data-idx=\"45\" data-doc=\"lees-2008-social-mixing\" data-nid=\"eab3369f39\"><p class=\"en\">While the scale of urban renewal clearance was larger than that of HOPE VI, both programs involve the displacement of very large numbers of low income households of color (National Housing Law Project et al., 2002, p. 38).</p><p class=\"zh\">尽管城市更新清拆的规模比“希望六号”计划更大，但这两项计划都造成了数量极其庞大的有色人种低收入家庭被置换（National Housing Law Project et al., 2002, 第38页）。</p><span class=\"attrib\">全国住房法律项目（National Housing Law Project）等（2002）原话，经 Lees 转引——Lees&lt;strong&gt;认同并借用&lt;/strong&gt;此论断，作为美国案例部分的收束，与她本人对贫困去集中化政策的批判立场一致。</span></div><h3 class=\"sec\" data-secidx=\"46\"><span class=\"en\">The Netherlands</span><span class=\"zh\">荷兰</span></h3><div class=\"para\" data-idx=\"47\" data-doc=\"lees-2008-social-mixing\" data-nid=\"a6fd03f57c\"><p class=\"en\">Compared with the US and the UK, spatial segregation is comparatively low in the Netherlands (van Kempen et al., 1992) due to the different composition of the housing market, where over half the housing is owned and rented out by public housing corporations. Traditionally, all sections of society have made use of this public housing regardless of income (Murie and Musterd, 1996), although this is now changing with higher-income households now almost entirely absent from publically provided housing. Nevertheless, despite the low levels of spatial segregation, social segregation and social mixing are high on governmental agendas. In the Netherlands, a policy of ‘housing redifferentiation’ (see Hulsbergen and Stouten, 2001; Musterd et al., 1999; Priemus, 1995, 1998, 2001; Uitermark, 2003) as they call it, has been underway since 1996. The British Urban Task Force were especially excited by this policy. Housing redifferentiation is a policy of adding more expensive dwellings to low-income areas by removing inexpensive dwellings through demolition, together with the sale and upgrading of existing dwellings—the idea being to create a more socially mixed population in neighbourhoods via gentrification.</p><p class=\"zh\">与美国和英国相比，荷兰的空间隔离程度相对较低（van Kempen et al., 1992），这是因为其住房市场构成不同：超过一半的住房由公共住房公司所拥有并出租。传统上，无论收入高低，社会各阶层都会使用这类公共住房（Murie and Musterd, 1996）——不过如今这一情况正在改变，高收入家庭如今几乎已完全退出公共提供的住房体系。尽管如此，尽管空间隔离程度较低，社会隔离与社会混合问题依然高居政府议程之列。在荷兰，一项他们称之为“住房再分异”（housing redifferentiation）的政策（见 Hulsbergen and Stouten, 2001；Musterd et al., 1999；Priemus, 1995, 1998, 2001；Uitermark, 2003）自1996年起就已在推行。英国的“城市工作组”（Urban Task Force）对这项政策尤其感到振奋。所谓“住房再分异”，是指通过拆除来清除低收入地区的廉价住房、并加入更昂贵的住房，同时出售并升级现存住房——其构想是要通过绅士化，在街区中造就一个社会混合程度更高的人口结构。</p></div><div class=\"para\" data-idx=\"48\" data-doc=\"lees-2008-social-mixing\" data-nid=\"9cd5842f65\"><p class=\"en\">The motivation for promoting such policies is not about the social well-being of disadvantaged individuals, rather it is about the need to strengthen the economic position of Dutch cities overall (Uitermark, 2003). Aalbers et al. outline the rationales behind a series of interlinked policy shifts in the Netherlands</p><p class=\"zh\">推动这类政策的动机，并非出于对弱势个体社会福祉的关切，而是出于要强化荷兰各城市整体经济地位的需要（Uitermark, 2003）。Aalbers 等人概述了荷兰一系列相互关联的政策转向背后的理据：</p></div><div class=\"para quote\" data-idx=\"49\" data-doc=\"lees-2008-social-mixing\" data-nid=\"801ff0ecdd\"><p class=\"en\">At the end of the 1980s it was realised that the urban economy had lost much of its strength due to suburbanization and due to the focus on poor residents and on their housing provision as a leading principle. Policy concentrating on areas with multiple problems (problem accumulation areas) and in a later stage the policy of social renewal had to respond to this: the civic society had to be activated. The role of the policy was to increase participation in society. This was done under the name of “stedelijke vernieuwing”, which also means “urban renewal” but should be translated as “urban revitalization” because the goals were very different: not housing needs, but the reinforcement of the urban economy was most important (Aalbers et al., 2004, p. 11).</p><p class=\"zh\">20世纪80年代末，人们意识到，由于郊区化，以及此前一直以贫困居民及其住房供给为主导原则，城市经济已流失了相当一部分活力。因此，针对“多重问题地区”（问题累积地区）的政策、以及后来的“社会更新”政策，都不得不对此作出回应：公民社会必须被激活。政策的作用在于提升社会参与度。这一做法被冠以“stedelijke vernieuwing”之名，该词字面上也可译作“urban renewal”（城市更新），但其实更应译作“urban revitalization”（城市振兴），因为二者目标截然不同：最重要的并非住房需求本身，而是城市经济的强化（Aalbers et al., 2004, 第11页）。</p><span class=\"attrib\">Aalbers 等（2004）原话，经 Lees 转引——学理性的政策史概述，Lees 引用它来交代荷兰政策转向的官方理据脉络，属中性转述，并非她要反驳的对象；但整段引文本身即印证了她紧接前一句的判断：荷兰社会混合政策的真实动机是经济，而非弱势者的福祉。</span></div><div class=\"para\" data-idx=\"50\" data-doc=\"lees-2008-social-mixing\" data-nid=\"91f43c4d97\"><p class=\"en\">As in the US, city governments in the Netherlands see the facilitation of social mix as a way of attracting higher-income residents who will improve the tax-base, support local businesses and improve the governability of the city—for well educated, middle-class urbanites are less of a burden on social services and are likely to play an active part in neighbourhood revitalisations. These ideas about social mix in the Netherlands, and especially in Rotterdam, have gained new intensity since 2002 related to the political turbulence due to the rise of the Pim Fortuyn Party and their ‘Leefbaar Rotterdam’ (Liveable Rotterdam). There are now strong calls in the Netherlands for the dispersal of the poor and immigrant inhabitants and the creation of mixed communities. In Rotterdam, Uitermark et al. argue that</p><p class=\"zh\">与美国类似，荷兰的市政府也把促进社会混合视为吸引高收入居民的一种手段——这些居民将改善税基、扶持本地商业、并提升城市的可治理性，因为受过良好教育的中产阶级城市居民，对社会服务体系造成的负担更小，也更可能积极参与街区振兴。荷兰、尤其是鹿特丹关于社会混合的这些构想，自2002年以来因 <a class=\"gref\" href=\"#g-pimfortuyn\">Pim Fortuyn</a> 党及其“宜居鹿特丹”（Leefbaar Rotterdam）运动所引发的政治动荡而获得了新的强度。荷兰国内如今出现了强烈的呼声，要求分散穷人与移民居民、并营造混合社区。在鹿特丹，Uitermark 等人主张：</p></div><div class=\"para quote\" data-idx=\"51\" data-doc=\"lees-2008-social-mixing\" data-nid=\"256ab1b038\"><p class=\"en\">The city now actively markets itself as a good place for affluent residents and especially targets the so-called creative class (cf. Florida, 2005). The city has boosted both the construction of owner-occupied dwellings and the demolition of social rented housing. Each year, developers add about 3,000 new owner-occupied dwellings to the total of 250,000 dwellings, while demolishers destroy about 4,000 social houses ... In language that hardly requires textual deconstruction, the government of Rotterdam declares that it aims to attract ‘desired households’ to ‘problem areas’ ... therefore reinforcing and politicizing the connection between owner-occupied housing and liveability. This discourse no longer only involves the right-wing parties that were in office since 2002. The Labour Party that won the local elections of February 2006 supports similar policies. A document produced by top civil servants to define the communis opinio after Labour’s victory explicitly argues that gentrification needs to be ‘enhanced’ (Uitermark et al., 2007, p. 129).</p><p class=\"zh\">这座城市如今积极地把自己包装为适合富裕居民的好去处，尤其瞄准所谓的“创意阶层”（creative class，参 Florida, 2005）。市政府同时加大了自有住房的建设力度与社会租赁住房的拆除力度：开发商每年在总量25万套住房的基础上，新增约3,000套自有住房，而拆除方每年则摧毁约4,000套社会住房⋯⋯用几乎无需解构就能看穿的语言，鹿特丹市政府宣称，其目标是把“心仪的家庭”（desired households）吸引到“问题地区”⋯⋯从而把自有住房与宜居性之间的关联，进一步强化并政治化。这套话语如今已不再只是2002年以来在任的右翼政党的专利。2006年2月赢得地方选举的工党，同样支持类似的政策。一份由高层公务员在工党胜选后起草、旨在界定“共同意见”（communis opinio）的文件，明确主张绅士化“有必要被强化”（Uitermark et al., 2007, 第129页）。</p><span class=\"attrib\">Uitermark 等（2007）原话，经 Lees 转引——Lees&lt;strong&gt;认同并借用&lt;/strong&gt;此论断，作为荷兰案例部分最尖锐的证据：连原本被认为更倾向社会保护的工党，也在明确主张“强化”绅士化，这直接支撑她“社会混合话语掩藏绅士化策略”的核心论点。</span></div><div class=\"para\" data-idx=\"52\" data-doc=\"lees-2008-social-mixing\" data-nid=\"26c126322e\"><p class=\"en\">There have been a number of studies of social interaction in these restructured Dutch neighbourhoods and these have found that the social networks amongst neighbours tend to be socially segregated, especially in terms of socioeconomic status and ethnicity. Uitermark et al. (2007) are clear that an influx of middle-class residents into a disadvantaged neighbourhood does not increase social cohesion, rather the contacts between low-income and higher-income households tend to be superficial at best and downright hostile at worst (for comparison of some successes and failures, see Aalbers, 2006, on the Bijlmermeer on the outskirts of Amsterdam).</p><p class=\"zh\">已有多项研究考察了这些经过重构的荷兰街区中的社会互动，结果发现，邻里之间的社会网络仍然趋于社会性隔离，尤其是在社会经济地位与族裔这两个维度上。Uitermark 等人（2007）明确指出：中产阶级居民涌入弱势街区，<strong>并不会</strong>提升社会凝聚力；相反，低收入与高收入家庭之间的接触，往好里说也不过是浮于表面，往坏里说则是彻头彻尾的敌意（关于成败对照的案例，见 Aalbers, 2006 论阿姆斯特丹郊区的贝尔美尔〔Bijlmermeer〕）。</p></div><h2 class=\"sec\" data-secidx=\"53\"><span class=\"en\">Gentrification and Social Mixing: A Critique</span><span class=\"zh\">绅士化与社会混合：一种批判</span></h2><div class=\"para quote\" data-idx=\"54\" data-doc=\"lees-2008-social-mixing\" data-nid=\"e146f79cb4\"><p class=\"en\">As of yet ... there is little systematic evidence that gentrification actually leads to greater levels of social mix at the neighbourhood scale. Indeed, it is not even apparent that social mix can achieve the goals hoped of it ... Moreover, it is not clear exactly what kind of ‘mix’ is most desirable, or what sort of mix matters most in producing the expected positive outcomes ... (Walks and Maaranen, 2008, p. 294).</p><p class=\"zh\">迄今为止⋯⋯几乎没有系统性证据表明，绅士化真的会在街区尺度上带来更高程度的社会混合。事实上，就连社会混合能否达成人们对它所寄予的目标，也远非显而易见⋯⋯此外，究竟哪一种“混合”最为理想，或者哪一种混合对于产生预期中的正面结果最为关键，也并不清楚⋯⋯（Walks and Maaranen, 2008, 第294页）。</p><span class=\"attrib\">Walks and Maaranen (2008) 原话，经 Lees 转引，置于本节标题之下作为提要式引文——Lees&lt;strong&gt;认同并借用&lt;/strong&gt;此论断，作为她即将展开的六条批判的总纲，代表她本人接下来要系统论证的立场，不是被反驳的对象。</span></div><div class=\"para\" data-idx=\"55\" data-doc=\"lees-2008-social-mixing\" data-nid=\"d1859d385e\"><p class=\"en\">Conceptually, policy claims about the causal links between more socially mixed communities, increased social mixing, the development of social capital and cohesion, and decreased social exclusion and deprivation, have been criticised as something of an “analytical sack of potatoes” (Fine, 2001, p. 190; see also Kearns, 2003). Randolph and Wood (2003) note there has been only limited research into the causes and consequences of social mixing, and most of that has been on public housing estates (see for example, Cole and Shayer, 1998; Atkinson and Kintrea, 2000). By way of contrast, Butler with Robson (2003) suggest that higher levels of social mixing, and thus conceivably also of social capital and cohesion, are more likely to be achieved in socially homogeneous, rather than socially mixed, areas. Moreover, researchers have cautioned against the artificial imposition of social mixing at too fine a spatial scale. At too local a scale, it can create tensions—especially when there are marked economic, social and cultural differences between residents—and residents may withdraw rather than mix (Rose, 2004, p. 281). All this suggests that Randolph and Wood (2003, p. 40) are correct in claiming that there is a “weak evidence base for the principles upon which social mix policies are based”.</p><p class=\"zh\">在概念层面上，关于“社会混合程度更高的社区、社会混合的增加、社会资本与凝聚力的发展，以及社会排斥与贫困剥夺的减少”这几者之间因果关联的政策主张，已被批评为某种“分析上的一麻袋土豆”（analytical sack of potatoes，Fine, 2001, 第190页；另见 Kearns, 2003）——意即各种因素被随意堆在一起，却缺乏严谨的因果论证。Randolph and Wood（2003）指出，关于社会混合成因与后果的研究其实相当有限，且大多集中在公共住房社区（例见 Cole and Shayer, 1998；Atkinson and Kintrea, 2000）。与此形成对照的是，Butler with Robson（2003）提出，更高程度的社会混合——从而或许也包括更高的社会资本与凝聚力——<strong>更可能</strong>在社会同质、而非社会混合的地区实现。此外，研究者们也曾提醒，不应在过于细小的空间尺度上人为地推行社会混合。在过于局部的尺度上，这样做可能引发紧张关系——尤其是当居民之间存在明显的经济、社会与文化差异时——居民很可能选择退避，而非混合（Rose, 2004, 第281页）。凡此种种都表明，Randolph and Wood（2003，第40页）的主张是对的：社会混合政策所依据的那些原则，其“证据基础相当薄弱”。</p></div><div class=\"para\" data-idx=\"56\" data-doc=\"lees-2008-social-mixing\" data-nid=\"84e8e10f57\"><p class=\"en\">However, much of the policy literature supports the types of tenure dilutions via gentrification and the construction of market housing in low-income areas outlined in the discussions earlier, in the hopes of creating more socially heterogeneous and balanced neighbourhoods (Kearns and Mason, 2007). Tunstall and Fenton (2006), for example, who claim to bring together the best UK research to date on the subject (p. 2), conclude that although there are some gaps in knowledge “the most common rationales for mixed communities remain valid” (p. 3). By way of contrast, geographers reviewing social mix policies have concluded that there is a lack of real evidence to support them. Doherty et al. (2006, p. 60), for example, who undertook a large quantitative study using data from the UK census and the Scottish longitudinal study, were forced to “conclude that the policy of deliberately mixing tenures in housing developments in order to improve social well-being remains largely unsupported by the research evidence so far available”. In addition, Cheshire (2007) offers a sceptical view about the possibility of securing social mixing at the neighbourhood level. Moreover, in recent years, as I indicate in the earlier sections, the idea of social mixing has begun to be subjected to some important academic criticism from those researching gentrification. In this substantive section of the paper, I draw on that body of work and on the wider, critical literature on social mixing, to develop six somewhat interrelated critiques of social mixing policy.</p><p class=\"zh\">然而，大量政策文献仍然支持前文所述那类做法——通过绅士化稀释业权结构、在低收入地区建设市场化住房，寄望于由此营造出社会异质性更高、也更均衡的街区（Kearns and Mason, 2007）。例如 Tunstall and Fenton（2006）自称汇集了迄今为止英国在这一课题上最好的研究（第2页），得出的结论是：尽管知识上仍有一些空白，“混合社区最常见的那些理据依然是站得住的”（第3页）。与此相对，审视社会混合政策的地理学者们，得出的结论却是：支持这些政策的真实证据相当匮乏。例如 Doherty 等人（2006，第60页）利用英国人口普查数据与苏格兰纵向研究数据展开的大型定量研究，最终不得不“得出这样的结论：在住房开发项目中蓄意混合业权、以求改善社会福祉的这项政策，迄今为止的研究证据在很大程度上仍无法为其提供支持”。此外，<a class=\"gref\" href=\"#g-cheshire\">Cheshire</a>（2007）对能否在街区层面真正实现社会混合，也持怀疑态度。而且，正如我在前面几节中所指出的，近年来，社会混合这一理念，已开始受到来自绅士化研究者的一些重要学术批评。在本文这一实质性章节中，我将汇集这批研究成果，以及更广泛的、对社会混合持批判态度的文献，展开六条彼此有所关联的、针对社会混合政策的批判。</p></div><h2 class=\"sec\" data-secidx=\"57\"><span class=\"en\">Critique 1 — Gentrification Causes Overwhelmingly Negative Effects</span><span class=\"zh\">批判之一 —— 绅士化导致压倒性的负面效应</span></h2><div class=\"para\" data-idx=\"58\" data-doc=\"lees-2008-social-mixing\" data-nid=\"40b40a75e1\"><p class=\"en\">Social mixing is being promoted through gentrification in the face of evidence that gentrification leads to social segregation, social polarisation and displacement. The movement of middle-income groups into low-income areas creates overwhelmingly negative effects, the most significant of which is the displacement of low-income groups (Atkinson, 2004). Far from being tolerant, gentrification is part of an aggressive, revanchist ideology designed to retake the inner city for the middle classes (Smith, 1996). There are long-standing claims, mostly from the US, that gentrification leads to displacement and socio-spatial segregation, rather than alleviating social segregation, as working-class and minority residents are steadily priced out of gentrified areas (for example, Marcuse, 1986; Smith, 1996; Wyly and Hammel, 2004). In the UK, Lyons (1996) and Atkinson (2000) both used the longitudinal survey and found evidence suggesting gentrification-induced displacement in London. Davidson and Lees (2005) also found evidence of gentrification-induced displacement in riverside wards along the Thames that had experienced new-build gentrification. The spatially based mechanisms designed to increase social mixing—such as reduced spatial segregation, better urban design and compact cities (the exact policy ingredients in the case of new-build gentrification along the Thames)—have been ineffective in increasing social mixing at the neighbourhood/community level.</p><p class=\"zh\">尽管已有证据表明，绅士化会导致社会隔离、社会两极化与置换，但社会混合仍在通过绅士化被大力推广。中等收入群体迁入低收入地区，会产生压倒性的负面效应，其中最重大的一项，就是低收入群体的<strong>置换</strong>（displacement）（Atkinson, 2004）。绅士化远非宽容之举，而是一种旨在为中产阶级重新夺回内城的、带有攻击性的<a class=\"gref\" href=\"#g-revanchist\">复仇主义</a>（revanchist）意识形态的一部分（Smith, 1996）。长期以来，一直有说法（大多来自美国）指出，绅士化导致的是置换与社会空间隔离，而非缓解社会隔离，因为工人阶级与少数族裔居民正被持续地从绅士化地区的高房价中挤出（例如 Marcuse, 1986；Smith, 1996；Wyly and Hammel, 2004）。在英国，Lyons（1996）与 Atkinson（2000）都利用纵向调查数据，找到了伦敦存在绅士化驱动型置换的证据。Davidson and Lees（2005）同样在经历过新建式绅士化的泰晤士河沿岸各选区，找到了绅士化驱动型置换的证据。那些旨在增加社会混合的空间性机制——例如减少空间隔离、改善城市设计、建设紧凑城市（这些正是泰晤士河沿岸新建式绅士化案例中所采用的确切政策要素）——在街区／社区层面增加社会混合方面，被证明是<strong>无效的</strong>。</p></div><div class=\"para\" data-idx=\"59\" data-doc=\"lees-2008-social-mixing\" data-nid=\"32b9ad8cbf\"><p class=\"en\">As Williams and Smith argued some time ago now</p><p class=\"zh\">正如 Williams 与 Smith 在相当早以前就已论及：</p></div><div class=\"para quote\" data-idx=\"60\" data-doc=\"lees-2008-social-mixing\" data-nid=\"99ac04bb61\"><p class=\"en\">It is often argued that the benefits of gentrification are far greater than the costs (Schill and Nathan, 1983). Whether this is true is doubtful, but more important it is beside the point. The benefits and costs are so unevenly distributed that one has to look not at some overall equation but at different segments of the population. There are distinct losers as well as winners, and the consistent losers are the poor and the working class who will be displaced as gentrification proceeds, and who will confront higher housing costs in tight markets (Williams and Smith, 1986, p. 220).</p><p class=\"zh\">人们常常主张，绅士化带来的好处远大于其代价（Schill and Nathan, 1983）。这一说法是否属实，值得怀疑，但更重要的是，这其实并非重点所在。好处与代价的分布如此不均，以至于我们不能只看某种总体上的收支方程，而必须分别考察人口中的不同群体。这里面确实存在明确的输家与赢家，而始终扮演输家角色的，是那些会随着绅士化推进而被置换、并将在紧俏的市场中面对更高住房成本的穷人与工人阶级（Williams and Smith, 1986, 第220页）。</p><span class=\"attrib\">Williams and Smith (1986) 原话，经 Lees 转引——Lees&lt;strong&gt;认同并借用&lt;/strong&gt;此论断，以支撑她本段“绅士化产生压倒性负面效应”的核心主张。</span></div><div class=\"para\" data-idx=\"61\" data-doc=\"lees-2008-social-mixing\" data-nid=\"fcc40c2c47\"><p class=\"en\">Slater (2004) has shown that Canadian policies of social mixing have had such negative consequences, for in South Parkdale, Toronto, where a deliberate policy of social mixing was initiated in 1999, the fall-out was homeowner NIMBYism, significant rent increases and tenant displacement.</p><p class=\"zh\">Slater（2004）已经证明，加拿大的社会混合政策同样带来过这类负面后果：在多伦多的南帕克代尔（South Parkdale），1999年启动的一项刻意推行的社会混合政策，其后果是自有房主的“<a class=\"gref\" href=\"#g-nimby\">邻避主义</a>”（NIMBYism）、显著的租金上涨，以及租户置换。</p></div><div class=\"para\" data-idx=\"62\" data-doc=\"lees-2008-social-mixing\" data-nid=\"2e8431b96d\"><p class=\"en\">Walks and Maaranen (2008) have investigated the relationship between the timing of gentrification, changes in income structure and shifts in immigrant concentration and ethnic diversity in Toronto, Montreal and Vancouver from 1971 to 2001. They concluded that gentrification in these cities was followed by declining, rather than improving, levels of social mix, ethnic diversity and immigrant concentration within affected neighbourhoods. Indeed, gentrification was implicated in a growth in neighbourhood polarisation and inequality: “the more that gentrification has progressed in a neighbourhood, the greater the reduction in levels of social mix, and the less ‘mixed’ the local social structure in 2001” (pp. 319–320). Importantly, gentrification was also found to have a deleterious impact on the immigrant-reception function of inner-city neighbourhoods. They are very clear about the implications of this for policy</p><p class=\"zh\">Walks and Maaranen（2008）考察了1971年至2001年间，多伦多、蒙特利尔与温哥华三地绅士化发生的时间、收入结构的变化，以及移民集聚程度与族裔多样性变化之间的关系。他们的结论是：在这些城市中，绅士化之后跟随而来的，是受影响街区社会混合、族裔多样性与移民集聚程度的<strong>下降</strong>，而非改善。事实上，绅士化被牵涉进了街区两极化与不平等程度的加剧之中：“一个街区的绅士化推进得越深入，其社会混合程度的下降幅度就越大，其2001年时的本地社会结构也就越不“混合”（第319–320页）。重要的是，研究还发现，绅士化对内城街区接纳移民的功能，同样产生了不利影响。他们对这一发现在政策上的含义说得非常明确：</p></div><div class=\"para quote\" data-idx=\"63\" data-doc=\"lees-2008-social-mixing\" data-nid=\"6054730ed7\"><p class=\"en\">Contrary to the assumptions linking gentrification to social mix, these results suggest that if allowed to run its course, gentrification is likely to reduce neighbourhood levels of social mix and ethnic diversity...the lesson for policy-makers is that if they want to intervene to ensure proportionate levels of social mix and retain a more balanced social structure, they should be aiming to limit, rather than promote, gentrification (Walks and Maaranen, 2008, p. 320; original emphasis).</p><p class=\"zh\">与那些把绅士化和社会混合关联起来的种种预设相反，本研究的结果表明：如果任由绅士化自行发展，它很可能会<strong>降低</strong>街区层面的社会混合与族裔多样性程度⋯⋯给政策制定者的启示是：如果他们真的希望通过干预来确保比例适当的社会混合、并维持一个更均衡的社会结构，他们所应致力的方向，应当是<strong>限制</strong>、而非<strong>促进</strong>绅士化（Walks and Maaranen, 2008, 第320页；原文着重）。</p><span class=\"attrib\">Walks and Maaranen (2008) 原话，经 Lees 转引——Lees&lt;strong&gt;认同并借用&lt;/strong&gt;此论断，作为“批判之一”的收束性证据与政策启示，与她本人立场完全一致。</span></div><h2 class=\"sec\" data-secidx=\"64\"><span class=\"en\">Critique 2 — Gentrification does not engender social mixing</span><span class=\"zh\">批判之二 —— 绅士化并不会催生社会混合</span></h2><div class=\"para\" data-idx=\"65\" data-doc=\"lees-2008-social-mixing\" data-nid=\"c0136d8687\"><p class=\"en\">Work which has been sceptical about the voyeuristic and appropriative relationship of gentrification to difference by authors such as May (1996) and Merrifield (2000) has been given new impetus by recent empirical research into the social interactions of actual gentrifiers. The middle-class gentrifiers interviewed by Butler (1997), Butler and Robson (2001) and Butler with Robson (2003), engaged in little social mixing with local low-income groups. Social interaction was greatest in areas where other groups had been largely pushed aside and, where they had not, gentrification tended to result in ‘tectonic’ juxtapositions of polarised socio-economic groups rather than in socially cohesive communities. Butler (1997) found that Hackney’s gentrifiers sought out people with similar cultural and political values, ones attuned to what inner-city living had to offer, such as social and cultural diversity. His interviewees had similar pro-social-mixing views to the pioneer gentrifiers in Barnsbury quoted at the beginning of this paper. As one of his interviewees said</p><p class=\"zh\">May（1996）、Merrifield（2000）等作者曾对绅士化与差异之间那种<strong>窥视性、攫取性</strong>的关系持怀疑态度，而近来关于实际绅士化者社会互动的经验研究，为这批怀疑性研究注入了新的动力。<a class=\"gref\" href=\"#g-butler\">Butler</a>（1997）、Butler and Robson（2001）以及 Butler with Robson（2003）所访谈的中产阶级绅士化者，与本地低收入群体之间几乎<strong>没有</strong>发生社会混合。社会互动最活跃的地区，恰恰是其他群体已被大量排挤出去的地区；而在尚未被排挤出去的地区，绅士化往往造就的是两极化社会经济群体之间“板块构造”式（tectonic）的并置，而非具有社会凝聚力的社区。Butler（1997）发现，哈克尼（Hackney）的绅士化者们寻找的是与自己文化与政治价值观相近的人——那些懂得欣赏内城生活所能提供之物（例如社会与文化多样性）的人。他的受访者所持的亲社会混合观点，与本文开篇所引述的巴恩斯伯里先锋型绅士化者颇为相似。正如他的一位受访者所说：</p></div><div class=\"para quote\" data-idx=\"66\" data-doc=\"lees-2008-social-mixing\" data-nid=\"1137b7e74a\"><p class=\"en\">There’s a great social mix here, we’ve got an orthodox Jewish family that side, an English family two doors down who have become great mates. We’ve got a Black family this side who we are very friendly with and an Anglo-French family the other side up there, a New Zealander over there and there’s no tension at all in the street. ... I don’t like to be set in an enclave of all middle class or all anything because I think that as soon as you get all anything the same frictions start, you get the ‘one upmanships’, the silly, petty ‘I have got to be better than the next door’ (Butler, 1997, p. 117).</p><p class=\"zh\">这里的社会混合程度很高，那边住着一户正统犹太家庭，往下两户是一户英国家庭，我们已经成了很要好的朋友。这边住着一户黑人家庭，我们相处得很融洽，那边上面还有一户英法混合家庭，那边还有个新西兰人，街上一点紧张气氛都没有。⋯⋯我不喜欢被困在一个全是中产阶级、或全是随便什么单一群体的飞地里，因为我觉得只要什么东西变得清一色，同样的摩擦就会开始出现，你就会看到那种“互相攀比”、那种琐碎小气的“我一定要比隔壁强”（Butler, 1997, 第117页）。</p><span class=\"attrib\">受访者原话，经 Butler (1997) 记录、Lees 转引——这是 Butler 研究中一位绅士化者&lt;strong&gt;本人的亲身表述&lt;/strong&gt;，代表这位受访者自己乐观的亲社会混合立场；紧接着下一段 Lees／Butler 就指出这与该受访者群体实际行为之间存在矛盾——因此这段引文不能被当作 Lees 本人对社会混合现实的判断，而是她随后要用来对照、质疑的&lt;strong&gt;第一手证词&lt;/strong&gt;。</span></div><div class=\"para\" data-idx=\"67\" data-doc=\"lees-2008-social-mixing\" data-nid=\"13ea81c2e5\"><p class=\"en\">Yet Butler points to some interesting contradictions. He argues that “there appears to be an increasing tendency towards spatial segmentation within the middle class both occupationally and residentially” (Butler, 1997, p.161). So, despite the Hackney ‘new’ middle classes’ desire for diversity and difference, they tended to self-segregate. Notions of diversity were more in the minds of these gentrifiers, rather than in their actions, reflecting one way in which they defined themselves as a specific class fraction and, in particular, as cosmopolitan citizens (Butler and Robson, 2001). This has resonances with Irving Allen’s (1984, p. 38) perceptive argument that “The willingness of the new urbanites to live cheek by jowl with low-status communities may testify to the apartness that some feel from those communities”.</p><p class=\"zh\">然而，Butler 也指出了一些颇有意思的矛盾之处。他主张，“中产阶级内部，无论在职业上还是居住上，似乎都呈现出一种日益增强的空间分割化趋势”（Butler, 1997, 第161页）。也就是说，尽管哈克尼的“新”中产阶级渴望多样性与差异，他们实际上却倾向于<strong>自我隔离</strong>。多样性的观念，更多存在于这些绅士化者的头脑之中，而非他们的实际行动之中——这反映出他们借以将自己界定为一个特定阶级分支、尤其是界定为世界主义公民（cosmopolitan citizens）身份的一种方式（Butler and Robson, 2001）。这与 Irving Allen（1984，第38页）颇具洞察力的论断相呼应：“新都市人愿意与地位低下的社区比邻而居，这一意愿本身，或许恰恰证明了他们当中有些人对这些社区所抱持的<strong>疏离感</strong>”。</p></div><div class=\"para\" data-idx=\"68\" data-doc=\"lees-2008-social-mixing\" data-nid=\"81e7d04973\"><p class=\"en\">In later research, Butler and Robson (2001) and Butler with Robson (2003) supported these earlier findings about social interaction and found that middle-class gentrifiers tended to associate with other middle-class people in their neighbourhood, primarily through their children. They were clear: “There is little evidence of numbers of cross class friendships” (Butler with Robson, 2003, p. 127). The data on the children of gentrifiers and their social networks were the most telling: “There was no evidence that the children played outside these middle-class networks and our fieldwork strongly suggests that the middle-class pre-school clubs were, and remain, highly exclusionary of non-middle-class children” (Butler with Robson, 2003, p. 128). Gentrification-induced social mix did not then engender social mixing for either adults or children.</p><p class=\"zh\">在后续研究中，Butler and Robson（2001）与 Butler with Robson（2003）证实了此前关于社会互动的这些发现，并发现中产阶级绅士化者在自己的街区中，倾向于只与其他中产阶级人士来往，而这种来往又主要是通过他们的<strong>孩子</strong>发生的。他们说得很明确：“几乎没有证据表明存在数量可观的跨阶级友谊”（Butler with Robson, 2003, 第127页）。而关于绅士化者子女及其社会网络的数据最能说明问题：“没有证据显示这些孩子会在这些中产阶级网络之外玩耍，我们的田野调查有力地表明，中产阶级的学前俱乐部过去是、现在依然是高度排斥非中产阶级儿童的”（Butler with Robson, 2003, 第128页）。可见，绅士化所带来的社会混合，无论对成年人还是对儿童而言，都<strong>没有</strong>催生出真正的社会混合。</p></div><div class=\"para\" data-idx=\"69\" data-doc=\"lees-2008-social-mixing\" data-nid=\"d77ff45a08\"><p class=\"en\">With their focus on middle-class reproduction, Butler and Robson did not consider the experiences of non-gentrifiers; nevertheless, their findings raise important questions about the role of gentrification in fostering an inclusive urban renaissance. Yet once you include the experiences of non-gentrifiers, the inadequacies of arguments about the influence of residence on class relations in gentrifying neighbourhoods become apparent (see Bridge, 1994; also Freeman, 2006). Davidson (under review) surveyed and interviewed both gentrifiers and non-gentrifiers and found little evidence of social interaction between the residents in the newly built middle-income developments along the Thames and the lower-income residents living in the adjacent neighbourhoods. There was no transference of social capital from high- to low-income groups nor any of the other desired outcomes from the introduction of a middle-class population into these central-city riverside locations. In part this was due to the transitory nature of the new-build residents and in part it was due to the spatially segregated nature of the new-build developments with respect to the adjacent low-income communities. As Davidson argues</p><p class=\"zh\">由于聚焦于中产阶级的自我再生产，Butler and Robson 并未考察非绅士化者的经验；然而，他们的发现依然对绅士化在促成包容性城市复兴中所能扮演的角色，提出了重要的质疑。但一旦把非绅士化者的经验也纳入考量，那些关于“居住在一起会影响绅士化街区阶级关系”的论证，其不足之处便暴露出来（见 Bridge, 1994；另见 Freeman, 2006）。Davidson（审稿中）对绅士化者与非绅士化者都做了问卷调查与访谈，发现在泰晤士河沿岸新建的中等收入开发项目居民，与毗邻街区中的低收入居民之间，几乎没有社会互动的证据。既没有出现社会资本从高收入群体向低收入群体的传递，也没有出现把中产阶级人口引入这些中心城区滨河地段后本应期待出现的其他任何结果。这一部分是由于新建住宅居民本身具有<strong>流动性、暂居性</strong>，一部分则是由于这些新建开发项目相对于毗邻低收入社区而言，在空间上本就是隔离的。正如 Davidson 所论：</p></div><div class=\"para quote\" data-idx=\"70\" data-doc=\"lees-2008-social-mixing\" data-nid=\"3828a6685a\"><p class=\"en\">the lifeworlds of the two populations rarely intersect. [They] did not work in the same places or use the same means of transport. They did not frequent the same restaurants or public houses. They had different household structures. They had different expectations and aspirations about community and mixing (Davidson, under review).</p><p class=\"zh\">两类人口的生活世界几乎不曾交集。〔他们〕不在同样的地方工作，不使用同样的交通方式，不光顾同样的餐馆或酒吧，家庭结构也不相同，对于“社区”与“混合”，他们所抱持的期待与愿望也各不相同（Davidson，审稿中）。</p><span class=\"attrib\">Davidson（审稿中）原话，经 Lees 转引——Davidson 是 Lees 的长期合作者，此处代表&lt;strong&gt;与 Lees 立场一致&lt;/strong&gt;的经验研究发现，是她本人认同、并当作证据链一部分加以援引的结论。</span></div><div class=\"para\" data-idx=\"71\" data-doc=\"lees-2008-social-mixing\" data-nid=\"3f310c9f12\"><p class=\"en\">Freeman (2006) investigated the impact of gentrification on the indigenous residents in two Black gentrifying neighbourhoods, Harlem and Clinton Hill in New York City. Like Davidson (under review), he consulted both gentrifiers and non-gentrifiers living in the same neighbourhood. He concludes</p><p class=\"zh\"><a class=\"gref\" href=\"#g-freeman\">Freeman</a>（2006）考察了绅士化对纽约市哈莱姆（Harlem）与克林顿山（Clinton Hill）——两个正经历绅士化的黑人街区——原住居民的影响。与 Davidson（审稿中）一样，他也同时调查了居住在同一街区的绅士化者与非绅士化者。他的结论是：</p></div><div class=\"para quote\" data-idx=\"72\" data-doc=\"lees-2008-social-mixing\" data-nid=\"ef2b729575\"><p class=\"en\">This book shows that the gentry do indeed hold forth the promise to bring benefits to the indigenous residents, but in ways more limited than the poverty deconcentration thesis would suggest. In addition, the income mixing concomitant with gentrification is no guarantee for upward mobility (Freeman, 2006, p. 2).</p><p class=\"zh\">本书表明，绅士阶层的确带来了会为原住居民带来好处的<strong>承诺</strong>，但其实现方式，远比“贫困去集中化”命题所设想的要有限得多。此外，伴随绅士化而来的收入混合，并不能保证向上流动（Freeman, 2006, 第2页）。</p><span class=\"attrib\">Freeman (2006) 原话，经 Lees 转引——Freeman 本人研究结论，Lees 认同并借用，作为支撑其批判立场的经验证据之一。</span></div><div class=\"para\" data-idx=\"73\" data-doc=\"lees-2008-social-mixing\" data-nid=\"5418e8acd6\"><p class=\"en\">In his ethnography of the localised relationships between the incoming gentry and the long-term residents in the two neighbourhoods, he found that social ties rarely crossed class and racial lines, that the social networks in the neighbourhoods seemed impervious to the changes taking place around them and that there were clashes between the norms of gentrifiers and those of the longer-term residents. Like Davidson (under review), Freeman (2006) found that the gentry and the long-term residents moved in different spaces, as this commentary (in reference to a new restaurant) from a long-term resident of Harlem (in his 50s and living in a public housing project) captures</p><p class=\"zh\">在对这两个街区中新迁入的绅士阶层与长期居民之间在地关系的民族志研究中，他发现，社会纽带很少能跨越阶级与种族界线；街区中的社会网络似乎对周遭正在发生的变化“免疫”；绅士化者的行为规范与长期居民的行为规范之间，也存在冲突。与 Davidson（审稿中）一样，Freeman（2006）发现，绅士阶层与长期居民各自活动在不同的空间里——一位哈莱姆的长期居民（五十多岁，住在公共住房项目中）针对一家新开餐厅所说的这番话，恰好捕捉到了这一点：</p></div><div class=\"para quote\" data-idx=\"74\" data-doc=\"lees-2008-social-mixing\" data-nid=\"b68a00b16c\"><p class=\"en\">We don’t eat there. I went in there for a piece of cake and it was like four bucks! I can get a whole cake for four bucks. Obviously they don’t want too many of us in there (Freeman, 2006, p. 64).</p><p class=\"zh\">我们不在那儿吃。我进去买过一块蛋糕，居然要四块钱！四块钱我都能买一整个蛋糕了。显然他们不想让太多像我们这样的人进去（Freeman, 2006, 第64页）。</p><span class=\"attrib\">哈莱姆长期居民原话，经 Freeman (2006) 记录、Lees 转引——这是原住居民本人的第一手证词，用以印证前一句“绅士阶层与长期居民各自活动在不同空间”的判断，不是 Lees 或 Freeman 本人的分析性表述，而是被援引作为经验佐证的当事人声音。</span></div><div class=\"para\" data-idx=\"75\" data-doc=\"lees-2008-social-mixing\" data-nid=\"2179f5b3b6\"><p class=\"en\">Like Rose (2004), he also found that the incoming gentry and the long-term residents were fairly ambivalent about social diversity—few spoke in overall positive or negative tones about it. And the two groups did not interact, as this interview with two indigenous residents reveals</p><p class=\"zh\">与 Rose（2004）的发现类似，他也发现，新迁入的绅士阶层与长期居民，对社会多样性其实都相当<strong>矛盾</strong>——很少有人以整体正面或整体负面的口吻谈论它。而这两个群体之间并没有真正发生互动，下面这段对两位原住居民的访谈便揭示了这一点：</p></div><div class=\"para quote\" data-idx=\"76\" data-doc=\"lees-2008-social-mixing\" data-nid=\"ebacaad3bd\"><p class=\"en\">Lance: Do you see in general how they [the gentry] interact with the rest of the community or—? Ms Tate: Well, they don’t. You know, they just whatever, might walk by, and, and, and the people that are moving in here are younger people. When I say younger they might be in their late twenties, early thirties, in that range. Not much interaction at all. You know, you might see one ‘hi’, walk by, that’s it, but it’s no real communication going on (Freeman, 2006, pp. 131–132).</p><p class=\"zh\">Lance：你觉得一般来说，他们〔绅士阶层〕是怎么跟社区里其他人互动的，或者——？\nMs Tate：呃，他们根本不互动。你知道的，他们就那样，可能就是走过去而已，而且，而且，搬进来的都是些年轻人。我说的年轻，大概是二十七八到三十出头那个年纪段。基本上没什么互动。你知道吧，可能就打个招呼‘嗨’，然后走过去，就这样，没有真正的交流（Freeman, 2006, 第131–132页）。</p><span class=\"attrib\">两位哈莱姆原住居民（Lance 与 Ms Tate）访谈原话，经 Freeman (2006) 记录、Lees 转引——原住居民本人的第一手证词，用以具体印证“两个群体并未互动”的判断，代表当事人视角，不是 Lees 本人的概括性论断。</span></div><div class=\"para\" data-idx=\"77\" data-doc=\"lees-2008-social-mixing\" data-nid=\"b446023a2c\"><p class=\"en\">Rose (2004) undertook empirical research into gentrification and social mixing in downtown Montreal. She focused, in similar vein to Butler (1997), on the actual experiences of diversity drawn out in interviews with gentrifiers, but unlike Butler she focused on areas that had been deliberately socially mixed by municipal programmes designed to repopulate the central city in Montreal. The gentrifiers who had moved into the infill condominiums adjacent to social housing were asked questions about social diversity and about living next to social housing. Rose found a relatively large selection of viewpoints “running the gamut from ‘egalitarian’ through ‘tolerant’ to ‘NIMBY’, as well as ‘ignorant/indifferent’” (Rose, 2004, p. 300). Overall her findings were ambivalent.</p><p class=\"zh\"><a class=\"gref\" href=\"#g-rose\">Rose</a>（2004）针对蒙特利尔市中心的绅士化与社会混合，开展了经验研究。与 Butler（1997）类似，她聚焦于通过访谈绅士化者所呈现出的多样性的真实体验；但与 Butler 不同的是，她所聚焦的地区，是蒙特利尔市政当局为重新填充中心城区人口、而<strong>刻意</strong>实施社会混合的地区。研究者向那些迁入毗邻社会住房的填充式公寓（infill condominiums）的绅士化者，询问了有关社会多样性、以及与社会住房比邻而居的问题。Rose 发现，受访者的观点分布相当广泛，“从‘平等主义’，经由‘容忍’，一路延伸到‘邻避主义’（NIMBY），乃至‘无知／冷漠’”（Rose, 2004, 第300页）。总体而言，她的研究发现是<strong>矛盾、暧昧</strong>的。</p></div><div class=\"para\" data-idx=\"78\" data-doc=\"lees-2008-social-mixing\" data-nid=\"7ac404c56b\"><p class=\"en\">It seems then that it is not realistic to assume that people from different social class backgrounds or income bands living cheek-by-jowl will actually mix, let alone integrate. The evidence from the gentrification literature then tallies with Cole and Shayer’s (1998) research which has shown that a greater amount of neighbourhood social diversity does not correlate with increased interaction between different social groups within neighbourhoods. Indeed, some authors have pointed out that socially mixed communities are just as likely to engender social conflict as social harmony, due to the clash of different cultures, classes and socioeconomic groups (Goodchild and Cole, 2001). Freeman (2006) found conflict between the gentrifiers and the more established residents, and resentment stemming from feelings of irrelevance that the neighbourhood improvements were not being made for them. As Atkinson (2006, pp. 829–830) argues, “If diversity is to be encouraged, it may be possible only through a vision of a vibrant city, rather than an enforced social blend at the neighbourhood scale”. As Galster says</p><p class=\"zh\">由此看来，认为不同社会阶级背景或收入层级的人群比邻而居就会真正实现混合、更遑论融合，这一设想并不现实。绅士化文献所提供的证据，与 Cole and Shayer（1998）的研究结论相吻合：更高程度的街区社会多样性，与街区内不同社会群体之间互动的增加，<strong>并不相关</strong>。事实上，已有作者指出，由于不同文化、阶级与社会经济群体之间的碰撞，社会混合社区催生社会冲突的可能性，并不亚于催生社会和谐的可能性（Goodchild and Cole, 2001）。Freeman（2006）发现绅士化者与更早定居的居民之间存在冲突，以及一种源自“街区改善并非为自己而做”这种被忽视感的怨愤。正如 <a class=\"gref\" href=\"#g-atkinson\">Atkinson</a>（2006，第829–830页）所论，“如果要鼓励多样性，或许唯有通过对一座充满活力之城的愿景才能实现，而非在街区尺度上强行推行一种社会调和”。正如 Galster 所言：</p></div><div class=\"para quote\" data-idx=\"79\" data-doc=\"lees-2008-social-mixing\" data-nid=\"c208ee2d0c\"><p class=\"en\">precisely how and why neighbourhoods matter must be unpacked carefully before one can leap to any policy implications regarding neighbourhood mixing (Galster, 2007, p. 35; original emphasis).</p><p class=\"zh\">在人们急于对街区混合得出任何政策含义之前，必须先仔细拆解清楚：街区究竟是<strong>如何</strong>、又是<strong>为何</strong>才具有重要性的（Galster, 2007, 第35页；原文着重）。</p><span class=\"attrib\">Galster (2007) 原话，经 Lees 转引——Lees&lt;strong&gt;认同并借用&lt;/strong&gt;此论断，作为“批判之二”的收束，呼应她本段的整体论证：社会互动不会因空间混合而自动发生。</span></div><h2 class=\"sec\" data-secidx=\"80\"><span class=\"en\">Critique 3 — Social Mixing is a One-sided Strategy that is Seldom Advocated in Wealthier Neighbourhoods</span><span class=\"zh\">批判之三 —— 社会混合是一种单方面的策略，鲜少被提倡用于更富裕的街区</span></h2><div class=\"para quote\" data-idx=\"81\" data-doc=\"lees-2008-social-mixing\" data-nid=\"9c7a8d16db\"><p class=\"en\">higher-income households have largely been absent from contemporary academic and public policy discussions about how to achieve a socially just or inclusive residential patterning, even though aspirations of social balance and diversity clearly pre-occupy a returning government’s urban agenda (Atkinson, 2006, pp. 819–820).</p><p class=\"zh\">高收入家庭，在当代学术界与公共政策界围绕“如何实现社会公正或包容性居住格局”所展开的讨论中，在很大程度上始终是<strong>缺席</strong>的——尽管社会平衡与多样性的种种诉求，显然一直萦绕在重新执政政府的城市议程之中（Atkinson, 2006, 第819–820页）。</p><span class=\"attrib\">Atkinson (2006) 原话，经 Lees 转引，置于本节标题之下——Lees&lt;strong&gt;认同并借用&lt;/strong&gt;此论断，作为“批判之三”的开篇论点，代表她本人接下来要展开的立场。</span></div><div class=\"para\" data-idx=\"82\" data-doc=\"lees-2008-social-mixing\" data-nid=\"92821a18e6\"><p class=\"en\">Social mixing is a one-sided strategy that is seldom advocated in wealthier neighbourhoods that may be just as socially homogeneous—for example, poor people are not being moved/attracted to middle-income suburbs (see Blomley, 2004). Saying that, it is probably worth stating that gentrifiers are “presumably more amenable than the suburban middle class to having the poor as neighbours” (Freeman, 2006, p. 206). On the rare occasions when poor people have been moved to wealthier neighbourhoods—for example, the pilot programme Moving to Opportunity (MTO) in the US—the social and economic mobility expected did not happen. The MTO programme was set up in 1992 to assist low-income families to move out of areas with high concentrations of poor people into areas with low concentrations of poor people. Like HOPE VI, it was premised on the notion that introducing the poor to the more affluent will be beneficial to the poor. It was set up as a pilot policy experiment in five US cities to test (or demonstrate) the benefits of achieving more mixed communities. However, as Atkinson (2005) argues, only ‘good’ tenants, who were likely to have better employment and educational performances anyway, were selected to take part in this experiment. Cheshire (2007, 2008) provides a useful summary of the findings, both in the short term and the long term. The policy was not a success, it did not bring the social and economic benefits claimed (such as increased economic and social mobility) and was not a cost-effective programme either (see Kling and Liebman, 2004; Kling et al., 2005, 2007). Katz et al. (2001) looked at the MTO programme in Boston and found no significant improvement in employment, earnings and welfare dependence. This evidence is important because, if poor people’s lives do not improve as a result of being moved into more affluent areas, it is unlikely to say the least that their lives would be improved by an influx of middle-income people into their neighbourhood.</p><p class=\"zh\">社会混合是一种<strong>单方面</strong>的策略：它很少被提倡用于那些可能同样在社会构成上高度同质的富裕街区——例如，穷人并没有被搬迁或吸引到中等收入的郊区（见 Blomley, 2004）。话虽如此，或许值得指出的是，绅士化者“大概比郊区中产阶级更能容忍以穷人为邻”（Freeman, 2006, 第206页）。而在少数几次穷人真的被搬迁到富裕街区的情形中——例如美国的试点项目“<a class=\"gref\" href=\"#g-mto\">流动机会计划</a>”（Moving to Opportunity，MTO）——人们所预期的社会与经济流动性，<strong>并未</strong>发生。MTO 项目设立于1992年，旨在协助低收入家庭从贫困高度集聚的地区迁往贫困集聚程度较低的地区。与“希望六号”计划一样，它的前提预设是：让穷人接触到更富裕的人群，将有利于穷人。它作为一项试点性政策实验，在美国五个城市展开，用以检验（或证明）实现更混合社区所能带来的好处。然而，正如 Atkinson（2005）所论，只有那些本身就更可能拥有较好就业与教育表现的“好”租户，才被选中参与这项实验。Cheshire（2007, 2008）对短期与长期的研究结果都做了有益的总结。这项政策<strong>并不成功</strong>：它既没有带来所宣称的社会与经济效益（例如经济与社会流动性的提升），本身也不是一个具有成本效益的项目（见 Kling and Liebman, 2004；Kling et al., 2005, 2007）。Katz 等人（2001）考察了波士顿的 MTO 项目，同样没有发现就业、收入与福利依赖程度方面有任何显著改善。这一证据之所以重要，是因为：如果穷人搬入更富裕地区之后，生活并未因此改善，那么，至少可以说，让中等收入人群涌入他们所在的街区，同样<strong>不太可能</strong>改善他们的生活。</p></div><h2 class=\"sec\" data-secidx=\"83\"><span class=\"en\">Critique 4 — Gentrification-induced Social Mix Threatens the Benefits Accrued from Social Segregation</span><span class=\"zh\">批判之四 —— 绅士化诱发的社会混合，威胁到了社会隔离本可积累的种种收益</span></h2><div class=\"para\" data-idx=\"84\" data-doc=\"lees-2008-social-mixing\" data-nid=\"be9b28de16\"><p class=\"en\">Gentrification research has shown that increased social mix within declining neighbourhoods can worsen the quality of life for existing residents (Smith, 1996; Atkinson, 2000). Moreover, gentrification-induced social mix threatens the welfare benefits and supportive networks that emerge from living in neighbourhoods with complementary and similar households (Cheshire, 2006). It destroys one kind of social capital to try and create another. Here, social mixing is seen to threaten the benefits accrued from social segregation. University of Chicago policy analyst John Betancur found that gentrification had indeed destroyed neighbourhood support networks and institutions in West Town, Chicago</p><p class=\"zh\">绅士化研究表明，在衰败街区中增加社会混合，反而可能<strong>恶化</strong>既
