<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Timeline of strategy changes at Waterloo South" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><rect width="1000" height="440" fill="#fcfcfb"/><text x="50" y="26" font-size="15" font-weight="600" fill="#0b0b0b">Waterloo South: changes in strategy, 2015 to 2026</text><line x1="50" x2="950" y1="220.0" y2="220.0" stroke="#8a8985" stroke-width="2"/><line x1="50.0" x2="50.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="50.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2015</text><line x1="125.0" x2="125.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="125.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2016</text><line x1="200.0" x2="200.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="200.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2017</text><line x1="275.0" x2="275.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="275.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2018</text><line x1="350.0" x2="350.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="350.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2019</text><line x1="425.0" x2="425.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="425.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2020</text><line x1="500.0" x2="500.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="500.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2021</text><line x1="575.0" x2="575.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="575.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2022</text><line x1="650.0" x2="650.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="650.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2023</text><line x1="725.0" x2="725.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="725.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2024</text><line x1="800.0" x2="800.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="800.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2025</text><line x1="875.0" x2="875.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="875.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2026</text><line x1="950.0" x2="950.0" y1="216.0" y2="224.0" stroke="#8a8985"/><text x="950.0" y="238.0" text-anchor="middle" font-size="11" fill="#52514e">2027</text><path d="M665.0000000000034 212.0 l6 8 l-6 8 l-6 -8 z" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"/><text x="653.0000000000034" y="190.0" text-anchor="end" font-size="11" fill="#52514e">Mar 2023:</text><text x="653.0000000000034" y="203.0" text-anchor="end" font-size="11" fill="#52514e">change of government</text><line x1="122.00000000000273" x2="122.00000000000273" y1="220.0" y2="134.0" stroke="#2a78d6" stroke-width="1.5"/><text x="122.00000000000273" y="70.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">Dec 2015</text><text x="122.00000000000273" y="86.0" text-anchor="middle" font-size="11.5" fill="#52514e">Renewal announced:</text><text x="122.00000000000273" y="100.0" text-anchor="middle" font-size="11.5" fill="#52514e">about 30% social,</text><text x="122.00000000000273" y="114.0" text-anchor="middle" font-size="11.5" fill="#52514e">70% private</text><circle cx="122.00000000000273" cy="220.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><line x1="416.0000000000082" x2="416.0000000000082" y1="246.0" y2="284.0" stroke="#2a78d6" stroke-width="1.5"/><text x="416.0000000000082" y="298.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">Nov 2019</text><text x="416.0000000000082" y="314.0" text-anchor="middle" font-size="11.5" fill="#52514e">Planning route moves</text><text x="416.0000000000082" y="328.0" text-anchor="middle" font-size="11.5" fill="#52514e">from state-led to</text><text x="416.0000000000082" y="342.0" text-anchor="middle" font-size="11.5" fill="#52514e">council-led</text><circle cx="416.0000000000082" cy="220.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><line x1="515.0000000000034" x2="515.0000000000034" y1="220.0" y2="120.0" stroke="#2a78d6" stroke-width="1.5"/><text x="515.0000000000034" y="70.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">Mar 2021</text><text x="515.0000000000034" y="86.0" text-anchor="middle" font-size="11.5" fill="#52514e">State takes over as</text><text x="515.0000000000034" y="100.0" text-anchor="middle" font-size="11.5" fill="#52514e">planning authority</text><circle cx="515.0000000000034" cy="220.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><line x1="640.2499999999918" x2="640.2499999999918" y1="246.0" y2="284.0" stroke="#2a78d6" stroke-width="1.5"/><text x="640.2499999999918" y="298.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">Nov 2022</text><text x="640.2499999999918" y="314.0" text-anchor="middle" font-size="11.5" fill="#52514e">Plan finalised:</text><text x="640.2499999999918" y="328.0" text-anchor="middle" font-size="11.5" fill="#52514e">3,012 dwellings,</text><text x="640.2499999999918" y="342.0" text-anchor="middle" font-size="11.5" fill="#52514e">847 social</text><circle cx="640.2499999999918" cy="220.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><line x1="698.0000000000075" x2="698.0000000000075" y1="220.0" y2="134.0" stroke="#2a78d6" stroke-width="1.5"/><text x="698.0000000000075" y="70.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">Aug 2023</text><text x="698.0000000000075" y="86.0" text-anchor="middle" font-size="11.5" fill="#52514e">Social + affordable</text><text x="698.0000000000075" y="100.0" text-anchor="middle" font-size="11.5" fill="#52514e">raised to 50%;</text><text x="698.0000000000075" y="114.0" text-anchor="middle" font-size="11.5" fill="#52514e">right to return</text><circle cx="698.0000000000075" cy="220.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><line x1="769.9999999999932" x2="769.9999999999932" y1="246.0" y2="284.0" stroke="#2a78d6" stroke-width="1.5"/><text x="769.9999999999932" y="298.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">Aug 2024</text><text x="769.9999999999932" y="314.0" text-anchor="middle" font-size="11.5" fill="#52514e">Six months’ notice</text><text x="769.9999999999932" y="328.0" text-anchor="middle" font-size="11.5" fill="#52514e">and support</text><text x="769.9999999999932" y="342.0" text-anchor="middle" font-size="11.5" fill="#52514e">promised</text><circle cx="769.9999999999932" cy="220.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><line x1="861.4999999999951" x2="861.4999999999951" y1="220.0" y2="134.0" stroke="#2a78d6" stroke-width="1.5"/><text x="861.4999999999951" y="70.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">Oct 2025</text><text x="861.4999999999951" y="86.0" text-anchor="middle" font-size="11.5" fill="#52514e">70 social homes</text><text x="861.4999999999951" y="100.0" text-anchor="middle" font-size="11.5" fill="#52514e">occupied at</text><text x="861.4999999999951" y="114.0" text-anchor="middle" font-size="11.5" fill="#52514e">Metro Quarter</text><circle cx="861.4999999999951" cy="220.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><line x1="903.5000000000082" x2="903.5000000000082" y1="246.0" y2="284.0" stroke="#2a78d6" stroke-width="1.5"/><text x="903.5000000000082" y="298.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">May 2026</text><text x="903.5000000000082" y="314.0" text-anchor="middle" font-size="11.5" fill="#52514e">Concept application:</text><text x="903.5000000000082" y="328.0" text-anchor="middle" font-size="11.5" fill="#52514e">about 3,300</text><text x="903.5000000000082" y="342.0" text-anchor="middle" font-size="11.5" fill="#52514e">homes</text><circle cx="903.5000000000082" cy="220.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="50" y="430" font-size="11" fill="#8a8985">Sources: Zanardo et al. 2024; Turner Studio &amp; Turf 2020; NSW DPE 2022; NSW Government 2023, 2024, 2025; Scully 2026.</text></svg>