<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Five-step chain of segregation read against Waterloo" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><rect width="900" height="430" fill="#fcfcfb"/><text x="26.0" y="26" font-size="15" font-weight="600" fill="#0b0b0b">The five-step chain of segregation, read against Waterloo</text><text x="26.0" y="44" font-size="12" fill="#52514e">Steps from the lecture (Rosengren 2026; Tammaru et al. 2021). Lower boxes: what the documents show.</text><rect x="26.0" y="70" width="160" height="84" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><text x="38.0" y="94" font-size="20" font-weight="700" fill="#ffffff">1</text><text x="38.0" y="118" font-size="12.5" font-weight="600" fill="#ffffff">Disadvantage clusters</text><text x="38.0" y="134" font-size="12.5" font-weight="600" fill="#ffffff">spatially</text><path d="M187.0 112 l10 0" stroke="#8a8985" stroke-width="2"/><rect x="26.0" y="170" width="160" height="132" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><text x="36.0" y="194" font-size="11.5" fill="#0b0b0b">749 of 869 dwellings</text><text x="36.0" y="211" font-size="11.5" fill="#0b0b0b">on site are social</text><text x="36.0" y="228" font-size="11.5" fill="#0b0b0b">(86%). Plan: 847 of</text><text x="36.0" y="245" font-size="11.5" fill="#0b0b0b">3,012 (28%).</text><rect x="198.0" y="70" width="160" height="84" rx="6" fill="#f1f0ec" stroke="#e4e3df" stroke-width="1.5"/><text x="210.0" y="94" font-size="20" font-weight="700" fill="#0b0b0b">2</text><text x="210.0" y="118" font-size="12.5" font-weight="600" fill="#0b0b0b">Neighbourhood</text><text x="210.0" y="134" font-size="12.5" font-weight="600" fill="#0b0b0b">effects</text><path d="M359.0 112 l10 0" stroke="#8a8985" stroke-width="2"/><rect x="198.0" y="170" width="160" height="132" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/><text x="208.0" y="194" font-size="11.5" fill="#52514e">Concept contested</text><text x="208.0" y="211" font-size="11.5" fill="#52514e">(Sisson 2024).</text><text x="208.0" y="228" font-size="11.5" fill="#52514e">Building quality</text><text x="208.0" y="245" font-size="11.5" fill="#52514e">varies (Zanardo et</text><text x="208.0" y="262" font-size="11.5" fill="#52514e">al. 2024).</text><rect x="370.0" y="70" width="160" height="84" rx="6" fill="#f1f0ec" stroke="#e4e3df" stroke-width="1.5"/><text x="382.0" y="94" font-size="20" font-weight="700" fill="#0b0b0b">3</text><text x="382.0" y="118" font-size="12.5" font-weight="600" fill="#0b0b0b">Selective</text><text x="382.0" y="134" font-size="12.5" font-weight="600" fill="#0b0b0b">mobility</text><path d="M531.0 112 l10 0" stroke="#8a8985" stroke-width="2"/><rect x="370.0" y="170" width="160" height="132" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/><text x="380.0" y="194" font-size="11.5" fill="#52514e">Relocation is imposed.</text><text x="380.0" y="211" font-size="11.5" fill="#52514e">Tenants go to other</text><text x="380.0" y="228" font-size="11.5" fill="#52514e">public housing,</text><text x="380.0" y="245" font-size="11.5" fill="#52514e">incl. Metro Quarter</text><text x="380.0" y="262" font-size="11.5" fill="#52514e">(70 homes).</text><rect x="542.0" y="70" width="160" height="84" rx="6" fill="#f1f0ec" stroke="#e4e3df" stroke-width="1.5"/><text x="554.0" y="94" font-size="20" font-weight="700" fill="#0b0b0b">4</text><text x="554.0" y="118" font-size="12.5" font-weight="600" fill="#0b0b0b">Spread to other</text><text x="554.0" y="134" font-size="12.5" font-weight="600" fill="#0b0b0b">life domains</text><path d="M703.0 112 l10 0" stroke="#8a8985" stroke-width="2"/><rect x="542.0" y="170" width="160" height="132" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/><text x="552.0" y="194" font-size="11.5" fill="#52514e">Facilities: at least</text><text x="552.0" y="211" font-size="11.5" fill="#52514e">5,000 sqm (PDF p. 7).</text><text x="552.0" y="228" font-size="11.5" fill="#52514e">Schooling and work</text><text x="552.0" y="245" font-size="11.5" fill="#52514e">outcomes: no measure.</text><rect x="714.0" y="70" width="160" height="84" rx="6" fill="#f1f0ec" stroke="#e4e3df" stroke-width="1.5"/><text x="726.0" y="94" font-size="20" font-weight="700" fill="#0b0b0b">5</text><text x="726.0" y="118" font-size="12.5" font-weight="600" fill="#0b0b0b">Societal and spatial</text><text x="726.0" y="134" font-size="12.5" font-weight="600" fill="#0b0b0b">immobility</text><rect x="714.0" y="170" width="160" height="132" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/><text x="724.0" y="194" font-size="11.5" fill="#52514e">Waiting, uncertainty</text><text x="724.0" y="211" font-size="11.5" fill="#52514e">(Wynne and Rogers</text><text x="724.0" y="228" font-size="11.5" fill="#52514e">2021). Return not</text><text x="724.0" y="245" font-size="11.5" fill="#52514e">yet testable.</text><rect x="26.0" y="326" width="848" height="50" rx="6" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/><text x="40.0" y="348" font-size="13" font-weight="600" fill="#0b0b0b">The remedy, mixed tenure, acts on step 1.</text><text x="40.0" y="366" font-size="12" fill="#52514e">Whether it breaks the circle depends on where tenants go, how many return, and the market around the estate.</text><text x="26.0" y="418" font-size="11" fill="#8a8985">Shares calculated from NSW DPE 2022 (pp. 8, 37). The reading of the chain is the author’s.</text></svg>