<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Theoretical structure of the paper" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><rect width="900" height="560" fill="#fcfcfb"/><text x="26" y="26" font-size="15" font-weight="600" fill="#0b0b0b">Theoretical structure of the paper · 论文的理论结构</text><text x="26" y="44" font-size="12" fill="#52514e">Four bodies of theory (top) frame one test (bottom): does mixed tenure break the chain of segregation or relocate it?</text><rect x="26.0" y="66" width="200" height="92" rx="6" fill="#f1f0ec" stroke="#e4e3df" stroke-width="1.5"/><text x="38.0" y="88" font-size="13" font-weight="700" fill="#0b0b0b">§2 Global city</text><text x="38.0" y="105" font-size="12" font-weight="500" fill="#52514e">全球城市</text><text x="38.0" y="122" font-size="11" font-weight="400" fill="#52514e">Sassen · why the land is wanted</text><text x="38.0" y="139" font-size="11" font-weight="400" fill="#52514e">为什么这块地被需要</text><line x1="227.0" y1="112" x2="241.0" y2="112" stroke="#8a8985" stroke-width="2"/><polygon points="241.0,112 234.6,114.7 234.6,109.3" fill="#8a8985"/><rect x="242.0" y="66" width="200" height="92" rx="6" fill="#f1f0ec" stroke="#e4e3df" stroke-width="1.5"/><text x="254.0" y="88" font-size="13" font-weight="700" fill="#0b0b0b">§3 Housing</text><text x="254.0" y="105" font-size="12" font-weight="500" fill="#52514e">住房</text><text x="254.0" y="122" font-size="11" font-weight="400" fill="#52514e">Madden &amp; Marcuse</text><text x="254.0" y="139" font-size="11" font-weight="400" fill="#52514e">家与房地产的矛盾</text><line x1="443.0" y1="112" x2="457.0" y2="112" stroke="#8a8985" stroke-width="2"/><polygon points="457.0,112 450.6,114.7 450.6,109.3" fill="#8a8985"/><rect x="458.0" y="66" width="200" height="92" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><text x="470.0" y="88" font-size="13" font-weight="700" fill="#fff">§4 Segregation</text><text x="470.0" y="105" font-size="12" font-weight="500" fill="#fff">隔离</text><text x="470.0" y="122" font-size="11" font-weight="400" fill="#fff">Tammaru et al. · vicious circle</text><text x="470.0" y="139" font-size="11" font-weight="400" fill="#fff">恶性循环（全文中心）</text><line x1="659.0" y1="112" x2="673.0" y2="112" stroke="#8a8985" stroke-width="2"/><polygon points="673.0,112 666.6,114.7 666.6,109.3" fill="#8a8985"/><rect x="674.0" y="66" width="200" height="92" rx="6" fill="#f1f0ec" stroke="#e4e3df" stroke-width="1.5"/><text x="686.0" y="88" font-size="13" font-weight="700" fill="#0b0b0b">§5 Gentrification</text><text x="686.0" y="105" font-size="12" font-weight="500" fill="#52514e">绅士化</text><text x="686.0" y="122" font-size="11" font-weight="400" fill="#52514e">Smith · Lees · rent gap, social mix</text><text x="686.0" y="139" font-size="11" font-weight="400" fill="#52514e">租金差；社会混合的批评</text><text x="26.0" y="186" font-size="12" font-weight="600" fill="#0b0b0b">The five-step chain of segregation · 隔离的五步链 (Rosengren 2026)</text><rect x="26.0" y="196" width="160" height="56" rx="6" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/><text x="38.0" y="218" font-size="11.5" font-weight="600" fill="#0b0b0b">1 Disadvantage clusters</text><text x="38.0" y="235" font-size="11" font-weight="400" fill="#52514e">弱势聚集</text><path d="M187.0 224 l10 0" stroke="#8a8985" stroke-width="2"/><rect x="198.0" y="196" width="160" height="56" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/><text x="210.0" y="218" font-size="11.5" font-weight="600" fill="#0b0b0b">2 Neighbourhood effects</text><text x="210.0" y="235" font-size="11" font-weight="400" fill="#52514e">邻里效应</text><path d="M359.0 224 l10 0" stroke="#8a8985" stroke-width="2"/><rect x="370.0" y="196" width="160" height="56" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/><text x="382.0" y="218" font-size="11.5" font-weight="600" fill="#0b0b0b">3 Selective mobility</text><text x="382.0" y="235" font-size="11" font-weight="400" fill="#52514e">选择性流动</text><path d="M531.0 224 l10 0" stroke="#8a8985" stroke-width="2"/><rect x="542.0" y="196" width="160" height="56" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/><text x="554.0" y="218" font-size="11.5" font-weight="600" fill="#0b0b0b">4 Other life domains</text><text x="554.0" y="235" font-size="11" font-weight="400" fill="#52514e">其他生活领域</text><path d="M703.0 224 l10 0" stroke="#8a8985" stroke-width="2"/><rect x="714.0" y="196" width="160" height="56" rx="6" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/><text x="726.0" y="218" font-size="11.5" font-weight="600" fill="#0b0b0b">5 Immobility</text><text x="726.0" y="235" font-size="11" font-weight="400" fill="#52514e">固化与代际传递</text><line x1="558.0" y1="158" x2="558.0" y2="172" stroke="#2a78d6" stroke-width="2"/><polygon points="558.0,172 555.3,165.6 560.7,165.6" fill="#2a78d6"/><rect x="26.0" y="296" width="272" height="100" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/><text x="38.0" y="318" font-size="12" font-weight="600" fill="#0b0b0b">Remedy · 药方 (§4.1–4.3)</text><text x="38.0" y="335" font-size="11" font-weight="400" fill="#52514e">Mixed tenure 70:30 → plan 28% social</text><text x="38.0" y="352" font-size="11" font-weight="400" fill="#52514e">acts on step 1; origin of the ratio traced</text><text x="38.0" y="369" font-size="11" font-weight="400" fill="#52514e">作用在第 1 步；比例出自融资</text><line x1="162.0" y1="296" x2="106.0" y2="254" stroke="#eb6834" stroke-width="2"/><polygon points="106.0,254 112.8,255.7 109.5,260.0" fill="#eb6834"/><rect x="314.0" y="296" width="272" height="100" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/><text x="326.0" y="318" font-size="12" font-weight="600" fill="#0b0b0b">Destinations · 去向 (§4.4)</text><text x="326.0" y="335" font-size="11" font-weight="400" fill="#52514e">Metro Quarter 70, Elizabeth St ~95</text><text x="326.0" y="352" font-size="11" font-weight="400" fill="#52514e">dissolved or moved? steps 1 and 3</text><text x="326.0" y="369" font-size="11" font-weight="400" fill="#52514e">打散还是搬走？第 1、3 步</text><line x1="450.0" y1="296" x2="450.0" y2="254" stroke="#8a8985" stroke-width="2"/><polygon points="450.0,254 452.7,260.4 447.3,260.4" fill="#8a8985"/><rect x="602.0" y="296" width="272" height="100" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/><text x="614.0" y="318" font-size="12" font-weight="600" fill="#0b0b0b">Return and market · 回迁与市场 (§5.3)</text><text x="614.0" y="335" font-size="11" font-weight="400" fill="#52514e">Right to return; price pressure (§2, §5)</text><text x="614.0" y="352" font-size="11" font-weight="400" fill="#52514e">steps 3 and 5; who lives there in ten years</text><text x="614.0" y="369" font-size="11" font-weight="400" fill="#52514e">第 3、5 步；十年后谁住在里面</text><line x1="738.0" y1="296" x2="794.0" y2="254" stroke="#8a8985" stroke-width="2"/><polygon points="794.0,254 790.5,260.0 787.2,255.7" fill="#8a8985"/><rect x="26.0" y="436" width="848" height="86" rx="6" fill="#fdf0ea" stroke="#eb6834" stroke-width="2"/><text x="38.0" y="458" font-size="13" font-weight="700" fill="#0b0b0b">§6 Question and answer · 问题与回答</text><text x="38.0" y="475" font-size="11.5" font-weight="400" fill="#0b0b0b">Does the mixed-tenure renewal break the circle of segregation, or relocate it, in a city where prices have risen for two decades?</text><text x="38.0" y="492" font-size="11.5" font-weight="400" fill="#52514e">回答：条文锁定了第 1 步（楼面积）；去向、回迁和市场留给声明，现有文件没有给出结果。</text><line x1="162.0" y1="396" x2="162.0" y2="434" stroke="#8a8985" stroke-width="2"/><polygon points="162.0,434 159.3,427.6 164.7,427.6" fill="#8a8985"/><line x1="450.0" y1="396" x2="450.0" y2="434" stroke="#8a8985" stroke-width="2"/><polygon points="450.0,434 447.3,427.6 452.7,427.6" fill="#8a8985"/><line x1="738.0" y1="396" x2="738.0" y2="434" stroke="#8a8985" stroke-width="2"/><polygon points="738.0,434 735.3,427.6 740.7,427.6" fill="#8a8985"/><text x="26" y="548" font-size="11" fill="#8a8985">Dialectic runs through the tests: mixing ↔ moving, home ↔ real estate, promise ↔ record. The chain is the author’s reading, not a term of the documents.</text></svg>