 h-108.39999999999998 z" fill="#2a78d6"/><text x="370.4" y="143" font-size="13" font-weight="600" fill="#0b0b0b">28%</text><text x="370.4" y="159" font-size="11" fill="#52514e">847 of 3,012</text><text x="238" y="201" text-anchor="end" font-size="13" font-weight="600" fill="#0b0b0b">Waterloo South plan</text><text x="238" y="217" text-anchor="end" font-size="12" fill="#52514e">social + affordable</text><path d="M250 186 h138.8 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-138.8 z" fill="#2a78d6"/><text x="400.8" y="201" font-size="13" font-weight="600" fill="#0b0b0b">36%</text><text x="400.8" y="217" font-size="11" fill="#52514e">1,074 of 3,012</text><text x="238" y="259" text-anchor="end" font-size="13" font-weight="600" fill="#0b0b0b">Green Square Town Centre</text><text x="238" y="275" text-anchor="end" font-size="12" fill="#52514e">social + affordable</text><path d="M250 244 h8.399999999999977 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-8.399999999999977 z" fill="#8a8985"/><text x="270.4" y="259" font-size="13" font-weight="600" fill="#0b0b0b">3%</text><text x="270.4" y="275" font-size="11" fill="#52514e">104 of 3,308</text><text x="24" y="350" font-size="11" fill="#8a8985">Sources: NSW DPE 2022, pp. 8, 37; Turner Studio &amp; Turf 2020, App. 6, p. 463. Shares calculated. The Green Square figure is one town centre.</text><text x="24" y="366" font-size="11" fill="#8a8985">Existing Waterloo South: 749 social and 120 private dwellings.</text></svg>